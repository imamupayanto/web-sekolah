const TRAITS={kesayangan:['Crowd Favorite','Cheers +50%, mercy chance +10%'],pendendam:['Vengeful','ATK +30% when an ally falls'],hausdarah:['Bloodthirst','Restore 12% HP each time a foe falls'],karang:['Coral Rock','Immune to pin & knockback'],kilat:['Lightning Feet','AGI +25%'],pembantai:['Beast Slayer','Damage vs beasts +30%'],veteran:['Veteran','XP +20%'],teguh:['Stout Heart','Start bouts with 40% morale'],showman:['Showman','Finishing blow chance ×2'],

function initGlad(s,u){if(u.traits){u.traits=u.traits.filter(t=>t&&TRAITS[t]);if(u.traits.length)return}const r=mul(u.id*977+(u.gseed||u.preset||0)*13);u.traits=[u.preset!=null?SIG[u.preset]:(r()<.25?NEG[Math.floor(r()*NEG.length)]:POS[Math.floor(r()*POS.length)])];u.age0=u.preset!=null?[27,24,23,26,29,22,25,24,30,30,32,24][u.preset]:20+Math.floor(r()*9);u.born=s.day}
function ageOf(s,u){return(u.age0||25)+Math.floor((s.day-(u.born||s.day))/30)}
function ageMul(s,u){const a=ageOf(s,u);return a>33?Math.max(.7,1-.03*(a-33)):1}
function relKey(a,b){return a<b?a+'-'+b:b+'-'+a}
function relOf(s,a,b){return(s.rel||{})[relKey(a,b)]}
function bondTeam(s,team,notes){s.rel=s.rel||{};const g=team.filter(u=>u.kind==='glad');for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const k=relKey(g[i].id,g[j].id),R=s.rel[k]||(s.rel[k]={b:0,t:null});R.b++;
 if(!R.t&&R.b>=4){const same=clsOf(g[i])===clsOf(g[j]);R.t=(same?Math.random()<.6:Math.random()<.3)?'rival':'sahabat';const m=`${nameOf(g[i])} & ${nameOf(g[j])} kini ${R.t==='rival'?'RIVAL 🔥':'FRIEND 🤝'}!`;notes&&notes.push(m);s.log.unshift(m)}}}

 const y=new Date();y.setDate(y.getDate()-1);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();D.streak=D.last===yd?(D.streak%7)+1:1;D.last=t;D.date=t;D.login={day:D.streak,amt:LOGIN[D.streak-1],cl:false};
 const ks=Object.keys(DQ).sort(()=>Math.random()-.5).slice(0,3);D.q=ks.map(k=>{const n=DQ[k][1][Math.floor(Math.random()*2)];return{k,n,p:0,rew:120+n*60,cl:false}});return D.login}
