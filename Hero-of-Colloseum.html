 set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.p[y*this.w+x]=c}
 rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,c)}
 disc(cx,cy,r,c,only){for(let y=Math.floor(cy-r)-1;y<=Math.ceil(cy+r)+1;y++)for(let x=Math.floor(cx-r)-1;x<=Math.ceil(cx+r)+1;x++){const dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<=r*r+.3){if(only&&this.get(x,y)==null)continue;this.set(x,y,c)}}}
 ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry)-1;y<=Math.ceil(cy+ry)+1;y++)for(let x=Math.floor(cx-rx)-1;x<=Math.ceil(cx+rx)+1;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c)}}
 seg(a,b,r,c,sep){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d*2));const run=(rr,cc,only)=>{for(let i=0;i<=n;i++){const t=i/n;this.disc(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,rr,cc,only)}};if(sep)run(r+1,sep,true);run(r,c)}
 line(a,b,c){let x0=Math.round(a[0]),y0=Math.round(a[1]);const x1=Math.round(b[0]),y1=Math.round(b[1]);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let k=0;k<400;k++){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

}

const TRAITS={kesayangan:['Kesayangan Massa','Sorakan +50%, peluang ampun +10%'],pendendam:['Pendendam','ATK +30% saat teman jatuh'],hausdarah:['Haus Darah','Pulih 12% HP tiap menjatuhkan lawan'],karang:['Batu Karang','Kebal terpaku & terlempar'],kilat:['Kaki Kilat','AGI +25%'],pembantai:['Pembantai Buas','Damage ke hewan +30%'],veteran:['Veteran','XP +20%'],teguh:['Teguh Hati','Mulai laga dengan semangat 40%'],showman:['Showman','Peluang pukulan penutup ×2'],

const SIG=['karang','showman','kilat','kesayangan','veteran','pendendam','teguh','pembantai','hausdarah'];
const POS=Object.keys(TRAITS).filter(k=>!TRAITS[k][2]),NEG=Object.keys(TRAITS).filter(k=>TRAITS[k][2]);
function initGlad(s,u){if(u.traits)return;const r=mul(u.id*977+(u.gseed||u.preset||0)*13);u.traits=[u.preset!=null?SIG[u.preset]:(r()<.25?NEG[Math.floor(r()*NEG.length)]:POS[Math.floor(r()*POS.length)])];u.age0=u.preset!=null?[27,24,23,26,29,22,25,24,30][u.preset]:20+Math.floor(r()*9);u.born=s.day}
function ageOf(s,u){return(u.age0||25)+Math.floor((s.day-(u.born||s.day))/30)}
function ageMul(s,u){const a=ageOf(s,u);return a>33?Math.max(.7,1-.03*(a-33)):1}
function relKey(a,b){return a<b?a+'-'+b:b+'-'+a}
function relOf(s,a,b){return(s.rel||{})[relKey(a,b)]}
function bondTeam(s,team,notes){s.rel=s.rel||{};const g=team.filter(u=>u.kind==='glad');for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){const k=relKey(g[i].id,g[j].id),R=s.rel[k]||(s.rel[k]={b:0,t:null});R.b++;
 if(!R.t&&R.b>=4){const same=clsOf(g[i])===clsOf(g[j]);R.t=(same?Math.random()<.6:Math.random()<.3)?'rival':'sahabat';const m=`${nameOf(g[i])} & ${nameOf(g[j])} kini ${R.t==='rival'?'RIVAL 🔥':'SAHABAT 🤝'}!`;notes&&notes.push(m);s.log.unshift(m)}}}
function relMods(s,u,team){let a=1,d=1;team.forEach(o=>{if(o===u||o.kind!=='glad'||u.kind!=='glad')return;const R=relOf(s,u.id,o.id);if(!R||!R.t)return;if(R.t==='sahabat'){a*=1.08;d*=1.08}else{a*=1.15;d*=.95}});return[a,d]}
function traitCheck(s,u,notes){if(u.kind!=='glad'||!u.traits||u.traits.length>=2||(u.wins||0)<10)return;const pool=POS.filter(t=>!u.traits.includes(t));const t=pool[Math.floor(Math.random()*pool.length)];u.traits.push(t);const m=`${nameOf(u)} mendapat sifat baru: ${TRAITS[t][0]}!`;notes&&notes.push(m);s.log.unshift(m)}
function hallAdd(s,u,how){s.hall=s.hall||[];s.hall.unshift({n:nameOf(u),cls:clsOf(u),r:rarOf(u),lvl:u.lvl,wins:u.wins||0,how,day:s.day,preset:u.preset,gseed:u.gseed,eq:u.eq,traits:u.traits});if(s.hall.length>30)s.hall.length=30}

 const f=5+Math.round(u.lvl/2);s.fame+=f;hallAdd(s,u,'rudis');s.log.unshift(`🏛 ${nameOf(u)} menerima Rudis dan pensiun dengan terhormat. Ketenaran +${f}.`);return null}

const NTITLE=['si Pemenggal','Tangan Besi','Sang Algojo','Mimpi Buruk Capua','Si Tak Terkalahkan','Penjagal Arena','Si Mata Satu'];
function nemAdd(s,ent,why){s.nem=s.nem||[];if(s.nem.length>=3||s.nem.some(n=>n.rec.nama===ent.recipe.nama))return null;const n={id:Date.now()%1e7,rec:ent.recipe,lvl:ent.lvl+1,met:1,title:NTITLE[Math.floor(Math.random()*NTITLE.length)],why};s.nem.push(n);return n}

function nemAfter(s,B,win,notes){if(!s.nem)return{};const e=B.ents.find(o=>o.nem);let out={};if(e){const n=s.nem.find(x=>x.rec.nama===e.recipe.nama);if(n){if(e.dead&&win){s.nem=s.nem.filter(x=>x!==n);const g=500+n.lvl*60;s.gold+=g;s.fame+=10;const it=randLoot('epic');s.inv.push(it);notes.push(`☠ Nemesis ${e.name} tumbang! Dendam terbalas: 🪙${g}, 🏛+10, item Epic.`);s.log.unshift(`Nemesis ${e.name} akhirnya dikalahkan.`);out.killed=n}
  else{n.met++;n.lvl++;notes.push(`☠ ${e.name} lolos dan makin kuat (Lv ${n.lvl}).`)}}}return out}
function randLoot(rar){const slots=Object.keys(G.SLOTS),slot=slots[Math.floor(Math.random()*slots.length)];const ts=Object.keys(G.TYPES[slot]).filter(t=>t!=='tidak'&&!G.FTYPE.has(t));let t=ts[Math.floor(Math.random()*ts.length)];let rr=rar;if(rr==='legendary'&&!G.UNIQ.find(u=>u.slot===slot&&u.t===t)){const u=G.UNIQ[Math.floor(Math.random()*G.UNIQ.length)];return{slot:u.slot,t:u.t,v:u.v,r:'legendary',seed:Math.floor(Math.random()*1e6)}}return{slot,t,v:Math.floor(Math.random()*3),r:rr,seed:Math.floor(Math.random()*1e6)}}

  DG.avail(S).forEach(u=>{const on=sel.includes(u);const c=unitCard(u,on?'sel':'',()=>{if(on)sel=sel.filter(x=>x!==u);else if(sel.length<3)sel.push(u);else return toast('Rombongan penuh.');draw()});if(on)c.insertAdjacentHTML('afterbegin',`<span class="no">${sel.indexOf(u)+1}</span>`);box.querySelector('#pg').appendChild(c)});
  if(!DG.avail(S).length)box.querySelector('#pg').innerHTML='<div class="mut">Tidak ada petarung sehat.</div>';
  box.querySelector('#bm').onclick=()=>{bekal=Math.max(0,bekal-1);draw()};box.querySelector('#bp').onclick=()=>{bekal=Math.min(DG.MAXB,bekal+1);draw()};const g=w&&w.querySelector('.go');if(g){g.textContent=`🗺 Berangkat (🪙${bekal*DG.BEKAL})`;g.disabled=!sel.length}};
 let w=null;draw();w=sheet(D.n,box,[[`🗺 Berangkat`,()=>{const e=resc!=null?DG.startRescue(S,resc,sel.map(u=>u.id),bekal):DG.start(S,R.id,di,sel.map(u=>u.id),bekal);if(e){toast(e);return false}SFX.horn();toast('Rombongan berangkat!');save();render()},'pri go']]);draw()}
function rPath(p){const e=S.exp,R=DG.REG[e.rid],D=e.D||R.dg[e.di],H=e.path.length;
 p.innerHTML=`<div class="phd"><div><b>${R.ic} ${D.n}</b><div class="mut sm2">Titik ${Math.min(H,e.row+1)}/${H} · ${R.n}${e.buff?' · ✨ Berkah Mars':''}</div></div><div class="pr">🍞${e.bekal} · 🪙${e.loot.gold}${e.loot.items.length?' · 🎁'+e.loot.items.length:''}${e.loot.animals.length?' · 🐾'+e.loot.animals.length:''}</div></div><div class="party" id="pt"></div><div class="pm" id="pm"><svg id="pe"></svg></div><div class="row" style="margin-top:8px"><button id="ret" style="flex:1">🏠 Pulang lebih awal</button></div>`;
 DG.party(S).forEach(u=>{const d=el(`<div class="pc2 ${u.hpf<=0?'ko':''}"><div class="pi2"></div><div class="pn3">${LG.nameOf(u)}</div><div class="hb2"><i style="width:${Math.max(0,u.hpf)*100}%;background:${u.hpf>.5?'#5cb85c':u.hpf>.25?'#e0b030':'#d03a2a'}"></i></div></div>`);d.querySelector('.pi2').appendChild(sprite(u,.7));$('pt').appendChild(d)});
 const pm=$('pm'),Wd=pm.clientWidth||360,RH=62,svg=$('pe');pm.style.height=(H*RH+16)+'px';svg.setAttribute('width',Wd);svg.setAttribute('height',H*RH+16);
 const xy=(nd,i)=>[nd.x*Wd,(H-1-i)*RH+38];const isDone=(i,k)=>e.done.some(([a,b])=>a===i&&b===k);let lines='';
 e.path.forEach((row,i)=>row.forEach((nd,k)=>nd.to.forEach(j=>{const[a,b]=xy(nd,i),[c,d]=xy(e.path[i+1][j],i+1);const dn=isDone(i,k)&&isDone(i+1,j);lines+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${dn?'#ffd23a':'#6a5030'}" stroke-width="${dn?3:2}" stroke-dasharray="${dn?'':'4 4'}"/>`})));svg.innerHTML=lines;
 e.path.forEach((row,i)=>row.forEach((nd,k)=>{const[a,b]=xy(nd,i),dn=isDone(i,k),rc=DG.reachable(S,i,k),[ic,lb]=DG.ICON[nd.t];const n=el(`<button class="nd ${dn?'dn2':''} ${rc?'rc':''} ${nd.t==='boss'?'bs2':''}" style="left:${a}px;top:${b}px">${ic}</button>`);n.onclick=()=>{if(!rc)return toast(dn?'Sudah dilewati.':'Belum bisa dijangkau.');nodeSheet(i,k)};pm.appendChild(n)}));
 setTimeout(()=>{const r=pm.querySelector('.rc');if(r)r.scrollIntoView({block:'center'})},50);
 let arm=0;$('ret').onclick=ev=>{if(Date.now()-arm<3000){const f=DG.abort(S);save();summarySheet(f,false)}else{arm=Date.now();ev.target.textContent='⚠ Ketuk lagi: pulang, item & hewan hasil hilang, emas separuh'}}}
const NDESC={fight:'Musuh menghadang jalan.',elite:'Musuh elit dengan hadiah lebih besar.',chest:'Peti tersembunyi.',event:'Sesuatu terjadi di jalan…',camp:'Tempat aman untuk beristirahat. Pakai 1 bekal: +35% HP (tanpa bekal +10%).',boss:'Pemimpin musuh menunggu!',beast:'Jejak hewan buas. Kalahkan untuk peluang menangkapnya!'};
function nodeSheet(i,k){const nd=S.exp.path[i][k],[ic,lb]=DG.ICON[nd.t];const R=DG.REG[S.exp.rid];
 sheet(ic+' '+lb,`<div class="mut">${nd.t==='boss'?G.FACTIONS[R.boss].n+' menunggu!':NDESC[nd.t]}</div>`,[['Masuk',()=>{const r=DG.enter(S,i,k);if(r.err){toast(r.err);return false}
  if(r.fight){save();setTimeout(()=>startBattle({wild:true,n:r.node==='boss'?G.FACTIONS[R.boss].n:R.n+' · '+lb,sc:r.sc,bio:r.bio,waktu:r.node==='boss'?'senja':'siang',tier:1},r.team),50);return}
  if(r.node==='camp'){const h=DG.camp(S);toast(h>.2?'🔥 Rombongan beristirahat (+35% HP, −1 🍞)':'🔥 Tanpa bekal… +10% HP');afterNode();return}
  if(r.node==='chest'){const c=DG.chest(S);setTimeout(()=>{const g=LG.itemOf2(c.it);sheet('💰 Harta!',`<div class="rew">🪙 +${c.g}</div><div class="itm"><div>${itemBlock(g)}</div></div>`,[['Lanjut',()=>afterNode(),'pri']])},0);return}
  if(r.node==='event'){const ev=DG.event(S);setTimeout(()=>eventSheet(ev),0);return}},'pri']])}
function eventSheet(ev){const R=DG.REG[S.exp.rid];const box=el(`<div><div class="rimg"></div><div>${ev.d(R)}</div></div>`);box.querySelector('.rimg').appendChild(cvOf(G.wildScene(R.dg[S.exp.di].bio||R.bio,'siang',S.exp.seed%5+2),1));
 const w=sheet(ev.ic+' '+ev.t,box,ev.o.map((o,i)=>[o.l,()=>{const r=DG.choose(S,ev,i);if(r.err){toast(r.err);return false}top();setTimeout(()=>sheet(ev.ic+' '+ev.t,`<div class="card good">${r.msg}</div>`,[['Lanjut',()=>afterNode(),'pri']]),0)}]))}
function afterNode(){save();top();if(S.exp&&S.exp.cleared){setTimeout(()=>{sheet('🏁 Dungeon selesai!','<div class="mut">Rombongan berhasil menaklukkan jalur ini. Saatnya pulang membawa hasil.</div>',[['🏠 Pulang ke ludus',()=>{const f=DG.finish(S,false);save();setTimeout(()=>summarySheet(f,true),0)},'pri']])},0)}render()}
function summarySheet(f,ok){render();sheet(ok?'🏠 Rombongan pulang!':'🏠 Rombongan kembali',`<div class="rew"><span>🪙 +${f.gold}</span><span>🎁 ${f.items}</span><span>🐾 ${f.animals}</span><span>👤 ${f.recruits}</span></div><div class="mut">Perjalanan memakan ${f.days} hari (gaji dibayar tiap hari).</div>${f.notes.map(n=>`<div class="bad">${n}</div>`).join('')}`,[['OK',()=>render(),'pri']])}
function wildResult(){const a=DG.afterFight(S,B,curTeam);delete S.inFight;save();top();const el2=$('res');el2.classList.add('show');
 let h=`<div class="card2"><h2>${a.win?'MENANG!':'KALAH'}</h2>${a.notes.map(n=>`<div class="${a.win?'good':'bad'}">${n}</div>`).join('')}`;
 if(!a.win&&a.res)h+=`<div class="mut" style="margin-top:6px">Rombongan pulang (${a.res.days} hari). Emas tersisa 🪙${a.res.gold}. Tawanan bisa ditebus di tab Dunia.</div>`;
 h+='<div id="capb"></div><div class="btns"><button id="back" class="pri">Lanjut</button></div></div>';el2.innerHTML=h;
 if(a.cap){const c=a.cap;const cb=$('capb');const draw=()=>{cb.innerHTML=`<div class="mc"><div id="capi"></div><b>${G.animalName(c.sp,c.r)}</b> <span class="r-${c.r}">${RN[c.r]}</span><div class="mut">tergeletak lemah… peluang tangkap <b style="color:#ffd23a">${Math.round(c.p*100)}%</b></div><button id="ct" class="pri">🕸 Tangkap</button><button id="cbt">🍖 Umpan (+25%, 1 🍞)</button><button id="cl">Lepaskan</button></div>`;
  $('capi').appendChild(cvOf(G.animalFrame(c.sp,c.r,'tumbang',2,1),c.sp==='gajah'?1:1.6));
  $('ct').onclick=()=>{const r=DG.capture(S,c,false);if(r.err)return toast(r.err);cb.innerHTML=`<div class="mc ${r.ok?'good':'bad'}">${r.ok?'🎉 '+G.animalName(c.sp,c.r)+' tertangkap! Ikut pulang bersama rombongan.':'Hewan itu meronta dan kabur…'}</div>`;SFX[r.ok?'win':'lose']();a.cap=null;save()};
  $('cbt').onclick=()=>{if(!S.exp||S.exp.bekal<1)return toast('Bekal habis.');S.exp.bekal--;c.p=Math.min(.9,c.p+.25);c.baited=1;draw()};if(c.baited)$('cbt').disabled=true;
  $('cl').onclick=()=>{cb.innerHTML='';a.cap=null}};draw()}
 $('back').onclick=()=>{if(a.cap)return toast('Tangkap atau lepaskan hewannya dulu.');$('bt').classList.remove('show');tab='dunia';if(S.exp&&S.exp.cleared){afterNode()}else render();if(!a.win)setTimeout(()=>{render()},0)}}

// ===== HARIAN / CODEX / AULA / NEMESIS
function dailyCard(){const D=S.dly;if(!D)return;const c=$('dly');if(!c)return;const L=D.login;
 c.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>📅 Misi Harian</b><span class="mut sm2">Login beruntun: ${D.streak}/7</span></div>${L&&!L.cl?`<button class="pri sm" id="lgc">🎁 Klaim bonus login hari ${L.day}: 🪙${L.amt}${L.day===7?' + item Epic':''}</button>`:''}<div id="dql"></div></div>`;
 if(L&&!L.cl)$('lgc').onclick=()=>{LG.loginClaim(S);SFX.win();toast('Bonus login diklaim!');render()};
 D.q.forEach((q,i)=>{const r=el(`<div class="dq"><div style="flex:1"><div>${LG.DQ[q.k][0].replace('{n}',q.n)}</div><div class="bar"><i style="width:${q.p/q.n*100}%"></i></div></div><div class="sm2" style="min-width:76px;text-align:right">${q.cl?'<span class="good">✔ Selesai</span>':q.p>=q.n?`<button class="pri cl">Klaim 🪙${q.rew}</button>`:`${q.p}/${q.n} · 🪙${q.rew}`}</div></div>`);const b=r.querySelector('.cl');if(b)b.onclick=()=>{LG.dqClaim(S,i);SFX.cmd();toast('+🪙'+q.rew);render()};$('dql').appendChild(r)})}
function hallCard(){const H=S.hall||[];const c=$('hallc');if(!c||!H.length)return;c.innerHTML=`<h3>🏛 Aula Legenda <small class="mut">bonus XP latihan +${Math.round(LG.legacy(S)*100)}%</small></h3><div class="lst" id="hl"></div>`;
 H.slice(0,8).forEach(h=>{const r=el(`<div class="lr"><div class="ic"></div><div class="lm"><b class="r-${h.r}">${h.n}</b> <span class="mut sm2">${h.cls}</span><div class="mut">${h.how==='rudis'?'🏛 Pensiun terhormat':'⚰ Gugur di arena'} · Lv ${h.lvl} · ${h.wins} menang · hari ${h.day}</div></div></div>`);
  try{const R=Object.assign({},h.preset!=null?G.presetRecipe(h.preset):G.genRecipe(h.gseed),{eq:h.eq});r.querySelector('.ic').appendChild(cvOf(G.gladFrame(R,h.how==='rudis'?'menang':'tumbang',h.how==='rudis'?0:2),.8))}catch(_){}$('hl').appendChild(r)})}
function codexSheet(tabk){const c=LG.codexScan(S);const box=document.createElement('div');const n=LG.codexCount(S),T=LG.codexTotal();
 box.innerHTML=`<div class="mut">Koleksi ${n}/${T}</div><div class="bar"><i style="width:${n/T*100}%"></i></div><div class="seg" style="margin-top:6px"><button data-k="g">Gladiator</button><button data-k="a">Hewan</button><button data-k="b">Boss</button><button data-k="u">Item Unik</button></div><div class="gridc" id="cxg"></div><h3>Hadiah koleksi</h3><div id="cxm"></div>`;
 box.querySelectorAll('.seg button').forEach(b=>{b.classList.toggle('on',b.dataset.k===tabk);b.onclick=()=>codexSheet(b.dataset.k)});const g=box.querySelector('#cxg');
 const cell=(cv,name,own,sub)=>{const d=el(`<div class="cc ${own?'':'lock'}"></div>`);if(cv){if(!own)cv.style.filter='brightness(0)';d.appendChild(cv)}d.insertAdjacentHTML('beforeend',`<div><b>${own?name:'???'}</b></div><div class="mut sm2">${own?sub||'':'belum ditemukan'}</div>`);g.appendChild(d)};
 if(tabk==='g')G.PRESETS.forEach((P,i)=>cell(cvOf(G.gladFrame(G.presetRecipe(i),'diam',0),1),P.nama,c.g[i],`<span class="r-${P.rarity}">${P.kelas}</span>`));
 if(tabk==='a')Object.keys(G.SP).forEach(sp=>['common','rare','epic','legendary'].forEach(r=>cell(cvOf(G.animalFrame(sp,r,'diam',0,1),sp==='gajah'?.45:.6),G.animalName(sp,r),c.a[sp+':'+r],`<span class="r-${r}">${RN[r]}</span>`)));
 if(tabk==='b')LG.CODEX_BOSS.forEach(id=>{const cv=id==='gajah'?cvOf(G.animalFrame('gajah','epic','diam',0,1),.45):cvOf(G.gladFrame(G.enemyRecipe(id,1),'diam',0),1);cell(cv,id==='gajah'?'Gajah Hannibal':G.FACTIONS[id].n,c.b[id],'dikalahkan')});
 if(tabk==='u')G.UNIQ.forEach(q=>cell(cvOf(G.iconBuf(q.slot,q.t,'legendary',q.v),2),q.nama,c.u[q.nama],'Legendaris'));
 LG.CODEX_MS.forEach(([need,lbl],i)=>{const done=c.cl.includes(i),ok=n>=need;const r=el(`<div class="dq"><div style="flex:1">${need} koleksi → <b>${lbl}</b></div>${done?'<span class="good sm2">✔ Diklaim</span>':ok?'<button class="pri cl">Klaim</button>':`<span class="mut sm2">${n}/${need}</span>`}</div>`);const b=r.querySelector('.cl');if(b)b.onclick=()=>{const e=LG.codexClaim(S,i);if(e)return toast(e);SFX.win();toast('Hadiah koleksi diklaim!');save();top();codexSheet(tabk)};box.querySelector('#cxm').appendChild(r)});
 sheet('📖 Codex',box)}
function nemCard(){const N=S.nem||[];if(!N.length)return '';return`<div class="card nemc"><b>☠ Nemesis</b> <span class="mut sm2">(bisa muncul di laga arena)</span>${N.map(n=>`<div class="dq"><div style="flex:1"><b class="bad">${n.rec.nama} ${n.title}</b><div class="mut sm2">${n.rec.kelas} · Lv ${n.lvl} · ${n.why} · bertemu ${n.met}×</div></div></div>`).join('')}</div>`}

})();</script></body></html>
