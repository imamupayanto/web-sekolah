function hx(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function th(a){return'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
const dk=(c,f=.7)=>th(hx(c).map(v=>v*f));
const lt=(c,f=.25)=>th(hx(c).map(v=>v+(255-v)*f));
const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return th(A.map((v,i)=>v+(B[i]-v)*f))};

class Buf{
 constructor(w,h){this.w=w;this.h=h;this.p=new Array(w*h).fill(null)}
 get(x,y){x=Math.round(x);y=Math.round(y);return(x<0||y<0||x>=this.w||y>=this.h)?null:this.p[y*this.w+x]}
 set(x,y,c){x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.p[y*this.w+x]=c}
 rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)this.set(x,y,c)}
 disc(cx,cy,r,c,only){for(let y=Math.floor(cy-r)-1;y<=Math.ceil(cy+r)+1;y++)for(let x=Math.floor(cx-r)-1;x<=Math.ceil(cx+r)+1;x++){const dx=x-cx,dy=y-cy;if(dx*dx+dy*dy<=r*r+.3){if(only&&this.get(x,y)==null)continue;this.set(x,y,c)}}}
 ell(cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry)-1;y<=Math.ceil(cy+ry)+1;y++)for(let x=Math.floor(cx-rx)-1;x<=Math.ceil(cx+rx)+1;x++){const dx=(x-cx)/rx,dy=(y-cy)/ry;if(dx*dx+dy*dy<=1)this.set(x,y,c)}}
 seg(a,b,r,c,sep){const d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d*2));const run=(rr,cc,only)=>{for(let i=0;i<=n;i++){const t=i/n;this.disc(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,rr,cc,only)}};if(sep)run(r+1,sep,true);run(r,c)}
 line(a,b,c){let x0=Math.round(a[0]),y0=Math.round(a[1]);const x1=Math.round(b[0]),y1=Math.round(b[1]);const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(let k=0;k<400;k++){this.set(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
 map(f){for(let i=0;i<this.p.length;i++)if(this.p[i])this.p[i]=f(this.p[i],i%this.w,Math.floor(i/this.w))}
 blit(src,ox,oy,flip){for(let y=0;y<src.h;y++)for(let x=0;x<src.w;x++){const c=src.p[y*src.w+x];if(c)this.set(ox+(flip?src.w-1-x:x),oy+y,c)}}
}
function finish(b,shade=true,outline=OUT){
 const o=new Buf(b.w,b.h);o.p=b.p.slice();const E=(x,y)=>b.get(x,y)==null;
 if(shade)for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const c=b.p[y*b.w+x];if(!c||NS.has(c))continue;
  if(E(x+1,y)||E(x,y+1))o.p[y*b.w+x]=dk(c,.72);else if(E(x-1,y)||E(x,y-1))o.p[y*b.w+x]=lt(c,.22)}
 if(outline){const q=o.p.slice();for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){if(o.get(x,y)!=null)continue;if(o.get(x+1,y)||o.get(x-1,y)||o.get(x,y+1)||o.get(x,y-1))q[y*b.w+x]=outline}o.p=q}
 return o}
function shadow(b,cx,cy,rx){for(let y=cy-1;y<=cy+1;y++)for(let x=cx-rx;x<=cx+rx;x++){const dx=(x-cx)/rx,dy=(y-cy)/1.4;if(dx*dx+dy*dy<=1&&b.get(x,y)==null)b.set(x,y,'#00000055')}}
function sparkles(b,seed,n,big){const r=rng(seed);for(let i=0;i<n;i++){const x=(big?2:8)+Math.floor(r()*(b.w-(big?4:16))),y=(big?2:6)+Math.floor(r()*(b.h-(big?8:14)));if(b.get(x,y))continue;b.set(x,y,big?SPK:'#d6b8ff');if(big)for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(b.get(x+dx,y+dy)==null)b.set(x+dx,y+dy,SPK2)}}
function flash(b){b.map(c=>c===OUT||c.length>7?c:mix(c,'#ffffff',.7))}
function rotCCW(b){const n=new Buf(b.h,b.w);for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const c=b.p[y*b.w+x];if(c)n.set(y,b.w-1-x,c)}return n}

function event(s){const e=s.exp;const r=mul(e.seed+e.cur.i*53+e.cur.k);const ev=EVENTS[Math.floor(r()*EVENTS.length)];return ev}
function choose(s,ev,i){const res=ev.o[i].f(s);if(res==='Not enough gold.'||res==='Out of rations.')return{err:res};advance(s);if(s.exp.row>=s.exp.path.length)s.exp.cleared=true;return{msg:res}}

 L.recruits.forEach(sd=>{if(s.glads.length<LG.maxGlad(s)){LG.addRecruit(s,sd)}else notes.push('Barracks full: the recruit leaves.')});
 if(L.legend!=null){if(s.glads.length<LG.maxGlad(s))LG.addGlad(s,L.legend);else notes.push('Barracks full: the legend leaves!')}
 ps.forEach(u=>{delete u.away;if(u.hpf!=null&&u.hpf<.4)u.inj=Math.max(u.inj,u.hpf<=0?3:1);if(u.hpf!=null&&u.hpf<=0)LG.injure(s,u,Math.random()<.6?'berat':'ringan',notes);else if(u.hpf!=null&&u.hpf<.15&&Math.random()<.5)LG.injure(s,u,'ringan',notes);delete u.hpf});
 const days=D.days+e.extraDays;delete s.exp;s.stats.exp=(s.stats.exp||0)+1;

// ---------- hero
function heroRec(){const L=S.look,eq={};for(const sl in G.SLOTS){const it=S.eq[sl];eq[sl]=it?{t:it.t,v:it.v||0,r:it.r,seed:it.seed,up:it.up||0,set:it.set}:{t:'tidak',v:0,r:'common',seed:1}}

function devLv(g){const d=S.dev[g]||0;return DEV_T.filter(t=>d>=t).length}
const hasPerk=(g,i)=>devLv(g)>i;
function blessK(g){return S.bless&&S.bless.day===S.day&&S.bless.g===g?S.bless.k:0}
function buffK(k){return S.buff&&S.buff.day===S.day&&S.buff.k===k?S.buff.v:0}
// apply hero modifiers to a stats object from ENG.mk
function heroMods(st){const A=S.arma?ARMA[S.arma]:null;if(A){st.maxhp*=A.mod.hp;st.def*=A.mod.def;st.atk*=A.mod.atk;st.crit+=A.mod.crit}
 st.atk*=1+buffK('str')+(hasPerk('mars',0)?.05:0)+.1*blessK('mars')+(S.title==='butcher'?.06:0);
 st.maxhp*=1+buffK('vit')+(hasPerk('hercules',0)?.08:0)+.15*blessK('hercules')+(S.title==='champ'?.1:0);
 if(hasPerk('fortuna',2))st.crit+=6;if(S.inj>0)st.maxhp*=.75;
 for(const s of S.scars||[]){if(s==='eye')st.crit+=2;if(s==='arm')st.atk*=.97,st.crit+=1;if(s==='chest')st.maxhp*=.97,st.def*=1.04}
 st.stam=(A?A.st:100)*(1+buffK('agi'));return st}

 if(sl==='senjata')t=pick(ARMA_W[arma]);else if(sl==='perisai')t=pick(ARMA_S[arma]);else if(sl==='helm')t=pick(ARMA_H[arma]);else t=pick(Object.keys(G.TYPES[sl]).filter(x=>x!=='tidak'&&!['rompi','tudung','topeng','topi','serigala','beruang','galia','sorban','frigia','nemes','nemea','minotaur','cyclops','medusa'].includes(x)));

function gainXP(n,src){if(S.lvl>=lvCap())return;S.xp+=Math.round(n);let up=0;while(S.xp>=xpNeed(S.lvl)&&S.lvl<lvCap()){S.xp-=xpNeed(S.lvl);S.lvl++;S.pts+=3;up++}

function rep(k,n){S.rep[k]=(S.rep[k]||0)+n;if(n)toast(`${FAC[k].ic} ${FAC[k].n} ${n>0?'+':''}${n}`);if(k==='ludus'&&S.rep.ludus<=-6){S.confine=S.day+2;S.rep.ludus=-3;setTimeout(()=>toast('⛓ Batiatus confines you to the ludus for 2 days.',4000),300)}}

// ---------- calendar
const MONTH=12,monthOf=d=>Math.floor((d-1)/MONTH),ludiDays=m=>[m*MONTH+4,m*MONTH+8,m*MONTH+12];
const ROMAN_M=['Ianuarius','Februarius','Martius','Aprilis','Maius','Iunius','Iulius','Augustus','September','October','November','December'];
function dateStr(d){d=d||S.day;return`Day ${((d-1)%MONTH)+1} of ${ROMAN_M[monthOf(d)%12]}`}
function genMonth(){const m=monthOf(S.day);for(const d of ludiDays(m))if(!S.ludi[d])S.ludi[d]=mkLudi(d)}
function mkLudi(d,force){const a=Math.min(S.act,6),T=LUDI_ACT[a],k=force||T[(S.ludiN+Object.keys(S.ludi).length)%T.length],[l0,l1]=ACT_LV[a],n=Object.values(S.ludi).filter(x=>x.act===a).length;
 const lvl=Math.min(l1,l0+n)+(S.ng||0)*4,dm=Math.random()<.6?Object.assign({},pick(DEMANDS)):null;const nem=!force&&S.nem&&Math.random()<.35;return{d,k:nem?'munus':k,nem:nem?1:0,title:nem?'Revenge: '+S.nem.name:null,act:a,city:LUDI_CITY[a],lvl:nem?Math.max(lvl,S.nem.lvl):lvl,purse:Math.round(120*(1+.22*lvl)*(k==='gregatim'?1.2:k==='munus'?1:1.1)),dm,foe:pick(FOENAMES)}}
function todayLudi(){const L=S.ludi[S.day];return L&&!S.ludiDone[S.day]?L:null}
function nextLudi(){for(let d=S.day;d<S.day+30;d++){const L=S.ludi[d];if(L&&!S.ludiDone[d])return L}return null}
// day change (called whenever the date advances)
function newDay(n){n=n||1;const notes=[];for(let i=0;i<n;i++){const L=todayLudi();if(L&&S.loc!=='ludus'){S.ludiDone[S.day]='missed';rep('ludus',-3);notes.push(`⚠ You missed the ${LUDI[L.k].n} in ${L.city}! Batiatus is furious (Ludus -3).`);if(L.story)S.flags.storyMiss=1}
  S.day++;if(S.inj>0)S.inj--;genMonth();S.mornDone=0;S.nightDone=0;S.dayFlags={};for(const id in S.comp)S.comp[id].rev=0}
 if(S.flags.storyMiss){S.flags.storyMiss=0;const st=curStep();if(st&&st.ludi)scheduleStoryLudi(st)}
 notes.forEach(t=>toast(t,4200));return notes}
function scheduleStoryLudi(st){for(let d=S.day;d<S.day+30;d++)if(ludiDays(monthOf(d)).includes(d)&&!S.ludiDone[d]&&d>=S.day){const L=mkLudi(d,st.ludi.k);Object.assign(L,st.ludi,{d,story:st.id,lvl:st.ludi.lvl+(S.ng||0)*4});S.ludi[d]=L;return L}}

// quest: {id,t,giver,desc,k,rid,zone,n,prog,st:'on'|'ready'|'done',rew:{gold,xp},...}
function addQuest(q){q.prog=q.prog||0;q.st='on';S.quests[q.id]=q;if(!S.track)S.track=q.id;toast('📜 New quest: '+q.t);save()}
function questsOn(){return Object.values(S.quests).filter(q=>q.st!=='done')}
function qProgress(ev){// ev:{k:'kill',fac,beast,rid,zone,leader,camp,...}
 for(const q of questsOn()){if(q.st!=='on'||q.rid!==ev.rid)continue;let hit=false;
  if(q.k==='kill'&&ev.k==='kill'&&(q.zone==null||q.zone===ev.zone)&&(!q.beast||q.beast===ev.beast)&&(!q.fac||ev.fac===q.fac||(!ev.beast&&q.fac==='any')))hit=true;
  if((q.k==='leader'||q.k==='capture'||q.k==='hunt')&&ev.k==='qfoe'&&ev.q===q.id)hit=true;

function ending(){const E=S.path==='rebel'?'rebel':S.cnt.exec>=15&&S.rep.senat>=S.rep.plebs?'tyrant':'rudis';const go=k=>{S.ending=k;S.flags.won=1;log('Ending: '+k);advance();save();const T=ENDS[k];const w=el(`<div class="title"><div class="tbox"><h1 class="lg" style="font-size:28px">${T[0]}<small>${S.name}</small></h1><div class="mut" style="margin:12px 0;line-height:1.6">${T[1]}</div><div class="mut sm2">Day ${S.day} · Lv ${S.lvl} · ${S.cnt.win} arena wins · ${S.cnt.exec} executions · ${S.cnt.spare} spared</div><button class="pri" id="e1">Continue playing (Graecia opens)</button><button id="e2">⭐ New Game+</button></div></div>`);document.body.appendChild(w);
  $('e1').onclick=()=>{w.remove();S.ending=null;startHub()};$('e2').onclick=()=>{w.remove();const keep={lvl:S.lvl,at:S.at,pts:S.pts,eq:S.eq,inv:S.inv,dev:S.dev,titles:S.titles,title:S.title,gold:Math.round(S.gold/2),arma:S.arma};create({ng:(S.ng||0)+1,keep})}};
 dlg([[NR('varus'),'…the crowd… was always yours…'],'The Colosseum falls silent. Then it ROARS. The Emperor rises.'],E==='rudis'&&S.gold>=15000?[{t:'🗡 Accept the rudis: freedom',fn:()=>go('rudis')},{t:'🏛 Buy your own ludus (🪙15,000)',fn:()=>{S.gold-=15000;go('lanista')}}]:null,()=>go(E))}
const ENDS={rudis:['RUDIARIUS','The Emperor hands you the rudis, the wooden sword. You walk out of the Colosseum a free man, and the crowd chants your name into the night. Kaeso weeps openly.'],lanista:['LANISTA','You buy a crumbling ludus in Capua. Batiatus laughs, then pours you wine as an equal. One day, a scared slave will stand in your yard. You will choose what kind of master to be.'],
 rebel:['THE RISING','While Rome watches its games, the cells of a hundred ludi open. You lead the freed north across the Alps. The Senate will tell lies about you for a thousand years. Let them.'],tyrant:['THE EMPEROR\'S BLADE','The Emperor does not free you. He makes you his. Feared by the plebs, favoured by the Senate, you become the new executioner. Somewhere, a young slave learns your name and hates it.']};
const BOND={kaeso:['My father baked bread for the whole street. I can still smell it some nights.','Do you think we will ever see freedom? I think you might.','If I fall, give my share to my sister in Neapolis. Promise me.','You fight like a man with somewhere to go. I envy that.','Brother. That is what you are now.'],
 tauro:['In Numidia the lion is a king. Here, a toy for Romans.','I chose the sand. Chains I did not choose.','You hunt well. Better than Romans.','When this is over, come to the savanna. I will show you real lions.','My spear is yours. Always.'],
 brenna:['My brothers died at Alesia. I did not. I am still angry about it.','Romans call us barbarians. They have never seen a druid\'s grove.','You are not like the others. You look at the sky.','If we run, we run north. Together.','Sister in blood. Do not make me say it twice.'],
 lycos:['Hold still, I have stitched worse. Not much worse.','I lost everything on one throw of the dice. Funny, no?','You heal fast. Too fast. The gods favour you.','Hippocrates would weep at what I do here.','Friend. I did not think I would say that again.']};
const RUMOR={italia:['They say the bandit king of the fort was once a gladiator himself.','Wolves on the slopes of Vesuvius at night. Big ones.','The Via Appia bounty board pays well, if you live.','Old Aurelia lost her son to the smugglers\' cave.'],
 numidia:['A white lion walks the savanna. The priestesses of Tanit call it holy.','Jugurtha\'s palace is full of his hunters, even now.','The salt caravans hire swords for the Atlas road.','Elephants trample whole villages in the dry season.'],
 gallia:['The druids still gather in the marsh. Romans who go there do not return.','A Gaulish shield-maiden is chained in a slaver camp nearby.','Alesia\'s ruins are haunted by Vercingetorix\'s sworn men.'],
 dacia:['The gold mines run red with blood, and gold.','A great bear haunts the Wolf Pass at night.','Zalmoxis\' priests do not fear death. That makes them dangerous.'],
 germania:['Three legions vanished in the Teutoburg. Their eagle is still out there.','The seeress in the woods sees the future. Or says she does.','Berserkers bite their shields before they charge.'],
 aegyptus:['Tomb robbers in the Valley of the Kings found something that walks.','A crocodile the size of a boat rules the Nile reeds at night.','The pharaoh\'s mummy guards his tomb still.'],
 olympus:['The last Spartans hold Thermopylae as if Xerxes still marched.','In Crete, a bull-headed thing waits in the dark.','The oracle speaks only to those who bleed for her.']};
