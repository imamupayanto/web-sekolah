<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Belajar Kelas 6</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{--text:#1e293b;--muted:#64748b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:linear-gradient(135deg,#f0f9ff,#fef9c3);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:26px;box-shadow:0 8px 40px #0002;padding:2rem 1.6rem;max-width:420px;width:100%;text-align:center;animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.badge{display:inline-block;background:linear-gradient(135deg,#f43f5e,#f59e0b);color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:.3rem 1rem;border-radius:99px;margin-bottom:.9rem}
h1{font-family:'Fredoka One',cursive;font-size:2.1rem;line-height:1.1;background:linear-gradient(135deg,#dc2626,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.sub{font-size:.88rem;font-weight:700;color:var(--muted);margin-bottom:1.2rem}
input.nm{width:100%;border:2px solid #fed7aa;border-radius:14px;padding:.7rem 1rem;font-family:inherit;font-size:1rem;font-weight:700;text-align:center;outline:none;margin-bottom:.8rem}
input.nm:focus{border-color:#f97316}
.btn{display:flex;align-items:center;gap:.9rem;width:100%;padding:.9rem 1.2rem;border-radius:16px;border:none;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;text-align:left;margin-bottom:.75rem;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0003}
.btn.center{justify-content:center;text-align:center}
.bi{font-size:1.6rem;width:46px;height:46px;border-radius:13px;background:#ffffff26;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bt{flex:1}.bl{font-size:1rem}.bd{font-size:.72rem;font-weight:600;opacity:.9;margin-top:.1rem}
.link{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:800;font-size:.8rem;cursor:pointer;margin-top:.3rem;text-decoration:underline}
.err{color:#e11d48;font-size:.8rem;font-weight:700;margin-top:.4rem;display:none}
.ov{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:stretch;justify-content:center}
.ov.on{display:flex}
.panel{background:#fff;width:100%;max-width:680px;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:.7rem;padding:.9rem 1.2rem;border-bottom:1.5px solid #f1f5f9;flex-shrink:0}
.pt{font-family:'Fredoka One',cursive;font-size:1.15rem;flex:1}
.x{background:#f1f5f9;border:none;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:1rem}
.pb{overflow-y:auto;padding:1.1rem 1.2rem 2.5rem;flex:1}
.rs{margin-bottom:1.1rem}
.rt{font-family:'Fredoka One',cursive;font-size:1rem;margin-bottom:.5rem}
.ri{background:#f8fafc;border-radius:10px;padding:.5rem .7rem;margin-bottom:.35rem;font-size:.875rem;font-weight:600;line-height:1.5}
.ri b{font-weight:900}
.pg{display:flex;justify-content:space-between;font-family:'Fredoka One',cursive;color:var(--muted);margin-bottom:.35rem}
.bar{background:#f1f5f9;border-radius:99px;height:6px;overflow:hidden;margin-bottom:.8rem}
.bar i{display:block;height:6px;background:linear-gradient(90deg,#f59e0b,#f43f5e);transition:width .3s}
.tm{display:flex;align-items:center;gap:.6rem;background:#f8fafc;border-radius:12px;padding:.45rem .8rem;margin-bottom:.8rem;font-weight:800;font-size:.8rem;color:var(--muted)}
.tn{font-family:'Fredoka One',cursive;font-size:1.2rem;color:#16a34a;min-width:2.2rem}
.tm.w .tn{color:#d97706}.tm.u .tn{color:#e11d48}
.tb{flex:1;height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden}.tb i{display:block;height:6px;background:#22c55e;transition:width 1s linear}
.tm.w .tb i{background:#f59e0b}.tm.u .tb i{background:#f43f5e}
.chip{display:inline-block;border-radius:99px;padding:.15rem .6rem;font-size:.68rem;font-weight:800;margin-bottom:.6rem}
.cM{background:#dcfce7;color:#16a34a}.cS{background:#fef9c3;color:#92400e}.cK{background:#fee2e2;color:#dc2626}
.qt{font-weight:700;font-size:.97rem;line-height:1.55;margin-bottom:.9rem}
.op{display:flex;align-items:center;gap:.65rem;width:100%;padding:.55rem .75rem;margin-bottom:.4rem;border-radius:11px;background:#fff;border:1.8px solid #e2e8f0;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:600;text-align:left;color:var(--text)}
.op:hover:not(:disabled){border-color:#8b5cf6;background:#f5f3ff}
.op:disabled{cursor:default}
.ok{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:.73rem;font-weight:900;color:var(--muted)}
.op.c{border-color:#16a34a;background:#f0fdf4;color:#16a34a}.op.c .ok{background:#16a34a;color:#fff}
.op.w{border-color:#e11d48;background:#fff1f2;color:#e11d48}.op.w .ok{background:#e11d48;color:#fff}
.op.k{border-color:#16a34a;background:#f0fdf4}.op.k .ok{background:#16a34a;color:#fff}
.rz{margin-top:.5rem;padding:.5rem .75rem;border-radius:10px;font-size:.85rem;font-weight:800;text-align:center}
.rz.ok2{background:#dcfce7;color:#16a34a}.rz.no{background:#ffe4e6;color:#e11d48}
.nv{display:flex;margin-top:1rem}
.nb{flex:1;padding:.7rem;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:.95rem;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316)}
.nb:disabled{opacity:.4;cursor:default}.nb.f{background:linear-gradient(135deg,#22c55e,#0ea5e9)}
.hs{text-align:center}.he{font-size:3.2rem}.ht{font-family:'Fredoka One',cursive;font-size:1.7rem}
.hbox{background:linear-gradient(135deg,#fef9c3,#fff7ed);border-radius:16px;padding:1rem;margin:1rem 0}
.hn{font-family:'Fredoka One',cursive;font-size:3rem;line-height:1}
.hr{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:1rem}
.hc{background:#f8fafc;border-radius:10px;padding:.35rem .75rem;font-size:.78rem;font-weight:700;color:var(--muted)}
.sent{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.8rem}
.pi{border-radius:12px;padding:.7rem .9rem;margin-bottom:.55rem;border:1.5px solid}
.pi.a{background:#f0fdf4;border-color:#bbf7d0}.pi.b{background:#fff1f2;border-color:#fecdd3}
.pn{font-size:.7rem;font-weight:900;color:var(--muted)}.pq{font-size:.85rem;font-weight:700;margin:.15rem 0 .3rem}
.ps{font-size:.78rem;font-weight:800}.pi.a .ps{color:#16a34a}.pi.b .ps{color:#e11d48}
.pf{font-size:.82rem;font-weight:600;color:var(--muted);line-height:1.5}
.pin{position:fixed;inset:0;z-index:99;background:#000b;display:none;align-items:center;justify-content:center}
.pin.on{display:flex}
.pbox{background:#1a1a2e;border:1px solid #7c4dff66;border-radius:22px;padding:1.6rem;width:300px;text-align:center;color:#e8eaf6}
.dots{display:flex;justify-content:center;gap:.5rem;margin:1rem 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #c040fb88}.dot.f{background:#c040fb}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.pad button{padding:.7rem;border-radius:12px;border:1px solid #7c4dff44;background:#ffffff0d;color:#e8eaf6;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer}

.rprog{display:flex;align-items:center;gap:.6rem;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:.7rem}
.rprog .bar{flex:1;margin:0}
.rnav{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:.6rem;position:sticky;top:-1.1rem;background:#fff;z-index:2;padding-top:.3rem}
.rchip{flex-shrink:0;border:1.5px solid #e2e8f0;background:#fff;border-radius:99px;padding:.3rem .7rem;font-family:inherit;font-weight:800;font-size:.74rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.rchip.d{background:#dcfce7;border-color:#86efac;color:#16a34a}
.rc{border-radius:16px;margin-bottom:.7rem;border:1.5px solid color-mix(in srgb,var(--c) 30%,#fff);overflow:hidden;background:#fff}
.rh{display:flex;align-items:center;gap:.6rem;width:100%;padding:.7rem .85rem;border:none;cursor:pointer;font-family:inherit;text-align:left;background:color-mix(in srgb,var(--c) 12%,#fff)}
.re{font-size:1.4rem}
.rtt{flex:1;font-family:'Fredoka One',cursive;font-size:1rem;color:var(--c)}
.rar{transition:transform .2s;color:var(--c)}
.rc.open .rar{transform:rotate(180deg)}
.rbody{display:none;padding:.8rem .85rem 1rem}
.rc.open .rbody{display:block}
.rc .ri{border-left:4px solid var(--c)}
.rbox{background:#fffbeb;border:1.5px dashed #f59e0b;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-size:.85rem;font-weight:700;line-height:1.5}
.rbox:before{content:'💡 Ingat! ';font-weight:900;color:#d97706}
.rtw{overflow-x:auto;margin:.6rem 0}
.rtbl{width:100%;border-collapse:collapse;font-size:.82rem;font-weight:600}
.rtbl th{background:var(--c);color:#fff;padding:.4rem .6rem;text-align:left}
.rtbl td{padding:.4rem .6rem;border-bottom:1px solid #e2e8f0}
.rtbl tr:nth-child(even) td{background:#f8fafc}
.rex{background:#f0f9ff;border-radius:12px;padding:.65rem .8rem;margin:.6rem 0;font-size:.85rem;font-weight:600}
.rex .eh{font-weight:900;color:#0369a1;margin-bottom:.25rem}
.rex ol{margin:.3rem 0 .3rem 1.2rem;line-height:1.6}
.rex .ea{font-weight:900;color:#16a34a}
.rtrik{background:#f5f3ff;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-size:.85rem;font-weight:700;line-height:1.5}
.rtrik:before{content:'🧠 Trik: ';font-weight:900;color:#7c3aed}
.rfct{font-size:.74rem;font-weight:900;color:var(--muted);margin:.7rem 0 .3rem}
.fcg{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
.fc{border:none;border-radius:12px;padding:.6rem;min-height:70px;font-family:inherit;font-size:.78rem;font-weight:800;cursor:pointer;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--text);line-height:1.35}
.fc .bk{display:none;color:#16a34a}
.fc.flip{background:#dcfce7}.fc.flip .fr{display:none}.fc.flip .bk{display:block}
.fc:before{content:'ketuk';display:block;font-size:.6rem;color:var(--muted);margin-bottom:.15rem}
.fc.flip:before{content:'jawaban'}
.rdn{margin-top:.8rem;width:100%;padding:.55rem;border:none;border-radius:11px;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#fff;font-family:inherit;font-weight:900;cursor:pointer}
@media(max-width:380px){.fcg{grid-template-columns:1fr}}

.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin:.6rem 0}
.stl{background:#f8fafc;border-radius:12px;padding:.5rem .3rem;text-align:center}
.stl b{display:block;font-family:'Fredoka One',cursive;font-size:1.3rem;line-height:1.1}
.stl span{font-size:.62rem;font-weight:800;color:var(--muted)}
.srow{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:12px;background:#f8fafc;margin-bottom:.4rem}
.srow .se{font-size:1.3rem}
.srow .sm{flex:1;min-width:0}
.srow .sn{font-weight:900;font-size:.85rem}
.srow .ss{font-size:.7rem;font-weight:700;color:var(--muted)}
.srow .sv{font-family:'Fredoka One',cursive;font-size:1.2rem}
.mini{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:.25rem 0}
.mini i{display:block;height:6px;border-radius:99px}
.schips{display:flex;gap:.4rem;overflow-x:auto;margin:.7rem 0 .4rem}
.sch{flex-shrink:0;border:1.5px solid #e2e8f0;background:#fff;border-radius:99px;padding:.35rem .75rem;font-family:inherit;font-weight:800;font-size:.76rem;color:var(--muted);cursor:pointer}
.sch.on{background:#1e293b;border-color:#1e293b;color:#fff}
.sbox{border:1.5px solid #e2e8f0;border-radius:14px;padding:.7rem .8rem;margin:.6rem 0}
.sbt{font-family:'Fredoka One',cursive;font-size:.95rem;margin-bottom:.4rem}
.lvr{display:flex;align-items:center;gap:.5rem;font-size:.76rem;font-weight:800;margin:.3rem 0}
.lvr .ln{width:62px}.lvr .mini{flex:1;margin:0}.lvr .lp{width:70px;text-align:right;color:var(--muted)}
.sad{background:#fffbeb;border:1.5px dashed #f59e0b;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0;font-size:.83rem;font-weight:700;line-height:1.5}
.swr{border-radius:11px;background:#fff1f2;border:1.5px solid #fecdd3;padding:.55rem .7rem;margin-bottom:.4rem;font-size:.82rem;font-weight:700}
.swr small{display:block;font-weight:600;color:var(--muted);margin-top:.2rem;line-height:1.45}
.hrw{display:flex;align-items:center;gap:.5rem;padding:.4rem .2rem;border-bottom:1px solid #f1f5f9;font-size:.78rem;font-weight:700}
.hrw .hd{width:92px;color:var(--muted);font-size:.7rem}.hrw .hm{flex:1}
.hrw .hn2{font-family:'Fredoka One',cursive;font-size:1rem}
.snote{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;margin-top:.8rem}
@media(max-width:380px){.sgrid{grid-template-columns:repeat(2,1fr)}}

.ltb{border:2px solid var(--c);border-radius:14px;margin:.9rem 0 .4rem;overflow:hidden}
.lth{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;background:color-mix(in srgb,var(--c) 12%,#fff);font-family:'Fredoka One',cursive;color:var(--c);font-size:.95rem}
.lth span.bs{margin-left:auto;font-family:'Nunito',sans-serif;font-weight:900;font-size:.72rem;color:var(--muted)}
.ltq{padding:.65rem .8rem;border-top:1px solid #eef2f7}
.ltq .qn{font-size:.7rem;font-weight:900;color:var(--muted)}
.ltq .qq{font-weight:700;font-size:.9rem;line-height:1.5;margin:.15rem 0 .45rem}
.lto{display:block;width:100%;text-align:left;padding:.45rem .65rem;margin-bottom:.3rem;border-radius:10px;border:1.8px solid #e2e8f0;background:#fff;font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;color:var(--text)}
.lto:hover:not(:disabled){border-color:var(--c);background:#f8fafc}
.lto:disabled{cursor:default}
.lto.c{border-color:#16a34a;background:#f0fdf4;color:#15803d}
.lto.w{border-color:#e11d48;background:#fff1f2;color:#be123c}
.lex{font-size:.8rem;font-weight:700;border-radius:9px;padding:.4rem .6rem;margin-top:.2rem;line-height:1.45}
.lex.ok{background:#dcfce7;color:#166534}.lex.no{background:#ffe4e6;color:#9f1239}
.ltr{padding:.8rem;text-align:center;border-top:1px solid #eef2f7;background:#fafafa}
.ltr b{font-family:'Fredoka One',cursive;font-size:1.5rem}
.ltgo{border:none;border-radius:11px;padding:.55rem 1.1rem;font-family:inherit;font-weight:900;color:#fff;background:var(--c);cursor:pointer;margin:.6rem 0}
.ltin{padding:.7rem .8rem;font-size:.82rem;font-weight:700;color:var(--muted);text-align:center}
.rbadge{font-size:.7rem;font-weight:900;background:#fef9c3;color:#92400e;border-radius:99px;padding:.1rem .5rem}
</style>
</head>
<body>

<div class="card" id="scr-nama">
  <div class="badge">🎯 Aplikasi Belajar 2025/2026</div>
  <h1>Kelas 6</h1>
  <div class="sub">Isi namamu sekali, lalu pilih mata pelajaran 😊</div>
  <input class="nm" id="in-nama" type="text" maxlength="40" placeholder="Tulis namamu di sini..." onkeydown="if(event.key==='Enter')mulai()">
  <button class="btn center" style="background:linear-gradient(135deg,#dc2626,#f97316)" onclick="mulai()">Mulai Belajar 🚀</button>
  <div class="err" id="nm-err">⚠️ Nama tidak boleh kosong!</div>
</div>

<div class="card" id="scr-menu" style="display:none">
  <div class="badge">🎯 Aplikasi Belajar 2025/2026</div>
  <h1>Pilih Mapel</h1>
  <div class="sub" id="hello"></div>
  <div id="mapel-list"></div>
  <button class="btn" id="btn-stat" style="background:linear-gradient(135deg,#0d9488,#0ea5e9)" onclick="openStat()"><div class="bi">📊</div><div class="bt"><div class="bl">Statistik Saya</div><div class="bd">Nilai, grafik, dan progres belajar</div></div></button>
  <button class="link" onclick="gantiNama()">Ganti nama</button>
</div>

<div class="card" id="scr-mapel" style="display:none">
  <div style="font-size:3rem" id="m-emoji"></div>
  <h1 id="m-judul" style="font-size:1.8rem"></h1>
  <div class="sub" id="m-sub"></div>
  <button class="btn" style="background:linear-gradient(135deg,#7c3aed,#6366f1)" onclick="openRangkuman()"><div class="bi">📖</div><div class="bt"><div class="bl">Rangkuman</div><div class="bd">Materi ringkas</div></div></button>
  <button class="btn" style="background:linear-gradient(135deg,#f59e0b,#f97316)" onclick="startQuiz()"><div class="bi">✏️</div><div class="bt"><div class="bl">Soal Latihan</div><div class="bd">30 soal acak · mudah–sedang–sulit</div></div></button>
  <button class="link" onclick="renderMenu()">← Kembali ke daftar mapel</button>
</div>

<div class="ov" id="ov"><div class="panel">
  <div class="ph"><span class="pt" id="ov-t"></span><button class="x" onclick="closeOv()">✕</button></div>
  <div class="pb" id="ov-b"></div>
</div></div>

<div class="pin" id="pin"><div class="pbox">
  <div style="font-size:2rem">🔐</div>
  <div style="font-family:'Fredoka One',cursive;font-size:1.2rem;color:#c040fb">Mode Admin</div>
  <div style="font-size:.78rem;color:#7986cb;font-weight:700">Masukkan PIN 6 digit</div>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="pin-err" style="color:#f43f5e;font-size:.78rem;font-weight:700;margin-top:.6rem;display:none">PIN salah.</div>
</div></div>

<script>
const BANK={};
const P=(lvl,q,opts,jawab,info)=>({lvl,tipe:'pg',q,opts,jawab,info});
const B=(lvl,q,v,info)=>({lvl,tipe:'bs',q,opts:['Benar','Salah'],jawab:v?0:1,info});
BANK.mat=[
P('M',"125 + 237 = …",["352","362","372","462"],1,"125 + 237 = 362."),
P('M',"1.000 − 357 = …",["633","643","653","743"],1,"1.000 − 357 = 643."),
P('M',"25 × 12 = …",["250","300","350","320"],1,"25 × 12 = 300."),
P('M',"144 : 12 = …",["10","11","12","14"],2,"12 × 12 = 144."),
P('M',"KPK dari 4 dan 6 adalah …",["8","10","12","24"],2,"Kelipatan 4: 4, 8, 12; kelipatan 6: 6, 12. KPK = 12."),
P('M',"FPB dari 12 dan 18 adalah …",["3","6","9","36"],1,"Faktor persekutuan terbesar 12 dan 18 adalah 6."),
B('M',"−5 lebih besar daripada −2.",false,"Pada garis bilangan, makin ke kiri makin kecil, jadi −5 < −2."),
P('M',"−3 + 8 = …",["−5","5","11","−11"],1,"Dari −3 maju 8 langkah menjadi 5."),
P('M',"5 − 9 = …",["4","−4","14","−14"],1,"5 − 9 = −4."),
B('M',"1/2 sama nilainya dengan 2/4.",true,"2/4 disederhanakan (dibagi 2) menjadi 1/2."),
P('M',"1/4 + 2/4 = …",["3/8","3/4","2/4","1/2"],1,"Penyebut sama, jumlahkan pembilang: 3/4."),
P('M',"3/5 − 1/5 = …",["2/10","4/5","2/5","3/5"],2,"3/5 − 1/5 = 2/5."),
P('M',"Pecahan yang sama dengan 0,5 adalah …",["1/5","1/2","1/4","2/3"],1,"0,5 = 5/10 = 1/2."),
B('M',"50% sama dengan 1/2.",true,"50/100 = 1/2."),
P('M',"25% dari 200 adalah …",["25","50","75","100"],1,"25/100 × 200 = 50."),
P('M',"Bentuk persen dari 0,75 adalah …",["7,5%","75%","750%","0,75%"],1,"0,75 × 100% = 75%."),
P('M',"Volume kubus dengan rusuk 5 cm adalah … cm³",["25","75","125","150"],2,"5 × 5 × 5 = 125."),
P('M',"Volume balok 6 cm × 4 cm × 3 cm adalah … cm³",["48","72","13","144"],1,"6 × 4 × 3 = 72."),

/* ---------- util ---------- */
const h53=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const show=id=>['scr-nama','scr-menu','scr-mapel'].forEach(x=>$(x).style.display=x===id?'':'none');

/* ---------- rekap ke Google Sheet ---------- */
function post(it){const p=new URLSearchParams();for(const k in it)p.append(k,it[k]);return fetch(GAS_URL,{method:'POST',mode:'no-cors',body:p})}
async function kirim(it){try{await post(it);return true}catch(e){const q=lsGet('pra6_pending',[]);q.push(it);lsSet('pra6_pending',q);return false}}
async function flush(){const q=lsGet('pra6_pending',[]);if(!q.length)return;const rest=[];for(const it of q){try{await post(it)}catch(e){rest.push(it)}}lsSet('pra6_pending',rest)}
function rekap(status){
  if(admin) return Promise.resolve(true);
  return kirim({nama,kelas:'6',mapel:'Aplikasi Belajar '+sk.n+' Kelas 6',nilai:nilaiOf(score),benar:score,jumlah:N,hadiah:status,waktu:new Date().toLocaleString('id-ID')});
}
function saveProg(nilai){
  if(admin) return;
  const nk=nama.toLowerCase(),key='pra6_'+nk,p=lsGet(key,{}),o=p[sk.k]||{best:0,n:0};
  o.last=nilai;o.best=Math.max(o.best,nilai);o.n++;p[sk.k]=o;lsSet(key,p);
  const lv={M:[0,0],S:[0,0],K:[0,0]},w=[],a=[];
  soal.forEach((q,i)=>{const ok=jw[i]===q.jawab;lv[q.lvl][1]++;if(ok)lv[q.lvl][0]++;else w.push(q._i);a.push(q._i)});
  const hk='pra6h_'+nk,h=lsGet(hk,[]);
  h.push({t:Date.now(),k:sk.k,n:nilai,b:score,lv,w,a});
  lsSet(hk,h.slice(-150));
}

/* ---------- nama & admin ---------- */
let pinBuf='';
function buildPad(){
  $('dots').innerHTML=Array.from({length:6},(_,i)=>`<div class="dot" id="d${i}"></div>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','✕','0','⌫'];
  $('pad').innerHTML=keys.map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('');
}
function pinKey(k){
  if(k==='✕'){pinBuf='';$('pin').classList.remove('on');return}
  if(k==='⌫')pinBuf=pinBuf.slice(0,-1);
  else if(pinBuf.length<6)pinBuf+=k;
  for(let i=0;i<6;i++)$('d'+i).classList.toggle('f',i<pinBuf.length);
  $('pin-err').style.display='none';
  if(pinBuf.length===6){
    if(h53(pinBuf)===HP){admin=true;pinBuf='';$('pin').classList.remove('on');renderMenu()}
    else{$('pin-err').style.display='block';pinBuf='';setTimeout(()=>{for(let i=0;i<6;i++)$('d'+i).classList.remove('f')},400)}
  }
}
function mulai(){
  const v=$('in-nama').value.trim();
  if(!v){$('nm-err').style.display='block';return}
  nama=v;admin=false;

}

    const info=o?`Terakhir ${o.last} · Terbaik ${o.best} · ${o.n}x`:s.d;

  $('btn-stat').style.display=admin?'none':'';
  show('scr-menu');
}
function openMapel(k){
  sk=SUBJ.find(s=>s.k===k);

let LTS={};
const ltKey=()=>'pra6lt_'+nama.toLowerCase()+'_'+sk.k;
function ltBest(i){return admin?null:(lsGet(ltKey(),{})[i]??null)}
function ltStart(i){
  LTS[i]=LT[sk.k][i].map(q=>{const o=shuffle([0,1,2,3]);return {q:q[0],o:o.map(x=>q[1][x]),a:o.indexOf(q[2]),e:q[3],sel:null}});
  ltDraw(i);
}
function ltAns(i,j,x){
  const q=LTS[i][j];if(q.sel!=null)return;
  q.sel=x;x===q.a?playOk():playWrong();
  if(LTS[i].every(z=>z.sel!=null)&&!admin){
    const sc=LTS[i].filter(z=>z.sel===z.a).length,k=ltKey(),b=lsGet(k,{});
    if((b[i]??-1)<sc){b[i]=sc;lsSet(k,b)}

  ltDraw(i);
}
function ltDraw(i){
  const el=$('lt'+i),st=LTS[i],b=ltBest(i),K='ABCD';
  const bd=b!=null?`⭐ Terbaik ${b}/5`:'';
  const bg=$('lb'+i);if(bg)bg.textContent=b!=null?'⭐ '+b+'/5':'';
  if(!st){
    el.innerHTML=`<div class="ltb"><div class="lth">🏋️ Latihan Bab <span class="bs">${bd||'5 soal'}</span></div><div class="ltin">Uji pemahamanmu dulu sebelum lanjut. Tanpa timer, tidak memengaruhi nilai di spreadsheet.<br><button class="ltgo" onclick="ltStart(${i})">Mulai latihan</button></div></div>`;
    return;
  }
  const done=st.every(z=>z.sel!=null),sc=st.filter(z=>z.sel===z.a).length;
  let h=`<div class="ltb"><div class="lth">🏋️ Latihan Bab <span class="bs">${st.filter(z=>z.sel!=null).length}/5 dijawab</span></div>`;

      h+=`<button class="lto ${c}" ${q.sel!=null?'disabled':''} onclick="ltAns(${i},${j},${x})"><b>${K[x]}.</b> ${t}</button>`;

    h+=`</div>`;
  });

    const em=sc===5?'🏆':sc>=4?'🎉':sc>=3?'👍':'💪';
    const msg=sc===5?'Sempurna! Kamu menguasai bab ini.':sc>=3?'Bagus! Baca lagi bagian yang salah, lalu coba ulang.':'Jangan menyerah! Baca ulang bab ini, lalu coba lagi.';

/* ---------- kuis ---------- */
function pick(){
  const b=BANK[sk.k].map((s,i)=>({...s,_i:i}));
  const f=(l,n)=>shuffle(b.filter(s=>s.lvl===l)).slice(0,n);
  return shuffle([...f('M',15),...f('S',9),...f('K',6)]).map(s=>{
    if(s.tipe==='bs')return s;
    const sh=shuffle([0,1,2,3]);
    return {...s,opts:sh.map(i=>s.opts[i]),jawab:sh.indexOf(s.jawab)};
  });
}
function startQuiz(){
  soal=pick();cur=0;score=0;jw=Array(N).fill(null);selesai=false;
  openOv('Soal '+sk.n,'');renderSoal();
}
function renderSoal(){
  const s=soal[cur],prev=jw[cur],K='ABCD';
  let h=`<div class="pg"><span>Soal ${cur+1} / ${N}</span><span>📊 Nilai: ${nilaiOf(score)}</span></div>
  <div class="bar"><i style="width:${Math.round(cur/N*100)}%"></i></div>
  <div class="tm" id="tm"><span class="tn" id="tn">${prev!=null?'✓':TIMER}</span><div class="tb"><i id="tbi" style="width:${prev!=null?0:100}%"></i></div><span id="tl">${prev!=null?(prev===-1?'Waktu habis':'Sudah dijawab'):'detik'}</span></div>
  <span class="chip c${s.lvl}">${lvlLbl[s.lvl]}</span>
  <div class="qt">${s.q}</div>`;
  s.opts.forEach((o,i)=>{
    let c='';
    if(prev!=null){ if(i===s.jawab)c=prev===i?'c':'k'; else if(i===prev)c='w'; }
    else if(admin&&i===s.jawab)c='k';
    const key=s.tipe==='bs'?(i===0?'✓':'✗'):K[i];
    h+=`<button class="op ${c}" ${prev!=null?'disabled':''} onclick="jwb(${i})"><span class="ok">${key}</span>${o}</button>`;
  });
  if(prev!=null){
    const ok=prev===s.jawab;
    h+=`<div class="rz ${ok?'ok2':'no'}">${prev===-1?'⏰ Waktu habis':ok?'✅ Jawaban benar!':'❌ Jawaban kurang tepat'}</div>`;
  }
  h+=`<div class="nv">${cur===N-1
    ?`<button class="nb f" ${prev==null?'disabled':''} onclick="showHasil()">Lihat Hasil 🎉</button>`
    :`<button class="nb" ${prev==null?'disabled':''} onclick="cur++;renderSoal()">Lanjut →</button>`}</div>`;
  $('ov-b').innerHTML=h;$('ov-b').scrollTop=0;
  if(prev==null)startTimer();else stopTimer();
}
function startTimer(){
  stopTimer();left=TIMER;
  tmr=setInterval(()=>{
    left--;
    const tn=$('tn'),tbi=$('tbi'),tm=$('tm');
    if(!tn){stopTimer();return}
    tn.textContent=left;tbi.style.width=(left/TIMER*100)+'%';
    tm.className='tm'+(left<=10?' u':left<=20?' w':'');
    if(left<=0){stopTimer();jw[cur]=-1;playWrong();renderSoal()}
  },1000);
}
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null}}
function jwb(i){
  if(jw[cur]!=null)return;
  stopTimer();jw[cur]=i;
  if(i===soal[cur].jawab){score++;playOk()}else playWrong();
  renderSoal();
}

const fmtT=t=>{const d=new Date(t);return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})};
const histOf=()=>lsGet('pra6h_'+nama.toLowerCase(),[]);
const nilCol=n=>n>=75?'#16a34a':n>=60?'#0ea5e9':n>=40?'#d97706':'#e11d48';
function chartSvg(vals,color){
  const W=300,H=140,pl=26,pr=12,pt=16,pb=20,n=vals.length;
  const x=i=>n===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1),y=v=>pt+(100-v)/100*(H-pt-pb);
  let g='';
  [0,50,100].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${pl-4}" y="${y(v)+3}" font-size="8" text-anchor="end" fill="#94a3b8">${v}</text>`);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"/><text x="${x(i)}" y="${y(v)-7}" font-size="8" font-weight="700" text-anchor="middle" fill="#334155">${v}</text><text x="${x(i)}" y="${H-6}" font-size="7" text-anchor="middle" fill="#94a3b8">${i+1}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafik nilai">${g}${n>1?`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}</svg>`;
}

  }else{

      top.forEach(([i,v])=>{const q=BANK[statK][i];h+=`<div class="swr">${q.q}<small>Salah ${v[0]} dari ${v[1]}x muncul · Jawaban benar: <b>${q.opts[q.jawab]}</b><br>${q.info}</small></div>`});
      h+=`</div>`;
    }else h+=`<div class="sbox" style="text-align:center;font-weight:800;color:#16a34a">🎉 Belum ada soal yang salah. Hebat!</div>`;
    const r=lsGet('pra6r_'+nk+'_'+statK,[]),nb=RK[statK].length,sa=[];
    if(pct.M!=null&&pct.M<70)sa.push('Dasar masih perlu dikuatkan: baca ulang Rangkuman '+s.n+' dan latih kartu kilat.');
    else if(pct.S!=null&&pct.S<70)sa.push('Soal sedang masih sering salah: pelajari contoh soal dan trik di rangkuman, lalu latihan lagi.');

let ac=null;
function tone(f,t0,d,type,v){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.01,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);
}
function playOk(){try{[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.4,'sine',.2))}catch(e){}}
function playWrong(){try{tone(200,0,.4,'sawtooth',.12);tone(130,.1,.4,'square',.08)}catch(e){}}
