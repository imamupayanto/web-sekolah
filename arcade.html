/* ===== doodle-jump.js                          ===== */
(function(){
/* Doodle Jump — Platformer · Canvas 2D · potrait
   Lompat otomatis, tahan kiri/kanan atau geser jari.                   */

var api, root, cvs, hud;
var P, plats, camY, best, score, state, ctrl, hold, dragX, padX0, hintT, sq;

var GRAV = 1500, JUMP = -620, SPRING = -1000, ACC = 1500, MAXVX = 340;
var PW = 62, PH = 13;

function newGame() {
  api.closeOverlays();
  P = { x: cvs.w / 2, y: cvs.h - 140, vx: 0, vy: JUMP, w: 34, h: 34 };
  plats = [];
  camY = 0;
  score = 0;
  hintT = 3.4;
  sq = 0;
  plats.push({ x: cvs.w / 2 - PW / 2, y: cvs.h - 90, t: "n", vx: 0, dead: false });
  var y = cvs.h - 90;
  while (y > -cvs.h) { y -= 62 + api.rand(46); plats.push(makePlat(y)); }
  state = "play";
  refresh();
}

function makePlat(y) {
  var r = Math.random();
  var t = "n";
  var h = Math.max(0, -camY);
  if (r < 0.13 + Math.min(0.14, h / 26000)) t = "m";
  else if (r < 0.24 + Math.min(0.16, h / 22000)) t = "b";
  else if (r < 0.30) t = "s";
  return {
    x: 8 + Math.random() * (cvs.w - PW - 16), y: y, t: t,
    vx: t === "m" ? (Math.random() < .5 ? -1 : 1) * (44 + Math.random() * 52) : 0,
    dead: false
  };
}

function refresh() {
  hud.set({ score: Math.floor(score), best: best });
}

function over() {
  if (state === "over") return;
  state = "over";
  var s = Math.floor(score);
  if (s > best) { best = s; api.store.set("best", best); }
  refresh();
  api.sfx("lose"); api.vibrate(70);
  api.overlay({
    title: "Jatuh!",
    lines: ["Ketinggian <b>" + s + "</b>", "Terbaik <b>" + best + "</b>"],
    buttons: [{ label: "Main Lagi", style: "pri", delay: 380, onClick: newGame },
              { label: "Ganti kontrol", style: "gho", onClick: startScreen }]
  });
}

function update(dt) {
  if (state !== "play") return;
  if (hintT > 0) hintT -= dt;
  if (sq > 0) sq -= dt;

  if (ctrl === "hold") {
    if (hold === -1) P.vx -= ACC * dt;
    else if (hold === 1) P.vx += ACC * dt;
    else P.vx *= Math.pow(0.0009, dt);
    P.vx = api.clamp(P.vx, -MAXVX, MAXVX);
    P.x += P.vx * dt;
  } else {
    P.x += (dragX != null ? 0 : 0);
    P.vx = 0;
  }

  if (P.x < -P.w / 2) P.x = cvs.w + P.w / 2;
  if (P.x > cvs.w + P.w / 2) P.x = -P.w / 2;

  P.vy += GRAV * dt;
  P.y += P.vy * dt;

  if (P.vy > 0) {
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (p.dead) continue;
      var py = p.y;
      if (P.y + P.h / 2 >= py && P.y + P.h / 2 <= py + PH + 14 &&
          P.x + P.w * 0.35 > p.x && P.x - P.w * 0.35 < p.x + PW) {
        if (p.t === "b") {
          p.dead = true;
          api.sfx("err");
          continue;
        }
        P.y = py - P.h / 2;
        P.vy = p.t === "s" ? SPRING : JUMP;
        sq = 0.16;
        api.sfx(p.t === "s" ? "win" : "tap");
        if (p.t === "s") api.vibrate(18);
        break;
      }
    }
  }

  for (i = 0; i < plats.length; i++) {
    var pm = plats[i];
    if (pm.t !== "m" || pm.dead) continue;
    pm.x += pm.vx * dt;
    if (pm.x < 6) { pm.x = 6; pm.vx = Math.abs(pm.vx); }
    if (pm.x > cvs.w - PW - 6) { pm.x = cvs.w - PW - 6; pm.vx = -Math.abs(pm.vx); }
  }

  // kamera hanya naik
  var want = P.y - cvs.h * 0.44;
  if (want < camY) {
    score += (camY - want) / 8;
    camY = want;
    refresh();
  }

  // buang platform di bawah layar, tambah di atas
  var topY = camY - 40;
  for (i = plats.length - 1; i >= 0; i--) {
    if (plats[i].y > camY + cvs.h + 60) plats.splice(i, 1);
  }
  var highest = Infinity;
  for (i = 0; i < plats.length; i++) if (plats[i].y < highest) highest = plats[i].y;
  while (highest > topY) {
    highest -= 62 + api.rand(46);
    plats.push(makePlat(highest));
  }

  if (P.y - camY > cvs.h + 60) over();
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h;
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0c4a6e"); g.addColorStop(1, "#075985");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // bintang latar yang ikut kamera
  ctx.fillStyle = "rgba(255,255,255,.35)";
  var off = ((-camY * 0.3) % 90 + 90) % 90;
  for (var i = 0; i < 40; i++) {
    var sx = (i * 97) % W, sy = ((i * 53) % 90) + Math.floor(i / 5) * 90 + off - 90;
    if (sy < -4 || sy > H) continue;
    ctx.fillRect(sx, sy, 2, 2);
  }

  for (i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (p.dead) continue;
    var y = p.y - camY;
    if (y < -30 || y > H + 30) continue;
    var col = p.t === "n" ? "#22c55e" : p.t === "m" ? "#3b82f6" : p.t === "b" ? "#b45309" : "#eab308";
    ctx.fillStyle = col;
    api.rr(ctx, p.x, y, PW, PH, 6); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    api.rr(ctx, p.x + 3, y + 2, PW - 6, 4, 2); ctx.fill();
    if (p.t === "s") {
      ctx.fillStyle = "#facc15";
      ctx.fillRect(p.x + PW / 2 - 7, y - 9, 14, 9);
      ctx.fillStyle = "#a16207";
      ctx.fillRect(p.x + PW / 2 - 7, y - 9, 14, 3);
    }
    if (p.t === "b") {
      ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(p.x + PW * .35, y); ctx.lineTo(p.x + PW * .45, y + PH);
      ctx.moveTo(p.x + PW * .65, y); ctx.lineTo(p.x + PW * .58, y + PH);
      ctx.stroke();
    }
  }

  // karakter
  var py = P.y - camY;
  var sqf = sq > 0 ? 1 + sq * 1.1 : 1;
  ctx.save();
  ctx.translate(P.x, py);
  ctx.scale(1 / sqf, sqf);
  ctx.fillStyle = "#f472b6";
  api.rr(ctx, -P.w / 2, -P.h / 2, P.w, P.h, 10); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(-6, -4, 5.5, 0, Math.PI * 2);
  ctx.arc(7, -4, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111827";
  var look = api.clamp(P.vx / 200, -1, 1) * 2;
  ctx.beginPath();
  ctx.arc(-6 + look, -4, 2.6, 0, Math.PI * 2);
  ctx.arc(7 + look, -4, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#111827"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 6, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();

  if (ctrl === "hold" && hintT > 0) {
    ctx.globalAlpha = Math.min(0.4, hintT / 3.4 * 0.4);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, H * 0.45, W / 2 - 2, H * 0.55);
    ctx.fillRect(W / 2 + 2, H * 0.45, W / 2 - 2, H * 0.55);
    ctx.globalAlpha = Math.min(0.9, hintT / 3.4);
    ctx.fillStyle = "#0f172a";
    ctx.font = "800 26px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("◀", W * 0.25, H * 0.75);
    ctx.fillText("▶", W * 0.75, H * 0.75);
    ctx.globalAlpha = 1;
  }
}

function startScreen() {
  state = "over";
  var box = api.el("div", null);
  box.appendChild(api.el("div", "fieldlbl", "Kontrol"));
  var row = api.el("div", "seg");
  [["hold", "Tahan kiri/kanan"], ["drag", "Geser jari"]].forEach(function (o) {
    var b = api.el("button", "btn");
    b.textContent = o[1];
    b.setAttribute("aria-pressed", String(ctrl === o[0]));
    b.addEventListener("click", function (e) {
      e.preventDefault();
      ctrl = o[0]; api.store.set("ctrl", ctrl); api.sfx("tap");
      Array.prototype.forEach.call(row.children, function (c) {
        c.setAttribute("aria-pressed", String(c === b));
      });
    });
    row.appendChild(b);
  });
  box.appendChild(row);
  api.overlay({
    title: "Doodle Jump",
    lines: ["Lompatan otomatis. Naik setinggi mungkin."],
    body: box,
    buttons: [{ label: "Mulai", style: "pri", onClick: newGame }]
  });
}

Arcade.register({
  id: "doodle-jump",
  title: "Doodle Jump",
  cat: "Platformer",
  tech: "canvas",
  diff: 2,
  orient: "portrait",
  icon: "🦘",
  desc: "Sentuh separuh kiri atau kanan layar.",

  mount: function (r, a) {
    api = a; root = r;
    best = api.store.get("best", 0);
    ctrl = api.store.get("ctrl", "hold");
    state = "over"; hold = 0; dragX = null; score = 0; camY = 0; sq = 0; hintT = 0;
    plats = [];

    hud = api.hud({ score: 0, best: best });
    root.appendChild(hud.el);

    cvs = api.canvas(root);
    P = { x: cvs.w / 2, y: cvs.h - 140, vx: 0, vy: JUMP, w: 34, h: 34 };

    var touches = {};
    function sync() {
      var l = false, r2 = false;
      for (var k in touches) { if (touches[k] < 0) l = true; else r2 = true; }
      hold = l && !r2 ? -1 : r2 && !l ? 1 : 0;
    }
    api.on(cvs.wrap, "touchstart", function (e) {
      var b = cvs.wrap.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (ctrl === "hold") { touches[t.identifier] = (t.clientX - b.left) < cvs.w / 2 ? -1 : 1; }
        else { dragX = t.clientX - b.left; padX0 = P.x; }
      }
      sync();
    }, { passive: true });
    api.on(cvs.wrap, "touchmove", function (e) {
      var b = cvs.wrap.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (ctrl === "drag" && dragX != null) {
          var nx = padX0 + (t.clientX - b.left - dragX) * 1.5;
          P.vx = (nx - P.x) * 8;
          P.x = nx;
        } else if (ctrl === "hold" && touches[t.identifier] !== undefined) {
          touches[t.identifier] = (t.clientX - b.left) < cvs.w / 2 ? -1 : 1;
        }
      }
      sync();
    }, { passive: true });
    function up(e) {
      for (var i = 0; i < e.changedTouches.length; i++) delete touches[e.changedTouches[i].identifier];
      dragX = null;
      sync();
    }
    api.on(cvs.wrap, "touchend", up, { passive: true });
    api.on(cvs.wrap, "touchcancel", up, { passive: true });
    api.on(window, "blur", function () { touches = {}; dragX = null; sync(); });
    api.on(cvs.wrap, "mousedown", function (e) {
      var b = cvs.wrap.getBoundingClientRect();
      if (ctrl === "hold") { touches.mouse = (e.clientX - b.left) < cvs.w / 2 ? -1 : 1; sync(); }
      else { dragX = e.clientX - b.left; padX0 = P.x; }
    });
    api.on(window, "mousemove", function (e) {
      if (ctrl !== "drag" || dragX == null) return;
      var b = cvs.wrap.getBoundingClientRect();
      var nx = padX0 + (e.clientX - b.left - dragX) * 1.5;
      P.vx = (nx - P.x) * 8; P.x = nx;
    });
    api.on(window, "mouseup", function () { delete touches.mouse; dragX = null; sync(); });

    newGame();
    startScreen();

    api.loop(function (dt) { update(dt); draw(); });
  },

  restart: function () { newGame(); },

  unmount: function () {
    plats = null; P = null; cvs = null; hud = null; root = null; api = null;
  }
});
})();

/* ===== drift-arena.js                          ===== */
(function(){
/* Drift Arena — Racing 2D · Canvas 2D · landscape
   Slip angle terpisah dari arah hadap; tahan drift sambil membelok.    */

var api, root, cvs, hud, pad;
var car, cones, marks, smoke, cam;
var score, pending, combo, comboT, straightT, timeLeft, best, state, target;

var BTN = {};
var ARENA = { w: 1500, h: 1000 };

function newGame() {
  api.closeOverlays();
  car = { x: ARENA.w / 2, y: ARENA.h / 2, a: 0, vx: 0, vy: 0 };
  cones = [];
  for (var i = 0; i < 22; i++) {
    cones.push({ x: 130 + Math.random() * (ARENA.w - 260), y: 130 + Math.random() * (ARENA.h - 260), hit: 0 });
  }
  marks = []; smoke = [];
  cam = { x: car.x, y: car.y };
  score = 0; pending = 0; combo = 1; comboT = 0; straightT = 0;
  timeLeft = 90; state = "play";
  target = 12000;
  refresh();
}

function refresh() {
  hud.set({ score: Math.floor(score), best: best,
            extra: { Waktu: Math.ceil(Math.max(0, timeLeft)) + "s", Combo: "×" + combo } });
}

function bankCombo() {
  if (pending > 0) {
    score += Math.floor(pending * combo);
    api.sfx("ok");
  }
  pending = 0; combo = 1; comboT = 0;
}

/* Pantulan dinding: kecepatan DAN arah hadap ikut memantul, kalau tidak
   mobil menempel di dinding (throttle mendorong ke luar sementara kecepatan
   dipantulkan) dan slip angle tak pernah turun sehingga poin tak pernah masuk. */
function bounce(nx, ny) {
  var dot = car.vx * nx + car.vy * ny;
  if (dot < 0) { car.vx -= 2 * dot * nx; car.vy -= 2 * dot * ny; }
  car.vx *= 0.5; car.vy *= 0.5;
  var hx = Math.cos(car.a), hy = Math.sin(car.a);
  var hd = hx * nx + hy * ny;
  if (hd < 0) {
    hx -= 2 * hd * nx; hy -= 2 * hd * ny;
    car.a = Math.atan2(hy, hx);
  }
  straightT = 2;
  bankCombo();
  api.sfx("err");
  api.vibrate(20);
}

function finish() {
  state = "over";
  bankCombo();
  if (score > best) { best = Math.floor(score); api.store.set("best", best); }
  refresh();
  api.sfx(score >= target ? "win" : "lose");
  api.vibrate(score >= target ? [20, 50, 20] : 60);
  api.overlay({
    title: score >= target ? "Target tercapai! 🏆" : "Waktu habis",
    lines: ["Skor drift <b>" + api.fmt(score) + "</b>",
            "Target " + api.fmt(target),
            "Terbaik <b>" + api.fmt(best) + "</b>"],
    buttons: [{ label: "Main Lagi", style: "pri", delay: 350, onClick: newGame }]
  });
}

function update(dt) {
  if (state !== "play") return;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; return finish(); }

  var drifting = pad.is("drift");
  var turn = (pad.is("right") ? 1 : 0) - (pad.is("left") ? 1 : 0);

  // gas otomatis searah hadap
  var THR = 620;
  car.vx += Math.cos(car.a) * THR * dt;
  car.vy += Math.sin(car.a) * THR * dt;

  var sp = Math.sqrt(car.vx * car.vx + car.vy * car.vy);
  car.a += turn * (2.5 * api.clamp(sp / 220, 0.3, 1.25)) * dt;

  // grip: memaksa vektor kecepatan menyelaraskan diri dengan arah hadap
  var grip = drifting ? 1.1 : 7.5;
  var fx = Math.cos(car.a), fy = Math.sin(car.a);
  var fwd = car.vx * fx + car.vy * fy;
  var latx = car.vx - fx * fwd, laty = car.vy - fy * fwd;
  var keep = Math.exp(-grip * dt);
  car.vx = fx * fwd + latx * keep;
  car.vy = fy * fwd + laty * keep;

  // gesekan
  var fr = Math.exp(-(drifting ? 0.55 : 1.05) * dt);
  car.vx *= fr; car.vy *= fr;
  sp = Math.sqrt(car.vx * car.vx + car.vy * car.vy);
  if (sp > 430) { car.vx *= 430 / sp; car.vy *= 430 / sp; sp = 430; }

  car.x += car.vx * dt;
  car.y += car.vy * dt;
  if (car.x < 40) { car.x = 40; bounce(1, 0); }
  else if (car.x > ARENA.w - 40) { car.x = ARENA.w - 40; bounce(-1, 0); }
  if (car.y < 40) { car.y = 40; bounce(0, 1); }
  else if (car.y > ARENA.h - 40) { car.y = ARENA.h - 40; bounce(0, -1); }

  // slip angle = selisih arah gerak dengan arah hadap
  var slip = 0;
  if (sp > 40) {
    var mv = Math.atan2(car.vy, car.vx);
    slip = Math.abs(((mv - car.a + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
  }

  if (slip > 0.35 && sp > 90) {
    pending += slip * sp * dt * 0.9;
    straightT = 0;
    comboT += dt;
    if (comboT >= 2) { comboT = 0; combo = Math.min(10, combo + 1); api.sfx("pop"); }
    marks.push({ x: car.x, y: car.y, a: car.a, t: 3 });
    if (marks.length > 300) marks.shift();
    if (smoke.length < 60) {
      smoke.push({ x: car.x - Math.cos(car.a) * 16, y: car.y - Math.sin(car.a) * 16,
                   r: 6 + Math.random() * 6, t: 0.7 });
    }
  } else {
    straightT += dt;
    if (straightT > 1 && pending > 0) bankCombo();
  }

  for (var i = marks.length - 1; i >= 0; i--) { marks[i].t -= dt * 0.5; if (marks[i].t <= 0) marks.splice(i, 1); }
  for (i = smoke.length - 1; i >= 0; i--) {
    var s = smoke[i];
    s.t -= dt; s.r += 26 * dt;
    if (s.t <= 0) smoke.splice(i, 1);
  }

  for (i = 0; i < cones.length; i++) {
    var c = cones[i];
    if (c.hit > 0) { c.hit -= dt; continue; }
    if (Math.abs(c.x - car.x) < 22 && Math.abs(c.y - car.y) < 22) {
      c.hit = 3;
      api.sfx("err"); api.vibrate(30);
      api.toast("Cone tertabrak — combo hangus");
      pending = 0; combo = 1; comboT = 0;
    }
  }

  cam.x += (car.x - cam.x) * Math.min(1, dt * 4);
  cam.y += (car.y - cam.y) * Math.min(1, dt * 4);
  refresh();
}

function buttons() {
  var W = cvs.w, H = cvs.h;
  var r = Math.min(44, H * 0.15);
  BTN.left = { id: "left", x: r + 16, y: H - r - 16, r: r };
  BTN.right = { id: "right", x: r * 3 + 30, y: H - r - 16, r: r };
  BTN.drift = { id: "drift", x: W - r * 1.3 - 16, y: H - r * 1.3 - 16, r: r * 1.3 };
  return [BTN.left, BTN.right, BTN.drift];
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h;
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2 - cam.x, H / 2 - cam.y);

  ctx.fillStyle = "#334155";
  ctx.fillRect(0, 0, ARENA.w, ARENA.h);
  ctx.strokeStyle = "rgba(255,255,255,.14)";
  ctx.lineWidth = 2;
  for (var x = 0; x <= ARENA.w; x += 150) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, ARENA.h); ctx.stroke();
  }
  for (var y = 0; y <= ARENA.h; y += 150) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(ARENA.w, y); ctx.stroke();
  }
  ctx.strokeStyle = "#f59e0b";
  ctx.lineWidth = 8;
  ctx.strokeRect(20, 20, ARENA.w - 40, ARENA.h - 40);

  ctx.strokeStyle = "rgba(0,0,0,.5)";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  marks.forEach(function (m) {
    ctx.globalAlpha = Math.max(0, m.t / 3) * 0.75;
    ctx.beginPath();
    ctx.moveTo(m.x - Math.cos(m.a) * 10, m.y - Math.sin(m.a) * 10);
    ctx.lineTo(m.x, m.y);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  cones.forEach(function (c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    if (c.hit > 0) ctx.rotate(1.1);
    ctx.fillStyle = "#f97316";
    ctx.beginPath();
    ctx.moveTo(0, -13); ctx.lineTo(9, 11); ctx.lineTo(-9, 11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillRect(-6, -2, 12, 4);
    ctx.restore();
  });

  smoke.forEach(function (s) {
    ctx.globalAlpha = Math.max(0, s.t) * 0.5;
    ctx.fillStyle = "#cbd5e1";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.a);
  ctx.fillStyle = "rgba(0,0,0,.4)";
  api.rr(ctx, -19, -11, 38, 22, 5); ctx.fill();
  ctx.fillStyle = "#22d3ee";
  api.rr(ctx, -20, -12, 40, 24, 5); ctx.fill();
  ctx.fillStyle = "#0e7490";
  api.rr(ctx, -5, -9, 13, 18, 3); ctx.fill();
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(-15, -15, 9, 5); ctx.fillRect(-15, 10, 9, 5);
  ctx.fillRect(8, -15, 9, 5); ctx.fillRect(8, 10, 9, 5);
  ctx.restore();
  ctx.restore();

  // multiplier besar di tengah atas
  if (pending > 0) {
    ctx.fillStyle = "rgba(250,204,21,.95)";
    ctx.font = "900 " + Math.round(Math.min(46, 26 + combo * 2)) + "px system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("×" + combo, W / 2, 46);
    ctx.font = "800 16px system-ui,sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText("+" + api.fmt(Math.floor(pending * combo)), W / 2, 68);
  }

  var bs = buttons();
  var labels = { left: "◀", right: "▶", drift: "DRIFT" };
  bs.forEach(function (b) {
    var on = pad.is(b.id);
    ctx.globalAlpha = on ? 0.65 : 0.3;
    ctx.fillStyle = b.id === "drift" ? "#f59e0b" : "#0f172a";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = on ? 1 : 0.75;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "800 " + Math.round(b.id === "drift" ? b.r * 0.34 : b.r * 0.7) + "px system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(labels[b.id], b.x, b.y + 1);
  });
  ctx.globalAlpha = 1;
  ctx.textBaseline = "alphabetic";
}

Arcade.register({

/* ===== flappy.js                               ===== */
(function(){
/* Flappy Bird — Arcade / Casual · Canvas 2D · potrait
   Satu tap di mana saja untuk terbang melewati celah pipa.             */

var api, root, cvs, hud;
var bird, pipes, clouds, score, best, state, groundX, lastFlap, spawnT, speed;

var GRAV = 1500, FLAP = -430, PIPE_W = 66, GAP_MIN = 152, GAP_MAX = 195;
var GROUND = 74;

function reset() {
  bird = { x: 0, y: 0, vy: 0, rot: 0, wing: 0 };
  pipes = [];
  score = 0;
  speed = 175;
  spawnT = 0;
  groundX = 0;
  lastFlap = 0;
  bird.x = Math.max(64, cvs.w * 0.3);
  bird.y = (cvs.h - GROUND) * 0.42;
  clouds = [];
  for (var i = 0; i < 7; i++) {
    clouds.push({
      x: Math.random() * cvs.w, y: 40 + Math.random() * (cvs.h - GROUND - 180),
      s: 0.22 + Math.random() * 0.5, r: 20 + Math.random() * 34
    });
  }
  hud.set({ score: 0, best: best });
}

function flap() {
  if (state === "over") return;
  var t = Date.now();
  if (t - lastFlap < 90) return;      // abaikan sentuhan ganda terlalu cepat
  lastFlap = t;
  if (state === "ready") state = "play";
  bird.vy = FLAP;
  bird.wing = 0.18;
  api.sfx("tap");
}

function spawnPipe() {
  var usable = cvs.h - GROUND;
  var gap = GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
  var margin = 58;
  var top = margin + Math.random() * (usable - gap - margin * 2);
  pipes.push({ x: cvs.w + PIPE_W, top: top, gap: gap, passed: false });
}

function die() {
  if (state === "over") return;
  state = "over";
  api.sfx("lose");
  api.vibrate(70);
  if (score > best) { best = score; api.store.set("best", best); }
  hud.set({ score: score, best: best });
  api.overlay({
    title: "Tamat",
    lines: ["Skor <b>" + score + "</b>", "Terbaik <b>" + best + "</b>"],
    buttons: [{
      label: "Main Lagi", style: "pri", delay: 500,
      onClick: function () { reset(); state = "ready"; }
    }]
  });
}

function update(dt) {
  var floorY = cvs.h - GROUND;

  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    c.x -= speed * c.s * dt;
    if (c.x < -c.r * 2.4) { c.x = cvs.w + c.r * 2; c.y = 40 + Math.random() * (floorY - 180); }
  }

  if (state === "ready") {
    bird.y = floorY * 0.42 + Math.sin(Date.now() / 260) * 9;
    bird.rot = 0;
    groundX = (groundX - speed * dt) % 34;
    return;
  }
  if (state === "over") return;

  groundX = (groundX - speed * dt) % 34;

  bird.vy += GRAV * dt;
  bird.y += bird.vy * dt;
  bird.rot = api.clamp(bird.vy / 620, -0.5, 1.35);
  if (bird.wing > 0) bird.wing -= dt;

  spawnT -= dt;
  if (spawnT <= 0) { spawnPipe(); spawnT = (PIPE_W + 148) / speed; }

  var r = 15;
  for (i = pipes.length - 1; i >= 0; i--) {
    var p = pipes[i];
    p.x -= speed * dt;
    if (p.x + PIPE_W < -20) { pipes.splice(i, 1); continue; }
    if (!p.passed && p.x + PIPE_W < bird.x - r) {
      p.passed = true;
      score++;
      api.sfx("coin");
      if (score > best) { best = score; api.store.set("best", best); }
      hud.set({ score: score, best: best });
      if (score % 6 === 0) speed = Math.min(280, speed + 9);
    }
    if (bird.x + r > p.x && bird.x - r < p.x + PIPE_W) {
      if (bird.y - r < p.top || bird.y + r > p.top + p.gap) return die();
    }
  }
  if (bird.y + r >= floorY) { bird.y = floorY - r; return die(); }
  if (bird.y - r <= 0) { bird.y = r; bird.vy = 0; }
}

function drawBird(ctx) {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.fillStyle = "#facc15";
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f59e0b";
  ctx.beginPath();
  var w = bird.wing > 0 ? -8 : 5;
  ctx.ellipse(-3, w * 0.5, 10, 6.5, w > 0 ? 0.3 : -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(7, -4.5, 5.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#111827";
  ctx.beginPath(); ctx.arc(8.8, -4.5, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#f97316";
  ctx.beginPath();
  ctx.moveTo(15, -1); ctx.lineTo(25, 2.4); ctx.lineTo(15, 6); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h, floorY = H - GROUND;

  var sky = ctx.createLinearGradient(0, 0, 0, floorY);
  sky.addColorStop(0, "#38bdf8");
  sky.addColorStop(1, "#bae6fd");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, floorY);

  ctx.fillStyle = "rgba(255,255,255,.85)";
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * .85, c.y + c.r * .18, c.r * .72, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * .8, c.y + c.r * .22, c.r * .62, 0, Math.PI * 2);
    ctx.fill();
  }

  for (i = 0; i < pipes.length; i++) {
    var p = pipes[i];
    var g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0, "#16a34a"); g.addColorStop(.45, "#4ade80"); g.addColorStop(1, "#15803d");
    ctx.fillStyle = g;
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top + p.gap, PIPE_W, floorY - p.top - p.gap);
    ctx.fillStyle = "#166534";
    ctx.fillRect(p.x - 5, p.top - 20, PIPE_W + 10, 20);
    ctx.fillRect(p.x - 5, p.top + p.gap, PIPE_W + 10, 20);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(p.x + 8, 0, 7, p.top - 20);
    ctx.fillRect(p.x + 8, p.top + p.gap + 20, 7, floorY - p.top - p.gap - 20);
  }

  drawBird(ctx);

  ctx.fillStyle = "#ca8a04";
  ctx.fillRect(0, floorY, W, GROUND);
  ctx.fillStyle = "#65a30d";
  ctx.fillRect(0, floorY, W, 15);
  ctx.fillStyle = "#4d7c0f";
  for (var x = groundX; x < W; x += 34) ctx.fillRect(x, floorY + 15, 17, 8);

  if (state === "ready") {
    ctx.fillStyle = "rgba(17,24,39,.55)";
    api.rr(ctx, W / 2 - 118, floorY * 0.62, 236, 62, 16); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "700 20px system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Tap untuk terbang", W / 2, floorY * 0.62 + 38);
  }
}

(function(){
/* Hangman — Word Game · Canvas 2D · potrait
   Tiang gantungan digambar bertahap, papan huruf A–Z sendiri.          */

var CSS = [
  ".gh .word{text-align:center;font-weight:800;letter-spacing:.12em;padding:6px 10px;",
  "  white-space:nowrap;overflow:hidden;font-variant-ligatures:none}",
  ".gh .cat{text-align:center;font-size:12px;font-weight:800;color:var(--mut);",
  "  text-transform:uppercase;letter-spacing:.9px}",
  ".gh .keys{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;",
  "  padding:8px 10px calc(var(--sab) + 8px)}",
  ".gh .k{height:46px;border-radius:9px;background:var(--surf);border:1px solid var(--bord2);",
  "  font-size:16px;font-weight:800;color:var(--fg);display:grid;place-items:center;",
  "  box-shadow:var(--shadow-sm)}",
  ".gh .k:active:not([disabled]){transform:scale(.93);background:var(--surf2)}",

  ".gh .row2{display:flex;gap:8px;padding:0 10px 6px}",

].join("\n");

var CATS = {
  "Hewan": ("harimau gajah orangutan komodo badak buaya kucing anjing kelinci kambing " +
           "kerbau merpati elang penyu lumba paus hiu udang kepiting semut kupu belalang " +
           "jangkrik landak musang").split(" "),
  "Buah": ("mangga rambutan durian manggis salak jambu pepaya semangka melon nanas " +
          "pisang jeruk apel anggur alpukat sirsak markisa belimbing kedondong duku " +
          "langsat sawo kesemek nangka cempedak").split(" "),
  "Kota di Indonesia": ("jakarta surabaya bandung medan semarang makassar palembang depok " +
          "tangerang bekasi padang malang denpasar samarinda balikpapan pontianak manado " +
          "pekanbaru jambi bengkulu mataram kupang jayapura ambon banjarmasin").split(" "),
  "Profesi": ("dokter perawat guru dosen polisi tentara pilot masinis nelayan petani " +
          "pedagang arsitek insinyur akuntan pengacara hakim wartawan penulis pelukis " +
          "musisi koki pemadam apoteker peneliti programmer").split(" ")
};

var api, root, cvs, hud, wordEl, catEl, keysEl, hintBtn;
var word, cat, found, wrong, done, score, best, hintUsed;

var MAXW = 6;

function newGame() {
  api.closeOverlays();
  cat = api.pick(Object.keys(CATS));
  word = api.pick(CATS[cat]).toUpperCase();
  found = {}; wrong = []; done = false; hintUsed = false;
  render();
}

function render() {
  catEl.textContent = "Kategori: " + cat;
  var shown = word.split("").map(function (c) { return found[c] ? c : "_"; }).join(" ");
  wordEl.textContent = shown;
  var per = Math.min(30, Math.max(13, Math.floor((root.clientWidth - 24) / (word.length * 1.35))));
  wordEl.style.fontSize = per + "px";

  keysEl.querySelectorAll(".k").forEach(function (k) {
    var ch = k.textContent;
    k.className = "k" + (found[ch] ? " hit" : wrong.indexOf(ch) >= 0 ? " miss" : "");
    k.disabled = done || !!found[ch] || wrong.indexOf(ch) >= 0;
  });
  hintBtn.disabled = done || hintUsed || wrong.length >= MAXW - 1;
  hud.set({ score: score, best: best, extra: { Salah: wrong.length + "/" + MAXW } });
}

function guess(ch) {
  if (done) return;
  if (found[ch] || wrong.indexOf(ch) >= 0) return;
  if (word.indexOf(ch) >= 0) {
    found[ch] = true;
    api.sfx("ok"); api.vibrate(10);
    render();
    if (word.split("").every(function (c) { return found[c]; })) return finish(true);
  } else {
    wrong.push(ch);
    api.sfx("err"); api.vibrate(35);
    render();
    if (wrong.length >= MAXW) return finish(false);
  }
}

function hint() {
  if (done || hintUsed) return;
  var left = word.split("").filter(function (c) { return !found[c]; });
  if (!left.length) return;
  hintUsed = true;
  wrong.push("·");                    // biaya satu kesempatan
  found[api.pick(left)] = true;
  api.sfx("tap");
  render();
  if (word.split("").every(function (c) { return found[c]; })) return finish(true);
  if (wrong.length >= MAXW) finish(false);
}

function finish(won) {
  done = true;
  if (won) {
    var gained = (MAXW - wrong.length) * 20 + word.length * 10;
    score += gained;
    if (score > best) { best = score; api.store.set("best", best); }
    api.sfx("win"); api.vibrate([20, 50, 20]);
  } else {
    api.sfx("lose"); api.vibrate(80);
  }
  render();
  api.overlay({
    title: won ? "Tepat! 🎉" : "Kalah",
    lines: won ? ["Kata: <b>" + word + "</b>", "Skor sesi <b>" + score + "</b> · terbaik <b>" + best + "</b>"]
               : ["Kata yang benar: <b>" + word + "</b>", "Skor sesi <b>" + score + "</b>"],
    buttons: [{ label: "Kata Baru", style: "pri", onClick: newGame },
              { label: "Reset skor sesi", style: "gho", onClick: function () { score = 0; newGame(); } }]
  });
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h;
  ctx.clearRect(0, 0, W, H);
  var s = Math.min(W, H) / 220;
  ctx.save();
  ctx.translate(W / 2 - 60 * s, (H - 200 * s) / 2);
  ctx.scale(s, s);
  ctx.strokeStyle = api.css("--fg", "#e9edf6");
  ctx.lineWidth = 6;
  ctx.lineCap = "round";

  var n = wrong.length;
  function seg(fn) { ctx.beginPath(); fn(); ctx.stroke(); }
  // tiang selalu tampak
  seg(function () { ctx.moveTo(10, 195); ctx.lineTo(110, 195); });
  seg(function () { ctx.moveTo(40, 195); ctx.lineTo(40, 15); });
  seg(function () { ctx.moveTo(40, 15); ctx.lineTo(120, 15); });
  seg(function () { ctx.moveTo(120, 15); ctx.lineTo(120, 38); });

  ctx.strokeStyle = "#ef4444";
  ctx.fillStyle = "#ef4444";
  if (n >= 1) { ctx.beginPath(); ctx.arc(120, 56, 18, 0, Math.PI * 2); ctx.stroke(); }
  if (n >= 2) seg(function () { ctx.moveTo(120, 74); ctx.lineTo(120, 130); });
  if (n >= 3) seg(function () { ctx.moveTo(120, 88); ctx.lineTo(94, 112); });
  if (n >= 4) seg(function () { ctx.moveTo(120, 88); ctx.lineTo(146, 112); });
  if (n >= 5) seg(function () { ctx.moveTo(120, 130); ctx.lineTo(98, 168); });
  if (n >= 6) seg(function () { ctx.moveTo(120, 130); ctx.lineTo(142, 168); });
  if (n >= 6) {
    ctx.lineWidth = 3;
    seg(function () { ctx.moveTo(113, 52); ctx.lineTo(119, 58); ctx.moveTo(119, 52); ctx.lineTo(113, 58); });
    seg(function () { ctx.moveTo(121, 52); ctx.lineTo(127, 58); ctx.moveTo(127, 52); ctx.lineTo(121, 58); });
  }
  ctx.restore();
}

  ".gim .mine .ic{font-size:28px}",
  ".gim .mine .nm{font-size:15px;font-weight:850;flex:1}",
  ".gim .mine .rate{font-size:11px;font-weight:800;color:var(--mut)}",

  ".gim .fly2{position:absolute;right:14px;font-weight:900;font-size:14px;color:var(--ok);",
  "  pointer-events:none;animation:gimf .9s ease-out forwards}",
  "@keyframes gimf{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}",
  ".gim .lockmsg{position:absolute;left:0;right:0;top:0;bottom:0;display:grid;place-items:center;",
  "  background:color-mix(in srgb,var(--bg) 78%,transparent);font-weight:800;font-size:13px;",
  "  text-align:center;padding:12px;z-index:3}",
  ".gim .foot{padding:0 12px calc(var(--sab) + 10px);display:flex;gap:8px}",
  ".gim .foot .btn{flex:1;min-height:46px;font-size:12px}"
].join("\n");

var MINES = [
  { id: 0, nm: "Batu Bara", ic: "🪨", col: "#64748b", value: 1, unlock: 0 },
  { id: 1, nm: "Perak", ic: "🥈", col: "#94a3b8", value: 9, unlock: 500 },
  { id: 2, nm: "Emas", ic: "🥇", col: "#eab308", value: 70, unlock: 12000 }
];

var api, root, balEl, rateEl, listEl, hud;
var money, totalEarned, prestige, mines, cards, saveT;

function mineState(i) { return mines[i]; }
function cycleTime(m) { return Math.max(0.35, 3.2 / Math.pow(1.16, m.spd)); }
function payload(m) { return Math.round((1 + m.cap * 1.6) * MINES[m.i].value * multi()); }
function multi() { return 1 + prestige * 0.25; }
function spdCost(m) { return Math.ceil(45 * Math.pow(1.55, m.spd) * (MINES[m.i].value)); }
function capCost(m) { return Math.ceil(70 * Math.pow(1.6, m.cap) * (MINES[m.i].value)); }
function hireCost(m) { return Math.ceil(320 * (MINES[m.i].value) * Math.pow(1.8, m.workers)); }

function perSec() {
  var t = 0;
  mines.forEach(function (m) {
    if (!m.unlocked || !m.workers) return;
    t += payload(m) / cycleTime(m) * Math.min(3, m.workers);
  });
  return t;
}

function fly(card, txt) {
  var f = api.el("div", "fly2");
  f.textContent = "+" + txt;
  f.style.top = "40px";
  card.appendChild(f);
  api.after(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 920);
}

function collect(m, manual) {
  var v = payload(m);
  money += v; totalEarned += v;
  if (manual) { api.sfx("coin"); api.vibrate(6); }
  fly(cards[m.i], api.fmt(v));
  refresh();
}

function dig(i) {
  var m = mines[i];
  if (!m.unlocked) { api.sfx("err"); return; }
  m.prog += 0.34;
  if (m.prog >= 1) { m.prog = 0; collect(m, true); }
  else { api.sfx("tap"); refresh(); }
}

function buy(kind, i) {
  var m = mines[i];
  var cost = kind === "spd" ? spdCost(m) : kind === "cap" ? capCost(m) : hireCost(m);
  if (money < cost) { api.sfx("err"); api.toast("Uang belum cukup"); return; }
  money -= cost;
  if (kind === "spd") m.spd++;
  else if (kind === "cap") m.cap++;
  else m.workers++;
  api.sfx("ok"); api.vibrate(12);
  save();
  render();
}

function render() {
  listEl.innerHTML = "";
  cards = [];
  MINES.forEach(function (M, i) {
    var m = mines[i];
    var card = api.el("div", "mine" + (m.unlocked ? "" : " locked"));
    var hd = api.el("div", "hd");
    var ic = api.el("div", "ic"); ic.textContent = M.ic;
    var nm = api.el("div", "nm"); nm.textContent = M.nm;
    var rt = api.el("div", "rate");
    hd.appendChild(ic); hd.appendChild(nm); hd.appendChild(rt);
    card.appendChild(hd);

    var tr = api.el("div", "track");
    var fill = api.el("i");
    fill.style.background = M.col;
    tr.appendChild(fill);
    card.appendChild(tr);

    var ups = api.el("div", "ups");
    function upBtn(kind, label) {
      var b = api.el("button", "btn" + (kind === "hire" ? " hire" : ""));
      var t = api.el("b"); t.textContent = label;
      var p = api.el("small");
      b.appendChild(t); b.appendChild(p);
      b.addEventListener("click", function (e) { e.stopPropagation(); buy(kind, i); });
      ups.appendChild(b);
      return { b: b, p: p, t: t };
    }
    var bs = upBtn("spd", "⚡ Kecepatan");
    var bc = upBtn("cap", "📦 Kapasitas");
    var bh = upBtn("hire", "👷 Sewa Pekerja");
    card.appendChild(ups);

    if (!m.unlocked) {
      var lm = api.el("div", "lockmsg");
      lm.textContent = "🔒 Terbuka pada Rp " + api.fmt(M.unlock);
      card.appendChild(lm);
    }

    api.on(card, "touchstart", function (e) {
      if (e.target.closest && e.target.closest(".btn")) return;
      dig(i);
    }, { passive: true });
    var lastT = 0;
    api.on(card, "touchend", function () { lastT = Date.now(); }, { passive: true });
    api.on(card, "mousedown", function (e) {
      if (Date.now() - lastT < 700) return;
      if (e.target.closest && e.target.closest(".btn")) return;
      dig(i);
    });

    listEl.appendChild(card);
    cards.push(card);
    m._ui = { fill: fill, rate: rt, bs: bs, bc: bc, bh: bh, card: card };
  });
  refresh();
}

function refresh() {
  balEl.textContent = "Rp " + api.fmt(money);
  rateEl.textContent = api.fmt(perSec()) + " / detik · prestise ×" + multi().toFixed(2);
  hud.set({ score: Math.floor(money), extra: { Perdetik: Math.round(perSec()), Prestise: prestige } });

  mines.forEach(function (m, i) {
    var M = MINES[i], u = m._ui;
    if (!u) return;
    if (!m.unlocked && money >= M.unlock) {
      m.unlocked = true;
      u.card.classList.remove("locked");
      var lm = u.card.querySelector(".lockmsg");
      if (lm) lm.remove();
      api.sfx("win");
      api.toast("Tambang " + M.nm + " terbuka!");
    }
    u.fill.style.width = (m.prog * 100) + "%";
    u.rate.textContent = m.workers
      ? m.workers + " pekerja · " + api.fmt(payload(m)) + "/siklus"
      : "manual · " + api.fmt(payload(m)) + "/siklus";
    u.bs.p.textContent = "Rp " + api.fmt(spdCost(m)) + " · Lv" + m.spd;
    u.bc.p.textContent = "Rp " + api.fmt(capCost(m)) + " · Lv" + m.cap;
    u.bh.p.textContent = "Rp " + api.fmt(hireCost(m)) + " · " + m.workers + " orang";
    u.bs.b.disabled = !m.unlocked || money < spdCost(m);
    u.bc.b.disabled = !m.unlocked || money < capCost(m);
    u.bh.b.disabled = !m.unlocked || money < hireCost(m) || m.workers >= 3;
  });
}

function tick(dt) {
  mines.forEach(function (m) {
    if (!m.unlocked || !m.workers) return;
    m.prog += dt / cycleTime(m) * Math.min(3, m.workers);
    while (m.prog >= 1) { m.prog -= 1; collect(m, false); }
  });
}

function save() {
  api.store.set("save", {
    money: money, total: totalEarned, prestige: prestige,
    m: mines.map(function (m) { return { i: m.i, spd: m.spd, cap: m.cap, workers: m.workers, unlocked: m.unlocked }; }),
    ts: Date.now()
  });
}

function fresh() {
  return MINES.map(function (M, i) {
    return { i: i, spd: 0, cap: 0, workers: 0, prog: 0, unlocked: i === 0 };
  });
}

function load() {
  var d = api.store.get("save", null);
  if (!d) { mines = fresh(); return; }
  money = d.money || 0; totalEarned = d.total || 0; prestige = d.prestige || 0;
  mines = fresh();
  (d.m || []).forEach(function (s, i) {
    if (!mines[i]) return;
    mines[i].spd = s.spd || 0; mines[i].cap = s.cap || 0;
    mines[i].workers = s.workers || 0; mines[i].unlocked = !!s.unlocked || i === 0;
  });
  var away = Math.min(8 * 3600, Math.max(0, (Date.now() - (d.ts || Date.now())) / 1000));
  var earned = perSec() * away;
  if (earned > 1) {
    money += earned; totalEarned += earned;
    api.after(function () {
      api.overlay({
        title: "Tambang tetap jalan ⛏️",
        lines: ["Selama <b>" + api.mmss(away) + "</b> kamu pergi,",
                "pekerja mengumpulkan <b>Rp " + api.fmt(earned) + "</b>",
                away >= 8 * 3600 - 5 ? "(dibatasi maksimal 8 jam)" : ""],
        buttons: [{ label: "Ambil", style: "pri" }]
      });
    }, 280);
  }
}

function prestigeGain() { return Math.floor(Math.sqrt(totalEarned / 50000)); }

function doPrestige() {
  var g = prestigeGain();
  if (g < 1) {
    api.toast("Butuh total Rp " + api.fmt(50000) + " untuk prestise pertama");
    api.sfx("err");
    return;
  }
  api.overlay({
    title: "Prestise?",
    lines: ["Reset semua tambang dan uang,",
            "dapatkan <b>+" + g + "</b> poin prestise (pengali ×" + (1 + (prestige + g) * 0.25).toFixed(2) + ").",
            "Total yang pernah dikumpulkan tetap dihitung."],
    buttons: [
      { label: "Ya, prestise sekarang", style: "pri", onClick: function () {
        prestige += g;
        money = 0;
        mines = fresh();
        save(); render();
        api.sfx("win"); api.vibrate([20, 50, 20]);
        api.toast("Prestise! Pengali sekarang ×" + multi().toFixed(2));
      } },
      { label: "Batal", style: "gho" }
    ]
  });
}

/* ===== jetpack.js                              ===== */
(function(){
/* Jetpack Joyride — Platformer · Canvas 2D · landscape
   Tahan jari di mana saja untuk naik, lepas untuk turun.               */

var api, root, cvs, hud;
var P, obs, coins, parts, smoke, bgx;
var dist, coinsGot, best, state, speed, spawnT, coinT, thrust, holdIds;

var GRAV = 1500, THRUST = -2100, MAXV = 700, CEIL = 26, FLOORH = 34;

function floorY() { return cvs.h - FLOORH; }

function newGame() {
  api.closeOverlays();
  P = { x: 0, y: 0, vy: 0, w: 26, h: 40 };
  P.x = Math.max(56, cvs.w * 0.22);
  P.y = floorY() - P.h;
  obs = []; coins = []; parts = []; smoke = [];
  dist = 0; coinsGot = 0; speed = 260; spawnT = 1.1; coinT = 0.7;
  thrust = false; holdIds = {};
  bgx = 0;
  state = "play";
  refresh();
}

function refresh() {
  hud.set({ score: Math.floor(dist) + " m", best: best + " m", extra: { Koin: coinsGot } });
}

function over() {
  if (state === "over") return;
  state = "over";
  var d = Math.floor(dist);
  if (d > best) { best = d; api.store.set("best", best); }
  refresh();
  api.sfx("lose"); api.vibrate(80);
  api.overlay({
    title: "Tertabrak!",
    lines: ["Jarak <b>" + d + " m</b> · " + coinsGot + " koin",
            "Terbaik <b>" + best + " m</b>"],
    buttons: [{ label: "Main Lagi", style: "pri", delay: 400, onClick: newGame }]
  });
}

function spawnObstacle() {
  var kind = Math.random();
  var H = cvs.h, W = cvs.w;
  if (kind < 0.4) {
    var y = CEIL + 30 + Math.random() * (floorY() - CEIL - 100);
    obs.push({ t: "hlaser", x: W + 60, y: y, w: 150 + Math.random() * 130, h: 8, warn: 0.85 });
  } else if (kind < 0.72) {
    var h = 90 + Math.random() * 130;
    var yy = Math.random() < 0.5 ? CEIL : floorY() - h;
    obs.push({ t: "vlaser", x: W + 60, y: yy, w: 8, h: h, warn: 0.85 });
  } else {
    var my = CEIL + 20 + Math.random() * (floorY() - CEIL - 70);
    obs.push({ t: "missile", x: W + 120, y: my, w: 40, h: 16, warn: 1.05, vx: 150 });
  }
}

function spawnCoins() {
  var W = cvs.w, base = CEIL + 40 + Math.random() * (floorY() - CEIL - 120);
  var n = 5 + api.rand(5);
  var wave = Math.random() < 0.55;
  for (var i = 0; i < n; i++) {
    coins.push({
      x: W + 40 + i * 34,
      y: wave ? base + Math.sin(i * 0.75) * 46 : base,
      got: false
    });
  }
}

function update(dt) {
  if (state !== "play") return;

  dist += speed * dt / 22;
  if (Math.floor(dist / 500) > Math.floor((dist - speed * dt / 22) / 500)) {
    speed = Math.min(560, speed + 42);
    api.toast(Math.floor(dist) + " m! Makin cepat");
    api.sfx("ok");
  }
  bgx = (bgx - speed * dt) % 240;

  P.vy += (thrust ? THRUST : GRAV) * dt;
  P.vy = api.clamp(P.vy, -MAXV, MAXV);
  P.y += P.vy * dt;
  if (P.y < CEIL) { P.y = CEIL; P.vy = 0; }
  if (P.y + P.h > floorY()) { P.y = floorY() - P.h; P.vy = 0; }

  if (thrust) {
    for (var i = 0; i < 2; i++) {
      parts.push({ x: P.x + 4, y: P.y + P.h - 6, vx: -90 - Math.random() * 130,
                   vy: 60 + Math.random() * 190, life: 0.32, r: 3 + Math.random() * 4 });
    }
  }
  for (i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.life -= dt; p.x += (p.vx - speed) * dt; p.y += p.vy * dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (i = smoke.length - 1; i >= 0; i--) {
    var s = smoke[i];
    s.life -= dt; s.x -= speed * dt * 0.4; s.r += 22 * dt;
    if (s.life <= 0) smoke.splice(i, 1);
  }

  spawnT -= dt;
  if (spawnT <= 0) { spawnObstacle(); spawnT = Math.max(0.62, 1.35 - dist / 3200); }
  coinT -= dt;
  if (coinT <= 0) { spawnCoins(); coinT = 1.5 + Math.random() * 1.6; }

  var pb = { x: P.x + 3, y: P.y + 3, w: P.w - 6, h: P.h - 6 };
  for (i = obs.length - 1; i >= 0; i--) {
    var o = obs[i];
    if (o.warn > 0) { o.warn -= dt; if (o.t !== "missile") continue; }
    o.x -= (o.t === "missile" ? speed + o.vx : speed) * dt;
    if (o.t === "missile" && o.warn <= 0 && Math.random() < 0.4) {
      smoke.push({ x: o.x + o.w, y: o.y + o.h / 2, r: 5, life: 0.5 });
    }
    if (o.x + o.w < -80) { obs.splice(i, 1); continue; }
    if (o.warn > 0) continue;
    if (pb.x < o.x + o.w && pb.x + pb.w > o.x && pb.y < o.y + o.h && pb.y + pb.h > o.y) return over();
  }

  for (i = coins.length - 1; i >= 0; i--) {
    var c = coins[i];
    c.x -= speed * dt;
    if (c.x < -30) { coins.splice(i, 1); continue; }
    if (c.got) continue;
    if (Math.abs(c.x - (P.x + P.w / 2)) < 20 && Math.abs(c.y - (P.y + P.h / 2)) < 24) {
      c.got = true; coinsGot++; api.sfx("coin");
      coins.splice(i, 1);
    }
  }
  refresh();
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h, fy = floorY();

  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#111827"); g.addColorStop(1, "#1f2937");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // parallax lapis 1: pipa laboratorium
  ctx.strokeStyle = "rgba(148,163,184,.22)"; ctx.lineWidth = 10;
  for (var x = bgx * 0.35; x < W + 240; x += 240) {
    ctx.beginPath(); ctx.moveTo(x, CEIL); ctx.lineTo(x, fy); ctx.stroke();
  }
  // lapis 2: panel
  ctx.fillStyle = "rgba(59,130,246,.12)";
  for (x = bgx; x < W + 240; x += 120) ctx.fillRect(x, CEIL + 20, 64, 40);

  ctx.fillStyle = "#334155";
  ctx.fillRect(0, 0, W, CEIL);
  ctx.fillRect(0, fy, W, FLOORH);
  ctx.fillStyle = "#475569";
  for (x = bgx; x < W + 60; x += 60) ctx.fillRect(x, fy, 30, 6);

  for (var i = 0; i < coins.length; i++) {
    var c = coins[i];
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.arc(c.x, c.y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a16207";
    ctx.beginPath(); ctx.arc(c.x, c.y, 4, 0, Math.PI * 2); ctx.fill();
  }

  for (i = 0; i < smoke.length; i++) {
    var s = smoke[i];
    ctx.globalAlpha = Math.max(0, s.life) * 0.7;
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (i = 0; i < obs.length; i++) {
    var o = obs[i];
    if (o.warn > 0) {
      var blink = Math.floor(o.warn * 12) % 2;
      ctx.globalAlpha = blink ? 0.85 : 0.3;
      ctx.fillStyle = "#ef4444";
      if (o.t === "missile") {
        ctx.beginPath();
        ctx.moveTo(W - 26, o.y - 12); ctx.lineTo(W - 6, o.y + o.h / 2); ctx.lineTo(W - 26, o.y + o.h + 12);
        ctx.closePath(); ctx.fill();
        ctx.font = "800 12px system-ui,sans-serif"; ctx.textAlign = "right";
        ctx.fillText("!", W - 30, o.y + o.h / 2 + 4);
      } else {
        var px = Math.min(o.x, W - o.w - 6);
        ctx.fillRect(px, o.y, o.w, o.h);
      }
      ctx.globalAlpha = 1;
      continue;
    }
    if (o.t === "missile") {
      ctx.fillStyle = "#ef4444";
      api.rr(ctx, o.x, o.y, o.w, o.h, 6); ctx.fill();
      ctx.fillStyle = "#fca5a5";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + o.h / 2); ctx.lineTo(o.x - 12, o.y + 2); ctx.lineTo(o.x - 12, o.y + o.h - 2);
      ctx.closePath(); ctx.fill();
    } else {
      var lg = ctx.createLinearGradient(o.x, o.y, o.x + o.w, o.y + o.h);
      lg.addColorStop(0, "#f87171"); lg.addColorStop(.5, "#fecaca"); lg.addColorStop(1, "#f87171");
      ctx.fillStyle = lg;
      ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 12;
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#7f1d1d";
      if (o.t === "hlaser") {
        ctx.fillRect(o.x - 8, o.y - 6, 8, o.h + 12);
        ctx.fillRect(o.x + o.w, o.y - 6, 8, o.h + 12);
      } else {
        ctx.fillRect(o.x - 6, o.y - 8, o.w + 12, 8);
        ctx.fillRect(o.x - 6, o.y + o.h, o.w + 12, 8);
      }
    }
  }

  for (i = 0; i < parts.length; i++) {
    var pp = parts[i];
    ctx.globalAlpha = Math.max(0, pp.life / 0.32);
    ctx.fillStyle = pp.life > 0.2 ? "#fde047" : "#f97316";
    ctx.beginPath(); ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // karakter
  ctx.fillStyle = "#64748b";
  api.rr(ctx, P.x - 8, P.y + 8, 10, 22, 3); ctx.fill();
  ctx.fillStyle = "#22d3ee";
  api.rr(ctx, P.x, P.y, P.w, P.h, 6); ctx.fill();
  ctx.fillStyle = "#f8fafc";
  ctx.beginPath(); ctx.arc(P.x + P.w - 7, P.y + 10, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#0f172a";
  ctx.beginPath(); ctx.arc(P.x + P.w - 5, P.y + 10, 3, 0, Math.PI * 2); ctx.fill();

  if (state === "play" && dist < 40) {
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.font = "700 15px system-ui,sans-serif"; ctx.textAlign = "center";
    ctx.fillText("Tahan jari di mana saja untuk terbang", W / 2, H * 0.28);
  }
}

Arcade.register({
  id: "jetpack",
  title: "Jetpack Joyride",
  cat: "Platformer",
  tech: "canvas",
  diff: 2,
  orient: "landscape",
  icon: "🚀",
  desc: "Tahan jari untuk naik, lepas untuk turun.",

  mount: function (r, a) {
    api = a; root = r;
    best = api.store.get("best", 0);
    state = "over"; thrust = false; holdIds = {};
    obs = []; coins = []; parts = []; smoke = []; bgx = 0;
    dist = 0; coinsGot = 0; speed = 260;

    hud = api.hud({ score: "0 m", best: best + " m", extra: { Koin: 0 } });
    root.appendChild(hud.el);

    cvs = api.canvas(root);
    P = { x: Math.max(56, cvs.w * 0.22), y: floorY() - 40, vy: 0, w: 26, h: 40 };

    // dukung dua jari bergantian: jetpack menyala selama ada jari menempel
    function sync() { thrust = Object.keys(holdIds).length > 0; }
    api.on(cvs.wrap, "touchstart", function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) holdIds[e.changedTouches[i].identifier] = 1;
      sync();
    }, { passive: true });
    function up(e) {
      for (var i = 0; i < e.changedTouches.length; i++) delete holdIds[e.changedTouches[i].identifier];
      sync();
    }
    api.on(cvs.wrap, "touchend", up, { passive: true });
    api.on(cvs.wrap, "touchcancel", up, { passive: true });
    // jari terangkat di luar layar / tab kehilangan fokus
    api.on(window, "touchend", up, { passive: true });
    api.on(window, "blur", function () { holdIds = {}; sync(); });
    api.on(document, "visibilitychange", function () { if (document.hidden) { holdIds = {}; sync(); } });
    api.on(cvs.wrap, "mousedown", function () { holdIds.mouse = 1; sync(); });
    api.on(window, "mouseup", function () { delete holdIds.mouse; sync(); });

    api.overlay({
      title: "Jetpack Joyride",
      lines: ["Tahan jari di mana saja untuk terbang, lepas untuk turun.",
              "Hindari laser dan rudal, kumpulkan koin.",

      buttons: [{ label: "Mulai", style: "pri", onClick: newGame }]
    });

    api.loop(function (dt) { update(dt); draw(); });
  },

  restart: function () { newGame(); },

  unmount: function () {
    obs = null; coins = null; parts = null; smoke = null; P = null; holdIds = null;
    cvs = null; hud = null; root = null; api = null;
  }
});
})();

var api, root, hud, emoEl, clueEl, inputEl, fbEl, metaEl, hintBtns;
var deck, idx, score, best, streak, bestStreak, used, missed, locked;

function norm(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "");
}

function start() {
  api.closeOverlays();
  deck = api.shuffle(PUZ.slice());
  idx = 0; score = 0; streak = 0; bestStreak = 0; missed = [];
  show();
}

function show() {
  if (idx >= deck.length) return finish();
  used = 0; locked = false;
  var p = deck[idx];
  emoEl.textContent = p[0];
  clueEl.textContent = "";
  fbEl.textContent = "";
  fbEl.className = "fb";
  inputEl.value = "";
  inputEl.disabled = false;
  metaEl.innerHTML = "<span>Soal " + (idx + 1) + "/" + deck.length + "</span><span>Streak " + streak + "</span>";
  updateHints();
  hud.set({ score: score, best: best, extra: { Streak: streak } });
}

function updateHints() {
  var labels = ["Jumlah huruf", "Huruf pertama", "Kategori"];
  for (var i = 0; i < 3; i++) {
    hintBtns[i].disabled = used > i || locked;
    hintBtns[i].innerHTML = "";
    var t = document.createTextNode("💡 " + labels[i]);
    var s = api.el("small"); s.textContent = "−25";
    hintBtns[i].appendChild(t); hintBtns[i].appendChild(s);
    if (used > i) hintBtns[i].disabled = true;
  }
  for (i = 0; i < 3; i++) hintBtns[i].disabled = locked || i !== used;
}

function hint(i) {
  if (locked || i !== used) return;
  var p = deck[idx];
  used++;
  api.sfx("tap");
  if (i === 0) clueEl.textContent = p[1].replace(/[^ ]/g, "•").replace(/ /g, "   ") + "  (" + p[1].replace(/\s/g, "").length + " huruf)";
  else if (i === 1) clueEl.textContent = "Huruf pertama: " + p[1][0].toUpperCase() + " · " + clueEl.textContent;
  else clueEl.textContent = "Kategori: " + p[2] + " · " + clueEl.textContent;
  updateHints();
}

function submit() {
  if (locked) return;
  var p = deck[idx];
  var v = norm(inputEl.value);
  if (!v) return;
  if (v === norm(p[1])) {
    locked = true;
    inputEl.disabled = true;
    var pts = Math.max(25, 100 - used * 25);
    score += pts;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    if (score > best) { best = score; api.store.set("best", best); }
    fbEl.textContent = "Benar! +" + pts + " · " + p[1];
    fbEl.className = "fb ok";
    api.sfx("ok"); api.vibrate(18);
    updateHints();
    hud.set({ score: score, best: best, extra: { Streak: streak } });
    api.after(function () { idx++; show(); }, 950);
  } else {
    streak = 0;
    fbEl.textContent = "Belum tepat, coba lagi";
    fbEl.className = "fb no";
    emoEl.classList.remove("shake");
    void emoEl.offsetWidth;
    emoEl.classList.add("shake");
    api.sfx("err"); api.vibrate(40);
    hud.set({ score: score, best: best, extra: { Streak: streak } });
  }
}

function skip() {
  if (locked) return;
  locked = true;
  streak = 0;
  missed.push(deck[idx]);
  fbEl.textContent = "Jawabannya: " + deck[idx][1];
  fbEl.className = "fb no";
  api.sfx("err");
  api.after(function () { idx++; show(); }, 1100);
}

function finish() {
  api.store.set("bestStreak", Math.max(bestStreak, api.store.get("bestStreak", 0)));
  var box = api.el("div");
  if (missed.length) {
    box.appendChild(api.el("div", "fieldlbl", "Yang belum terjawab"));
    var rv = api.el("div", "rv scrollable");
    missed.forEach(function (m) {
      var it = api.el("div", "rvi");
      it.innerHTML = m[0] + " → <b>" + m[1] + "</b> <span style='color:var(--mut)'>(" + m[2] + ")</span>";
      rv.appendChild(it);
    });
    box.appendChild(rv);
  }
  api.sfx("win");
  api.overlay({
    title: "Selesai!",
    lines: ["Skor <b>" + score + "</b> · Terbaik <b>" + best + "</b>",
            "Streak terpanjang <b>" + bestStreak + "</b>",
            (deck.length - missed.length) + " dari " + deck.length + " terjawab"],
    body: missed.length ? box : null,
    buttons: [{ label: "Main Lagi", style: "pri", onClick: start }]
  });
}

var N = 8, TYPES = 6, GAP = 1.2, CELL = (100 - GAP * (N + 1)) / N;
var PTS = { 3: 30, 4: 60 };            // 5+ = 100

var api, root, board, hud, barFill, ro;
var grid, score, best, level, target, timeLeft, busy, playing, sel, seq;

function pos(i) { return GAP + i * (CELL + GAP); }
function at(r, c) { return (r >= 0 && r < N && c >= 0 && c < N) ? grid[r * N + c] : null; }
function set(r, c, g) { grid[r * N + c] = g; if (g) { g.r = r; g.c = c; } }

function tf(r, c) {
  return "translate(" + (pos(c) / CELL * 100) + "%," + (pos(r) / CELL * 100) + "%)";
}
function place(g, anim) {
  var t = tf(g.r, g.c);
  g.el.style.setProperty("--tf", t);
  g.el.style.transform = t;
  if (!anim) {
    g.el.style.transition = "none";
    void g.el.offsetWidth;
    g.el.style.transition = "";
  }
}

function makeGem(r, c, type) {
  var g = { id: ++seq, r: r, c: c, type: type, el: api.el("div", "gem t" + type) };
  g.el.style.width = CELL + "%";
  g.el.style.height = CELL + "%";
  g.el.appendChild(api.el("i"));
  board.appendChild(g.el);
  return g;
}

/* ------------------------- deteksi match ------------------------- */
function runs() {
  var out = [], r, c, k;
  for (r = 0; r < N; r++) {
    c = 0;
    while (c < N) {
      var g = at(r, c);
      if (!g) { c++; continue; }
      k = c + 1;
      while (k < N && at(r, k) && at(r, k).type === g.type) k++;
      if (k - c >= 3) out.push({ cells: rangeH(r, c, k), len: k - c });
      c = k;
    }
  }
  for (c = 0; c < N; c++) {
    r = 0;
    while (r < N) {
      var g2 = at(r, c);
      if (!g2) { r++; continue; }
      k = r + 1;
      while (k < N && at(k, c) && at(k, c).type === g2.type) k++;
      if (k - r >= 3) out.push({ cells: rangeV(c, r, k), len: k - r });
      r = k;
    }
  }
  return out;
}
function rangeH(r, a, b) { var o = []; for (var c = a; c < b; c++) o.push(at(r, c)); return o; }
function rangeV(c, a, b) { var o = []; for (var r = a; r < b; r++) o.push(at(r, c)); return o; }

function anyMatch() { return runs().length > 0; }

function swapCells(a, b) {
  var ar = a.r, ac = a.c;
  set(b.r, b.c, a);
  set(ar, ac, b);
}

function hasMove() {
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      var g = at(r, c); if (!g) continue;
      var nb = [at(r, c + 1), at(r + 1, c)];
      for (var i = 0; i < 2; i++) {
        if (!nb[i]) continue;
        swapCells(g, nb[i]);
        var ok = anyMatch();
        swapCells(g, nb[i]);
        if (ok) return true;
      }
    }
  }
  return false;
}

/* ------------------------- papan ------------------------- */
function fill() {
  for (var r = 0; r < N; r++) {
    for (var c = 0; c < N; c++) {
      var bad, t, guard = 0;
      do {
        t = api.rand(TYPES);
        bad = (at(r, c - 1) && at(r, c - 1).type === t && at(r, c - 2) && at(r, c - 2).type === t) ||
              (at(r - 1, c) && at(r - 1, c).type === t && at(r - 2, c) && at(r - 2, c).type === t);
      } while (bad && guard++ < 30);
      var g = makeGem(r, c, t);
      set(r, c, g);
      place(g);
    }
  }
  if (!hasMove()) { clearBoard(); fill(); }
}

function clearBoard() {
  for (var i = 0; i < N * N; i++) {
    if (grid[i] && grid[i].el.parentNode) grid[i].el.parentNode.removeChild(grid[i].el);
    grid[i] = null;
  }
}

function reshuffle(quiet) {
  var types = [];
  for (var i = 0; i < N * N; i++) if (grid[i]) types.push(grid[i].type);
  var guard = 0;
  do {
    api.shuffle(types);
    var k = 0;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var g = at(r, c); if (g) { g.type = types[k++]; g.el.className = "gem t" + g.type; }
    }
  } while ((anyMatch() || !hasMove()) && guard++ < 60);
  for (i = 0; i < N * N; i++) if (grid[i]) place(grid[i]);
  if (!quiet) { api.sfx("ok"); api.toast("Papan diacak ulang"); }
}

/* ------------------------- resolusi & cascade ------------------------- */
function floatText(r, c, txt) {
  var f = api.el("div", "float");
  f.textContent = txt;
  f.style.left = pos(c) + "%";
  f.style.top = pos(r) + "%";
  f.style.width = CELL + "%";
  f.style.textAlign = "center";
  board.appendChild(f);
  api.after(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 720);
}

function resolve(chain) {
  var rs = runs();
  if (!rs.length) {
    busy = false;
    if (playing && !hasMove()) reshuffle(false);
    return;
  }
  var seen = {}, gained = 0;
  rs.forEach(function (run) {
    var base = PTS[run.len] || 100;
    gained += base * chain;
    run.cells.forEach(function (g) { if (g) seen[g.r * N + g.c] = g; });
    var mid = run.cells[Math.floor(run.cells.length / 2)];
    if (mid) floatText(mid.r, mid.c, "+" + base * chain);
  });

  score += gained;
  if (score > best) { best = score; api.store.set("best", best); }
  api.sfx(chain > 1 ? "ok" : "pop");
  api.vibrate(chain > 1 ? 22 : 10);
  if (chain > 1) api.toast("Cascade x" + chain + "!");
  refreshHud();
  if (score >= target) levelUp();

  Object.keys(seen).forEach(function (k) {
    var g = seen[k];
    g.el.classList.add("gone");
    set(g.r, g.c, null);
    api.after(function () { if (g.el.parentNode) g.el.parentNode.removeChild(g.el); }, 200);
  });

  api.after(function () { collapse(chain); }, 190);
}

function collapse(chain) {
  for (var c = 0; c < N; c++) {
    var write = N - 1;
    for (var r = N - 1; r >= 0; r--) {
      var g = at(r, c);
      if (!g) continue;
      if (write !== r) { set(r, c, null); set(write, c, g); place(g); }
      write--;
    }
    var spawnRow = -1;
    while (write >= 0) {
      var ng = makeGem(spawnRow, c, api.rand(TYPES));
      place(ng);                       // mulai dari atas papan
      set(write, c, ng);
      place(ng, true);                 // lalu jatuh ke tempatnya
      write--; spawnRow--;
    }
  }
  api.after(function () { resolve(chain + 1); }, 200);
}

/* ------------------------- interaksi ------------------------- */
function select(g) {
  if (sel && sel.el) sel.el.classList.remove("sel");
  sel = g || null;
  if (sel) { sel.el.classList.add("sel"); api.sfx("tap"); }
}

function trySwap(a, b) {
  if (!a || !b || busy || !playing) return;
  if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) { select(b); return; }
  busy = true;
  select(null);
  swapCells(a, b);
  place(a, true); place(b, true);
  if (anyMatch()) {
    api.after(function () { resolve(1); }, 170);
  } else {
    api.sfx("err");
    api.after(function () {
      swapCells(a, b);
      place(a, true); place(b, true);
      api.after(function () { busy = false; }, 170);
    }, 170);
  }
}

function cellAt(x, y, w) {
  var u = x / w * 100, v = y / w * 100;
  var c = Math.floor((u - GAP / 2) / (CELL + GAP));
  var r = Math.floor((v - GAP / 2) / (CELL + GAP));
  return at(r, c);
}

/* ------------------------- alur permainan ------------------------- */
function refreshHud() {
  hud.set({

(function(){

   Flip 3D, tiga tingkat grid, rekor waktu per tingkat.                 */

  ".gm .stage{flex:1;min-height:0;display:grid;place-items:center;padding:8px}",

var SYM = ["🍎", "🍌", "🍇", "🍓", "🍒", "🥝", "🍑", "🍍", "🥑", "🌽", "🍄", "🌶️",

};

var api, root, hud, boardEl, stageEl, ro;

function build() {
  var L = LEVELS[level];
  var pairs = (L.c * L.r) / 2;
  var syms = api.shuffle(SYM.slice()).slice(0, pairs);
  var pool = api.shuffle(syms.concat(syms));
  cards = pool.map(function (s, i) { return { s: s, i: i, up: false, done: false }; });

  boardEl.innerHTML = "";

function fit() {
  if (!boardEl || !stageEl) return;
  var L = LEVELS[level];
  var r = stageEl.getBoundingClientRect();
  var gap = 8;
  var w = Math.floor((r.width - gap * (L.c - 1)) / L.c);
  var h = Math.floor((r.height - gap * (L.r - 1)) / L.r);
  var cw = Math.min(w, Math.floor(h * 0.78));
  cw = Math.max(52, cw);
  var ch = Math.floor(cw / 0.78);
  if (ch * L.r + gap * (L.r - 1) > r.height) {
    ch = Math.floor((r.height - gap * (L.r - 1)) / L.r);
    cw = Math.floor(ch * 0.78);
  }
  boardEl.style.width = (cw * L.c + gap * (L.c - 1)) + "px";
  boardEl.style.height = (ch * L.r + gap * (L.r - 1)) + "px";
  boardEl.style.fontSize = Math.max(14, Math.floor(cw * 0.42)) + "px";
}

function flip(idx) {
  if (busy || !playing) return;
  var c = cards[idx];
  if (!c || c.done || c.up) return;
  c.up = true;
  c.el.classList.add("up");
  api.sfx("tap"); api.vibrate(6);

  if (!first) { first = c; return; }
  second = c;
  busy = true;
  moves++;
  refresh();

  if (first.s === second.s) {
    var a = first, b = second;
    api.after(function () {
      a.done = b.done = true;
      a.el.classList.add("done"); b.el.classList.add("done");
      api.sfx("ok"); api.vibrate(16);
      matched++;
      first = second = null; busy = false;
      refresh();
      if (matched === cards.length / 2) win();
    }, 320);
  } else {
    var x = first, y = second;
    api.after(function () {
      x.el.classList.add("miss"); y.el.classList.add("miss");
      api.sfx("err"); api.vibrate(30);
    }, 260);
    api.after(function () {
      x.up = y.up = false;
      x.el.classList.remove("up", "miss");
      y.el.classList.remove("up", "miss");
      first = second = null; busy = false;
    }, 800);
  }
}

function stars() {
  var pairs = cards.length / 2;
  if (moves <= pairs * 1.6) return 3;
  if (moves <= pairs * 2.4) return 2;
  return 1;
}

function refresh() {

}

function win() {

  var key = "best-" + level;
  var prev = api.store.get(key, null);
  var rec = !prev || secs < prev.t || (secs === prev.t && moves < prev.m);
  if (rec) api.store.set(key, { t: secs, m: moves, s: st });
  api.sfx("win"); api.vibrate([20, 50, 20]);
  var starBox = api.el("div", "stars");
  starBox.textContent = "★".repeat(st) + "☆".repeat(3 - st);

  api.overlay({

    body: starBox,
    buttons: [{ label: "Main Lagi", style: "pri", onClick: function () { newGame(level); } },

}

/* ===== platformer.js                           ===== */
(function(){
/* Side-scroller — Platformer · Canvas 2D · landscape
   Tombol virtual kiri/kanan + lompat, coyote time & jump buffer.       */

var api, root, cvs, hud, pad;
var P, cam, plats, coins, foes, flag, keys, btns;
var score, coinsGot, lives, time, state, invT, level, best;

var GRAV = 2000, RUN = 250, JUMP_V = -560, JUMP_HOLD = 0.22, COYOTE = 0.1, BUF = 0.12;

function rect(x, y, w, h, t) { return { x: x, y: y, w: w, h: h, t: t || "solid" }; }

function buildLevel(n) {
  plats = []; coins = []; foes = [];
  var groundY = 300;
  var x = 0, seed = n;
  plats.push(rect(0, groundY, 620, 120));
  x = 620;
  for (var i = 0; i < 16 + n * 2; i++) {
    var gap = 70 + ((seed * 37 + i * 53) % 60);
    var w = 150 + ((seed * 17 + i * 91) % 190);
    var dy = ((seed + i * 7) % 4) * -46;
    var y = groundY + dy;
    plats.push(rect(x + gap, y, w, 120 - dy * 0.2));
    // platform melayang
    if (i % 3 === 1) {
      plats.push(rect(x + gap + 30, y - 110 - ((i * 13) % 50), 100, 16, "float"));
      coins.push({ x: x + gap + 60, y: y - 140 - ((i * 13) % 50), got: false });
    }
    for (var c = 0; c < 3; c++) coins.push({ x: x + gap + 40 + c * 42, y: y - 40, got: false });
    if (i % 2 === 0) {
      foes.push({ x: x + gap + w * 0.5, y: y - 26, w: 26, h: 26, vx: 52 * ((i % 4) ? 1 : -1),
                  minX: x + gap + 12, maxX: x + gap + w - 38, alive: true });
    }
    x += gap + w;
  }
  plats.push(rect(x + 80, groundY - 60, 240, 180));
  flag = { x: x + 170, y: groundY - 60 };
  P = { x: 60, y: groundY - 60, w: 24, h: 34, vx: 0, vy: 0, onG: false, face: 1, coyote: 0, buf: 0, holdT: 0 };
  cam = { x: 0 };
  time = 0; invT = 0;
}

function newGame() {
  api.closeOverlays();
  score = 0; coinsGot = 0; lives = 3; level = 1;
  buildLevel(1);
  state = "play";
  refresh();
}

function refresh() {
  hud.set({ score: score, best: best, extra: { Koin: coinsGot, Nyawa: "❤".repeat(Math.max(0, lives)) || "—" } });
}

function hurt() {
  if (invT > 0) return;
  lives--;
  invT = 1.4;
  P.vy = -300; P.vx = -P.face * 160;
  api.sfx("err"); api.vibrate(60);
  refresh();
  if (lives <= 0) over(false);
}

function over(won) {
  state = "over";
  if (score > best) { best = score; api.store.set("best", best); }
  refresh();
  api.sfx(won ? "win" : "lose");
  api.overlay({
    title: won ? "Level selesai! 🚩" : "Game Over",
    lines: ["Skor <b>" + api.fmt(score) + "</b> · " + coinsGot + " koin",
            "Waktu <b>" + api.mmss(time) + "</b>",
            "Terbaik <b>" + api.fmt(best) + "</b>"],
    buttons: won
      ? [{ label: "Level berikutnya", style: "pri", onClick: function () { level++; buildLevel(level); state = "play"; } },
         { label: "Mulai dari awal", style: "gho", onClick: newGame }]
      : [{ label: "Main Lagi", style: "pri", delay: 350, onClick: newGame }]
  });
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(dt) {
  if (state !== "play") return;
  keys.left = pad.is("left");
  keys.right = pad.is("right");
  keys.jump = pad.is("jump");
  time += dt;
  if (invT > 0) invT -= dt;

  var ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (ax) { P.vx += ax * 2300 * dt; P.face = ax; }
  else P.vx *= Math.pow(0.0016, dt);
  P.vx = api.clamp(P.vx, -RUN, RUN);

  if (keys.jump && !keys.jumpPrev) P.buf = BUF;
  keys.jumpPrev = keys.jump;
  if (P.buf > 0) P.buf -= dt;
  if (P.coyote > 0) P.coyote -= dt;

  if (P.buf > 0 && P.coyote > 0) {
    P.vy = JUMP_V; P.onG = false; P.coyote = 0; P.buf = 0; P.holdT = JUMP_HOLD;
    api.sfx("tap");
  }
  if (P.holdT > 0) {
    if (keys.jump) { P.vy -= 900 * dt; P.holdT -= dt; }
    else P.holdT = 0;
  }

  P.vy += GRAV * dt;
  if (P.vy > 1100) P.vy = 1100;

  P.x += P.vx * dt;
  for (var i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (!aabb(P, p)) continue;
    if (P.vx > 0) P.x = p.x - P.w; else if (P.vx < 0) P.x = p.x + p.w;
    P.vx = 0;
  }

  P.onG = false;
  P.y += P.vy * dt;
  for (i = 0; i < plats.length; i++) {
    var p2 = plats[i];
    if (!aabb(P, p2)) continue;
    if (P.vy > 0) { P.y = p2.y - P.h; P.vy = 0; P.onG = true; }
    else if (P.vy < 0) { P.y = p2.y + p2.h; P.vy = 0; }
  }
  if (P.onG) P.coyote = COYOTE;
  if (P.x < 0) { P.x = 0; P.vx = 0; }

  for (i = 0; i < foes.length; i++) {
    var f = foes[i];
    if (!f.alive) continue;
    f.x += f.vx * dt;
    if (f.x < f.minX) { f.x = f.minX; f.vx = Math.abs(f.vx); }
    if (f.x > f.maxX) { f.x = f.maxX; f.vx = -Math.abs(f.vx); }
    if (!aabb(P, f)) continue;
    if (P.vy > 60 && P.y + P.h - f.y < 20) {
      f.alive = false; P.vy = -340; score += 200;
      api.sfx("pop"); api.vibrate(15); refresh();
    } else hurt();
  }

  for (i = 0; i < coins.length; i++) {
    var c = coins[i];
    if (c.got) continue;
    if (Math.abs(c.x - (P.x + P.w / 2)) < 22 && Math.abs(c.y - (P.y + P.h / 2)) < 26) {
      c.got = true; coinsGot++; score += 100;
      api.sfx("coin"); refresh();
    }
  }

  if (P.y > 620) { P.x = Math.max(20, P.x - 120); P.y = 0; P.vy = 0; hurt(); }
  if (state === "play" && P.x + P.w > flag.x && P.y < flag.y + 80) {
    score += Math.max(0, 900 - Math.floor(time) * 10);
    over(true);
  }

  var want = P.x - cvs.w * 0.36 + P.face * 60;
  cam.x += (want - cam.x) * Math.min(1, dt * 6);
  if (cam.x < 0) cam.x = 0;
}

function draw() {
  var ctx = cvs.ctx, W = cvs.w, H = cvs.h;
  var sc = H / 420;
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#1e3a8a"); sky.addColorStop(.55, "#3b82f6"); sky.addColorStop(1, "#93c5fd");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(sc, sc);
  var w = W / sc, h = H / sc;

  // parallax
  ctx.fillStyle = "rgba(255,255,255,.16)";
  for (var i = 0; i < 9; i++) {
    var hx = ((i * 340 - cam.x * .25) % (w + 400)) - 200;
    ctx.beginPath();
    ctx.moveTo(hx, 320); ctx.lineTo(hx + 140, 190); ctx.lineTo(hx + 280, 320);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,.28)";
  for (i = 0; i < 7; i++) {
    var cx = ((i * 260 - cam.x * .5) % (w + 300)) - 150;
    ctx.beginPath();
    ctx.arc(cx, 70 + (i % 3) * 26, 26, 0, Math.PI * 2);
    ctx.arc(cx + 26, 78 + (i % 3) * 26, 20, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.translate(-cam.x, 0);

  for (i = 0; i < plats.length; i++) {
    var p = plats[i];
    if (p.x - cam.x > w + 60 || p.x + p.w - cam.x < -60) continue;
    ctx.fillStyle = p.t === "float" ? "#f59e0b" : "#65a30d";
    api.rr(ctx, p.x, p.y, p.w, p.h, p.t === "float" ? 6 : 3); ctx.fill();
    ctx.fillStyle = p.t === "float" ? "#fbbf24" : "#84cc16";
    ctx.fillRect(p.x, p.y, p.w, 7);
    if (p.t !== "float") {
      ctx.fillStyle = "rgba(0,0,0,.14)";
      for (var b = 0; b < p.w; b += 34) ctx.fillRect(p.x + b, p.y + 12, 30, 2);
    }
  }

  // bendera
  ctx.fillStyle = "#e5e7eb";
  ctx.fillRect(flag.x, flag.y - 90, 4, 92);
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.moveTo(flag.x + 4, flag.y - 90); ctx.lineTo(flag.x + 48, flag.y - 74);
  ctx.lineTo(flag.x + 4, flag.y - 58); ctx.closePath(); ctx.fill();

  for (i = 0; i < coins.length; i++) {
    var c = coins[i];
    if (c.got || c.x - cam.x > w + 30 || c.x - cam.x < -30) continue;
    var t = Math.abs(Math.sin(Date.now() / 260 + c.x));
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 8 * (0.35 + t * 0.65), 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#a16207";
    ctx.beginPath(); ctx.ellipse(c.x, c.y, 3.5 * (0.35 + t * 0.65), 5, 0, 0, Math.PI * 2); ctx.fill();
  }

  for (i = 0; i < foes.length; i++) {
    var f = foes[i];
    if (!f.alive || f.x - cam.x > w + 40 || f.x - cam.x < -40) continue;
    ctx.fillStyle = "#7c3aed";
    api.rr(ctx, f.x, f.y, f.w, f.h, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(f.x + 8, f.y + 10, 4, 0, Math.PI * 2);
    ctx.arc(f.x + 18, f.y + 10, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(f.x + 8 + (f.vx > 0 ? 1.6 : -1.6), f.y + 10, 2, 0, Math.PI * 2);
    ctx.arc(f.x + 18 + (f.vx > 0 ? 1.6 : -1.6), f.y + 10, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  if (!(invT > 0 && Math.floor(invT * 12) % 2)) {
    ctx.fillStyle = "#ef4444";
    api.rr(ctx, P.x, P.y, P.w, P.h, 5); ctx.fill();
    ctx.fillStyle = "#fde68a";
    api.rr(ctx, P.x + 3, P.y + 5, P.w - 6, 11, 3); ctx.fill();
    ctx.fillStyle = "#111827";
    ctx.beginPath();
    ctx.arc(P.x + (P.face > 0 ? 16 : 8), P.y + 10, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#1d4ed8";
    ctx.fillRect(P.x + 2, P.y + P.h - 10, 8, 10);
    ctx.fillRect(P.x + P.w - 10, P.y + P.h - 10, 8, 10);
  }
  ctx.restore();

  drawButtons(ctx, W, H);
}

/* Geometri tombol dihitung saat layout, bukan saat menggambar, supaya
   sentuhan pertama sebelum frame pertama tetap terbaca. */
function layoutButtons(W, H) {
  var r = Math.min(46, H * 0.15);
  btns.left = { id: "left", x: r + 18, y: H - r - 18, r: r };
  btns.right = { id: "right", x: r * 3 + 34, y: H - r - 18, r: r };
  btns.jump = { id: "jump", x: W - r * 1.25 - 18, y: H - r * 1.25 - 18, r: r * 1.25 };
  return [btns.left, btns.right, btns.jump];
}

function drawButtons(ctx, W, H) {
  var list = [["left", "◀", keys.left], ["right", "▶", keys.right], ["jump", "▲", keys.jump]];
  for (var i = 0; i < list.length; i++) {
    var b = btns[list[i][0]];
    ctx.globalAlpha = list[i][2] ? 0.55 : 0.28;
    ctx.fillStyle = "#0f172a";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = list[i][2] ? 0.95 : 0.7;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "700 " + Math.round(b.r * 0.75) + "px system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(list[i][1], b.x, b.y + 1);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = "alphabetic";
}
