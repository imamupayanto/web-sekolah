<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Mission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EAF0EF; --surface:#FFFFFF; --surface-2:#DEE8E6; --ink:#17222B; --ink-soft:#4B5B62;
  --ink-faint:#7A888E; --accent:#0E7C7B; --accent-strong:#0A5F5E; --accent-tint:#D8ECEA;
  --gold:#B37B15; --gold-tint:#FAE8C6; --navy:#1B2A41; --danger:#A93E29; --danger-tint:#F6DED8;
  --success:#33754A; --success-tint:#D9EBE0; --line:#CBD9D6;
  --shadow:0 1px 2px rgba(23,34,43,.06),0 6px 16px rgba(23,34,43,.08);
  --term-bg:#0B1119; --term-ink:#DCE7E5; --term-accent:#3FC0B8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1620; --surface:#16202C; --surface-2:#1E2B39; --ink:#E7EDEE; --ink-soft:#A3B3B9;
  --ink-faint:#77888F; --accent:#3FC0B8; --accent-strong:#68D6CE; --accent-tint:#17332F;
  --gold:#E0A83F; --gold-tint:#3A2E15; --navy:#0B1119; --danger:#E4816A; --danger-tint:#3A211C;
  --success:#6FCB93; --success-tint:#1B3326; --line:#2B3846;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0E1620; --surface:#16202C; --surface-2:#1E2B39; --ink:#E7EDEE; --ink-soft:#A3B3B9;
  --ink-faint:#77888F; --accent:#3FC0B8; --accent-strong:#68D6CE; --accent-tint:#17332F;
  --gold:#E0A83F; --gold-tint:#3A2E15; --navy:#0B1119; --danger:#E4816A; --danger-tint:#3A211C;
  --success:#6FCB93; --success-tint:#1B3326; --line:#2B3846;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Karla',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:'Baloo 2',system-ui,sans-serif;margin:0;text-wrap:balance;line-height:1.2}
.mono{font-family:'IBM Plex Mono',ui-monospace,"Courier New",monospace}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

#shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}
header.appbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:14px 18px 16px;border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
header .row{display:flex;align-items:center;gap:13px}
header h1{font-size:1.3rem;color:#fff}
header .tagline{font-size:.74rem;color:#A9B6C2;margin-top:2px}
header .stars{font-size:.72rem;color:var(--gold);font-family:'Baloo 2';font-weight:700;margin-top:3px}
.ring{--pct:0;width:54px;height:54px;border-radius:50%;flex:none;background:conic-gradient(var(--gold) calc(var(--pct)*1%),rgba(255,255,255,.15) 0);display:flex;align-items:center;justify-content:center;transition:background .4s ease}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-size:.78rem;color:#fff}

main{flex:1;padding:18px 16px 100px}
.view{display:none}
.view.on{display:block;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lead{color:var(--ink-soft);font-size:.9rem;margin:0 0 16px}
h2.sec{font-size:1.06rem;margin:22px 0 10px}

.path{position:relative;padding-left:26px}
.path::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.node{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left;color:inherit;transition:transform .14s ease}
.node:active{transform:scale(.985)}
.node[data-locked="1"]{opacity:.5;cursor:not-allowed}
.node::before{content:"";position:absolute;left:-26px;top:50%;transform:translate(-2px,-50%);width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.node[data-state="done"]::before{background:var(--success);border-color:var(--success)}
.node[data-state="open"]::before{background:var(--accent);border-color:var(--accent)}
.node .ic{width:44px;height:44px;border-radius:13px;flex:none;background:var(--tt);color:var(--tc);display:flex;align-items:center;justify-content:center}
.node .ic svg{width:23px;height:23px}
.node .bd{flex:1;min-width:0}
.node .bd h3{font-family:'Karla';font-size:.95rem;font-weight:700}
.node .bd p{margin:3px 0 0;font-size:.74rem;color:var(--ink-faint)}
.node .bd .tag{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:.62rem;padding:1px 7px;border-radius:99px;background:var(--tt);color:var(--tc);margin-right:4px;vertical-align:1px}
.node .rt{flex:none;text-align:right}
.pill{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:.66rem;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.lock{background:var(--surface-2);color:var(--ink-faint)}
.pill.open{background:var(--accent-tint);color:var(--accent-strong)}
.pill.done{background:var(--success-tint);color:var(--success)}
.starline{font-size:.72rem;color:var(--gold);margin-top:4px;letter-spacing:1px}

.lvl{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
.lvl[data-locked="1"]{opacity:.5;cursor:not-allowed}
.lvl .num{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:.9rem;background:var(--surface-2);color:var(--ink-faint)}
.lvl[data-done="1"] .num{background:var(--success-tint);color:var(--success)}
.lvl[data-open="1"] .num{background:var(--accent-tint);color:var(--accent-strong)}
.lvl .bd{flex:1;min-width:0}
.lvl .bd h4{font-family:'Karla';font-size:.92rem;font-weight:700}
.lvl .bd p{margin:2px 0 0;font-size:.73rem;color:var(--ink-faint)}
.lvl .st{flex:none;font-size:.8rem;color:var(--gold);letter-spacing:1px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card h3{font-size:1rem;margin-bottom:6px}
.card p{margin:0 0 8px;font-size:.88rem;color:var(--ink-soft)}
.card p:last-child{margin-bottom:0}
.card ul{margin:6px 0 0;padding-left:18px;font-size:.87rem;color:var(--ink-soft)}
.card li{margin-bottom:5px}
.eyebrow{font-family:'Baloo 2';font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;border:none;font-family:'Baloo 2';font-weight:600;font-size:.95rem;padding:12px 18px;border-radius:99px;cursor:pointer;box-shadow:0 4px 10px rgba(14,124,123,.25)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);box-shadow:0 4px 10px rgba(179,123,21,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:9px;margin-top:12px}
.btns .btn{flex:1}

input[type=text],input[type=password],textarea{width:100%;font-family:'Karla';font-size:.94rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
textarea{font-family:'IBM Plex Mono';font-size:.76rem;resize:vertical}
label{display:block;font-size:.77rem;font-weight:700;color:var(--ink-soft);margin:0 0 6px}
.field{margin-bottom:12px}

.choice{display:block;width:100%;text-align:left;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 14px;margin-bottom:8px;font-size:.9rem;cursor:pointer}
.choice.ok{background:var(--success-tint);border-color:var(--success);color:var(--success);font-weight:700}
.choice.no{background:var(--danger-tint);border-color:var(--danger);color:var(--danger)}
.choice.sel{border-color:var(--accent);background:var(--accent-tint)}
.choice:disabled{cursor:default}

.note{border-radius:11px;padding:11px 13px;font-size:.85rem;margin-top:11px}
.note.ok{background:var(--success-tint);color:var(--success)}
.note.no{background:var(--danger-tint);color:var(--danger)}
.note.hint{background:var(--gold-tint);color:var(--gold)}
.note.info{background:var(--accent-tint);color:var(--accent-strong)}
.note b{display:block;font-family:'Baloo 2';margin-bottom:3px}
.explain{font-size:.83rem;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.counter{font-family:'Baloo 2';font-size:.78rem;color:var(--ink-faint);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer{font-family:'IBM Plex Mono';font-weight:600;font-size:.82rem;color:var(--accent)}
.timer.low{color:var(--danger)}
.tbar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.tbar i.low{background:var(--danger)}

.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:14px}
.msg .from{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
.msg .txt{font-size:.93rem;margin-top:6px}
.msg .txt.mono{font-size:.82rem;word-break:break-all}

.evi{font-size:.93rem;line-height:1.9}
.evi span.tok{border-radius:6px;padding:2px 3px;cursor:pointer;border-bottom:2px dotted var(--ink-faint)}
.evi span.tok.picked{background:var(--accent-tint);border-color:var(--accent)}
.evi span.tok.good{background:var(--success-tint);color:var(--success);font-weight:700;border-color:var(--success)}
.evi span.tok.bad{background:var(--danger-tint);color:var(--danger);border-color:var(--danger)}

.term{background:var(--term-bg);color:var(--term-ink);border-radius:13px;padding:12px;font-family:'IBM Plex Mono';font-size:.74rem;line-height:1.6;height:250px;overflow-y:auto}
.term .l{white-space:pre-wrap;word-break:break-word;margin:0}
.term .c{color:var(--term-accent)}
.term .w{color:#E8B75C}
.term .r{color:#F08A6C}
.termrow{display:flex;gap:8px;margin-top:9px}
.termrow input{flex:1;font-family:'IBM Plex Mono';font-size:.8rem}
.termrow button{flex:none;width:auto;padding:11px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:'IBM Plex Mono';font-size:.71rem;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:99px;padding:5px 11px;cursor:pointer}

.meter{height:11px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:11px 0 5px}
.meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .3s ease,background .3s ease}
.mlabel{font-family:'Baloo 2';font-weight:700;font-size:.92rem}
.mtime{font-size:.79rem;color:var(--ink-soft)}
.crit{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.crit span{font-size:.71rem;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-faint)}
.crit span.hit{background:var(--success-tint);color:var(--success);font-weight:700}

.exif{font-family:'IBM Plex Mono';font-size:.75rem;background:var(--surface-2);border-radius:11px;padding:11px;margin-top:10px}
.exif div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.exif div:last-child{border:none}
.exif b{color:var(--ink-faint);font-weight:500;flex:none}
.exif span{text-align:right;word-break:break-word}

.ord{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.ord .n{width:26px;height:26px;flex:none;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:700;font-size:.78rem;color:var(--ink-faint)}
.ord .t{flex:1;font-size:.85rem}
.ord .mv{display:flex;flex-direction:column;gap:3px;flex:none}
.ord .mv button{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);border-radius:6px;width:26px;height:19px;line-height:1;cursor:pointer;padding:0;font-size:.65rem}

.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.bg{aspect-ratio:1;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:5px;background:var(--surface-2);color:var(--ink-faint);border:1px solid var(--line)}
.bg.got{background:var(--gold-tint);color:var(--gold);border-color:var(--gold)}
.bg svg{width:21px;height:21px}
.bg span{font-family:'Baloo 2';font-weight:700;font-size:.58rem;line-height:1.15}

.rank{display:flex;align-items:center;gap:12px}
.rank .rb{width:52px;height:52px;border-radius:15px;flex:none;background:var(--gold-tint);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:1.2rem}
.cert{border:2px solid var(--gold);background:var(--gold-tint);border-radius:16px;padding:22px 16px;text-align:center}
.cert .k{font-family:'Baloo 2';font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cert h3{font-size:1.5rem;color:var(--gold);margin:6px 0}
.cert .nm{font-family:'Baloo 2';font-size:1.25rem;color:var(--ink);margin:10px 0 4px}
.cert p{font-size:.8rem;color:var(--ink-soft);margin:0}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 28px);max-width:452px;background:var(--surface);border:1px solid var(--line);border-radius:99px;box-shadow:var(--shadow);display:flex;z-index:30}
nav.tabs button{flex:1;background:none;border:none;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);cursor:pointer;border-radius:99px}
nav.tabs svg{width:20px;height:20px}
nav.tabs span{font-family:'Baloo 2';font-weight:700;font-size:.65rem}
nav.tabs button.on{color:var(--accent)}

.ovl{position:fixed;inset:0;background:rgba(11,17,25,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .22s ease both}
.ovl.mid{align-items:center;padding:18px}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px 26px;max-height:92vh;overflow-y:auto}
.ovl.mid .sheet{border-radius:20px;max-height:84vh}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.shead h2{font-size:1.14rem}
.tchip{display:inline-block;font-family:'Baloo 2';font-weight:700;font-size:.65rem;padding:3px 10px;border-radius:99px;background:var(--tt);color:var(--tc);margin-bottom:5px}
.x{background:none;border:none;color:var(--ink-faint);font-size:1.5rem;line-height:1;cursor:pointer;padding:0 4px;flex:none}
.bigstars{text-align:center;font-size:2.1rem;letter-spacing:6px;color:var(--gold);margin:6px 0 2px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:'Baloo 2';font-weight:600;font-size:.85rem;padding:11px 20px;border-radius:99px;z-index:60;box-shadow:var(--shadow);animation:pop .3s ease both;max-width:88%;text-align:center}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
</style>
</head>
<body>
<div id="shell">
  <header class="appbar">
    <div class="row">
      <div class="ring" id="ring"><b id="ringTxt">0/8</b></div>
      <div>
        <h1>Cyber Mission</h1>
        <div class="tagline" id="tagline">Misi keamanan siber untuk calon jagoan digital</div>
        <div class="stars" id="hstars"></div>
      </div>
    </div>
  </header>
  <main>
    <section class="view on" id="v-map"></section>
    <section class="view" id="v-belajar"></section>
    <section class="view" id="v-profil"></section>
  </main>
  <nav class="tabs">
    <button data-tab="map" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4m0 0L9 7"/></svg><span>Peta Misi</span></button>
    <button data-tab="belajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 006.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15z"/></svg><span>Belajar</span></button>
    <button data-tab="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.5-6 7.5-6s7.5 2 7.5 6"/></svg><span>Profil</span></button>
  </nav>
  <div id="modal"></div>
</div>
<script>
/* ==================== ICONS ==================== */
const I = {
  key:'<path d="M14 7a4 4 0 11-4.9 3.9L4 16v3h3l1-1h2v-2h2l1.1-1.1A4 4 0 0114 7z"/><circle cx="16.5" cy="7.5" r=".8" fill="currentColor"/>',
  fish:'<path d="M3 12s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/>',
  term:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  lock:'<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>',
  cipher:'<path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18" cy="15" r="3"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-6 6"/>',
  chat:'<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.4A8 8 0 1121 12z"/>',
  flag:'<path d="M5 21V4m0 0l9 3-2 3 2 3-9 3"/>'
};
const svg = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';

/* ==================== TIERS ==================== */
const TIER = {
  mudah:{n:'Mudah', c:'#33754A', t:'#D9EBE0', cd:'#6FCB93', td:'#1B3326'},
  sedang:{n:'Sedang', c:'#0E7C7B', t:'#D8ECEA', cd:'#3FC0B8', td:'#17332F'},
  sulit:{n:'Sulit', c:'#B37B15', t:'#FAE8C6', cd:'#E0A83F', td:'#3A2E15'},
  ekstra:{n:'Di Atas Normal', c:'#A93E29', t:'#F6DED8', cd:'#E4816A', td:'#3A211C'}
};
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  if(t === 'dark') return true; if(t === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
};
const tierVars = k => { const t = TIER[k]; return '--tc:'+(isDark()?t.cd:t.c)+';--tt:'+(isDark()?t.td:t.t)+';'; };

/* ==================== UTIL ==================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toUpperCase().replace(/[\s]+/g,' ').trim();
const stars = n => '★'.repeat(n) + '☆'.repeat(3-n);
function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function caesar(t, s){
  return String(t).replace(/[A-Za-z]/g, c => {
    const b = c === c.toUpperCase() ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - b + s + 26) % 26 + b);
  });
}
const b64 = t => { try{ return btoa(t); }catch(e){ return ''; } };
function scoreStars(score, total){
  const p = score/total;
  if(p >= 0.95) return 3;
  if(p >= 0.75) return 2;
  if(p >= 0.55) return 1;
  return 0;
}

/* ==================== STATE ==================== */
const KEY = 'cybermission.v2';
let S = {nama:'', kode:'', lv:{}};
function load(){ try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const lk = (m,n) => m+'.'+n;
const lvStars = (m,n) => (S.lv[lk(m,n)] && S.lv[lk(m,n)].s) || 0;
const lvDone  = (m,n) => lvStars(m,n) > 0;
const lvOpen  = (m,n) => n === 1 || lvDone(m, n-1);
const misById = id => MISSIONS.find(x => x.id === id);
const misDoneCount = m => misById(m).levels.filter(l => lvDone(m, l.n)).length;
const misDone = m => misDoneCount(m) === misById(m).levels.length;
const misOpen = i => i === 0 || misDone(MISSIONS[i-1].id);
const misStars = m => misById(m).levels.reduce((a,l) => a + lvStars(m, l.n), 0);
const totalStars = () => MISSIONS.reduce((a,x) => a + misStars(x.id), 0);
const maxStars = () => MISSIONS.reduce((a,x) => a + x.levels.length*3, 0);
const misCleared = () => MISSIONS.filter(x => misDone(x.id)).length;
function rankOf(){
  const p = totalStars()/maxStars();
  if(p >= 0.9) return {t:'Elite', d:'Penjaga siber tingkat tertinggi'};
  if(p >= 0.7) return {t:'Ahli', d:'Sudah menguasai sebagian besar keterampilan'};
  if(p >= 0.45) return {t:'Penjaga', d:'Terus berlatih, kamu berkembang pesat'};
  if(p >= 0.2) return {t:'Kadet', d:'Dasar-dasarnya mulai terbentuk'};
  return {t:'Rekrut', d:'Perjalananmu baru dimulai'};
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

/* ==================== RENDER: MAP ==================== */
function renderMap(){
  let h = '<p class="lead">Selesaikan misi berurutan dari atas ke bawah. Tiap misi punya beberapa level yang makin sulit. Misi berikutnya terbuka kalau semua level misi ini selesai.</p><div class="path">';
  MISSIONS.forEach((m, i) => {
    const dn = misDone(m.id), op = misOpen(i), pr = misDoneCount(m.id), tot = m.levels.length;
    const state = dn ? 'done' : (op ? 'open' : 'lock');
    const pill = dn ? '<span class="pill done">Tuntas</span>'
               : op ? '<span class="pill open">'+pr+'/'+tot+'</span>'
                    : '<span class="pill lock">Terkunci</span>';
    const st = misStars(m.id);
    h += '<button class="node" style="'+tierVars(m.tier)+'" data-state="'+state+'" data-locked="'+(op?0:1)+'" '+
         'onclick="'+(op ? "openMission('"+m.id+"')" : "toast('Tuntaskan misi sebelumnya dulu')")+'">'+
         '<span class="ic">'+svg(m.icon)+'</span>'+
         '<span class="bd"><h3>Misi '+m.no+' &middot; '+m.title+'</h3>'+
         '<p><span class="tag">'+TIER[m.tier].n+'</span>'+tot+' level &middot; '+m.desc+'</p>'+
         (st ? '<div class="starline">'+'★'.repeat(Math.min(st,tot*3))+' '+st+'/'+(tot*3)+'</div>' : '')+
         '</span><span class="rt">'+pill+'</span></button>';
  });
  h += '</div>';
  document.getElementById('v-map').innerHTML = h;
}

/* ==================== MISSION -> LEVEL SELECT ==================== */
function openMission(id){
  const m = misById(id);
  let h = sheetHead(m, m.desc);
  h += '<p class="lead">'+m.intro+'</p>';
  m.levels.forEach(l => {
    const dn = lvDone(id, l.n), op = lvOpen(id, l.n), st = lvStars(id, l.n);
    h += '<button class="lvl" data-done="'+(dn?1:0)+'" data-open="'+(op&&!dn?1:0)+'" data-locked="'+(op?0:1)+'" '+
         'onclick="'+(op ? "playLevel('"+id+"',"+l.n+")" : "toast('Selesaikan level sebelumnya dulu')")+'">'+
         '<span class="num">'+l.n+'</span>'+
         '<span class="bd"><h4>'+l.t+'</h4><p>'+l.d+'</p></span>'+
         '<span class="st">'+(dn ? stars(st) : (op ? '' : '\u{1F512}'))+'</span></button>';
  });
  const tot = m.levels.length;
  h += '<div class="note info" style="margin-top:14px"><b>Progres misi ini</b>'+misDoneCount(id)+' dari '+tot+' level selesai &middot; '+misStars(id)+' dari '+(tot*3)+' bintang.</div>';
  openSheet(h);
}
function playLevel(mid, n){
  const m = misById(mid), l = m.levels.find(x => x.n === n);
  CUR = {mid:mid, n:n, m:m, l:l};
  l.run();
}
let CUR = null;
function lvHead(extra){
  const m = CUR.m;
  return sheetHead(m, 'Level '+CUR.n+' &mdash; '+CUR.l.t, "openMission('"+CUR.mid+"')") + (extra||'');
}
function finishLevel(st, msg, extra){
  const {mid, n, m} = CUR;
  const prev = lvStars(mid, n);
  if(st > 0 && st >= prev) S.lv[lk(mid,n)] = {s:st};
  else if(st > 0 && prev === 0) S.lv[lk(mid,n)] = {s:st};
  save();
  const nx = m.levels.find(x => x.n === n+1);
  let h = lvHead();
  h += '<div class="bigstars">'+(st ? stars(st) : '☆☆☆')+'</div>';
  h += '<div class="note '+(st?'ok':'no')+'"><b>'+(st ? (st===3?'Sempurna!':'Level selesai!') : 'Belum lulus level ini')+'</b>'+msg+'</div>';
  if(extra) h += extra;
  h += '<div class="btns">';
  if(st && nx) h += '<button class="btn" onclick="playLevel(\''+mid+'\','+(n+1)+')">Level Berikutnya</button>';
  else if(st) h += '<button class="btn" onclick="openMission(\''+mid+'\')">Kembali ke Misi</button>';
  else h += '<button class="btn" onclick="playLevel(\''+mid+'\','+n+')">Coba Lagi</button>';
  h += '<button class="btn sec" onclick="playLevel(\''+mid+'\','+n+')">Ulangi</button>';
  h += '</div>';
  h += '<div class="btns"><button class="btn sec" onclick="openMission(\''+mid+'\')">Daftar Level</button></div>';
  openSheet(h);
  renderAll();
  if(st && misDone(mid) && misCleared() === MISSIONS.length) toast('Semua misi tuntas! Kamu LULUS!');
  else if(st && misDone(mid)) toast('Misi '+m.no+' tuntas! Lencana didapat');
}

/* ==================== ENGINE: MCQ SEQUENCE ==================== */
let TIMER = null;
function stopTimer(){ if(TIMER){ clearInterval(TIMER); TIMER = null; } }
function seqMCQ(items, opts, onEnd){
  opts = opts || {};
  let i = 0, score = 0;
  const list = opts.shuffle ? shuffle(items) : items;
  function step(){
    stopTimer();
    if(i >= list.length) return onEnd(score, list.length);
    const q = list[i];
    const opts2 = q.keepOrder ? q.o.map((t,k) => ({t:t, k:k})) : shuffle(q.o.map((t,k) => ({t:t, k:k})));
    let h = lvHead();
    h += '<div class="counter"><span>Soal '+(i+1)+' dari '+list.length+'</span>'+
         (opts.time ? '<span class="timer" id="tmr">'+opts.time+'s</span>' : '<span>Skor '+score+'</span>')+'</div>';
    if(opts.time) h += '<div class="tbar"><i id="tbar"></i></div>';
    if(q.pre) h += q.pre;
    h += '<p style="font-weight:700;margin:12px 0 10px">'+q.t+'</p>';
    h += opts2.map((o,k) => '<button class="choice" data-k="'+o.k+'">'+o.t+'</button>').join('');
    h += '<div id="fb"></div>';
    openSheet(h);
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.k, q, false));
    if(opts.time) startCountdown(opts.time, () => answer(-1, q, true));
  }
  function answer(pick, q, timeout){
    stopTimer();
    const ok = pick === q.a;
    if(ok) score++;
    document.querySelectorAll('.choice').forEach(b => {
      const k = +b.dataset.k; b.disabled = true;
      if(k === q.a) b.classList.add('ok'); else if(k === pick) b.classList.add('no');
    });
    document.getElementById('fb').innerHTML =
      '<div class="note '+(ok?'ok':'no')+'"><b>'+(ok ? 'Benar!' : (timeout ? 'Waktu habis' : 'Belum tepat'))+'</b>'+q.e+'</div>'+
      '<div class="btns"><button class="btn" id="nx">'+(i === list.length-1 ? 'Lihat Hasil' : 'Lanjut')+'</button></div>';
    document.getElementById('nx').onclick = () => { i++; step(); };
  }
  step();
}
function startCountdown(sec, onZero){
  let left = sec;
  const el = document.getElementById('tmr'), bar = document.getElementById('tbar');
  const tick = () => {
    left -= 0.1;
    if(el) el.textContent = Math.max(0, left).toFixed(1)+'s';
    if(bar) bar.style.width = Math.max(0, left/sec*100)+'%';
    if(el && left <= sec*0.3) el.classList.add('low');
    if(bar && left <= sec*0.3) bar.classList.add('low');
    if(left <= 0){ stopTimer(); onZero(); }
  };
  stopTimer(); TIMER = setInterval(tick, 100);
}

/* ==================== ENGINE: TEXT CHALLENGE ==================== */
function textChain(steps, onEnd){
  let i = 0, penalty = 0;
  function step(fb){
    const s = steps[i];
    let h = lvHead();
    h += '<div class="counter"><span>Tahap '+(i+1)+' dari '+steps.length+'</span><span>Petunjuk dipakai: '+penalty+'</span></div>';
    h += s.body;
    h += '<div class="field" style="margin-top:12px"><label for="ta">'+s.label+'</label>'+
         '<input type="text" id="ta" autocomplete="off" spellcheck="false" placeholder="'+(s.ph||'tulis jawabanmu...')+'"></div>';
    if(fb) h += fb;
    h += '<button class="btn" id="cek">Periksa</button>';
    if(s.hints && s.hints.length) h += '<div class="btns"><button class="btn sec" id="hb">Minta Petunjuk (-1 nilai)</button></div><div id="hbox"></div>';
    openSheet(h);
    const inp = document.getElementById('ta');
    document.getElementById('cek').onclick = check;
    inp.onkeydown = e => { if(e.key === 'Enter') check(); };
    const hb = document.getElementById('hb');
    if(hb) hb.onclick = () => {
      const used = Math.min(penalty, s.hints.length);
      if(used >= s.hints.length) return toast('Semua petunjuk sudah dipakai');
      penalty++;
      document.getElementById('hbox').innerHTML = s.hints.slice(0, penalty).map((x,k) =>
        '<div class="note hint"><b>Petunjuk '+(k+1)+'</b>'+x+'</div>').join('');
    };
    setTimeout(() => { const e2 = document.getElementById('ta'); if(e2) e2.focus(); }, 120);
  }
  function check(){
    const v = norm(document.getElementById('ta').value);
    const ans = Array.isArray(steps[i].a) ? steps[i].a : [steps[i].a];
    if(ans.some(x => norm(x) === v)){
      i++;
      if(i >= steps.length) return onEnd(penalty);
      step('<div class="note ok"><b>Tepat!</b>Lanjut ke tahap berikutnya.</div>');
    } else {
      step('<div class="note no"><b>Belum tepat</b>'+(steps[i].wrong || 'Periksa lagi jawabanmu.')+'</div>');
    }
  }
  step();
}

/* ==================== ENGINE: PICK EVIDENCE ==================== */
function pickEvidence(cases, onEnd){
  let i = 0, score = 0;
  function step(){
    const c = cases[i];
    let h = lvHead();
    h += '<div class="counter"><span>Kasus '+(i+1)+' dari '+cases.length+'</span><span>Skor '+score+'</span></div>';
    h += '<p class="lead">Ketuk bagian yang menurutmu <b>mencurigakan</b> ('+c.need.length+' bagian), lalu tekan Periksa.</p>';
    h += '<div class="msg"><div class="from">'+c.from+'</div><div class="evi" id="evi">'+
         c.tokens.map((t,k) => '<span class="tok" data-k="'+k+'">'+t+'</span>').join(' ')+'</div></div>';
    h += '<div id="fb"></div><button class="btn" id="cek" style="margin-top:12px">Periksa</button>';
    openSheet(h);
    const picked = new Set();
    document.querySelectorAll('#evi .tok').forEach(t => t.onclick = () => {
      const k = +t.dataset.k;
      if(picked.has(k)){ picked.delete(k); t.classList.remove('picked'); }
      else { picked.add(k); t.classList.add('picked'); }
    });
    document.getElementById('cek').onclick = () => {
      const need = new Set(c.need);
      let right = 0, wrong = 0;
      document.querySelectorAll('#evi .tok').forEach(t => {
        const k = +t.dataset.k;
        t.classList.remove('picked');
        if(need.has(k)){ t.classList.add('good'); if(picked.has(k)) right++; }
        else if(picked.has(k)){ t.classList.add('bad'); wrong++; }
      });
      const perfect = right === need.size && wrong === 0;
      if(perfect) score++;
      document.getElementById('cek').remove();
      document.getElementById('fb').innerHTML =
        '<div class="note '+(perfect?'ok':'no')+'"><b>'+(perfect ? 'Tepat semua!' : 'Benar '+right+' dari '+need.size+(wrong?', salah tunjuk '+wrong:'')) +'</b>'+c.e+'</div>'+
        '<div class="btns"><button class="btn" id="nx">'+(i === cases.length-1 ? 'Lihat Hasil' : 'Kasus Berikutnya')+'</button></div>';
      document.getElementById('nx').onclick = () => { i++; i < cases.length ? step() : onEnd(score, cases.length); };
    };
  }
  step();
}

/* ==================== ENGINE: MULTI SELECT ==================== */
function multiSelect(cases, onEnd){
  let i = 0, score = 0;
  function step(){
    const c = cases[i];
    let h = lvHead();
    h += '<div class="counter"><span>Kasus '+(i+1)+' dari '+cases.length+'</span><span>Skor '+score+'</span></div>';
    if(c.pre) h += c.pre;
    h += '<p style="font-weight:700;margin:12px 0 10px">'+c.t+'</p>';
    h += c.o.map((o,k) => '<button class="choice" data-k="'+k+'">'+o+'</button>').join('');
    h += '<div id="fb"></div><button class="btn" id="cek" style="margin-top:6px">Periksa</button>';
    openSheet(h);
    const picked = new Set();
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if(picked.has(k)){ picked.delete(k); b.classList.remove('sel'); }
      else { picked.add(k); b.classList.add('sel'); }
    });
    document.getElementById('cek').onclick = () => {
      const need = new Set(c.a);
      let right = 0, wrong = 0;
      document.querySelectorAll('.choice').forEach(b => {
        const k = +b.dataset.k; b.disabled = true; b.classList.remove('sel');
        if(need.has(k)){ b.classList.add('ok'); if(picked.has(k)) right++; }
        else if(picked.has(k)){ b.classList.add('no'); wrong++; }
      });
      const perfect = right === need.size && wrong === 0;
      if(perfect) score++;
      document.getElementById('cek').remove();
      document.getElementById('fb').innerHTML =
        '<div class="note '+(perfect?'ok':'no')+'"><b>'+(perfect ? 'Tepat semua!' : 'Benar '+right+' dari '+need.size+(wrong?', salah pilih '+wrong:''))+'</b>'+c.e+'</div>'+
        '<div class="btns"><button class="btn" id="nx">'+(i === cases.length-1 ? 'Lihat Hasil' : 'Lanjut')+'</button></div>';
      document.getElementById('nx').onclick = () => { i++; i < cases.length ? step() : onEnd(score, cases.length); };
    };
  }
  step();
}

/* ==================== ENGINE: ORDERING ==================== */
function ordering(spec, onEnd){
  let cur = shuffle(spec.items.map((x,k) => k));
  function step(fb){
    let h = lvHead();
    h += '<p class="lead">'+spec.lead+'</p>';
    if(spec.pre) h += spec.pre;
    h += '<div id="list">'+cur.map((idx,pos) =>
      '<div class="ord"><span class="n">'+(pos+1)+'</span><span class="t">'+spec.items[idx]+'</span>'+
      '<span class="mv"><button data-p="'+pos+'" data-d="-1">&#9650;</button><button data-p="'+pos+'" data-d="1">&#9660;</button></span></div>'
    ).join('')+'</div>';
    if(fb) h += fb;
    h += '<button class="btn" id="cek" style="margin-top:10px">Periksa Urutan</button>';
    openSheet(h);
    document.querySelectorAll('.mv button').forEach(b => b.onclick = () => {
      const p = +b.dataset.p, d = +b.dataset.d, q = p+d;
      if(q < 0 || q >= cur.length) return;
      [cur[p], cur[q]] = [cur[q], cur[p]];
      step();
    });
    document.getElementById('cek').onclick = () => {
      const ok = cur.every((v,k) => v === spec.order[k]);
      if(ok) onEnd(true);
      else step('<div class="note no"><b>Belum tepat</b>'+spec.wrong+'</div>');
    };
  }
  step();
}

/* ==================== ENGINE: BRANCHING STORY ==================== */
function branchStory(stories, onEnd){
  let i = 0, safeTotal = 0, maxSafe = 0;
  function play(){
    const st = stories[i];
    let node = 'start', safe = 0, steps = 0;
    maxSafe += st.maxSafe;
    function scene(fb){
      const nd = st.nodes[node];
      let h = lvHead();
      h += '<div class="counter"><span>Skenario '+(i+1)+' dari '+stories.length+'</span><span>Langkah '+(steps+1)+'</span></div>';
      h += '<div class="msg"><div class="from">'+st.n+'</div><div class="txt">'+nd.c+'</div></div>';
      if(fb) h += fb;
      h += '<p style="font-weight:700;margin:14px 0 10px">Apa yang kamu lakukan?</p>';
      h += nd.o.map((o,k) => '<button class="choice" data-k="'+k+'">'+o.t+'</button>').join('');
      h += '<div id="fb"></div>';
      openSheet(h);
      document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        const k = +b.dataset.k, o = nd.o[k];
        document.querySelectorAll('.choice').forEach((x,j) => {
          x.disabled = true;
          if(nd.o[j].safe) x.classList.add('ok'); else if(j === k) x.classList.add('no');
        });
        if(o.safe) safe++;
        steps++;
        document.getElementById('fb').innerHTML =
          '<div class="note '+(o.safe?'ok':'no')+'"><b>'+(o.safe?'Langkah aman':'Kamu terpancing')+'</b>'+o.e+'</div>'+
          '<div class="btns"><button class="btn" id="nx">'+(o.next ? 'Lanjut' : (i === stories.length-1 ? 'Lihat Hasil' : 'Skenario Berikutnya'))+'</button></div>';
        document.getElementById('nx').onclick = () => {
          if(o.next){ node = o.next; scene(); }
          else { safeTotal += safe; i++; i < stories.length ? play() : onEnd(safeTotal, maxSafe); }
        };
      });
    }
    scene();
  }
  play();
}
/* ==================== ENGINE: TERMINAL ==================== */
function terminal(cfg){
  let lines = [];
  const push = (t,c) => lines.push({t:t, c:c||''});
  (cfg.intro||[]).forEach(l => push(typeof l === 'string' ? l : l.t, typeof l === 'string' ? '' : l.c));
  const flags = {};
  const dev = cfg.devices || [];
  const findDev = a => dev.find(d => d.ip === a || d.nm.toLowerCase() === String(a).toLowerCase());
  function scanOne(d){
    if(!d.up){ push('  '+d.ip+' ('+d.nm+') - tidak merespons', 'w'); return; }
    if(!d.ports.length){ push('  '+d.ip+' ('+d.nm+') - aktif, tidak ada port terbuka'); return; }
    push('  '+d.ip+' ('+d.nm+') - aktif'+(d.hidden ? '  [TIDAK TERDAFTAR]' : ''), d.hidden ? 'r' : '');
    d.ports.forEach(p => push('      port '+p[0]+' TERBUKA : '+p[1], p[2] ? 'w' : ''));
  }

  function draw(){
    let h = lvHead();
    h += '<p class="lead">'+cfg.brief+'</p>';
    h += '<div class="term" id="term">'+lines.map(l => '<p class="l '+l.c+'">'+l.t+'</p>').join('')+'</div>';
    h += '<div class="termrow"><input type="text" id="cmd" placeholder="ketik perintah..." autocomplete="off" spellcheck="false"><button class="btn" id="run">Jalan</button></div>';
    h += '<div class="chips">'+(cfg.chips||[]).map(c => '<button class="chip" data-c="'+c+'">'+c+'</button>').join('')+'</div>';
    h += '<div id="mission"></div>';
    openSheet(h);
    const t = document.getElementById('term'); t.scrollTop = t.scrollHeight;
    const inp = document.getElementById('cmd');
    document.getElementById('run').onclick = () => exec(inp.value);
    inp.onkeydown = e => { if(e.key === 'Enter') exec(inp.value); };
    document.querySelectorAll('.chip').forEach(c => c.onclick = () => exec(c.dataset.c));
    if(cfg.mission) cfg.mission(document.getElementById('mission'), flags, draw);
  }
  function exec(raw){
    const s = (raw||'').trim();
    if(!s) return;
    push('$ '+esc(s), 'c');
    const parts = s.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const arg = parts.slice(1).join(' ');
    const has = c => (cfg.cmds||[]).indexOf(c) >= 0;
    if(['help','ls','ping','whois','nmap','cat','grep','files','clear'].indexOf(cmd) >= 0) flags['cmd_'+cmd] = true;

    if(cmd === 'help'){
      push('Perintah yang tersedia:');
      (cfg.cmds||[]).forEach(c => push('  '+HELP[c]));
    }
    else if(cmd === 'clear'){ lines = []; }
    else if(cmd === 'ls' && has('ls')){
      push('Perangkat terdaftar di '+cfg.net+':');
      dev.filter(d => !d.hidden).forEach(d => push('  '+d.ip.padEnd(16)+d.nm));
      if(cfg.lsNote) push(cfg.lsNote);
    }
    else if(cmd === 'ping' && has('ping')){
      const d = findDev(arg);
      if(!d){ push('ping: host "'+esc(arg)+'" tidak dikenal', 'w'); }
      else if(!d.up){ push('Request timeout... (3x)'); push(d.nm+' tidak merespons - kemungkinan sedang mati.', 'w'); }
      else { for(let i=0;i<3;i++) push('64 bytes dari '+d.ip+' ('+d.nm+'): waktu='+(3+i*2)+'ms'); push(d.nm+' AKTIF.'); flags['ping_'+d.ip] = true; }
    }
    else if(cmd === 'whois' && has('whois')){
      if(new RegExp(cfg.net.split('.')[0], 'i').test(arg) || arg === cfg.net){
        push('Nama jaringan : '+cfg.net);
        push('Tipe          : jaringan simulasi (latihan)');
        push('Gerbang       : '+(dev[0] ? dev[0].ip+' ('+dev[0].nm+')' : '-'));
        push('Perangkat     : '+dev.filter(d => !d.hidden).length+' terdaftar');
      } else {
        const d = findDev(arg);
        if(!d || d.hidden){ push('whois: data untuk "'+esc(arg)+'" tidak ditemukan', 'w'); }
        else { push('Perangkat : '+d.nm); push('Alamat IP : '+d.ip); push('Vendor    : '+(d.vendor||'tidak diketahui')); push('Status    : '+(d.up?'aktif':'mati')); }
      }
    }
    else if(cmd === 'nmap' && has('nmap')){
      const sweep = /^[\d.]+\s*-\s*\d+$/.test(arg) || /^[\d.]+\/\d+$/.test(arg);
      const range = /^(semua|all)$/i.test(arg);
      if(sweep){
        push('Menyapu seluruh rentang alamat '+esc(arg)+' ...');
        dev.forEach(scanOne);
        const hid = dev.filter(d => d.hidden).length;
        push('Sapuan selesai. '+hid+' host TIDAK TERDAFTAR ditemukan.', hid ? 'r' : 'c');
        flags.swept = true; flags.scanned = true;
      } else if(range){
        push('Memindai perangkat terdaftar di '+cfg.net+' ...');
        dev.filter(d => !d.hidden).forEach(scanOne);
        push('Pemindaian selesai.', 'c');
        if(dev.some(d => d.hidden)) push('Catatan: perintah ini hanya memeriksa perangkat yang TERDAFTAR.', 'w');
        flags.scanned = true;
      } else {
        const d = findDev(arg);
        if(!d){ push('nmap: target "'+esc(arg)+'" tidak dikenal. Coba "nmap semua".', 'w'); }
        else { push('Memindai '+d.ip+' ('+d.nm+') ...'); scanOne(d); flags['nmap_'+d.ip] = true; }
      }
    }
    else if(cmd === 'cat' && has('cat')){
      const f = (cfg.files||{})[arg];
      if(!f){ push('cat: berkas "'+esc(arg)+'" tidak ditemukan', 'w'); }
      else { f.split('\n').forEach(l => push('  '+esc(l))); flags['cat_'+arg] = true; flags.readlog = true; }
    }
    else if(cmd === 'grep' && has('grep')){
      const m = arg.match(/^"?([^"]+)"?\s+(\S+)$/);
      if(!m){ push('grep: format -> grep <kata> <berkas>', 'w'); }
      else {
        const f = (cfg.files||{})[m[2]];
        if(!f){ push('grep: berkas "'+esc(m[2])+'" tidak ditemukan', 'w'); }
        else {
          const hits = f.split('\n').filter(l => l.toLowerCase().indexOf(m[1].toLowerCase()) >= 0);
          if(!hits.length) push('  (tidak ada baris yang cocok)');
          else hits.forEach(l => push('  '+esc(l), 'w'));
          flags.readlog = true;
        }
      }
    }
    else if(cmd === 'files' && has('cat')){
      push('Berkas yang bisa dibaca:');
      Object.keys(cfg.files||{}).forEach(k => push('  '+k));
    }
    else {
      flags.bad = (flags.bad || 0) + 1;
      push('Perintah "'+esc(cmd)+'" tidak dikenal atau belum tersedia di level ini. Ketik "help".', 'w');
    }
    push('');
    draw();
  }
  const HELP = {
    ls:'ls                  - lihat perangkat yang terdaftar',
    ping:'ping <ip>           - cek perangkat hidup atau mati',
    whois:'whois <nama/ip>     - info jaringan atau perangkat',
    nmap:'nmap <ip|semua>     - periksa port yang terbuka',
    cat:'cat <berkas>        - baca isi berkas (lihat: files)',
    grep:'grep <kata> <berkas>- cari baris yang mengandung kata',
    clear:'clear               - bersihkan layar'
  };
  draw();
}

/* ==================== PASSWORD UTIL ==================== */
const COMMON_PW = ['password','123456','12345678','qwerty','abc123','111111','iloveyou','admin','password123','sayang','rahasia','12345','indonesia','qwerty123','aku cinta kamu'];
const KATA_ID = ['kucing','gajah','sepeda','rendang','matahari','pelangi','gunung','kelapa','samudra','harimau','durian','bintang','jendela','sepatu','mangga','kompor','payung','singa','badak','melati'];
function pwBits(v){
  const low = /[a-z]/.test(v), up = /[A-Z]/.test(v), dg = /[0-9]/.test(v), sy = /[^A-Za-z0-9]/.test(v);
  const set = (low?26:0)+(up?26:0)+(dg?10:0)+(sy?33:0);
  let bits = v.length && set ? v.length * Math.log2(set) : 0;
  if(COMMON_PW.indexOf(v.toLowerCase()) >= 0) bits = Math.min(bits, 10);
  return bits;
}
function pwLevel(bits, len){
  if(!len) return {n:'Belum diisi', c:'var(--line)', s:0};
  if(bits < 28) return {n:'Sangat Lemah', c:'var(--danger)', s:0};
  if(bits < 40) return {n:'Lemah', c:'var(--danger)', s:0};
  if(bits < 60) return {n:'Sedang', c:'var(--gold)', s:1};
  if(bits < 80) return {n:'Kuat', c:'var(--success)', s:2};
  return {n:'Sangat Kuat', c:'var(--success)', s:3};
}
function crackTime(bits){
  if(bits <= 0) return '—';
  const secs = Math.pow(2, bits) / 1e10;
  if(!isFinite(secs) || secs > 3.15e16) return 'miliaran tahun';
  if(secs < 1) return 'kurang dari 1 detik';
  if(secs < 60) return Math.round(secs)+' detik';
  if(secs < 3600) return Math.round(secs/60)+' menit';
  if(secs < 86400) return Math.round(secs/3600)+' jam';
  if(secs < 31536000) return Math.round(secs/86400)+' hari';
  const y = secs/31536000;
  if(y < 1000) return Math.round(y)+' tahun';
  if(y < 1e6) return Math.round(y/1000)+' ribu tahun';
  return Math.round(y/1e6)+' juta tahun';
}
function pwMeterHTML(id){
  return '<div class="meter"><i id="'+id+'bar"></i></div>'+
         '<div class="mlabel" id="'+id+'lbl">Belum diisi</div>'+
         '<div class="mtime" id="'+id+'time">Perkiraan waktu dibobol: —</div>'+
         '<div class="crit" id="'+id+'crit"></div>';
}
function pwPaint(id, v){
  const bits = pwBits(v), L = pwLevel(bits, v.length);
  const bar = document.getElementById(id+'bar');
  if(!bar) return L;
  bar.style.width = Math.min(100, bits/90*100)+'%';
  bar.style.background = L.c;
  const lbl = document.getElementById(id+'lbl'); lbl.textContent = L.n; lbl.style.color = L.c;
  document.getElementById(id+'time').innerHTML = 'Perkiraan waktu dibobol: <b>'+crackTime(bits)+'</b>';
  const cr = [['8+ huruf', v.length>=8],['12+ huruf', v.length>=12],['huruf kecil',/[a-z]/.test(v)],['huruf besar',/[A-Z]/.test(v)],['angka',/[0-9]/.test(v)],['simbol',/[^A-Za-z0-9]/.test(v)],['bukan kata umum', v.length>0 && COMMON_PW.indexOf(v.toLowerCase())<0]];
  document.getElementById(id+'crit').innerHTML = cr.map(c => '<span class="'+(c[1]?'hit':'')+'">'+(c[1]?'✓ ':'')+c[0]+'</span>').join('');
  return L;
}

/* ==================== INLINE MCQ (untuk panel misi) ==================== */
function mcqInline(host, q, cb){
  host.innerHTML = (q.pre||'') +
    '<p style="font-weight:700;margin:12px 0 10px">'+q.t+'</p>' +
    q.o.map((o,k) => '<button class="choice" data-k="'+k+'">'+o+'</button>').join('') +
    '<div id="ifb"></div>';
  host.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    const pick = +b.dataset.k, ok = pick === q.a;
    host.querySelectorAll('.choice').forEach((x,j) => {
      x.disabled = true;
      if(j === q.a) x.classList.add('ok'); else if(j === pick) x.classList.add('no');
    });
    host.querySelector('#ifb').innerHTML =
      '<div class="note '+(ok?'ok':'no')+'"><b>'+(ok?'Benar!':'Belum tepat')+'</b>'+q.e+'</div>'+
      '<div class="btns"><button class="btn" id="inx">Lanjut</button></div>';
    host.querySelector('#inx').onclick = () => cb(ok);
  });
}

      if(hint >= spec.hints.length) return toast('Semua petunjuk sudah dipakai');

  {s:8, m:'Modul 3', t:'Celah Umum di Website', b:['Banyak celah muncul karena server percaya begitu saja pada apa yang diketik pengguna.','Injeksi = menyelipkan perintah di kolom isian, seolah menyelundupkan pesan lewat kolom nama.','Menyaring daftar kata terlarang bukan perbaikan sejati - penyerang tinggal memakai cara lain.','Perbaikan sebenarnya: prepared statement, yang memisahkan data dari perintah.']},
  {s:9, m:'Modul 3', t:'Etika Saat Menemukan Celah', b:['Kalau menemukan celah di sistem nyata: berhenti begitu terbukti ada.','Jangan mengunduh data, jangan mengubah apa pun - itu tetap pelanggaran walau niatnya baik.','Laporkan ke pemilik sistem. Namanya responsible disclosure.','Peretas terbaik bukan yang paling jago masuk, tapi yang paling bisa dipercaya.']},
  {s:10, m:'Modul 4', t:'Kriptografi Dasar', b:['Encoding = mengubah bentuk data agar rapi dikirim (contoh: Base64). Bukan pengamanan.','Enkripsi = mengunci data dengan kunci rahasia. Tanpa kunci, isi tidak terbaca.','Caesar menggeser huruf; Atbash membalik alfabet (A jadi Z).','Sandi berlapis dibongkar dari lapisan terluar dulu.']},
  {s:11, m:'Modul 4', t:'Forensik & Jejak Digital', b:['Setiap foto menyimpan metadata: waktu, jenis HP, kadang lokasi GPS.','Bandingkan waktu "diambil" dan "diubah" untuk mengetahui apakah sebuah foto diedit.','Koordinat GPS terlihat seperti angka biasa, padahal menunjuk titik persis di peta.','Bersihkan metadata dan sensor data pribadi sebelum membagikan apa pun.']},
  {s:12, m:'Modul 5', t:'Rekayasa Sosial & OSINT', b:['Rekayasa sosial menyerang manusianya, bukan komputernya.','Senjatanya: rasa takut, buru-buru, iba, dan iming-iming hadiah.','Penipu paling berbahaya adalah yang sabar - ia membangun kepercayaan dulu.','Pertahanan terkuat: verifikasi lewat jalur lain, dan jangan pernah dilarang bertanya.']},
  {s:13, m:'Modul 5', t:'Review & Latihan Ulang', b:['Buka kembali level dengan bintang paling sedikit dan mainkan ulang.','Yang sering keliru: mengira Base64 itu enkripsi, dan mengira semua port terbuka pasti berbahaya.','Ceritakan ulang satu konsep ke temanmu - kalau bisa menjelaskan, berarti kamu paham.','Catatan arsip lama: burung pembawa pesan rahasia para peretas muda adalah MERPATI.']},
  {s:14, m:'Modul 5', t:'Apa Itu Mini-CTF', b:['CTF (Capture The Flag) = lomba memecahkan tantangan keamanan untuk menemukan "flag".','Flag biasanya berbentuk teks khusus seperti CTF{...}.','Kerja tim penting: satu membaca petunjuk, satu mencoba, satu mencatat.','Tantangan CTF jarang satu jenis - biasanya berantai dari beberapa keterampilan sekaligus.']},
  {s:15, m:'Modul 6', t:'Tantangan Akhir', b:['Tantangan terakhir menggabungkan encoding, sandi, jaringan, log, forensik, dan phishing.','Kerjakan bertahap: hasil satu tahap menjadi kunci tahap berikutnya.','Kalau macet, baca ulang materi sesi sebelumnya - semua kuncinya sudah pernah diajarkan.','Beberapa petunjuk sengaja disembunyikan di dalam materi. Membaca adalah bagian dari keterampilan.']},
  {s:16, m:'Modul 6', t:'Penutup & Langkah Lanjut', b:['Kamu sudah mengenal dasar dunia keamanan siber. Ini baru pintu masuknya.','Lanjutannya: belajar pemrograman (Python), jaringan lebih dalam, lalu latihan CTF resmi.','Ingat selalu: kemampuan ini dipakai untuk melindungi, bukan merusak.','Peretas terbaik adalah yang paling dipercaya.']}
];
/* ==================== RENDER: BELAJAR ==================== */
function renderBelajar(){
  let h = '<p class="lead">Materi ringkas untuk tiap pertemuan. Baca sebelum atau sesudah mengerjakan misi &mdash; beberapa petunjuk tantangan akhir tersembunyi di sini.</p>';
  let last = '';
  LESSONS.forEach(l => {
    if(l.m !== last){ h += '<h2 class="sec">'+l.m+'</h2>'; last = l.m; }
    h += '<div class="card"><div class="eyebrow">Pertemuan '+l.s+'</div><h3>'+l.t+'</h3><ul>'+
         l.b.map(x => '<li>'+x+'</li>').join('')+'</ul></div>';
  });
  document.getElementById('v-belajar').innerHTML = h;
}

/* ==================== RENDER: PROFIL ==================== */
function renderProfil(){
  const cleared = misCleared(), all = cleared === MISSIONS.length;
  const ts = totalStars(), ms = maxStars(), R = rankOf();
  let h = '';
  h += '<div class="card"><div class="eyebrow">Peserta</div><h3>'+(esc(S.nama)||'Belum diisi')+
       (S.kode ? ' <span style="font-family:Karla;font-size:.78rem;color:var(--ink-faint)">('+esc(S.kode)+')</span>' : '')+'</h3>'+
       '<p style="margin-top:6px">'+cleared+' dari '+MISSIONS.length+' misi tuntas &middot; '+ts+' dari '+ms+' bintang.</p>'+
       '<div class="meter"><i style="width:'+(ts/ms*100)+'%;background:var(--gold)"></i></div></div>';

  h += '<div class="card"><div class="rank"><div class="rb">'+R.t.charAt(0)+'</div>'+
       '<div><div class="eyebrow">Peringkat</div><h3>'+R.t+'</h3>'+
       '<p style="margin:2px 0 0;font-size:.82rem">'+R.d+'</p></div></div></div>';

  h += '<h2 class="sec">Lencana Misi</h2><div class="badges">';
  MISSIONS.forEach(m => { h += '<div class="bg'+(misDone(m.id)?' got':'')+'">'+svg(m.icon)+'<span>'+m.badge+'</span></div>'; });
  h += '</div>';

  h += '<h2 class="sec">Rincian Level</h2>';
  MISSIONS.forEach(m => {
    const dn = misDoneCount(m.id), tot = m.levels.length;
    h += '<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+
         '<h3 style="font-size:.92rem">Misi '+m.no+' &middot; '+m.title+'</h3>'+
         '<span style="font-family:\'Baloo 2\';font-size:.78rem;color:var(--ink-faint)">'+dn+'/'+tot+'</span></div>'+
         '<div style="margin-top:6px;font-size:.78rem;color:var(--gold);letter-spacing:1px">'+
         m.levels.map(l => lvDone(m.id,l.n) ? '★'.repeat(lvStars(m.id,l.n))+'<span style="color:var(--ink-faint)">'+'☆'.repeat(3-lvStars(m.id,l.n))+'</span>' : '<span style="color:var(--ink-faint)">☆☆☆</span>').join(' &nbsp; ')+
         '</div></div>';
  });

  h += '<h2 class="sec">Sertifikat</h2>';
  if(all){
    h += '<div class="cert"><div class="k">Sertifikat Kelulusan</div><h3>LULUS</h3>'+
         '<div class="nm">'+(esc(S.nama)||'Peserta')+'</div>'+
         '<p>telah menuntaskan seluruh '+MISSIONS.length+' misi Cyber Mission<br>dengan '+ts+' dari '+ms+' bintang &middot; peringkat '+R.t+'</p>'+
         '<p style="margin-top:10px;font-size:.72rem">'+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+'</p></div>';
  } else {
    h += '<div class="card"><p>Sertifikat terbuka setelah semua '+MISSIONS.length+' misi tuntas. Tersisa <b>'+(MISSIONS.length-cleared)+' misi</b> lagi.</p></div>';
  }

  h += '<h2 class="sec">Kode Progres</h2><div class="card">'+
       '<p>Tunjukkan kode ini ke fasilitator di akhir sesi sebagai cadangan data.</p>'+
       '<textarea id="expBox" rows="3" readonly>'+esc(exportCode())+'</textarea>'+
       '<div class="btns"><button class="btn sec" onclick="copyCode()">Salin Kode</button></div>'+
       '<div style="margin-top:14px"><label for="impBox">Pulihkan dari kode</label>'+
       '<textarea id="impBox" rows="3" placeholder="Tempel kode progres di sini..."></textarea>'+
       '<div class="btns"><button class="btn sec" onclick="importCode()">Pulihkan</button></div></div></div>';

  h += '<div class="card"><h3>Data Peserta</h3><div class="field"><input type="text" id="rnName" value="'+esc(S.nama)+'" placeholder="Nama kamu"></div>'+
       '<div class="field"><input type="text" id="rnKode" value="'+esc(S.kode)+'" placeholder="Kode peserta (opsional)"></div>'+
       '<button class="btn sec" onclick="renameMe()">Simpan</button></div>';
  document.getElementById('v-profil').innerHTML = h;
}
function exportCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ''; } }
function copyCode(){
  const t = document.getElementById('expBox');
  t.select(); t.setSelectionRange(0, 99999);
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(() => toast('Kode disalin'), () => toast('Salin manual ya'));
  else { try{ document.execCommand('copy'); toast('Kode disalin'); }catch(e){ toast('Salin manual ya'); } }
}
function importCode(){
  const v = document.getElementById('impBox').value.trim();
  if(!v) return toast('Kode masih kosong');
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!o || typeof o !== 'object') throw 0;
    S = {nama:o.nama||'', kode:o.kode||'', lv:o.lv||{}};
    save(); renderAll(); toast('Progres dipulihkan');
  }catch(e){ toast('Kode tidak valid'); }
}
function renameMe(){
  const n = document.getElementById('rnName').value.trim();
  if(!n) return toast('Nama tidak boleh kosong');
  S.nama = n; S.kode = document.getElementById('rnKode').value.trim();
  save(); renderAll(); toast('Tersimpan');
}

/* ==================== ONBOARDING ==================== */
function askName(){
  openSheet(
    '<div class="shead" style="--tt:var(--accent-tint);--tc:var(--accent-strong)"><div>'+
    '<span class="tchip">Selamat datang</span><h2>Halo, calon jagoan siber!</h2></div></div>'+
    '<p class="lead">Sebelum mulai, tulis namamu dulu. Progres misimu tersimpan di HP ini.</p>'+
    '<div class="field"><label for="obName">Nama kamu</label><input type="text" id="obName" placeholder="Contoh: Rani"></div>'+
    '<div class="field"><label for="obKode">Kode peserta (opsional, dari fasilitator)</label><input type="text" id="obKode" placeholder="Contoh: P1"></div>'+
    '<button class="btn" onclick="startApp()">Mulai Misi</button>', true);
  setTimeout(() => { const el = document.getElementById('obName'); if(el) el.focus(); }, 120);
}
function startApp(){
  const n = document.getElementById('obName').value.trim();
  if(!n) return toast('Isi namamu dulu ya');
  S.nama = n; S.kode = document.getElementById('obKode').value.trim();
  save(); closeSheet(); renderAll(); toast('Selamat datang, '+S.nama+'!');
}

/* ==================== HEADER + BOOT ==================== */
function renderHeader(){
  const c = misCleared(), pct = Math.round(c/MISSIONS.length*100);
  document.getElementById('ring').style.setProperty('--pct', pct);
  document.getElementById('ringTxt').textContent = c+'/'+MISSIONS.length;
  document.getElementById('tagline').textContent = S.nama
    ? (c === MISSIONS.length ? 'Selamat, '+S.nama+' - kamu LULUS!' : 'Semangat, '+S.nama+'! '+(MISSIONS.length-c)+' misi lagi')
    : 'Misi keamanan siber untuk calon jagoan digital';
  document.getElementById('hstars').textContent = '★ '+totalStars()+'/'+maxStars()+' bintang · '+rankOf().t;
}
function renderAll(){ renderHeader(); renderMap(); renderBelajar(); renderProfil(); }

load();
renderAll();
if(!S.nama) askName();
</script>
