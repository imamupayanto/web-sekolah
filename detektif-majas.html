<title>Detektif Majas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --paper:#e9f1e6;
    --surface:#f7fbf3;
    --surface-2:#dde9d7;
    --line:#c4d6bd;
    --ink:#1c2a1f;
    --ink-soft:#4a5c4c;
    --accent:#2f6f4e;
    --accent-strong:#1f5539;
    --accent-ink:#f4fbf0;
    --good:#2f6f4e;
    --warn:#a9791c;
    --critical:#b23a35;
    --cat-personifikasi:#9c6414;
    --cat-personifikasi-bg:#f1e3c6;
    --cat-simile:#1d7a98;
    --cat-simile-bg:#d9edf3;
    --cat-hiperbola:#a63762;
    --cat-hiperbola-bg:#f3dde7;
    --shadow: 0 1px 2px rgba(20,30,20,.06), 0 8px 24px -12px rgba(20,30,20,.22);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e1512;
      --surface:#161f1a;
      --surface-2:#1f2b22;
      --line:#2c3b30;
      --ink:#e7efe2;
      --ink-soft:#a9bbac;
      --accent:#6fcf97;
      --accent-strong:#8fe0ae;
      --accent-ink:#0a1710;
      --good:#6fcf97;
      --warn:#f2c464;
      --critical:#ff6b62;
      --cat-personifikasi:#e3a93f;
      --cat-personifikasi-bg:#3a3016;
      --cat-simile:#5fb8de;
      --cat-simile-bg:#122e37;
      --cat-hiperbola:#f07aa0;
      --cat-hiperbola-bg:#3a1c28;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1512;
    --surface:#161f1a;
    --surface-2:#1f2b22;
    --line:#2c3b30;
    --ink:#e7efe2;
    --ink-soft:#a9bbac;
    --accent:#6fcf97;
    --accent-strong:#8fe0ae;
    --accent-ink:#0a1710;
    --good:#6fcf97;
    --warn:#f2c464;
    --critical:#ff6b62;
    --cat-personifikasi:#e3a93f;
    --cat-personifikasi-bg:#3a3016;
    --cat-simile:#5fb8de;
    --cat-simile-bg:#122e37;
    --cat-hiperbola:#f07aa0;
    --cat-hiperbola-bg:#3a1c28;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(120,140,110,.14) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-inline: 16px;
  }
  :root[data-theme="dark"] body{
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0);
    background-size: 22px 22px;
  }

  h1,h2,h3, .display{
    font-family:"Fraunces", Georgia, "Times New Roman", serif;
    text-wrap: balance;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding-block: 28px 56px;
  }

  .masthead{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom: 22px;
  }
  .badge{
    width:52px; height:52px; flex:none;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow);
  }
  .badge svg{ width:26px; height:26px; }
  .masthead .title{
    font-size: 1.5rem;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .sub{
    margin:2px 0 0;
    color:var(--ink-soft);
    font-size:.92rem;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px;
  }

  [hidden]{ display:none !important; }

  /* ---------- START SCREEN ---------- */
  .section-label{
    font-family:"JetBrains Mono", ui-monospace, monospace;
    text-transform:uppercase;
    font-size:.72rem;
    letter-spacing:.09em;
    color:var(--ink-soft);
    margin: 0 0 10px;
  }

  .tier-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-bottom: 22px;
  }
  @media (max-width:520px){
    .tier-grid{ grid-template-columns: 1fr; }
  }
  .tier-card{
    text-align:left;
    cursor:pointer;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 14px 12px;
    color:var(--ink);
    font-family:inherit;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition: border-color .15s ease, transform .1s ease, background .15s ease;
  }
  .tier-card:hover{ border-color: var(--accent); }
  .tier-card:active{ transform: translateY(1px); }
  .tier-card[aria-pressed="true"]{
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: inset 0 0 0 1.5px var(--accent);
  }
  .tier-card .name{ font-weight:700; font-size:1rem; }
  .tier-card .stars{ color: var(--accent); letter-spacing:2px; font-size:.85rem; }
  .tier-card .time{
    font-family:"JetBrains Mono", monospace;
    font-size:.78rem;
    color:var(--ink-soft);
  }

  .count-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom: 24px;
  }
  .count-row input[type="range"]{
    flex:1;
    accent-color: var(--accent);
    height: 22px;
  }
  .count-value{
    font-family:"JetBrains Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-weight:700;
    font-size:1.1rem;
    min-width: 3.4ch;
    text-align:right;
  }

  .btn{
    font-family:"Work Sans", sans-serif;
    font-weight:600;
    font-size:1rem;
    border-radius: var(--radius-md);
    border:1.5px solid transparent;
    padding: 13px 20px;
    cursor:pointer;
    transition: filter .12s ease, transform .08s ease, background .15s ease;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{
    background: var(--accent);
    color: var(--accent-ink);
    width:100%;
  }
  .btn-primary:hover{ filter: brightness(1.06); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; filter:none; }
  .btn-ghost{
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }
  .btn-ghost:hover{ border-color: var(--accent); color: var(--accent); }

  :focus-visible{ outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .info-line{
    color:var(--ink-soft);
    font-size:.88rem;
    margin-top:14px;
    text-align:center;
  }

  /* ---------- QUIZ SCREEN ---------- */
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:18px;
  }
  .progress-text{
    font-family:"JetBrains Mono", monospace;
    font-size:.85rem;
    color:var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .progress-track{
    flex:1;
    height:6px;
    background:var(--surface-2);
    border-radius:999px;
    overflow:hidden;
    margin: 0 14px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition: width .25s ease;
  }

  .timer{
    position:relative;
    width:54px; height:54px; flex:none;
  }
  .timer svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .timer circle{ fill:none; stroke-width:5; }
  .timer .track{ stroke: var(--surface-2); }
  .timer .fill{
    stroke: var(--good);
    stroke-linecap:round;
    transition: stroke-dashoffset 1s linear, stroke .3s ease;
  }
  .timer .num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:1rem;
    font-variant-numeric: tabular-nums;
  }

  .clue-card{
    background:var(--surface);
    border:1.5px dashed var(--line);
    border-radius: var(--radius-lg);
    padding: 32px 26px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    min-height: 132px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .clue-card p{
    font-family:"Fraunces", Georgia, serif;
    font-style:italic;
    font-size: clamp(1.15rem, 1rem + 1vw, 1.5rem);
    line-height:1.45;
    margin:0;
    text-wrap: balance;
  }

  .answers{
    display:grid;
    gap:10px;
  }
  .answer-btn{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    padding: 15px 16px;
    border-radius: var(--radius-md);
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-family:"Work Sans", sans-serif;
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
    transition: border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .answer-btn:hover:not(:disabled){ border-color: var(--dot-color, var(--accent)); }
  .answer-btn:active:not(:disabled){ transform: translateY(1px); }
  .answer-btn:disabled{ cursor:default; }
  .answer-dot{
    width:12px; height:12px; border-radius:50%; flex:none;
    background: var(--dot-color);
  }
  .answer-btn[data-cat="personifikasi"]{ --dot-color: var(--cat-personifikasi); }
  .answer-btn[data-cat="simile"]{ --dot-color: var(--cat-simile); }
  .answer-btn[data-cat="hiperbola"]{ --dot-color: var(--cat-hiperbola); }

  .answer-btn.is-correct{
    border-color: var(--good);
    background: color-mix(in srgb, var(--good) 16%, var(--surface));
  }
  .answer-btn.is-wrong{
    border-color: var(--critical);
    background: color-mix(in srgb, var(--critical) 14%, var(--surface));
  }

  /* ---------- END SCREEN ---------- */
  .report-head{
    text-align:center;
    margin-bottom: 22px;
  }
  .score-num{
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size: 4rem;
    line-height:1;
    font-variant-numeric: tabular-nums;
    color:var(--accent);
    margin: 6px 0 4px;
  }
  .verdict{
    font-family:"Fraunces", serif;
    font-size:1.3rem;
    font-weight:600;
    margin:0 0 4px;
  }
  .verdict-sub{
    color:var(--ink-soft);
    font-size:.92rem;
    margin:0;
  }

  .stat-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin: 22px 0;
  }
  @media (max-width:520px){
    .stat-grid{ grid-template-columns: 1fr; }
  }
  .stat-tile{
    border-radius: var(--radius-md);
    padding: 14px;
    text-align:center;
    background: var(--tile-bg);
    border: 1px solid var(--line);
  }
  .stat-tile[data-cat="personifikasi"]{ --tile-bg: var(--cat-personifikasi-bg); }
  .stat-tile[data-cat="simile"]{ --tile-bg: var(--cat-simile-bg); }
  .stat-tile[data-cat="hiperbola"]{ --tile-bg: var(--cat-hiperbola-bg); }
  .stat-tile .label{
    font-size:.78rem;
    font-weight:600;
    text-transform:capitalize;
    margin-bottom:6px;
  }
  .stat-tile[data-cat="personifikasi"] .label{ color: var(--cat-personifikasi); }
  .stat-tile[data-cat="simile"] .label{ color: var(--cat-simile); }
  .stat-tile[data-cat="hiperbola"] .label{ color: var(--cat-hiperbola); }
  .stat-tile .value{
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    font-size:1.3rem;
    font-variant-numeric: tabular-nums;
  }

  .end-actions{
    display:flex;
    gap:10px;
  }
  .end-actions .btn{ flex:1; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>

  </section>
</div>

    els.countValue.textContent = String(state.jumlah);
    if (state.tier){
      els.startHint.textContent = 'Siap? ' + state.jumlah + ' kalimat, ' + TIME_MAP[state.tier] + ' detik tiap soal.';
    }
  });

  els.startBtn.addEventListener('click', function(){
    startQuiz();
  });

  els.changeTierBtn.addEventListener('click', function(){
    showScreen('start');
  });

  els.replayBtn.addEventListener('click', function(){
    startQuiz();
  });

  // ---------- QUIZ ----------
  function startQuiz(){
    var pool = BANK.filter(function(q){ return q.tier === state.tier; });
    state.questions = shuffle(pool).slice(0, state.jumlah);
    state.index = 0;
    state.correctCount = 0;
    state.tally = makeTally();
    showScreen('quiz');
    loadQuestion();
  }

  function loadQuestion(){
    state.answered = false;
    var q = state.questions[state.index];
    els.clueText.textContent = q.text;
    els.progressText.textContent = 'Kasus ' + (state.index + 1) + ' / ' + state.questions.length;
    els.progressFill.style.width = (100 * state.index / state.questions.length).toFixed(1) + '%';

    var order = shuffle(els.answerBtns);
    order.forEach(function(btn, i){
      els.screenQuiz.querySelector('.answers').appendChild(btn);
      btn.disabled = false;
      btn.classList.remove('is-correct', 'is-wrong');
    });

    els.answerBtns.forEach(function(btn){
      btn.onclick = function(){ handleAnswer(btn.getAttribute('data-cat')); };
    });

    startTimer(TIME_MAP[state.tier]);
  }

  function startTimer(seconds){
    clearInterval(state.timerId);
    state.timeLeft = seconds;
    updateTimerVisual(seconds, seconds);
    state.timerId = setInterval(function(){
      state.timeLeft -= 1;
      updateTimerVisual(state.timeLeft, seconds);
      if (state.timeLeft <= 0){
        clearInterval(state.timerId);
        handleAnswer(null);
      }
    }, 1000);
  }

  function updateTimerVisual(left, total){
    els.timerNum.textContent = String(Math.max(left, 0));
    var frac = Math.max(left, 0) / total;
    els.timerRing.style.strokeDashoffset = (CIRC * (1 - frac)).toFixed(2);
    var color = 'var(--good)';
    if (frac <= 0.33) color = 'var(--critical)';
    else if (frac <= 0.6) color = 'var(--warn)';
    els.timerRing.style.stroke = color;
  }

  function handleAnswer(chosenCat){
    if (state.answered) return;
    state.answered = true;
    clearInterval(state.timerId);

    var q = state.questions[state.index];
    var isCorrect = chosenCat === q.majas;

    state.tally[q.majas].total += 1;
    if (isCorrect){
      state.tally[q.majas].correct += 1;
      state.correctCount += 1;
    }

    els.answerBtns.forEach(function(btn){
      btn.disabled = true;
      var cat = btn.getAttribute('data-cat');
      if (cat === q.majas) btn.classList.add('is-correct');
      else if (cat === chosenCat) btn.classList.add('is-wrong');
    });

    setTimeout(function(){
      state.index += 1;
      if (state.index >= state.questions.length){
        finishQuiz();
      } else {
        loadQuestion();
      }
    }, 900);
  }

  function finishQuiz(){
    els.progressFill.style.width = '100%';
    var total = state.questions.length;
    var score = total > 0 ? Math.round((state.correctCount / total) * 100) : 0;

    var verdict, sub;
    if (score >= 90){ verdict = 'Detektif Utama'; sub = 'Ketajaman analisismu luar biasa!'; }
    else if (score >= 75){ verdict = 'Detektif Handal'; sub = 'Hampir semua kasus terpecahkan dengan baik.'; }
    else if (score >= 50){ verdict = 'Detektif Magang'; sub = 'Lumayan! Latihan sedikit lagi pasti makin tajam.'; }
    else { verdict = 'Detektif Pemula'; sub = 'Yuk pelajari lagi ciri-ciri tiap majas, lalu coba lagi.'; }

    els.finalScore.textContent = String(score);
    els.finalVerdict.textContent = verdict;
    els.finalDetail.textContent = state.correctCount + ' dari ' + total + ' kalimat terpecahkan benar. ' + sub;

    setStatTile(els.statP, state.tally.personifikasi);
    setStatTile(els.statS, state.tally.simile);
    setStatTile(els.statH, state.tally.hiperbola);

    showScreen('end');
  }

  function setStatTile(el, tallyEntry){
    if (tallyEntry.total === 0){
      el.textContent = '–';
    } else {
      el.textContent = tallyEntry.correct + '/' + tallyEntry.total;
    }
  }

  // ---------- Hot reload (keep game state for open viewers) ----------
  function restoreFromSnapshot(data){
    try{
      if (!data || !data.screen) return;
      state = Object.assign(state, data);
      if (state.screen === 'quiz' && state.questions && state.questions.length){
        showScreen('quiz');
        var q = state.questions[state.index];
        if (q){
          els.clueText.textContent = q.text;
          els.progressText.textContent = 'Kasus ' + (state.index + 1) + ' / ' + state.questions.length;
          els.progressFill.style.width = (100 * state.index / state.questions.length).toFixed(1) + '%';
          startTimer(TIME_MAP[state.tier] || 20);
          els.answerBtns.forEach(function(btn){
            btn.disabled = false;
            btn.classList.remove('is-correct', 'is-wrong');
            btn.onclick = function(){ handleAnswer(btn.getAttribute('data-cat')); };
          });
        }
      } else if (state.screen === 'end'){
        finishQuiz();
      } else {
        showScreen('start');
      }
    } catch (err){ showScreen('start'); }
  }

  function boot(initialData){
    restoreFromSnapshot(initialData);
  }

  try{
    if (window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){
        return {
          screen: state.screen,
          tier: state.tier,
          jumlah: state.jumlah,
          questions: state.questions,
          index: state.index,
          correctCount: state.correctCount,
          tally: state.tally
        };
      });
      if (window.claude.hot.ready){
        window.claude.hot.ready(boot);
      } else {
        boot(window.claude.hot.data || {});
      }
    } else {
      showScreen('start');
    }
  } catch(err){
    showScreen('start');
  }
})();
</script>
