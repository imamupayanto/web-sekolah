<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRILL MAPSI SD</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=IBM+Plex+Mono:wght@500;600&family=Amiri:wght@400;700&display=swap">
<style>
:root{
  --ground:#F2F5F2; --surface:#FFFFFF; --surface-2:#EAEFEA; --line:#D5DED8;
  --ink:#132018; --muted:#5C6E64; --accent:#0E6B54; --accent-soft:#DCEDE6;
  --gold:#A9761B; --gold-soft:#F6ECD8;
  --ok:#12744F; --ok-soft:#DDF0E6; --bad:#A83A28; --bad-soft:#F8E4DF;
  --shadow:0 1px 2px rgba(19,32,24,.06),0 8px 24px -12px rgba(19,32,24,.18);
  --on-accent:#FFFFFF; --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0D1512; --surface:#151F1B; --surface-2:#1D2A25; --line:#2B3A33;
    --ink:#E9F0EB; --muted:#96A99E; --accent:#4CC79C; --accent-soft:#153029;
    --gold:#DBA94E; --gold-soft:#2C2415;
    --ok:#4CC79C; --ok-soft:#143126; --bad:#E4836E; --bad-soft:#33201C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
    --on-accent:#08130F;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1512; --surface:#151F1B; --surface-2:#1D2A25; --line:#2B3A33;
  --ink:#E9F0EB; --muted:#96A99E; --accent:#4CC79C; --accent-soft:#153029;
  --gold:#DBA94E; --gold-soft:#2C2415;
  --ok:#4CC79C; --ok-soft:#143126; --bad:#E4836E; --bad-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7);
  --on-accent:#08130F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);-webkit-text-size-adjust:100%;
  font-family:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Gabarito,"Nunito Sans",sans-serif;font-weight:700;line-height:1.2;
  text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ar{font-family:Amiri,serif;font-size:1.25em;line-height:2}

/* shell */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:920px;margin:0 auto;padding:12px 18px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:9px 13px 11px;border-bottom:2px solid transparent;
  color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:920px;margin:0 auto;padding:22px 18px 80px}
.view[hidden]{display:none!important}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lede{color:var(--muted);max-width:62ch}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:11px 18px;font-weight:700;
  cursor:pointer;font-family:Gabarito,sans-serif;font-size:15px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 13px;font-size:14px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scroll-x{overflow-x:auto}

/* rangkuman */
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
details.topic+details.topic{margin-top:10px}
details.topic>summary{cursor:pointer;padding:15px 18px;font-family:Gabarito,sans-serif;font-weight:700;
  font-size:17px;display:flex;justify-content:space-between;gap:12px;align-items:center;list-style:none}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary::after{content:"+";color:var(--accent);font-size:20px}
details.topic[open]>summary::after{content:"–"}
details.topic[open]>summary{border-bottom:1px solid var(--line)}
.topic-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.topic-body ul{margin:0;padding-left:20px}
.topic-body li{margin:5px 0}
.topic-body h4{font-size:14px;color:var(--accent);letter-spacing:.02em}
.key{background:var(--gold-soft);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14.5px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font-size:17px;font-weight:600;margin:14px 0 4px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .lt{flex:0 0 26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;
  font-weight:700;font-size:13px;font-family:Gabarito,sans-serif}
.opt[data-state="picked"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[data-state="right"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-state="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.opt[data-state="right"] .lt{background:var(--ok);color:var(--surface)}
.opt[data-state="wrong"] .lt{background:var(--bad);color:var(--surface)}
.exp{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14.5px;background:var(--surface-2)}
.exp b{font-family:Gabarito,sans-serif}
.timer{font-size:15px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface-2)}
.timer.warn{background:var(--bad-soft);color:var(--bad)}
.grid-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.grid-nav button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;cursor:pointer;font-family:"IBM Plex Mono",monospace}
.grid-nav button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid-nav button.now{outline:2px solid var(--accent);outline-offset:1px}

/* result */
.score-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score{font-family:Gabarito,sans-serif;font-size:56px;font-weight:800;line-height:1;color:var(--accent)}
.meterrow{display:grid;grid-template-columns:minmax(120px,1.3fr) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meterrow .pct{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}

/* flashcard */
.fc{perspective:1200px;height:230px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);display:grid;place-content:center;text-align:center;padding:26px;gap:10px}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.fc-face .big{font-family:Gabarito,sans-serif;font-size:26px;font-weight:700}
.fc-face .hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fc-in,.progress span{transition:none}}
footer.wm{border-top:1px solid var(--line);margin-top:34px;padding:16px 18px 26px;text-align:center}
footer.wm p{margin:0;font-size:12px;letter-spacing:.04em;color:var(--muted);opacity:.65}
@media (max-width:700px){
  body{font-size:17px;line-height:1.62}
  main{padding:18px 14px 40px}
  .top-in{padding:12px 14px 0}
  .brand h1{font-size:19px}
  .brand .sub{font-size:13px}
  header.top{position:static}
  nav.tabs button{font-size:15px;padding:10px 12px 12px}
  .card{padding:16px 15px;border-radius:13px}
  .lede{font-size:16px}
  .eyebrow{font-size:12px}
  h2{font-size:23px!important}
  details.topic>summary{font-size:17.5px;padding:15px 16px}
  .topic-body{padding:15px 16px 20px;font-size:16.5px}
  .topic-body li{margin:7px 0}
  .key{font-size:16px}
  table{font-size:15.5px}
  th,td{padding:9px 8px}
  .qtext{font-size:19px;line-height:1.5;margin-top:16px}
  .opt{font-size:17px;padding:14px 14px;gap:11px;align-items:center}
  .opt .lt{flex:0 0 30px;height:30px;font-size:14px}
  .exp{font-size:16px;padding:14px}
  .badge{font-size:12px;padding:4px 9px}
  .chip{font-size:15.5px;padding:10px 16px}
  .btn{font-size:16.5px;padding:13px 20px;text-align:center}
  .btn:not(.small){width:100%}
  .btn.small{font-size:15.5px;padding:12px 14px;flex:1 1 auto}
  .timer{font-size:16px;padding:7px 14px}
  .grid-nav{grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px}
  .grid-nav button{font-size:14.5px}
  .score{font-size:46px}
  .meterrow{grid-template-columns:1fr 56px;font-size:15.5px;row-gap:4px}
  .meterrow .meter{grid-column:1/-1;order:3}
  .fc{height:250px}
  .fc-face .big{font-size:24px}
  .fc-face.back .big{font-size:19px}
  footer.wm p{font-size:12.5px}
  .card .aksi{position:sticky;bottom:0;z-index:5;background:var(--surface);
    padding:10px 0 4px;margin-left:-2px;margin-right:-2px;border-top:1px solid var(--line)}
  .scroll-x{margin-inline:-4px;padding-inline:4px}
  details.topic>summary::after{font-size:24px}
  .fc-face{padding:22px}
}
@media (max-width:700px) and (orientation:portrait){
  .card .row[style*="space-between"]{gap:10px}
}
</style>
</head>

...","opts":{"A":"Perwujudan ketetapan Allah yang telah terjadi","B":"Ketetapan Allah sejak zaman azali","C":"Usaha manusia mengubah takdir","D":"Doa untuk rezeki"},"key":"A","exp":"Perwujudan ketetapan Allah yang telah terjadi Qada adalah realisasi ketetapan Allah yang pasti terjadi.","topic":"Akidah","ar":false},{"id":"P1-57","paket":1,"no":57,"type":"PG","q":"\"‫ب‬‫ش رغاسق إ رذا رو رق ر‬ ِّ ‫\"ومن َ ر‬ ‫ر‬ ِ ٍ ِ ‫ِر‬ ‫ر‬ Mengapa pada kata \"‫اس ٍق ِإذا‬ ِ ‫ \"غ‬bukan dibaca idgham bighunnah?","opts":{"A":"Karena termasuk izhar halqi","B":"Karena hamzah bukan huruf idgham","C":"Ada huruf qalqalah di tengah","D":"Dibaca waqaf"},"key":"A","exp":"Karena termasuk izhar halqi Tanwin bertemu hamzah dibaca jelas (izhar halqi), bukan idgham.","topic":"BTQ","ar":true},{"id":"P1-58","paket":1,"no":58,"type":"PG","q":"Tidak semua huruf hijaiyah bisa disambungkan dengan huruf setelahnya. Salah satu huruf yang tidak dapat disambung dari kanan dan kiri adalah...","opts":{"A":"Ba","B":"Zai","C":"Mim","D":"Nun"},"key":"B","exp":"Zai Huruf zai tidak dapat disambung dari kanan dan kiri.","topic":"BTQ","ar":false},{"id":"P1-59","paket":1,"no":59,"type":"PG","q":"Khalifah Umar bin Khattab dikenal sebagai pemimpin yang bijaksana dan cerdas. Salah satu peninggalan administratif penting beliau adalah...","opts":{"A":"Mushaf Utsmani","B":"Kalender Hijriyah","C":"Buku ilmu nahwu","D":"Masjid Nabawi"},"key":"B","exp":"Kalender Hijriyah Umar bin Khattab menetapkan kalender Hijriyah sebagai peninggalan administratif.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-61","paket":1,"no":61,"type":"PG","q":"Dalam Q.S. Al-Ma'un ayat 4, \"‫ي‬ َ Allah memperingatkan ancaman bagi orang- ِ orang yang mengerjakan salat secara zahir, namun lalai terhadap maknanya. Siapakah yang sebenarnya menjadi subjek teguran dalam ayat tersebut dan mengapa perbuatan mereka mendapatkan celaan dari Allah?","opts":{"A":"Orang yang salat namun lalai dan riya","B":"Orang yang tidak berpuasa di bulan Ramadan","C":"Orang yang menolak membayar zakat","D":"Orang yang tidak melaksanakan haji"},"key":"A","exp":"Orang yang salat namun lalai dan riya Ayat ini menegur orang yang salat tetapi lalai dan riya, karena salat mereka tidak bermakna.","topic":"Fikih","ar":true},{"id":"P1-62","paket":1,"no":62,"type":"PG","q":"Dalam Islam, sedekah adalah amalan yang sangat dianjurkan dan dapat dilakukan kapan saja. Berbeda dengan zakat yang memiliki nisab dan haul, sedekah tidak terbatas jumlah maupun waktunya. Apa yang menjadi ciri utama dari sedekah dalam konteks sosial kemasyarakatan?","opts":{"A":"Pemberian wajib kepada fakir miskin","B":"Pemberian sukarela kepada siapa pun yang membutuhkan","C":"Pemberian rutin setiap bulan kepada mustahik","D":"Pemberian yang dilakukan hanya pada bulan Ramadan"},"key":"B","exp":"Pemberian sukarela kepada siapa pun yang membutuhkan Sedekah adalah pemberian sukarela tanpa batas waktu atau jumlah.","topic":"Fikih","ar":false},{"id":"P1-63","paket":1,"no":63,"type":"PG","q":"Setelah diturunkan ke bumi sebagai akibat dari pelanggaran terhadap larangan Allah di surga, Nabi Adam a.s. bersama Siti Hawa mengalami ujian pertama mereka sebagai manusia. Apa hikmah dari kisah penurunan tersebut dalam konteks keimanan dan ketakwaan?","opts":{"A":"Manusia bebas melakukan kesalahan tanpa taubat","B":"Manusia tidak bertanggung jawab atas perbuatannya","C":"Pentingnya tobat dan pengampunan dari Allah","D":"Malaikat tidak dapat memberi petunjuk kepada manusia"},"key":"C","exp":"Pentingnya tobat dan pengampunan dari Allah Kisah Nabi Adam mengajarkan pentingnya taubat dan memohon ampun kepada Allah.","topic":"Akidah","ar":false},{"id":"P1-64","paket":1,"no":64,"type":"PG","q":"Huruf \"ain (‫ \")ع‬dalam ilmu tajwid dan makharijul huruf termasuk huruf yang keluar dari tengah tenggorokan (wasathul-halq). Mengapa penting mengetahui tempat keluarnya huruf ini dalam membaca Al-Qur'an?","opts":{"A":"Agar lebih mudah memahami makna ayat","B":"Untuk memperlancar hafalan","C":"Untuk menghasilkan bacaan yang fasih dan sesuai tajwid","D":"Untuk mempercepat penyelesaian tilawah"},"key":"C","exp":"Untuk menghasilkan bacaan yang fasih dan sesuai tajwid Mengetahui makhraj huruf seperti \"ain\" memastikan bacaan Al-Qur'an sesuai tajwid.","topic":"BTQ","ar":true},{"id":"P1-65","paket":1,"no":65,"type":"PG","q":"Tayamum adalah bentuk rukhsah atau keringanan dalam Islam yang diberikan ketika tidak memungkinkan bersuci dengan air. Dalam pelaksanaannya, bagaimana langkah yang benar dalam melakukan tayamum agar sah digunakan untuk ibadah?","opts":{"A":"Menepuk debu ke wajah dan kedua telapak tangan","B":"Membasuh wajah dengan debu kering","C":"Mencuci tangan sampai siku","D":"Mengusap seluruh tubuh dengan debu"},"key":"A","exp":"Menepuk debu ke wajah dan kedua telapak tangan Tayamum dilakukan dengan menepuk debu ke wajah dan kedua telapak tangan.","topic":"Fikih","ar":false},{"id":"P1-66","paket":1,"no":66,"type":"PG","q":"Gelar \"Al-Faruq\" yang diberikan kepada Umar bin Khattab r.a. merupakan bentuk penghargaan atas ketegasan beliau dalam menegakkan kebenaran dan memisahkan antara haq dan batil. Dalam konteks sejarah, apa pengaruh terbesar dari kepemimpinan beliau terhadap umat Islam?","opts":{"A":"Penyusunan mushaf Al-Qur'an","B":"Penyebaran Islam ke luar Jazirah Arab","C":"Pembangunan sistem militer modern","D":"Pengumpulan hadis secara sistematis"},"key":"B","exp":"Penyebaran Islam ke luar Jazirah Arab Umar bin Khattab memperluas wilayah Islam hingga ke luar Jazirah Arab.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-67","paket":1,"no":67,"type":"PG","q":"Dalam Q.S. Al-Kafirun ayat 6, Allah menyatakan \"‫ين‬ َ َ ُْ ُ ُْ ‫ى‬ ِ ‫ \"لكم ِدينكم و ِ يل ِد‬sebagai bentuk sikap tegas terhadap perbedaan keyakinan. Ayat ini mengajarkan prinsip penting dalam kehidupan masyarakat majemuk. Prinsip yang dimaksud adalah...","opts":{"A":"Menghindari pergaulan dengan non-Muslim","B":"Menyembunyikan identitas keagamaan","C":"Toleransi dan penghormatan terhadap kepercayaan orang lain","D":"Tidak bekerja sama dengan orang berbeda agama"},"key":"C","exp":"Toleransi dan penghormatan terhadap kepercayaan orang lain Ayat \"ّ‫يّدين‬ َ ‫ \"لَك ْمّدينك ْم‬mengajarkan toleransi dalam perbedaan keyakinan. َ ‫ّول‬","topic":"Al-Qur’an & Hadis","ar":true},{"id":"P1-68","paket":1,"no":68,"type":"PG","q":"Lingkungan abiotik merupakan bagian dari ekosistem yang tidak hidup tetapi memiliki peran penting dalam mendukung kehidupan makhluk hidup. Mana dari pilihan berikut yang termasuk unsur abiotik dan mengapa unsur ini penting?","opts":{"A":"Air, cahaya matahari, udara - menunjang fotosintesis dan kehidupan","B":"Tumbuhan, pohon, dan hewan - bagian dari biotik","C":"Mikroorganisme - termasuk faktor biotik","D":"Manusia dan hewan - bagian dari ekosistem sosial"},"key":"A","exp":"Air, cahaya matahari, udara - menunjang fotosintesis dan kehidupan Unsur abiotik seperti air dan cahaya matahari penting untuk mendukung kehidupan.","topic":"Akhlak","ar":false},{"id":"P1-69","paket":1,"no":69,"type":"PG","q":"Dalam Islam, permintaan maaf tidak hanya tentang kata-kata tetapi juga menunjukkan ketulusan hati dan keinginan memperbaiki hubungan. Bagaimana ciri permintaan maaf yang mencerminkan akhlak mulia seorang Muslim?","opts":{"A":"Dibarengi dengan rasa penyesalan dan usaha memperbaiki kesalahan","B":"Diucapkan hanya jika diminta orang lain","C":"Dilakukan melalui perantara saja","D":"Disampaikan dengan rasa kesal ِّ َ ‫\"م ْن‬"},"key":"A","exp":"Dibarengi dengan rasa penyesalan dan usaha memperbaiki kesalahan Permintaan maaf yang tulus disertai penyesalan dan perbaikan.","topic":"Akhlak","ar":true},{"id":"P1-70","paket":1,"no":70,"type":"PG","q":"Dalam Q.S. Al-Falaq ayat 2, kalimat \"‫ش‬ ِ mengandung hukum bacaan nun sukun bertemu huruf syin. Berdasarkan ilmu tajwid, hukum bacaan tersebut dinamakan...","opts":{"A":"Idzhar halqi","B":"Ikhfa haqiqi","C":"Idgham bighunnah","D":"Iqlab"},"key":"B","exp":"Ikhfa haqiqi Nun sukun bertemu syin dalam \"ّ‫ \"م ْنّشَر‬dibaca ikhfa haqiqi (samar).","topic":"BTQ","ar":true},{"id":"P1-71","paket":1,"no":71,"type":"PG","q":"Puasa Ayyamul Bidh adalah puasa sunah yang dilakukan tiga hari setiap bulan hijriah. Apa hikmah dari pelaksanaan puasa ini secara rutin setiap bulan?","opts":{"A":"Membantu meningkatkan imun tubuh","B":"Menjaga pengendalian diri dan ketakwaan","C":"Menghapus dosa besar secara otomatis","D":"Menggantikan puasa Ramadan yang batal"},"key":"B","exp":"Menjaga pengendalian diri dan ketakwaan Puasa Ayyamul Bidh melatih pengendalian diri dan meningkatkan ketakwaan.","topic":"Fikih","ar":false},{"id":"P1-72","paket":1,"no":72,"type":"PG","q":"Dalam tajwid, huruf-huruf yang dibaca tipis (tarqiq) perlu diperhatikan agar tidak terjadi kesalahan pengucapan. Huruf \"ta\" termasuk dalam kategori...","opts":{"A":"Huruf isti'la (tebal)","B":"Huruf tarqiq (tipis)","C":"Huruf qalqalah","D":"Huruf tafkhim"},"key":"B","exp":"Huruf tarqiq (tipis) Huruf \"ta\" dibaca tipis (tarqiq) kecuali dalam kondisi tertentu.","topic":"BTQ","ar":false},{"id":"P1-73","paket":1,"no":73,"type":"PG","q":"Dalam fiqih, hukum haram merupakan larangan syar'i yang jika dilanggar akan mendapat dosa. Mengapa penting bagi seorang Muslim memahami batasan antara halal dan haram?","opts":{"A":"Agar bisa lebih bebas memilih ibadah","B":"Agar tidak melanggar hukum negara","C":"Agar hidupnya terarah sesuai syariat","D":"Agar tidak perlu bertanya kepada ulama"},"key":"C","exp":"Agar hidupnya terarah sesuai syariat Memahami halal dan haram membantu Muslim hidup sesuai syariat.","topic":"Fikih","ar":false},{"id":"P1-74","paket":1,"no":74,"type":"PG","q":"Menjaga lingkungan adalah bagian dari tanggung jawab seorang Muslim sebagai khalifah di bumi. Apa dampak positif dari upaya pelestarian lingkungan hidup dalam jangka panjang?","opts":{"A":"Keseimbangan ekosistem dan keberlanjutan hidup","B":"Meningkatkan konsumsi bahan kimia","C":"Mengurangi aktivitas pertanian","D":"Menurunkan jumlah penduduk"},"key":"A","exp":"Keseimbangan ekosistem dan keberlanjutan hidup Pelestarian lingkungan menjaga keseimbangan ekosistem untuk kehidupan.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-75","paket":1,"no":75,"type":"PG","q":"Al-Samad dalam Asmaul Husna menunjukkan bahwa Allah adalah tempat bergantung segala makhluk. Bagaimana sikap seorang hamba terhadap Allah dengan memahami makna ini?","opts":{"A":"Mengandalkan diri sendiri dalam segala urusan","B":"Bergantung pada sesama manusia dalam kesulitan","C":"Selalu berserah diri kepada Allah dalam setiap keadaan","D":"Beribadah hanya saat mendapat nikmat"},"key":"C","exp":"Selalu berserah diri kepada Allah dalam setiap keadaan Memahami Al-Samad berarti bergantung sepenuhnya kepada Allah.","topic":"BTQ","ar":false},{"id":"P1-76","paket":1,"no":76,"type":"PG","q":"Dalam Q.S. Al-Baqarah ayat 30, Allah menjelaskan penciptaan Nabi Adam sebagai khalifah di bumi. Apa konsekuensi dari kedudukan ini bagi seluruh keturunan Adam?","opts":{"A":"Mereka bebas berbuat apa saja","B":"Mereka harus menjaga bumi dengan adil dan bertanggung jawab","C":"Mereka tidak boleh tinggal di bumi","D":"Mereka wajib menjadi nabi dan rasul"},"key":"B","exp":"Mereka harus menjaga bumi dengan adil dan bertanggung jawab Sebagai khalifah, manusia bertanggung jawab menjaga bumi.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-77","paket":1,"no":77,"type":"PG","q":"Rukun puasa merupakan syarat sahnya ibadah puasa baik fardhu maupun sunah. Salah satu rukun tersebut adalah niat. Kapan niat puasa sunah boleh dilafalkan agar ibadahnya sah?","opts":{"A":"Sebelum waktu subuh atau sebelum tergelincir matahari jika belum makan","B":"Sesudah berbuka puasa","C":"Setelah salat Zuhur","D":"Sebelum tidur malam"},"key":"A","exp":"Sebelum waktu subuh atau sebelum tergelincir matahari jika belum makan Niat puasa sunah dilakukan sebelum subuh atau sebelum zuhur jika belum makan.","topic":"Fikih","ar":false},{"id":"P1-78","paket":1,"no":78,"type":"PG","q":"Dalam Islam, pemberian hadiah atau hibah sangat dianjurkan untuk mempererat silaturahmi dan menciptakan kasih sayang. Apa bentuk keutamaan dari pemberian hadiah dalam kehidupan sosial?","opts":{"A":"Menunjukkan status sosial seseorang","B":"Meningkatkan kecemburuan","C":"Membangun hubungan yang harmonis dan saling menyayangi","D":"Menghindari pembayaran zakat"},"key":"C","exp":"Membangun hubungan yang harmonis dan saling menyayangi Hadiah mempererat silaturahmi dan menciptakan kasih sayang.","topic":"Fikih","ar":false},{"id":"P1-79","paket":1,"no":79,"type":"PG","q":"Tanda tasydid ( ّ ) dalam penulisan Arab menunjukkan bahwa huruf dibaca dengan penekanan atau dobel. Dalam membaca Al-Qur'an, mengapa penting memperhatikan tasydid?","opts":{"A":"Agar tidak salah dalam tajwid dan makna ayat","B":"Agar bacaan menjadi lebih cepat","C":"Untuk mengganti panjang pendek huruf","D":"Untuk memperindah tulisan kaligrafi"},"key":"A","exp":"Agar tidak salah dalam tajwid dan makna ayat Tasydid penting untuk menjaga kebenaran tajwid dan makna.","topic":"BTQ","ar":true},{"id":"P1-80","paket":1,"no":80,"type":"PG","q":"Menjaga kebersihan diri tidak hanya memberikan manfaat fisik tetapi juga bernilai ibadah. Bagaimana hubungan antara kebersihan diri dan keimanan dalam pandangan Islam?","opts":{"A":"Kebersihan hanya penting saat salat","B":"Kebersihan mencerminkan keimanan dan kesadaran spiritual","C":"Kebersihan hanya urusan pribadi","D":"Kebersihan tidak ada kaitan dengan ibadah"},"key":"B","exp":"Kebersihan mencerminkan keimanan dan kesadaran spiritual Kebersihan adalah bagian dari iman dan mencerminkan kesadaran spiritual.","topic":"Akhlak","ar":false},{"id":"P1-81","paket":1,"no":81,"type":"PG","q":"Angkatan laut Islam pertama dibentuk oleh Khalifah yang dikenal memperluas wilayah kekuasaan Islam melalui jalur laut, terutama ke Siprus dan wilayah Bizantium. Hal ini menunjukkan pentingnya strategi maritim dalam dakwah dan pertahanan. Siapakah khalifah tersebut?","opts":{"A":"Khalifah Abu Bakar","B":"Khalifah Umar bin Khattab","C":"Khalifah Utsman bin Affan","D":"Khalifah Ali bin Abi Talib"},"key":"C","exp":"Khalifah Utsman bin Affan Utsman bin Affan membentuk angkatan laut Islam pertama.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-83","paket":1,"no":83,"type":"PG","q":"\"‫ٱس ِم رربك ٱل ِذي خلق‬ ْ ِ Hukum tajwid pada kata \"ِ‫ق‬ َ َ‫ \" َخل‬adalah...","opts":{"A":"Qolqolah","B":"Ikhfa syafawi","C":"Izhar syafawi","D":"Idgham bighunnah"},"key":"A","exp":"Qolqolah Huruf qaf (‫ )ق‬dalam \"َّ‫ \" َخلَق‬dibaca dengan qalqalah.","topic":"BTQ","ar":true},{"id":"P1-84","paket":1,"no":84,"type":"PG","q":"Amal jariah merupakan sedekah berkelanjutan yang pahalanya terus mengalir, seperti membangun sekolah, sumur, atau menyebarkan ilmu yang bermanfaat. Jariah berarti...","opts":{"A":"Pemberian kepada 8 golongan mustahik","B":"Pemberian untuk kepentingan umum","C":"Pemberian tanpa imbalan untuk hubungan baik","D":"Pemberian untuk haji"},"key":"B","exp":"Pemberian untuk kepentingan umum Amal jariah adalah pemberian yang manfaatnya berkelanjutan untuk umum.","topic":"Fikih","ar":false},{"id":"P1-85","paket":1,"no":85,"type":"PG","q":"Nabi Adam a.s. dan Hawa dipertemukan kembali di sebuah tempat yang kini dikenal dengan Jabal Rahmah setelah terpisah pasca turunnya ke bumi. Peristiwa ini menjadi simbol rahmat dan kasih sayang Allah. Apa yang terjadi di Jabal Rahmah?","opts":{"A":"Memakan buah khuldi","B":"Berpisah dengan Hawa","C":"Dipertemukan kembali dengan Hawa","D":"Menolak perintah Allah"},"key":"C","exp":"Dipertemukan kembali dengan Hawa Nabi Adam dan Hawa dipertemukan kembali di Jabal Rahmah.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P1-86","paket":1,"no":86,"type":"PG","q":"Dalam ilmu tajwid, huruf \"mim\" merupakan salah satu huruf syafawi karena makhraj- nya keluar dari...","opts":{"A":"Tenggorokan","B":"Lidah","C":"Bibir","D":"Hidung"},"key":"C","exp":"Bibir Huruf \"mim\" keluar dari bibir (huruf syafawi).","topic":"BTQ","ar":false},{"id":"P paket":4,"no":7,"type":"PG","q":"Allah SWT menciptakan manusia dari suku, bangsa, ras dan tradisi yang berbeda-beda agar manusia saling mengenal. Perbedaan tersebut bukanlah suatu masalah yang dapat menimbulkan pertikaian jika kita mengedepankan sikap ... .","opts":{"A":"Tasamuh","B":"Egois","C":"Takabur","D":"Qanaah"},"key":"A","exp":"Sikap tasamuh (toleransi) diperlukan untuk mencegah pertikaian akibat perbedaan suku, bangsa, dan tradisi.","topic":"Akhlak","ar":false},{"id":"P4-9","paket":4,"no":9,"type":"PG","q":"Perhatikan pernyataan di bawah ini! 1. Huruf lam dibaca jelas 2. Huruf lam tidak terbaca (hilang suaranya) 3. Di atas huruf lam terdapat tanda baca sukun 4. Di atas huruf lam terdapat tanda baca tasydid Ciri-ciri bacaan Idgam Syamsiyah ditujukan nomor ... .","opts":{"A":"1 dan 2","B":"2 dan 3","C":"3 dan 4","D":"2 dan 4"},"key":"B","exp":"Ciri Idgham Syamsiyah adalah huruf lam tidak terbaca dan memiliki tanda sukun.","topic":"BTQ","ar":false},{"id":"P4-11","paket":4,"no":11,"type":"PG","q":"Allah SWT menciptakan manusia dari suku, ras,dan golongan yang berbeda beda agar manusia saling mengenal. Agar tercipta kerukunan dan kedamaian maka perlu mengedepankan sikap ... .","opts":{"A":"Tasamuh","B":"Egois","C":"Takabur","D":"Sombong"},"key":"A","exp":"Tasamuh (toleransi) diperlukan untuk menciptakan kerukunan di tengah perbedaan suku dan ras.","topic":"Akhlak","ar":false},{"id":"P4-12","paket":4,"no":12,"type":"PG","q":"Perhatikan sikap terpuji berikut ini! 1) Tidak menganjurkan memberi makan orang miskin 2) Mencintai dan menyayangi anak yatim 3) Menghindari perbuatan riya' yang mempertontonkan amal perbuatan baik 4) Lalai terhadap kewajiban salat Pernyataan diatas yang menunjukan pengamalan perilaku terpuji sesuai dengan Surah al-Ma’un ditunjukan nomor … .","opts":{"A":"1) dan 2)","B":"1) dan 3)","C":"2) dan 3)","D":"3) dan 4)"},"key":"C","exp":"Perilaku terpuji sesuai Surah al-Ma’un adalah mencintai anak yatim dan menghindari riya’.","topic":"Fikih","ar":false},{"id":"P4-13","paket":4,"no":13,"type":"PG","q":"Rasulullah SAW adalah manusia yang paling baik akhlaknya. Beliau sangat memperhatikan anak- anak yatim dan beliau juga memerintahkan kepada kita untuk selalu berbuat baik terhadap anak yatim, bahkan Rasulullah menggambarkan kedekatan dengan orang yang menyantuni anak yatim seperti ... .","opts":{"A":"dua bukit","B":"pagi dan malam","C":"Makkah dan Madinah","D":"jari tengah dan jari telunjuk"},"key":"D","exp":"Rasulullah menggambarkan kedekatan dengan penyantun anak yatim seperti jari tengah dan telunjuk.","topic":"Akhlak","ar":false},{"id":"P4-15","paket":4,"no":15,"type":"BS","q":"Ketika proses kiamat kelak semua manusia akan dimatikan pada tiupan Malaikat Israfil. Lalu, Allah SWT akan membangkitkannya lagi pada hari yang disebut Yaumul Ba’ats. Dari pernyataan tersebut Allah SWT bisa disebut sebagai Al-Ba’ats yang artinya Maha Mematikan, yaitu ... .","opts":{"A":"Benar","B":"Salah"},"key":"B","exp":"Allah disebut Al-Ba’ats karena Maha Membangkitkan manusia pada Yaumul Ba’ats.","topic":"Akidah","ar":false},{"id":"P4-16","paket":4,"no":16,"type":"PG","q":"Ahmad selalu mewakili kelasnya untuk menjadi pemimpin upacara pada hari Senin dan peringatan hari besar lainnya. Ahmad memiliki fisik yang kuat karena sering berolahraga dan makan makanan sehat. Sikap Ahmad yang berusaha memiliki fisik yang kuat merupakan wujud teladan pada sifat Allah SWT, yaitu ... .","opts":{"A":"al-Qayyum","B":"al-Qawiyyu","C":"al-Mumit","D":"al-Hayyu"},"key":"B","exp":"Sikap Ahmad menjaga fisik yang kuat mencerminkan teladan sifat Allah al-Qawiyyu.","topic":"BTQ","ar":false},{"id":"P4-17","paket":4,"no":17,"type":"PG","q":"Perhatikan pernyataan berikut! (1) Memperkuat hawa nafsu (2) Selalu mengingat kematian (3) Membiasakan diri untuk berolahraga (4) Memperbanyak amal kebaikan yang dilandasi keridhoan dari Allah SWT Perilaku mengimani Asmaul Husna al-Mumit ditunjukan oleh nomor ... .","opts":{"A":"(1) dan (2)","B":"(2) dan (3)","C":"(2) dan (4)","D":"(3) dan (4)"},"key":"C","exp":"Mengimani al-Mumit ditunjukkan dengan mengingat kematian dan memperbanyak amal kebaikan.","topic":"Akidah","ar":false},{"id":"P4-19","paket":4,"no":19,"type":"PG","q":"Penerimaan zakat fitrah adalah delapan mustahiq yang telah ditentukan dalam Al-Qur'an, tetapi sangat diutamakan untuk fakir miskin, pernyataan tersebut sangat tepat karena ... .","opts":{"A":"Muzaki boleh memilih siapa saja yang ada dalam delapan golongan","B":"Fakir miskin lebih membutuhkan pada hari yang bahagia","C":"Manusia memiliki simpati dan empati kepada orang lain","D":"Hanya Orang fakir yang paling tepat mendapatkan zakat"},"key":"B","exp":"Fakir miskin diutamakan menerima zakat fitrah karena lebih membutuhkan pada hari raya.","topic":"Fikih","ar":false},{"id":"P4-20","paket":4,"no":20,"type":"PG","q":"Arkan memberikan sesuatu barang yang berharga untuk Aman. Arkan memberikan barang tersebut karena Aman menjadi siswa yang paling rajin dan paling jujur dalam kelas. Karena itu Aman perlu mendapatkan perhargaan. Pemberian tersebut termasuk ... .","opts":{"A":"zakat mal","B":"zakat fitrah","C":"sedekah","D":"hadiah"},"key":"D","exp":"Pemberian barang kepada Aman karena prestasinya termasuk hadiah, bukan zakat atau sedekah.","topic":"Akhlak","ar":false},{"id":"P4-21","paket":4,"no":21,"type":"PG","q":"Allah Swt menciptakan manusia ada yang berkecukupan dan kekurangan. Allah mengamanatkan kepada mereka yang berkecukupan untuk menolong orang-orang yang membutuhkan. Sehingga mereka menjadi kuat dan termotivasi untuk bangkit. Berdasarkan diskripsi di atas, maka hikmah sedekah dan infaq adalah ... .","opts":{"A":"menambah pahala yang berlipat","B":"menolak bencana dan musibah","C":"menolong orang yang lemah","D":"menghapus penyakit kikir"},"key":"C","exp":"Hikmah sedekah dan infaq adalah menolong orang yang lemah agar kuat dan termotivasi.","topic":"Fikih","ar":false},{"id":"P4-22","paket":4,"no":22,"type":"PG","q":"Rukun Iman adalah pondasi keimanan dari seorang muslim. Semua umat muslim harus mengamalkan rukun iman. Dengan mengaalkannya maka sesorang akan memiliki keimanan yang kuat. Jika seseorang mengabaikan atau tidak mengamalkan rukun iman, maka akan dengan mudah diguncang hatinya dengan berbagai masalah dan kegelisahan dalam keimanan. Rukun iman ada 6 yang harus diyakini dan memiliki urutan yang tetap yaitu ... .","opts":{"A":"Iman kepada: Allah, Malaikat, Kitab, Hari Kiamat, Rasul, Qada dan Qadar","B":"Iman kepada: Allah, Malaikat, Kitab, Rasul, Hari Kiamat, Qada dan Qadar","C":"Iman kepada: Allah, Kitab, Malaikat, Rasul, Hari Kiamat, Qada dan Qadar","D":"Iman kepada : Allah, Rosul, Malaikat, Kitab, Hari Kiamat, Qada dan Qadar"},"key":"B","exp":"Urutan rukun iman yang benar adalah iman kepada Allah, Malaikat, Kitab, Rasul, Hari Kiamat, Qada dan Qadar.","topic":"Akidah","ar":false},{"id":"P4-23","paket":4,"no":23,"type":"PG","q":"Hewan yang membuat sarang di depan pintu gua tempat sembunyi Nabi Muhammad SAW ketika hijrah adalah....","opts":{"A":"kelelawar","B":"laba-laba","C":"lebah","D":"burung"},"key":"B","exp":"Laba-laba membuat sarang di depan gua tempat Nabi Muhammad bersembunyi saat hijrah.","topic":"BTQ","ar":false},{"id":"P4-24","paket":4,"no":24,"type":"PG","q":"Orang-orang muslim yang hijrah dari Makkah disambut baik oleh orang-orang penduduk Madinah. Orang-orang penduduk Madinah yang menyambut baik orang-orang muslim yang hijrah disebut kaum ... .","opts":{"A":"Ansar","B":"Kafilah","C":"Saudagar","D":"Muhajirin"},"key":"A","exp":"Penduduk Madinah yang menyambut kaum Muhajirin disebut kaum Ansar.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P4-25","paket":4,"no":25,"type":"PG","q":"Seseorang harus dapat memberi segala yang dimiliki untuk mencapai cita-cita Islam dan juga tidak menanti imbalan atas perjuangan tersebut. Sikap yang berkaitan adalah ... .","opts":{"A":"ikhlas dan rela berkorban","B":"ulet dan percaya diri","C":"jujur dan pekerja keras","D":"mandiri dan teguh pendirian"},"key":"A","exp":"Sikap ikhlas dan rela berkorban mencerminkan perjuangan untuk cita-cita Islam tanpa mengharap imbalan.","topic":"Akhlak","ar":false},{"id":"P4-26","paket":4,"no":26,"type":"PG","q":"Dalam ajaran Islam, jumlah malaikat yang wajib kita yakini dan ketahui tugasnya ada 10. Nama panggilan lain Al Qudus adalah malaikat ... .","opts":{"A":"Israfil","B":"Jibril","C":"Malik","D":"Ridwan"},"key":"B","exp":"Nama lain Al-Quddus adalah malaikat Jibril.","topic":"Akidah","ar":false},{"id":"P4-27","paket":4,"no":27,"type":"PG","q":"Hani sangat suka makan. Namun orang tuanya mengajaknya berpuasa sunnah hari Senin untuk melatihnya menahan hawa nafsu. Walaupun Hani sedang sendirian di dapur dan di meja banyak makanan dan minuman, Hani tetap berusaha untuk tidak membatalkan puasanya karena dia tahu bahwa semua amal perbuatannya akan dicatat oleh Allah Swt. Sikap Hani adalah cerminan dari Iman kepada Malaikat... .","opts":{"A":"Jibril dan Mikail","B":"Munkar dan Nakir","C":"Rakib dan Atid","D":"Mikail dan Ridwan"},"key":"C","exp":"Sikap Hani menjaga puasa mencerminkan iman kepada malaikat Rakib dan Atid yang mencatat amal.","topic":"Akidah","ar":false},{"id":"P4-28","paket":4,"no":28,"type":"PG","q":"Dalam sejarah, firman Allah SWT. ditulis dengan dua bentuk berupa suhuf dan mushaf. Keduanya berasal dari akar kalimat yang sama, yaitu sahafa (menulis). Akan tetapi terdapat kesamaan dan perbedaan diantara keduanya. Perbedaanya yaitu ... .","opts":{"A":"Isi kitab lebih lengkap daripada isi suhuf, kitab dibukukan sedangkan suhuf tidak dibukukan","B":"Kitab dan suhuf sama-sama wahyu dari Allah","C":"kitab Allah berfungsi untuk menuntun manusia dalam meyakini Allah swt","D":"Isi suhuf lebih lengkap dari pada isi kitab, suhuf dibukukan sedangkan kitab tidak dibukukan"},"key":"A","exp":"Kitab lebih lengkap dan dibukukan, sedangkan suhuf tidak dibukukan.","topic":"Akidah","ar":false},{"id":"P4-29","paket":4,"no":29,"type":"PG","q":"Para rasul pilihan yang diutus oleh Allah SWT mempunyai sifat wajib dan sifat mustahil yang dapat dilihat dalam kepribadian mereka pada saat menjalankan tugas yang istimewa tersebut. Mustahil jika rasul menyembunyikan kebenaran. Setiap firman yang rasul terima dari Allah SWT pasti akan disampaikan kepada para umatnya. Sifat mustahil tersebut yaitu ... .","opts":{"A":"Baladah","B":"Kidzib","C":"Kitman","D":"Khianat"},"key":"C","exp":"Sifat mustahil rasul menyembunyikan kebenaran disebut kitman.","topic":"Akidah","ar":false},{"id":"P4-30","paket":4,"no":30,"type":"PG","q":"Wahyu yang disampaikan melalui perantara malaikat Jibril dengan proses yang tidak mudah, namun para rasul senantiasa menyampaikannya tanpa mengurangi satu huruf pun sesuai dengan surah Al Maidah ayat 67. Sifat wajib bagi para rasul yang memiliki makna sesuai narasi bernama ... .","opts":{"A":"Amanah","B":"Fatanah","C":"Siddiq","D":"Tablig"},"key":"D","exp":"Sifat wajib rasul menyampaikan wahyu secara utuh disebut tabligh.","topic":"Akidah","ar":false},{"id":"P4-31","paket":4,"no":31,"type":"PG","q":"Air yang boleh untuk bersuci adalah air yang suci dan mensucikan, dibawah ini yang termasuk air yang suci dan mensucikan adalah … .","opts":{"A":"Air laut, air hujan dan air teh","B":"Air danau, air mata air dan air embun","C":"Air sungai, air salju dan air kelapa","D":"Air sumur, air hujan dan air lemon"},"key":"B","exp":"Air suci dan mensucikan meliputi air danau, air mata air, dan air embun.","topic":"Fikih","ar":false},{"id":"P4-32","paket":4,"no":32,"type":"PG","q":"Ketika akan shalat, Aldi kebingungan mencari air karen kran toilet tidak menyala. Dia sebab dia sedang dalam perjalan naik kereta dan keretanya tidak berhenti, padahal waktu shalat sudah hampir habis, maka Aldi dapat bersuci dengan menggunakan debu, yang disebut … .","opts":{"A":"Berwudu","B":"Bertoharah","C":"Bertayamum","D":"Mandi"},"key":"C","exp":"Aldi dapat bersuci dengan tayamum menggunakan debu saat tidak ada air.","topic":"Fikih","ar":false},{"id":"P4-33","paket":4,"no":33,"type":"PG","q":"Perhatikan pernyataan dibawah ini! 1. Masuk Waktu Sholat 2. Islam 3. Suci dari hadats besar dan kecil 4. Berakal 5. Suci badan, tempat dan pakaian 6. Baligh 7. Menutup aurat 8. Menghadap kiblat Syarat wajib salat ditujukan nomor … .","opts":{"A":"1,2, dan 3","B":"2,4 dan 6","C":"4,6 dan 8","D":"5,7 dan 8"},"key":"B","exp":"Syarat wajib salat adalah Islam, berakal, dan baligh.","topic":"Fikih","ar":false},{"id":"P4-34","paket":4,"no":34,"type":"PG","q":"Perhatikan beberapa pernyataan dibawah ini ! 1. Ta’biratul ihram, sidakep, ruku dan i’tidal 2. Membaca surah Al Fatihah, i’tidal, sujud dan duduk iftirosy 3. Ta’biratul ihram, membaca surah Al Fatihah, duduk tawaruk dan membaca doa tasyahud 4. Ruku’, sujud, membaca doa duduk antara dua sujud dan membca doa terhindar dari siksa neraka 5. Sujud, duduk tawaruk, membaca solawat nabi dan salam pertama Dari pernyataan diatas, yang merupakan rukun shalat, ditunjukkan pada nomor … .","opts":{"A":"1 dan 3","B":"2 dan 4","C":"3 dan 5","D":"4 dan 5"},"key":"C","exp":"Rukun shalat meliputi takbiratul ihram, membaca Al-Fatihah, duduk tawaruk, dan tasyahud.","topic":"Akidah","ar":false},{"id":"P4-35","paket":4,"no":35,"type":"PG","q":"Perhatikan pernyataan dibawah ini! 1. Makan, minum, buang angin, buang air kecil 2. Makan, minum, berbicara, berger-gerak tanpa sebab 3. Buang air besar, buang angin, berbicara, bergerak-gerak tanpa sebab 4. Buang air kecil, buang angin, menangis, makan Dari pernyataan diatas hal-hal yang dapat membatalkan shalat, ditunjukkan pada nomor … .","opts":{"A":"1","B":"2","C":"3","D":"4"},"key":"C","exp":"Hal yang membatalkan shalat adalah buang air besar, buang angin, berbicara, dan bergerak tanpa sebab.","topic":"Fikih","ar":false},{"id":"P4-36","paket":4,"no":36,"type":"PG","q":"Puasa dibulan Ramahan adalah termasuk salah satu dari empat rukun Islam yang harus dilakukan sebagai umat Islam, sebagai perbuatan menahan rasa lapar dan haus dan agar selalu lebih dekat kepada Allah dan meningkatkan kesalehan. Rukun puasa ada 2 macam, yaitu …","opts":{"A":"Niat pada malam harinya dan menahan makan dan minum dari terbit fajar sampai tenggelam matahari","B":"Beragama Islam dan suci dari hadas besar dan kecil","C":"Sudah masuk waktu berpuasa dan dewasa / baligh","D":"Niat pada malam harinya dan menyegerakan berbuka"},"key":"A","exp":"Rukun puasa adalah niat pada malam hari dan menahan makan-minum dari fajar hingga matahari terbenam.","topic":"Fikih","ar":false},{"id":"P4-37","paket":4,"no":37,"type":"PG","q":"“Bagi setiap umat telah kami syariatkan penyembelihan (kurban) agar mereka menyebut Nama Allah atas binatang ternak yang dianugrahkan-Nya kepada mereka. Tuhanmu ialah Tuhan Yang Maha Esa, maka berserahdirilahkepada-Nya. Sampaikanlah (Nabi Muhammad) kabar gembira kepada orang-orang yang rendah hari lagi taat (kepada Allah).” Dalil yang menguatkan hukum kurban adalah firman Allah swt dalan surah … .","opts":{"A":"QS. Al Hajj (22) : 24","B":"QS. Al Hajj (22) : 34","C":"QS. Al Hajj (22) : 43","D":"QS. Al Hajj (22) : 44"},"key":"B","exp":"Dal hukum kurban terdapat dalam QS. Al-Hajj (22): 34.","topic":"Akidah","ar":false},{"id":"P4-38","paket":4,"no":38,"type":"PG","q":"Perhatikan pernyataan berikut ! 1) Islam 2) Baligh 3) Berakal 4) Kekurangan harta 5) Kelebihan harta Pernyataan diatas yang termasuk syarat berkurban ditunjukan nomor … .","opts":{"A":"1),2),3),4)","B":"1),2),3),5)","C":"2),3),4),5)","D":"1),3),4),5)"},"key":"B","exp":"Syarat berkurban adalah Islam, baligh, berakal, dan memiliki kelebihan harta.","topic":"Fikih","ar":false},{"id":"P4-39","paket":4,"no":39,"type":"PG","q":"Ahmad seorang pemuda miskin dan berpenyakit kulit. Karena penyakitnya itu tubuhnya menjadi belang-belang. Ibunya seorang tua lumpuh. Ahmad senantiasa merawat dan memenuhi semua permintaan ibunya, hanya satu permintaan yang sulit ia kabulkan, yaitu ibunya ingin mengerjakan ibadah haji Ahmad berusaha memenuhinya. Berdasarkan kisah tersebut menunjukan perilaku kepada orang tuanya yaitu... .","opts":{"A":"simpati","B":"hormat","C":"patuh","D":"santun"},"key":"C","exp":"Perilaku Ahmad merawat dan memenuhi permintaan ibunya menunjukkan sikap patuh.","topic":"BTQ","ar":false},{"id":"P4-40","paket":4,"no":40,"type":"PG","q":"Perhatikan pernyataan dibawah ini! 1) Arsya membiarkan temannya melaksanakan ibadahnya sesuai dengan agamanya 2) Rahma mengajak orang lain yang sudah bergama agar pindah keagamanya dengan cara paksa 3) Anin menyadari beragama Islam itu hidayah. Maka ia tidak memaksakan orang lain untuk beragama dengannya 4) Herman menerima ibadah agama lain kedalam agamanya agar timbul kesatuan agama Perilaku yang paling tepat dengan toleransi adalah... .","opts":{"A":"4) dan 3)","B":"3) dan 2)","C":"2) dan 1)","D":"1) dan 3)"},"key":"D","exp":"Toleransi tercermin pada sikap Arsya dan Anin yang menghormati ibadah agama lain.","topic":"Akhlak","ar":false},{"id":"P4-41","paket":4,"no":41,"type":"PG","q":"Abu Bakar diberikan nama oleh Nabi Muhammad Saw. setelah ia masuk Islam. Abu Bakar tanpa ragu untuk memeluk Islam setelah ia mendengar cerita langsung bahwa Rasulullah Saw telah menerima wahyu dari Allah Swt. Sehingga ia juga termasuk dari As-Sabiqunal Awwalun yang berarti … .","opts":{"A":"golongan orang yang taat","B":"golongan yang pertama menolak Islam","C":"golongan orang yang pemberani","D":"golongan orang yang pertama kali masuk Islam"},"key":"D","exp":"As-Sabiqunal Awwalun adalah golongan orang yang pertama kali masuk Islam, seperti Abu Bakar.","topic":"BTQ","ar":false},{"id":"P4-42","paket":4,"no":42,"type":"PG","q":"Merasa sangat tidak enak hati seperti hina atau segan melakukan sesuatu karena ada rasa hormat, agak takut, kepada pihak lain atau dengan kata lain sifat yang mendorong seseorang merasa tidak enak apabila meninggalkan kewajiban-kewajiabannya sebagai hamba Allah Swt dan meninggalkan larangan-larangan-Nya disebut ... .","opts":{"A":"malu","B":"rendah diri","C":"simpati","D":"empati"},"key":"A","exp":"Sifat malu mendorong seseorang merasa , obat-obatan dan lain-lain. Ringkasan cerita di atas membutuhkan sikap … .","opts":{"A":"rendah hati","B":"sederhana","C":"simpatik","D":"toleransi"},"key":"C","exp":"Korban bencana membutuhkan sikap simpatik berupa bantuan pakaian, makanan, dan obat- obatan.","topic":"Akhlak","ar":false},{"id":"P4-46","paket":4,"no":46,"type":"PG","q":"Saat ini, beberapa jenis spesies hewan, seperti singa, gajah, ikan paus dll telah mengalami penurunan jumlah populasinya, bahkan sudah sangat langka untuk dijumpai dan yang lebih menyedihkan sudah banyak hewan yang punah dari muka bumi ini. Menurut kalian apa yang harus kita lakukan adalah … .","opts":{"A":"membiarkan kepunahan terjadi","B":"menangkap untuk dipelihara","C":"melestarikan","D":"memburu untuk diambil manfaatnya"},"key":"C","exp":"Untuk mencegah kepunahan hewan, kita harus melestarikannya.","topic":"Akhlak","ar":false},{"id":"P4-47","paket":4,"no":47,"type":"PG","q":"Memiliki berbudi luhur yang tinggi. Seseorang yang memiliki akhlak terpuji ini, memiliki jiwa kesatria di mana ia akan membela kebenaran. Selain itu, berbudi luhur yang tinggi ditunjukkan dengan tidak mudah putus asa sebelum mencapai tujuan yang dikehendakinya. Tingkah laku yang termasuk ke dalam akhlak terpuji dari narasi diatas yaitu ... .","opts":{"A":"Al Muru’ah","B":"Al ‘Awfu","C":"Al Hilmu","D":"Al Amanah"},"key":"A","exp":"Akhlak terpuji berbudi luhur yang membela kebenaran disebut al-Muru’ah.","topic":"Akhlak","ar":false},{"id":"P4-48","paket":4,"no":48,"type":"PG","q":"Kehalifahan Islam pertama setelah masa khulafaur rasyidin yang memerintah di Jazirah Arab dan sekitarnya (beribu kota di Damaskus). Nama dinasti ini merujuk kepada Ummayah bin’Abd asy- Syams, kakek buyut dari khalifah pertama Dinasti Umayyah, yaitu Muawiyah bin Abu Sufyan atau disebut juga dengan Muawiyah I. Dinasti tersebut didirikan pada tahun ... .","opts":{"A":"40 H / 661 M","B":"41 H / 662 M","C":"H / 663 M","D":"H / 664 M"},"key":"A","exp":"Dinasti Umayyah didirikan pada tahun i"},"key":"B","exp":"Piagam Madinah adalah konstitusi yang dibuat Nabi Muhammad untuk menjaga kedamaian antar kelompok di Madinah.","topic":"BTQ","ar":false},{"id":"P5-9","paket":5,"no":9,"type":"PG","q":"Rasulullah saw hijrah ke Madinah bersama sahabat-sahabatnya yang disebut kaum muhajirin. Sesampainya di Madinah, Nabi Muhammad mempersaudarakan Kaum Muhajirin dengan Kaum Anshar. Anshar artinya…..","opts":{"A":"Penolong","B":"Peminta","C":"Penerima","D":"Pemberi"},"key":"A","exp":"Anshar berarti \"penolong,\" merujuk pada penduduk Madinah yang mendukung Muhajirin.","topic":"BTQ","ar":false},{"id":"P5-10","paket":5,"no":10,"type":"PG","q":"Bagaimana pemahaman tentang Asmaul Husna \"Al-Qayyum\" dapat membantu seseorang dalam memelihara amal soleh secara konsisten/terus menerus?","opts":{"A":"Mengajak untuk berperilaku sembarangan dalam amal soleh","B":"Menyadarkan pentingnya konsistensi dalam amal soleh","C":"Tidak ada hubungan antara \"Al-Qayyum\" dan amal soleh","D":"Membuat seseorang lebih memilih untuk tidak melakukan amal soleh."},"key":"B","exp":"Memahami Al-Qayyum (Yang Maha Mandiri) mendorong konsistensi dalam amal soleh.","topic":"Akidah","ar":false},{"id":"P5-12","paket":5,"no":12,"type":"PG","q":"Ketika seseorang menyadari bahwa manusia adalah khalifah, apa yang seharusnya menjadi tanggung jawab mereka terhadap lingkungan?","opts":{"A":"Merusak dan mencemari lingkungan sebanyak mungkin.","B":"Mengabaikan lingkungan karena tidak penting.","C":"Membiarkan lingkungan mengurus dirinya sendiri.","D":"Melindungi dan merawat lingkungan agar tetap sehat dan indah."},"key":"D","exp":"Sebagai khalifah, manusia bertanggung jawab melindungi dan merawat lingkungan.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P5-13","paket":5,"no":13,"type":"PG","q":"Di sebuah desa kecil, ada seorang anak muda bernama Ali. Ali selalu berusaha untuk mandiri dalam kehidupannya sejak usia dini. Ia selalu ingin melakukan segalanya sendiri tanpa terlalu bergantung pada bantuan orang lain. Apa manfaat dari sikap Ali tersebut?","opts":{"A":"Ali cenderung tidak memiliki teman karena ia selalu ingin berdiri sendiri.","B":"Ali dapat memotivasi teman-temannya untuk juga menjadi mandiri.","C":"Ali selalu bergantung pada teman-temannya untuk melakukan hal-hal kecil.","D":"Ali tidak peduli dengan pendapat teman-temannya Created & Published by: www.ubaygurupai.blogspot.com 3"},"key":"B","exp":"Kemandirian Ali memotivasi teman-temannya untuk mandiri.","topic":"Akhlak","ar":false},{"id":"P5-14","paket":5,"no":14,"type":"PG","q":"Rani adalah seorang siswa yang sangat pintar di kelasnya. Hari ini, Rani dan teman-temannya memiliki perbedaan pendapat tentang cara menyelesaikan masalah matematika. Apa yang harus Rani lakukan?","opts":{"A":"Memaksa teman-temannya untuk mengikuti pendapatnya.","B":"Menghindari teman-temannya karena tidak setuju dengan pendapatnya.","C":"Meninggalkan teman-temannya untuk mencari jawaban sendiri.","D":"Mendengarkan pendapat teman-temannya dan mencari solusi bersama-sama."},"key":"D","exp":"Rani harus mendengarkan pendapat teman dan mencari solusi bersama.","topic":"Akhlak","ar":false},{"id":"P5-15","paket":5,"no":15,"type":"PG","q":"Berikut ini yang bukan termasuk contoh perilaku mengucapkan salam dengan baik adalah ....","opts":{"A":"Mengucapkan salam dengan suara yang jelas dan tegas.","B":"Menundukkan kepala saat mengucapkan salam.","C":"Menjabat tangan orang yang disapa.","D":"Memalingkan muka saat mengucapkan salam."},"key":"D","exp":"Memalingkan muka saat memberi salam bukan cara yang benar.","topic":"Akhlak","ar":false},{"id":"P5-16","paket":5,"no":16,"type":"PG","q":"Berikut ini yang bukan termasuk ciri-ciri orang munafik adalah ....","opts":{"A":"Berbohong saat berbicara.","B":"Ingkar janji.","C":"Berkhianat.","D":"Selalu menjaga shalat."},"key":"D","exp":"Menjaga shalat bukan ciri orang munafik.","topic":"Akhlak","ar":false},{"id":"P5-17","paket":5,"no":17,"type":"PG","q":"Pada suatu pagi, Budi bertemu dengan Pak Guru di depan gerbang sekolah. Budi kemudian mengucapkan salam kepada Pak Guru dengan suara yang jelas dan tegas. Sikap Budi menunjukkan nilai ....","opts":{"A":"Sopan santun","B":"Rendah hati","C":"Jujur","D":"Amanah"},"key":"A","exp":"Salam Budi yang jelas dan tegas menunjukkan sopan santun.","topic":"Akhlak","ar":false},{"id":"P5-18","paket":5,"no":18,"type":"PG","q":"Apa arti dari sifat rasul \"Tablig\"?","opts":{"A":"Menyampaikan seluruh wahyu","B":"Cerdas","C":"Menyembunyikan","D":"Berkhianat"},"key":"A","exp":"Tablig berarti menyampaikan seluruh wahyu dengan benar.","topic":"Sejarah Peradaban Islam","ar":false},{"id":"P5-19","paket":5,"no":19,"type":"PG","q":"Iman kepada rasul-rasul Allah berarti kalian percaya bahwa Allah mengutus rasul-rasul-Nya sebagai teladan dan contoh bagi manusia. Apa yang dimaksud dengan iman kepada rasul-rasul Allah?","opts":{"A":"Percaya bahwa rasul adalah teladan dan contoh","B":"Tidak percaya bahwa rasul diutus oleh Allah","C":"Tahu bahwa rasul hanya manusia biasa","D":"Percaya bahwa rasul adalah contoh buruk"},"key":"A","exp":"Iman kepada rasul berarti percaya bahwa mereka adalah teladan yang diutus Allah.","topic":"Akidah","ar":false},{"id":"P5-20","paket":5,"no":20,"type":"PG","q":"Hari itu, di taman bermain, Rina kehilangan bonekanya yang sangat disukainya. Temannya, Faisal, menemukan boneka tersebut di semak-semak. Faisal tidak ragu untuk segera mengembalikan boneka itu kepada Rina. Rina sangat senang dan berterima kasih kepada Faisal. Apa yang dapat dihubungkan dengan sifat Sidik dari kisah Faisal?","opts":{"A":"Rina sangat senang dan berterima kasih kepada Faisal.","B":"Faisal menemukan boneka di semak-semak","C":"Faisal segera mengembalikan boneka kepada Rina","D":"Rina kehilangan bonekanya di taman bermain Created & Published by: www.ubaygurupai.blogspot.com 4"},"key":"C","exp":"Tindakan Faisal mengembalikan boneka mencerminkan sifat Sidik (jujur).","topic":"Akhlak","ar":false},{"id":"P5-21","paket":5,"no":21,"type":"PG","q":"Budi merupakan anak satu-satunya. Setiap berangkat sekolah, Budi selalu minta disiapkan dari air hangat, sarapan, pakaian, bahkan sepatu pun harus Ibu yang memakaikan. Dari cerita ini Budi tidak memiliki sifat……","opts":{"A":"Cinta Kebersihan","B":"Mandiri","C":"Disiplin","D":"Hidup tertib"},"key":"B","exp":"Ketergantungan Budi pada ibunya menunjukkan kurangnya sifat mandiri.","topic":"Akhlak","ar":false},{"id":"P5-22","paket":5,"no":22,"type":"PG","q":"Sudah menjadi hal umum, setiap kelompok manusia mempunyai pemimpin. Di dalam kelas ada ketua kelas, di desa ada kepala desa, sampai negara dipimpin oleh presiden. Dari berbagai pemimpin itu, Alloh lah yang menjadi pemimpin dari berbagai pemimpin di dunia maupun di akhirat nanti. Karena Alloh mempunyai sifat......","opts":{"A":"Al Quddus yang artinya Alloh Maha Memimpin","B":"Al Quddus yang artinya Alloh Maha Suci","C":"Al Malik yang artinya Alloh Maha Pengasih","D":"Al Malik yang berarti Alloh Maha Merajai"},"key":"D","exp":"Sifat Al-Malik berarti \"Yang Maha Merajai\" atau penguasa tertinggi.","topic":"Akhlak","ar":false},{"id":"P5-23","paket":5,"no":23,"type":"PG","q":"Di dalam surat Al Hujurat ayat 13, Alloh menerangkan bahwa Dia menciptakan manusia berbeda-beda. Beda warna kulit, beda bahasa, beda negara dan lain sebagainya. Namun perbedaan-perbedaan itu, hanya satu hal yang paling dicintai oleh Alloh, yaitu:","opts":{"A":"Manusia yang paling banyak hartanya","B":"Anak yang cerdas","C":"Orang yang paling banyak taqwanya","D":"Laki-laki yang berbadan besar"},"key":"C","exp":"Surah Al-Hujurat ayat 13 menekankan bahwa taqwa paling dicintai Allah.","topic":"Al-Qur’an & Hadis","ar":false},{"id":"P5-24","paket":5,"no":24,"type":"PG","q":"Berikut ini yang bukan termasuk contoh perilaku persaudaraan dalam Islam adalah ....","opts":{"A":"Menolong teman yang sedang kesusahan.","B":"Menghormati orang tua dan guru.","C":"Membicarakan keburukan orang lain.","D":"Berbagi makanan dengan teman."},"key":"C","exp":"Membicarakan keburukan orang lain bukan contoh persaudaraan Islam.","topic":"Akhlak","ar":false},{"id":"P5-25","paket":5,"no":25,"type":"PG","q":"Persaudaraan karena kesamaan agama Islam disebut juga dengan ....","opts":{"A":"Ukhuwah Islamiyah","B":"Ukhuwah Wathaniyah","C":"Ukhuwah Basyariyah","D":"Ukhuwah Insaniyah"},"key":"A","exp":"Ukhuwah Islamiyah adalah persaudaraan berdasarkan iman Islam.","topic":"Akhlak","ar":false},{"id":"P5-26","paket":5,"no":26,"type":"PG","q":"Berikut ini yang termasuk contoh penerapan Ukhuwah Wathaniyah adalah ....","opts":{"A":"Menolong korban bencana alam di negara lain.","B":"Ikut menyumbang untuk korban bencana di provinsi lain","C":"Mempelajari bahasa asing.","D":"Berteman dengan orang dari negara lain."},"key":"B","exp":"Menyumbang korban bencana di provinsi lain mencerminkan Ukhuwah Wathaniyah.","topic":"Akhlak","ar":false},{"id":"P5-27","paket":5,"no":27,"type":"PG","q":"Dalam sebuah hadits, Rasulullah SAW bersabda, \"Perumpamaan orang-orang yang beriman dalam saling mencintai, mengasihi, dan menyayangi bagaikan satu tubuh. Jika satu anggota tubuh sakit, maka seluruh anggota tubuh lainnya akan merasakan sakitnya dengan demam dan tidak bisa tidur.\" Hadits ini menunjukkan bahwa ....","opts":{"A":"Persaudaraan dalam Islam sangatlah penting.","B":"Kita harus saling mengaku paling hebat","C":"Kita harus saling membenci dan memusuhi.","D":"Kita harus saling acuh tak acuh. Created & Published by: www.ubaygurupai.blogspot.com 5"},"key":"A","exp":"Hadis ini menekankan pentingnya persaudaraan dan empati dalam Islam.","topic":"Al-Qur’an & Hadis","ar":false},{"id":"P5-28","paket":5,"no":28,"type":"PG","q":"Temanmu yang berbeda agama sedang merayakan hari raya agamanya. Apa yang bisa kamu lakukan untuk menunjukkan sikap toleransi?","opts":{"A":"Membiarkannya merayakan sendiri tanpa ikut memeriahkan.","B":"Menanyakan tentang hari raya tersebut dan mengucapkan selamat.","C":"Mengejeknya karena merayakan hari raya yang berbeda.","D":"Melarangnya merayakan hari raya tersebut di sekolah."},"key":"B","exp":"Menanyakan hari raya dan mengucapkan selamat menunjukkan toleransi.","topic":"Akhlak","ar":false},{"id":"P5-29","paket":5,"no":29,"type":"PG","q":"Suatu hari di sebuah desa, seorang ustadz, meninggal secara tiba-tiba. Kehilangan ini membawa kesedihan mendalam bagi warga desa yang selalu mendengarkan nasihatnya. Meskipun kematian Ustadz Amir adalah kejadian tragis, itu hanya merupakan contoh dari apa yang sering disebut sebagai \"Kiamat Sugra\". Apa yang dimaksud dengan Kiamat Sugra?","opts":{"A":"Hancurnya seluruh alam semesta","B":"Matinya seseorang atau sebagian individu","C":"Kiamat yang hanya terjadi di musim panas","D":"Kiamat yang terjadi secara tiba-tiba"},"key":"B","exp":"Kiamat Sugra adalah kematian individu atau kehancuran skala kecil.","topic":"Akidah","ar":false},{"id":"P5-30","paket":5,"no":30,"type":"PG","q":"Apa arti Kiamat Kubra?","opts":{"A":"Hancurnya seluruh alam semesta beserta isinya","B":"Kiamat yang bersifat kecil dan hanya terjadi di dunia","C":"Matinya sejumlah besar manusia secara bersamaan","D":"Peristiwa alamiah yang terjadi setiap beberapa abad sekali"},"key":"A","exp":"Kiamat Kubra adalah kehancuran total alam semesta dan isinya.","topic":"Akidah","ar":false},{"id":"P5-31","paket":5,"no":31,"type":"PG","q":"Di bawah ini tanda besar kiamat, kecuali?","opts":{"A":"Keluarnya Yakjuj dan Ma‘juj","B":"Munculnya Dajjal","C":"Tersebarnya fitnah","D":"Terbitnya matahari dari sebelah barat"},"key":"C","exp":"Penyebaran fitnah bukan tanda besar kiamat.","topic":"Akidah","ar":false},{"id":"P5-32","paket":5,"no":32,"type":"PG","q":"Bacaan di samping yang berwarna merah, hukumnya dibaca","opts":{"A":"Idzhar","B":"Ghunnah","C":"Idgham Bila Ghunnah","D":"Ikhfa"},"key":"C","exp":"Idgham Bila Ghunnah adalah hukum tajwid untuk teks berwarna merah (berdasarkan konteks). 94 | J U A R A M A P S I S D","topic":"BTQ","ar":false},{"id":"P5-33","paket":5,"no":33,"type":"PG","q":"Apa pesan utama dari potongan ayat \ function go(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === name));
  Object.entries(views).forEach(([k, el]) => el.hidden = k !== name);
  if (name === 'latihan') renderLatihanSetup();
  if (name === 'ujian') renderUjianSetup();
  if (name === 'kartu') renderKartu();
  if (name === 'statistik') renderStat();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

const qkey = s => s.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 70);
function pick({ topic, paket, n, onlyWrong, includeArabic = true }) {
  let pool = BANK.slice();
  if (topic && topic !== 'Semua') pool = pool.filter(q => q.topic === topic);
  if (paket) pool = pool.filter(q => q.paket === paket);
  if (onlyWrong) pool = pool.filter(q => store.wrong[q.id]);
  if (!includeArabic) pool = pool.filter(q => !q.ar);
  if (!paket) { const seen = new Set(); pool = pool.filter(q => { const k = qkey(q.q); if (seen.has(k)) return false; seen.add(k); return true; }); }
  return shuffle(pool).slice(0, n).map(q => {
    const entries = shuffle(Object.entries(q.opts));
    return { q, entries, correct: entries.findIndex(([k]) => k === q.key), pickedIdx: null };
  });
}
function startQuiz(cfg) {
  if (Q && Q.timer) clearInterval(Q.timer);
  const items = pick(cfg);
  if (!items.length) { alert('Belum ada soal yang cocok dengan pilihan itu.'); return; }
  const kurang = cfg.n && items.length < cfg.n ? cfg.n - items.length : 0;
  Q = { cfg, items, i: 0, done: false, kurang, endAt: cfg.seconds ? Date.now() + cfg.seconds * 1000 : null, timer: null };
  if (Q.endAt) Q.timer = setInterval(tick, 1000);
  renderQuiz();
}
function tick() {
  if (!Q || !Q.endAt) return;
  const left = Q.endAt - Date.now();
  const el = $('#timer'); if (el) { el.textContent = fmt(left); el.classList.toggle('warn', left < 120000); }
  if (left <= 0) {
    clearInterval(Q.timer); Q.timer = null;
    if (views.ujian.hidden) go('ujian');
    finish();
  }
}
const fmt = ms => { ms = Math.max(0, ms); const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; return `${m}:${String(s).padStart(2, '0')}`; };
const host = () => Q.cfg.mode === 'latihan' ? views.latihan : views.ujian;

function renderQuiz() {
  const it = Q.items[Q.i], total = Q.items.length, latihan = Q.cfg.mode === 'latihan';
  const answered = it.pickedIdx !== null;
  host().innerHTML = `
  <div class="card">
    <div class="qhead">
      <div class="row" style="gap:8px">
        <span class="badge">${esc(it.q.topic)}</span>
        <span class="badge gold">Paket ${it.q.paket} · No ${it.q.no}</span>
        ${it.q.ar ? '<span class="badge" title="Teks Arab hasil salinan digital mungkin tampil kurang sempurna">teks Arab</span>' : ''}
      </div>
      <div class="row" style="gap:10px">
        ${Q.endAt ? '<span class="timer mono" id="timer">' + fmt(Q.endAt - Date.now()) + '</span>' : ''}
        <span class="mono" style="font-size:14px;color:var(--muted)">${Q.i + 1}/${total}</span>
      </div>
    </div>
    <div class="progress"><span style="width:${(Q.i + 1) / total * 100}%"></span></div>
    ${Q.kurang ? `<p class="lede" style="font-size:13.5px;margin:10px 0 0">Catatan: pilihanmu hanya punya ${total} soal, jadi sesi ini berisi ${total} soal (bukan ${Q.cfg.n}).</p>` : ''}
    <p class="qtext">${arabize(it.q.q)}</p>
    <div class="opts">${it.entries.map(([k, v], idx) => {
      let st = '';
      if (latihan && answered) st = idx === it.correct ? 'right' : (idx === it.pickedIdx ? 'wrong' : '');
      else if (!latihan && idx === it.pickedIdx) st = 'picked';
      return `<button class="opt" data-idx="${idx}" ${latihan && answered ? 'disabled' : ''} ${st ? `data-state="${st}"` : ''}>
        <span class="lt">${'ABCDE'[idx]}</span><span>${arabize(v)}</span></button>`;
    }).join('')}</div>
    ${latihan && answered ? `<div class="exp"><b>${it.pickedIdx === it.correct ? '✓ Benar.' : '✗ Belum tepat.'}</b>
      Jawaban: <b>${'ABCDE'[it.correct]}. ${arabize(it.entries[it.correct][1])}</b><br>${arabize(it.q.exp || '—')}</div>` : ''}
    <div class="row aksi" style="margin-top:18px;justify-content:space-between">
      <button class="btn ghost small" id="prev" ${Q.i === 0 ? 'disabled' : ''}>← Sebelumnya</button>
      <div class="row">
        <button class="btn ghost small" id="quit">Keluar</button>
        ${Q.i === total - 1 ? `<button class="btn small" id="finish">Selesai &amp; lihat skor</button>`
      : `<button class="btn small" id="next" ${latihan && !answered ? 'disabled' : ''}>Berikutnya →</button>`}
      </div>
    </div>
    ${!latihan ? `<div class="grid-nav">${Q.items.map((x, i) => `<button data-jump="${i}" class="${x.pickedIdx !== null ? 'done' : ''} ${i === Q.i ? 'now' : ''}">${i + 1}</button>`).join('')}</div>` : ''}
  </div>`;
  host().querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.idx)));
  const on = (id, fn) => { const el = $('#' + id, host()); if (el) el.addEventListener('click', fn); };
  on('next', () => { Q.i++; renderQuiz(); });
  on('prev', () => { Q.i--; renderQuiz(); });
  on('finish', finish);
  on('quit', () => {
    if (!confirm('Keluar dari sesi ini? Jawaban tidak disimpan.')) return;
    const mode = Q.cfg.mode; clearInterval(Q.timer); Q = null;
    mode === 'latihan' ? renderLatihanSetup() : renderUjianSetup();
  });
  host().querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => { Q.i = +b.dataset.jump; renderQuiz(); }));
}
function answer(idx) {
  const it = Q.items[Q.i];
  if (Q.cfg.mode === 'latihan' && it.pickedIdx !== null) return;
  it.pickedIdx = idx;
  if (Q.cfg.mode === 'latihan') {
    const ok = idx === it.correct;
    if (ok) { delete store.wrong[it.q.id]; store.right[it.q.id] = (store.right[it.q.id] || 0) + 1; }
    else store.wrong[it.q.id] = (store.wrong[it.q.id] || 0) + 1;
    save();
  }
  renderQuiz();
}
function finish() {
  if (!Q || Q.done) return;
  Q.done = true;
  clearInterval(Q.timer); Q.timer = null;
  const items = Q.items, benar = items.filter(x => x.pickedIdx === x.correct).length;
  const skor = Math.round(benar / items.length * 100);
  if (Q.cfg.mode === 'ujian') {
    items.forEach(x => {
      if (x.pickedIdx === x.correct) { delete store.wrong[x.q.id]; store.right[x.q.id] = (store.right[x.q.id] || 0) + 1; }
      else store.wrong[x.q.id] = (store.wrong[x.q.id] || 0) + 1;
    });
  }
  store.history.unshift({ d: Date.now(), mode: Q.cfg.mode, skor, benar, total: items.length });
  store.history = store.history.slice(0, 40); save();
  const perTopic = {};
  items.forEach(x => { const t = perTopic[x.q.topic] || (perTopic[x.q.topic] = { b: 0, n: 0 }); t.n++; if (x.pickedIdx === x.correct) t.b++; });
  const salah = items.filter(x => x.pickedIdx !== x.correct);
  const predikat = skor >= 90 ? ['Luar biasa', 'Siap tampil di lomba.'] : skor >= 75 ? ['Bagus', 'Tinggal rapikan topik yang masih merah.'] : skor >= 60 ? ['Cukup', 'Ulangi rangkuman topik terlemah, lalu latihan lagi.'] : ['Perlu latihan', 'Baca rangkuman dulu, kerjakan 15 soal per topik.'];
  host().innerHTML = `
  <div class="stack">
    <div class="card">
      <p class="eyebrow">Hasil ${Q.cfg.mode === 'ujian' ? 'simulasi lomba' : 'latihan'}</p>
      <div class="score-wrap" style="margin-top:10px">
        <div><div class="score mono">${skor}</div><div class="mono" style="color:var(--muted);font-size:13px">${benar} benar · ${items.length - benar} salah</div></div>
        <div style="flex:1;min-width:200px"><h3 style="font-size:19px">${predikat[0]}</h3><p class="lede" style="margin:4px 0 0">${predikat[1]}</p></div>
      </div>
      <div class="row" style="margin-top:18px">
        <button class="btn small" id="again">Ulangi dengan soal baru</button>
        ${salah.length ? '<button class="btn ghost small" id="drillwrong">Latih ' + salah.length + ' soal yang salah</button>' : ''}
        <button class="btn ghost small" id="back">Ganti pengaturan</button>
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:12px">Penguasaan per topik</h3>
      <div class="stack" style="gap:9px">
        ${Object.entries(perTopic).sort((a, b) => a[1].b / a[1].n - b[1].b / b[1].n).map(([t, v]) => `
          <div class="meterrow"><span>${esc(t)}</span>
          <span class="meter"><span style="width:${v.b / v.n * 100}%;background:${v.b / v.n >= .75 ? 'var(--ok)' : v.b / v.n >= .5 ? 'var(--gold)' : 'var(--bad)'}"></span></span>
          <span class="pct">${Math.round(v.b / v.n * 100)}%</span></div>`).join('')}
      </div>
    </div>
    ${salah.length ? `<div class="card">
      <h3 style="font-size:16px;margin-bottom:12px">Pembahasan ${salah.length} soal yang salah</h3>
      <div class="stack">${salah.map(x => `<div style="border-top:1px solid var(--line);padding-top:12px">
        <p style="font-weight:600;margin:0 0 6px">${arabize(x.q.q)}</p>
        <p style="margin:0;font-size:14.5px"><span style="color:var(--bad)">Jawabanmu: ${x.pickedIdx === null ? '(kosong)' : arabize(x.entries[x.pickedIdx][1])}</span><br>
        <span style="color:var(--ok)">Kunci: ${arabize(x.entries[x.correct][1])}</span></p>
        <div class="exp" style="margin-top:8px">${arabize(x.q.exp || '—')}</div></div>`).join('')}</div></div>` : ''}
  </div>`;
  const cfg = Q.cfg;
  $('#again', host()).addEventListener('click', () => startQuiz(cfg));
  $('#back', host()).addEventListener('click', () => cfg.mode === 'latihan' ? renderLatihanSetup() : renderUjianSetup());
  const dw = $('#drillwrong', host());
  if (dw) dw.addEventListener('click', () => {
    Q = { cfg: { mode: 'latihan' }, done: false, kurang: 0, items: shuffle(salah).map(x => ({ q: x.q, entries: shuffle(Object.entries(x.q.opts)), pickedIdx: null })).map(x => ({ ...x, correct: x.entries.findIndex(([k]) => k === x.q.key) })), i: 0, endAt: null, timer: null };
    go('latihan'); renderQuiz();
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  views.kartu.innerHTML = `
  <div class="stack">
    <div><h2 style="font-size:26px;margin:6px 0">Kartu hafalan</h2>
      <p class="lede">Tebak dulu di kepala, baru klik kartu untuk membaliknya. Ulangi satu dek sampai lancar sebelum pindah dek.</p></div>
    <div class="row">${Object.keys(DECKS).map(d => `<button class="chip" data-deck="${esc(d)}" aria-pressed="${d === deckName}">${esc(d)} <span class="mono" style="opacity:.6">${DECKS[d].length}</span></button>`).join('')}</div>
    <div class="fc" id="fc"><div class="fc-in">
      <div class="fc-face"><p class="eyebrow">${esc(deckName)}</p><p class="big">${esc(c[0])}</p><p class="hint">klik untuk membalik</p></div>
      <div class="fc-face back"><p class="eyebrow">Jawaban</p><p class="big" style="font-size:20px">${esc(c[1])}</p></div>
    </div></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost small" id="pv">← Sebelumnya</button>
      <span class="mono" style="color:var(--muted);font-size:14px">${deckI + 1} / ${deckCards.length}</span>
      <button class="btn small" id="nx">Berikutnya →</button>
    </div>
  </div>`;
  const fc = $('#fc', views.kartu);
  fc.onclick = () => fc.classList.toggle('flip');
  $('#nx', views.kartu).onclick = () => { deckI = (deckI + 1) % deckCards.length; renderKartu(false); };
  $('#pv', views.kartu).onclick = () => { deckI = (deckI - 1 + deckCards.length) % deckCards.length; renderKartu(false); };
  views.kartu.querySelectorAll('[data-deck]').forEach(b => b.onclick = () => { deckName = b.dataset.deck; renderKartu(true); });
}

/* ---------- 5. KEMAJUAN ---------- */
function renderStat() {
  const h = store.history, avg = h.length ? Math.round(h.reduce((s, x) => s + x.skor, 0) / h.length) : 0;
  const wrongIds = Object.keys(store.wrong), rightIds = Object.keys(store.right);
  const perTopic = {};
  BANK.forEach(q => { const t = perTopic[q.topic] || (perTopic[q.topic] = { b: 0, s: 0 }); if (store.right[q.id]) t.b++; if (store.wrong[q.id]) t.s++; });
  views.statistik.innerHTML = `
  <div class="stack">
    <div><h2 style="font-size:26px;margin:6px 0">Kemajuan belajar</h2>
      <p class="lede">Tersimpan otomatis di perangkat ini (tidak terkirim ke mana pun). Sasaran realistis: rata-rata skor di atas 85 dan daftar "soal salah" mendekati nol sebelum hari lomba.</p></div>
    <div class="card">
      <div class="row" style="gap:34px">
        <div><div class="score mono" style="font-size:38px">${h.length}</div><div class="eyebrow">sesi selesai</div></div>
        <div><div class="score mono" style="font-size:38px">${avg}</div><div class="eyebrow">rata-rata skor</div></div>
        <div><div class="score mono" style="font-size:38px;color:var(--ok)">${rightIds.length}</div><div class="eyebrow">soal dikuasai</div></div>
        <div><div class="score mono" style="font-size:38px;color:var(--bad)">${wrongIds.length}</div><div class="eyebrow">masih salah</div></div>
      </div>
    </div>
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:12px">Soal yang sudah dikuasai per topik</h3>
      <div class="stack" style="gap:9px">${Object.entries(perTopic).map(([t, v]) => {
        const total = BANK.filter(q => q.topic === t).length;
        return `<div class="meterrow"><span>${esc(t)}</span><span class="meter"><span style="width:${v.b / total * 100}%"></span></span><span class="pct">${v.b}/${total}</span></div>`;
      }).join('')}</div>
    </div>
    ${h.length ? `<div class="card"><h3 style="font-size:16px;margin-bottom:8px">Riwayat terakhir</h3>
      <div class="scroll-x"><table><tr><th>Waktu</th><th>Mode</th><th>Benar</th><th>Skor</th></tr>
      ${h.slice(0, 10).map(x => `<tr><td class="mono">${new Date(x.d).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
      <td>${x.mode === 'ujian' ? 'Simulasi' : 'Latihan'}</td><td class="mono">${x.benar}/${x.total}</td><td class="mono"><b>${x.skor}</b></td></tr>`).join('')}
      </table></div></div>` : ''}
    <div class="row">
      ${wrongIds.length ? '<button class="btn small" id="fixwrong">Latih soal yang masih salah</button>' : ''}
      <button class="btn ghost small" id="reset">Hapus data kemajuan</button>
    </div>
  </div>`;
  const fw = $('#fixwrong', views.statistik);
  if (fw) fw.onclick = () => { go('latihan'); startQuiz({ mode: 'latihan', topic: 'Semua', n: Math.min(25, wrongIds.length), onlyWrong: true }); };
  $('#reset', views.statistik).onclick = () => { if (confirm('Hapus semua riwayat dan catatan soal salah?')) { store = { wrong: {}, right: {}, history: [] }; save(); renderStat(); } };
}
</script>
</body>
</html>
