<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunters of Mossvale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
:root{
  --night:#161a24; --night2:#222938; --parch:#efe0bb; --parch2:#d6c090; --hi:#fff6dc;
  --ink:#2b2118; --ember:#e0692f; --moss:#6f9a4b; --steel:#8fa3b8; --blood:#b8392c; --gold:#e9b949;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em;font-weight:700;text-wrap:balance}
h1 span{color:var(--ember)}
.tag{font-family:VT323,monospace;font-size:20px;color:var(--steel)}
#frame{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--parch2),0 10px 0 4px #0b0d12;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;font-size:clamp(10px,2.15cqw,19px);line-height:1.3}
.panel{background:var(--parch);color:var(--ink);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--parch2),inset 3px 3px 0 var(--hi);padding:.5em .75em}
.small{font-family:VT323,monospace;font-size:1.2em;line-height:1;color:#6b5a44}
.bar{height:.75em;background:#4a362a;border:2px solid var(--ink);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--moss);transition:width .25s steps(6)}
.bar.f>i{background:var(--gold)}
.bar.low>i{background:var(--blood)}
#hud{top:.5em;left:.5em;width:36%;display:flex;flex-direction:column;gap:.2em}
#hudR{top:.5em;right:.5em;text-align:right;display:flex;flex-direction:column;gap:.15em;max-width:40%}
.hn{font-weight:700}
.pips{letter-spacing:.1em;color:var(--blood)}
.obj{color:#3d6b25;font-weight:600}
#hint{left:50%;bottom:.6em;transform:translateX(-50%);padding:.2em .7em;white-space:nowrap}
#toast{left:50%;top:22%;transform:translateX(-50%);padding:.3em .8em;white-space:nowrap;animation:pop .2s steps(3)}
@keyframes pop{from{transform:translate(-50%,-30%)}}
#dialog{left:.6em;right:.6em;bottom:.6em;min-height:5.2em;cursor:pointer;padding-right:2em}
#dialog .who{font-weight:700;color:var(--ember);display:block}
#dialog .more{position:absolute;right:.6em;bottom:.3em;color:var(--ember);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#menu{inset:1.1em;display:flex;flex-direction:column;gap:.45em}
#menu .mh{display:flex;justify-content:space-between;align-items:baseline;gap:1em;border-bottom:2px solid var(--ink);padding-bottom:.25em}
#menu .mh b{font-size:1.25em}
#menu .mbody{overflow:auto;flex:1;display:flex;flex-direction:column;gap:.1em;min-height:0}
#menu .note{font-family:VT323,monospace;font-size:1.2em;color:#6b5a44;padding:.1em .4em}
#menu .sec{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:#8a6a3a;padding:.5em .4em .1em}
.opt{font:inherit;color:inherit;background:none;border:0;text-align:left;padding:.2em .45em .2em 1.3em;position:relative;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:1em;width:100%}
.opt .r{white-space:nowrap;font-family:VT323,monospace;font-size:1.2em;line-height:1}
.opt:hover,.opt:focus{background:#e3d0a0;outline:none}
.opt:focus::before,.opt:hover::before{content:"▶";position:absolute;left:.25em;color:var(--ember)}
.opt[disabled]{opacity:.5;cursor:default}
.opt[disabled]:hover{background:none}
.opt .sub{display:block;font-family:VT323,monospace;font-size:1.15em;line-height:1;color:#6b5a44}
.ok{color:#3d6b25}.no{color:#a8321f}
.tabs{display:flex;gap:.3em;flex-wrap:wrap}
.tab{font:inherit;background:var(--parch2);color:var(--ink);border:2px solid var(--ink);padding:.05em .6em;cursor:pointer}
.tab.on{background:var(--ink);color:var(--parch)}
.tab:focus-visible{outline:2px solid var(--ember)}
#bstat{top:.5em;left:.5em;width:36%}
#bpl{display:flex;flex-direction:column;gap:.1em;padding-bottom:.3em;border-bottom:2px dashed var(--parch2);margin-bottom:.2em}
.bpr{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
#bleft{display:flex;flex-direction:column}
#bcmds .sec{font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:#8a6a3a;padding:0 .4em .15em}
.wait{padding:.3em .5em}
#banner{left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:.1em;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(20,12,28,.85) 20%,rgba(20,12,28,.85) 80%,transparent);padding:.5em 0;border-block:2px solid var(--ember);animation:bn 1.9s steps(12) forwards}
#banner b{font-size:2.3em;letter-spacing:.08em;color:var(--parch);text-shadow:3px 3px 0 var(--ink);line-height:1}
#banner span{font-family:VT323,monospace;font-size:1.3em;color:var(--ember);letter-spacing:.2em;text-transform:uppercase}
#banner.small-b{top:40%;animation-duration:.9s}#banner.small-b b{font-size:1.5em;color:var(--gold)}
@keyframes bn{0%{transform:scaleY(0)}8%{transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}
#dialog{display:flex;gap:.7em;align-items:flex-start}
.por,.mpor{image-rendering:pixelated;border:3px solid var(--ink);background:#c9b183;flex:none}
.por{width:4.4em;height:4.4em}
.mpor{width:3.2em;height:3.2em}
.dtx{flex:1;min-width:0}
#menu .mh{align-items:center}
.mt{display:flex;flex-direction:column;flex:1;min-width:0}
.zen{white-space:nowrap}
.num.weak{color:#ffb070}.num.psn{color:#9be35a;font-size:clamp(10px,2.4cqw,20px)}.num.brk{color:var(--gold);font-size:clamp(14px,3.6cqw,32px)}
.audio{display:flex;align-items:center;gap:10px;font-family:VT323,monospace;font-size:19px;color:var(--steel)}
.audio button{font:inherit;color:var(--parch);background:var(--night2);border:2px solid #3a4458;padding:0 10px;cursor:pointer}
.audio button:focus-visible,.audio input:focus-visible{outline:2px solid var(--ember)}
.audio input{width:110px;accent-color:var(--ember)}
.rage{color:var(--blood);font-weight:700}
#battle{left:.5em;right:.5em;bottom:.5em;display:grid;grid-template-columns:1.55fr 1fr;gap:.4em}
#blog{height:4.3em;overflow:hidden;font-family:VT323,monospace;font-size:1.2em;line-height:1.05;display:flex;flex-direction:column;justify-content:flex-end}
#blog .tell{color:var(--ember)}#blog .bad{color:#a8321f}#blog .good{color:#3d6b25}
#bcmds{display:flex;flex-direction:column;justify-content:flex-start;padding:.35em .3em;max-height:8.6em;overflow:auto}
#bcmds .opt{padding-block:.08em}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.num{position:absolute;transform:translate(-50%,-50%);font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(12px,3cqw,26px);color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);animation:rise .9s steps(9) forwards}
.num.hurt{color:#ff8a6a}.num.crit{color:var(--gold)}.num.heal{color:#9be35a}.num.miss{color:#cfd6e0}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}
#title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:rgba(14,12,22,.45)}
#title .logo{font-size:clamp(26px,7.5cqw,64px);font-weight:700;color:var(--parch);text-shadow:4px 4px 0 var(--ink),0 0 0 var(--ink);letter-spacing:.02em;line-height:.95;text-align:center}
#title .logo em{display:block;font-style:normal;color:var(--ember);font-size:.45em;letter-spacing:.3em;text-transform:uppercase}
#title .panel{min-width:40%}
.help{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:VT323,monospace;font-size:19px;color:var(--steel)}
.help kbd{font-family:inherit;color:var(--parch);background:var(--night2);border:1px solid #3a4458;padding:0 5px}
#pad{display:none;justify-content:space-between;align-items:center;gap:16px;padding-block:4px}
@media (pointer:coarse),(max-width:720px){#pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pb{font:inherit;font-size:20px;background:var(--night2);color:var(--parch);border:3px solid #3a4458;touch-action:none;-webkit-tap-highlight-color:transparent}
.pb:active,.pb.on{background:var(--ember);border-color:var(--ember);color:var(--ink)}
.ab{display:flex;gap:12px;align-items:center}
.ab .pb{width:68px;height:68px;border-radius:50%;font-weight:700}
#touch{inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:56%;height:58%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:30%;top:66%;width:30cqw;height:30cqw;max-width:150px;max-height:150px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(20,12,28,.22);border:2px solid rgba(255,255,255,.28);opacity:.55;transition:opacity .15s}
#stick.on{opacity:1}
#stick i{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:rgba(239,224,187,.45);border:2px solid rgba(255,255,255,.5)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(20,12,28,.28);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);font:700 clamp(14px,5cqw,26px) "Pixelify Sans",monospace;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.tb.on{background:rgba(224,105,47,.6)}
#tbA{right:5%;bottom:12%;width:19cqw;height:19cqw;max-width:96px;max-height:96px}
#tbB{right:26%;bottom:24%;width:14cqw;height:14cqw;max-width:72px;max-height:72px}
body.touch .help{display:none}
body.touch #hint{bottom:auto;top:30%}
@media (orientation:portrait){
  .ui{font-size:clamp(10px,3.1cqw,18px)}
  #hud{width:54%}#hudR{max-width:44%}#bstat{width:62%}
  #battle{grid-template-columns:1.15fr 1fr}
  #blog{height:5.2em}
  #bcmds{max-height:10em}
  #title .panel{min-width:72%}
  .audio label{display:none}
}
#dock{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;font-size:15px;align-items:start}
.dstat{display:flex;flex-direction:column;gap:6px;min-width:0}
.drow{display:flex;align-items:center;gap:6px}.drow b{width:3.2em;font-size:.9em}.drow .bar{flex:1;height:.8em}
.drow span{font-family:VT323,monospace;font-size:1.15em;min-width:4.2em;text-align:right}
.dmeta{display:flex;justify-content:space-between;gap:6px;font-family:VT323,monospace;font-size:1.2em;line-height:1}
#dSt:empty{display:none}
#dItems{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.di{font:inherit;font-size:13px;line-height:1.1;background:var(--parch2);color:var(--ink);border:2px solid var(--ink);padding:6px 4px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.di b{font-family:VT323,monospace;font-size:1.3em;font-weight:400}
.di.bag{grid-column:1/-1;flex-direction:row;gap:8px;min-height:40px;background:var(--parch)}.di.bag b{font-size:1.1em;color:#6b5a44}
.mat{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding:.15em .45em .15em 1.3em}.mat .sub{display:block;font-family:VT323,monospace;font-size:1.15em;line-height:1;color:#6b5a44}
.mat .r{white-space:nowrap;font-family:VT323,monospace;font-size:1.2em}
.di:active:not([disabled]){background:var(--ember)}.di[disabled]{opacity:.45}
.di:focus-visible{outline:2px solid var(--ember)}
body.dock #hudR{display:none}body.dock .hpline{display:none}
#fish{left:12%;right:12%;bottom:26%;display:flex;flex-direction:column;gap:.4em;text-align:center}
.fbar{position:relative;height:1.4em;background:#4a362a;border:2px solid var(--ink)}
#fZone{position:absolute;top:0;bottom:0;background:#6fb04a}
#fMark{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ember);box-shadow:0 0 0 1px var(--ink)}
.fbtn{font:inherit;font-weight:700;background:var(--ink);color:var(--parch);border:0;padding:.4em;cursor:pointer}
.fbtn:focus-visible{outline:2px solid var(--ember)}
#tbA,#tbB{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tb small{font-size:11px;font-weight:600;margin-top:2px;opacity:.9}
.tb small:empty{display:none}
#rotate{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--parch);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
#rotate b{font:700 24px "Pixelify Sans",monospace}
body.mobile{padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body.mobile .wrap{max-width:none;height:100%;display:block}
body.mobile header,body.mobile .help,body.mobile #dock{display:none!important}
body.mobile #frame{position:fixed;inset:0;border:0;box-shadow:none;width:auto;height:auto;aspect-ratio:auto!important}
body.mobile .ui{font-size:15px}
body.mobile #hud{top:calc(6px + env(safe-area-inset-top,0px));left:6px;width:58%;padding:.35em .55em}
body.mobile #hudR{top:calc(6px + env(safe-area-inset-top,0px));right:6px;max-width:38%;padding:.35em .55em}
body.mobile #hint{display:none!important}
body.mobile #toast{top:calc(22% + env(safe-area-inset-top,0px))}
body.mobile #dialog{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:16px;min-height:6.5em}
body.mobile #menu{inset:auto 0 0 0;max-height:82%;padding-bottom:calc(.6em + env(safe-area-inset-bottom,0px));border-left:0;border-right:0;border-bottom:0;font-size:16px}
body.mobile #menu .opt{min-height:44px;align-items:center}
body.mobile #menu .tab{min-height:38px;padding:.2em .8em}
body.mobile #bstat{top:calc(6px + env(safe-area-inset-top,0px));left:6px;width:62%}
body.mobile #battle{left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr;gap:6px}
body.mobile #blog{height:3.4em;font-size:1.1em}
body.mobile #bcmds{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:none;padding:6px}
body.mobile #bcmds .opt{min-height:50px;border:2px solid var(--ink);background:var(--parch2);flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0;padding:.3em .5em}
body.mobile #bcmds .opt::before{content:none!important}
body.mobile #bcmds .opt:focus{background:#e9d29b}
body.mobile #bcmds .sec,body.mobile #bcmds .small{grid-column:1/-1}
body.mobile #bcmds .opt.wide{grid-column:1/-1}
body.mobile #title .panel{min-width:80%}
body.mobile #title .logo{font-size:44px}
body.mobile #fish{bottom:calc(32% + env(safe-area-inset-bottom,0px));font-size:16px}
body.mobile #stickZone{width:50%;height:36%;bottom:env(safe-area-inset-bottom,0px)}
body.mobile #stick{left:48%;top:56%;width:36vw;height:36vw;max-width:180px;max-height:180px}
body.mobile #tbA{width:22vw;height:22vw;max-width:110px;max-height:110px;right:5vw;bottom:calc(9% + env(safe-area-inset-bottom,0px))}
body.mobile #tbB{width:16vw;height:16vw;max-width:80px;max-height:80px;right:29vw;bottom:calc(19% + env(safe-area-inset-bottom,0px))}
body.mobile #touch{display:none!important}
body.mobile #mbar{display:flex;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;align-items:stretch;gap:10px;padding:8px 8px 8px 10px;font-size:14px;line-height:1.25}
.mb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.mb-loc{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mb-time{font-weight:600;white-space:nowrap;color:#6b5a44;font-variant-numeric:tabular-nums}
.mb-hp .bar{flex:1;height:10px;min-width:60px}
.mb-hp span{font-size:12px;white-space:nowrap;color:#6b5a44;font-variant-numeric:tabular-nums}
.mb-sub{font-size:12px;color:#6b5a44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-sub.ok{color:#3d6b25;font-weight:600}
#mbBag{flex:none;min-width:62px;font:700 15px "Pixelify Sans",system-ui,sans-serif;background:var(--ink);color:var(--parch);border:0;padding:0 12px;cursor:pointer}
#mbBag:active{background:var(--ember)}
body.mobile .ui .small,body.mobile .ui .sub,body.mobile .ui .r,body.mobile #blog,body.mobile #menu .note,body.mobile #menu .sec,body.mobile .mat .sub{font-family:"Pixelify Sans",system-ui,sans-serif}
body.mobile .ui .small,body.mobile .ui .sub,body.mobile #menu .note,body.mobile .mat .sub{font-size:12.5px;line-height:1.3}
body.mobile .ui .r{font-size:14px;line-height:1.2}
body.mobile #menu .sec{font-size:11px;padding-top:.8em}
body.mobile #menu .mh b{font-size:17px}
body.mobile #menu .opt,body.mobile .mat{font-size:15px;gap:12px}
body.mobile #menu .opt>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
body.mobile #blog{font-size:13px;line-height:1.3;height:4em}
body.mobile #bstat{left:6px;right:6px;width:auto}
body.mobile #bstat .panel{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
body.mobile #bstat .bar{flex-basis:100%}
body.mobile .bpr b{font-size:14px}
body.mobile #bcmds .opt{font-size:15px;font-weight:600}
body.mobile #bcmds .opt .r{font-size:12px;font-weight:400}
body.mobile #dialog{font-size:15px;line-height:1.4}
body.mobile #dialog .who{font-size:14px;margin-bottom:2px}
body.mobile #toast{font-size:14px;white-space:normal;max-width:86%;text-align:center}
.txt{display:block;width:100%;margin:.3em 0;font:14px/1.3 ui-monospace,Menlo,monospace;padding:6px 8px;border:2px solid var(--ink);background:#fff8e4;color:var(--ink);resize:vertical;word-break:break-all}
.txt:focus{outline:2px solid var(--ember)}
#menu{z-index:5}#dialog{z-index:6}
.tuthead{display:flex;justify-content:space-between;align-items:baseline;padding:.2em .45em}.tuthead b{font-size:1.15em}
.tutimg{width:100%;max-width:400px;align-self:center;image-rendering:pixelated;border:3px solid var(--ink);display:block}
.tuttext{margin:.3em .45em;line-height:1.4}
.tutnav{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.tutnav .opt{justify-content:center;border:2px solid var(--ink);background:var(--parch2)}.tutnav .opt::before{content:none!important}
.skipb{position:absolute;right:.5em;top:-1.9em;font:600 13px "Pixelify Sans",system-ui,sans-serif;background:var(--ink);color:var(--parch);border:0;padding:.25em .8em;cursor:pointer}
#bcmds.wait .opt:not(.hot){opacity:.62}
.bar.atb{height:.5em;margin-top:2px}.bar.atb>i{background:#5fa8e0;transition:none}.bar.atb.rdy>i{background:var(--gold)}
.bar.atb.e>i{background:#c86a4a}.bar.atb.t>i{background:var(--blood)}
.tellbar{margin-top:3px}.tellbar .small{font-weight:700}
#bcmds .sec.q{color:#3a6ec4}
.opt.hot{background:#f4c27a!important;animation:hotp .5s steps(2) infinite}
@keyframes hotp{50%{background:#ffe2a8}}
@media (prefers-reduced-motion:reduce){.num{animation-duration:.01s}#dialog .more{animation:none}}
</style>
</head>
<body>

<div id="rotate" hidden><b>Please rotate your phone</b><span>Hunters of Mossvale is played in portrait.</span></div>
<div class="wrap">
  <header>
    <h1>Hunters of <span>Mossvale</span></h1>
    <div class="audio"><button id="mute" type="button" aria-pressed="true">Sound: on</button><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="60"></div>
  </header>
  <div id="frame">
    <canvas id="cv" width="320" height="240" aria-label="Game screen"></canvas>

  for(let i=cand.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
  const types=cave?['o','f','o','b','f']:['h','h','y','b','o'];const nn=6+Math.floor(r()*2);

const fireSpr=f=>spr('fire'+f,()=>{const p=new Pt(14,14);p.line(2,12,11,10,'leather',1,2);p.line(2,10,11,12,'leather',2,2);p.disc(6,8-f%2,3,4,'lava',2,true);p.disc(7,9,2,3,'lava',3,true);p.px(7,10,'lava',4,true);if(f%2)p.px(5,3,'lava',3,true);else p.px(8,4,'lava',3,true);return p.render({outline:false})});
function nodeSpr(t,f){return spr('node'+t+f,()=>{const p=new Pt(18,16);
  if(t==='h'){p.disc(6,10,5,4,'leaf',3);p.disc(12,10,5,4,'leaf',3);p.disc(9,7,5,4,'leaf',4);p.px(5,8,'red',3,true);p.px(11,9,'red',3,true);p.px(9,5,'white',3,true)}
  else if(t==='y'){p.rect(3,11,12,4,'leather',2);p.disc(9,11,6,1,'dirt',3);p.disc(9,6,5,5,'gold',2);for(let i=0;i<3;i++)p.line(5,3+i*3,13,3+i*3,'gold',1,1,true);p.px(9,8,'ink',0,true);if(f)p.px(14,3,'ink',0,true);else p.px(3,4,'ink',0,true)}
  else if(t==='b'){p.rect(2,11,14,4,'leather',2);p.rect(2,11,14,1,'leather',3);p.disc(5+f,8,1,1,'gold',4,true);p.disc(12-f,6,1,1,'leaf',4,true);p.px(8,4+f,'gold',3,true)}
  else if(t==='o'){p.disc(9,10,7,5,'stone',2);p.poly([[5,10],[7,3],[9,10]],'steel',3);p.poly([[10,11],[13,5],[14,11]],'steel',3);p.px(7,5,'white',3,true)}
  else if(t==='f'){p.disc(9,10,7,5,'stone',1);p.poly([[5,10],[7,3],[9,10]],'lava',3);p.poly([[10,11],[13,5],[14,11]],'lava',2);p.px(7,5,'lava',4,true)}
  return p.render()})}
function mapObjects(key){const m=MAPS[key],o=[];const at=(x,y)=>(m[y]||'')[x]||'';
  m.forEach((row,y)=>[...row].forEach((ch,x)=>{const X=x*16,Y=y*16;
    if(ch==='T')o.push({y:Y+15,d:()=>blit(treeSpr(Math.floor(hs(x,y,5)*3),zoneOf(key)==='snow'?'snow':zoneOf(key)==='forest'),X-7,Y-19,hs(x,y,6)>.5)});
    else if(ch==='r')o.push({y:Y+14,d:()=>blit(zoneOf(key)==='snow'?iceRockSpr():rockSpr(),X-2,Y+1)});
    else if(ch==='H'&&at(x,y-1)!=='H'&&at(x-1,y)!=='H')o.push({y:Y+31,d:()=>blit(houseSpr(x+y),X-4,Y-18)});
    else if(ch==='Q')o.push({y:Y+15,d:()=>blit(boardSpr(),X-3,Y-7)});
    else if(ch==='B')o.push({y:Y+15,d:()=>{blit(npcSpr('B',Math.floor(T0*2)%2?1:0),X-3,Y-14);blit(anvilSpr(Math.floor(T0*3)%3===0?1:0),X+13,Y+4)}});
    else if(ch==='M')o.push({y:Y+15,d:()=>{blit(stallSpr(),X-12,Y-14);blit(npcSpr('M',0),X-3,Y-15+(Math.floor(T0*1.5)%2))}});
    else if(ch==='C')o.push({y:Y+15,d:()=>{blit(npcSpr('C',0),X-3,Y-14+(Math.floor(T0*1.7)%2));blit(potSpr(Math.floor(T0*4)%2),X+13,Y+2)}});
    else if(ch==='Z')o.push({y:Y+15,d:()=>blit(chestSpr(),X-1,Y+1)});
    else if(ch==='G')o.push({y:Y+15,d:()=>blit(gateSpr(),X-18,Y-24)});
    else if(ch==='E')o.push({y:Y+15,d:()=>{blit(tentSpr(),X-8,Y-12);blit(fireSpr(Math.floor(T0*8)%4),X+17,Y-2)}});
  }));return o}

const bgCache={};
function battleBg(zone){const W=320;if(bgCache[zone])return bgCache[zone];const c=document.createElement('canvas');c.width=W;c.height=H;const x2=c.getContext('2d');const pt=new Pt(W,H);
  if(zone==='cave'){F(x2,0,0,W,60,'cave',0);F(x2,0,60,W,52,'cave',1);
    for(let i=0;i<14;i++){const x=i*24+8,l=16+((i*7)%4)*7;pt.poly([[x-7,-1],[x+7,-1],[x,l]],'stone',1)}
    for(let i=0;i<7;i++){const x=i*50+20,hh=22+((i*5)%3)*9;pt.poly([[x-16,112],[x,112-hh],[x+16,112]],'stone',1)}
    for(let i=0;i<5;i++){const x=30+i*64;pt.poly([[x,108],[x+3,98],[x+6,108]],'purple',2)}
    x2.drawImage(pt.render({shade:false,outline:false}),0,0);
    F(x2,0,106,W,6,'lava',2);F(x2,0,112,W,2,'lava',1);
    F(x2,0,114,W,126,'stone',1);for(let i=0;i<6;i++)F(x2,0,126+i*20,W,1,'stone',0)}
  else if(zone==='snow'){F(x2,0,0,W,64,'cloth',4);F(x2,0,64,W,48,'snow',4);
    pt.disc(70,24,20,5,'white',4);pt.disc(240,36,26,6,'white',4);
    for(let i=0;i<6;i++){const x=i*62-10,hh=40+((i*3)%3)*14;pt.poly([[x-44,104],[x+10,104-hh],[x+64,104]],'ice',2);pt.poly([[x-5,104-hh+12],[x+10,104-hh],[x+25,104-hh+12]],'white',4)}
    for(let i=0;i<22;i++){const x=i*15-4,hh=18+((i*5)%3)*8;pt.poly([[x,110],[x+7,110-hh],[x+14,110]],'pine',1);pt.poly([[x+4,110-hh+6],[x+7,110-hh],[x+10,110-hh+6]],'white',3)}
    x2.drawImage(pt.render({shade:false,outline:false}),0,0);
    F(x2,0,108,W,132,'snow',2);F(x2,0,108,W,2,'snow',1);for(let i=0;i<5;i++)F(x2,0,124+i*22,W,1,'snow',1)}
  else{F(x2,0,0,W,64,'water',2);F(x2,0,64,W,48,'water',4);
    pt.disc(60,26,20,5,'white',2);pt.disc(230,40,26,6,'white',2);pt.disc(150,16,14,4,'white',2);
    for(let i=0;i<6;i++){const x=i*62-10,hh=26+((i*3)%3)*10;pt.poly([[x-40,100],[x+10,100-hh],[x+60,100]],'purple',2)}
    for(let i=0;i<27;i++){const x=i*12-6,hh=16+((i*5)%3)*7;pt.poly([[x,110],[x+7,110-hh],[x+14,110]],'leaf',1)}
    x2.drawImage(pt.render({shade:false,outline:false}),0,0);
    F(x2,0,108,W,132,'grass',2);F(x2,0,108,W,2,'grass',1);for(let i=0;i<5;i++)F(x2,0,124+i*22,W,1,'grass',1);
    for(let i=0;i<14;i++)tuft(x2,i*23+5,132+(i%3)*28,'grass',1)}
  return bgCache[zone]=c}

function startQuest(){const q=quest(S.accepted),Z=ZONES[q.zone],m=MAPS[q.zone];
  const nodes={};for(const rm of Z.rooms)MAPS[rm].forEach((row,y)=>[...row].forEach((c,x)=>{if(NODE[c])nodes[rm+'|'+x+','+y]=ri(1,3)}));
  const hasBoss=q.type==='hunt'||(q.type==='free'&&S.done[Z.bossQ]);let boss=null;
  if(hasBoss){const M=MON[Z.boss];const sp=zoneSpawns(q.zone).filter(s=>s[0]!==Z.camp);const s=sp[ri(0,sp.length-1)];
    boss={key:Z.boss,hp:Math.round(M.hp*DF().hp),parts:M.parts.map(p=>({...p,broken:false})),room:s[0],x:s[1],y:s[2],painted:false,fled:false,alive:true,enraged:false,cool:0,limp:false,pst:null}}
  S.Q={id:q.id,zone:q.zone,time:3000,carts:0,kills:{},gathered:{},nodes,safe:4,steps:0,meal:S.meal,complete:false,boss,weather:pickWeather(q.zone)};questExtras(q,Z);
  S.meal=null;S.map=Z.camp;P.x=9;P.y=MAPS[Z.camp].length-2;P.dir='up';P.mv=null;S.hp=maxHP();S.pst=null;S.focus=MEAL()?.focus||0;catSnap();S.Q.warm=!!MEAL()?.warm;
  sfx('door');music(q.zone);startFade();hud();updHint();say([`— ${Z.name} —`,q.desc+(boss?' Paintballs keep it marked on your map.':''),conditionsLine()],'Quest start')}
async function checkQuest(){const Q=S.Q;if(!Q||Q.complete)return;const q=quest(Q.id);let ok=false;
  if(q.type==='deliver')ok=(Q.gathered[q.item]||0)>=q.n;
  else if(q.type==='slay')ok=(Q.kills[q.mon]||0)>=q.n;
  else if(q.type==='hunt')ok=Q.boss&&!Q.boss.alive;
  else if(q.type==='rescue')ok=!!Q.rescued;
  hud();if(ok){Q.complete=true;await completeQuest()}}
async function completeQuest(){busy=true;const Q=S.Q,q=quest(Q.id);const first=!S.done[q.id];
  if(q.type==='deliver')S.inv[q.item]=Math.max(0,have(q.item)-q.n);
  const rz=Math.round(q.z*zMul());S.zenny+=rz;S.done[q.id]=(S.done[q.id]||0)+1;
  const lines=[`QUEST COMPLETE — ${q.name}`,`Reward: ${rz}z`];
  if(q.type==='hunt'){const bn=[lroll(MON[q.mon].carve),lroll(MON[q.mon].carve)];bn.forEach(k=>gain(k));lines.push('Bonus rewards: '+group(bn))}
  if(q.id==='q2'&&first){gain('potion',2);lines.push('The guild adds 2 Potions. The Verdant Wyrm hunt is now open!')}
  if(q.hrUp&&S.hr<q.hrUp){S.hr=q.hrUp;lines.push(`Hunter Rank up! You are now HR ${S.hr}.`);
    if(S.hr===2)lines.push('The Ember Cave, Mega Potions and a free forest expedition are now open.')}
  if(q.id==='q5'&&first)lines.push('The Cinder Drake is down! The path to Frostpeak has opened — new quests await at the board.');
  if(q.id==='q7'&&first)lines.push('The Rimeback Tusker falls. You are a true Hunter of Mossvale! Forge the glacial arsenal and keep hunting.');
  jingle('quest');banner('QUEST COMPLETE',q.name);await sleep(1600);if(lines.some(l=>l.startsWith('Hunter Rank')))jingle('rank');await say(lines,'Guild');returnVillage();await storyAfter(q.id);busy=false}

  if(tab===0){
    body.append(h('div',{cls:'note'},`HP ${S.hp}/${maxHP()}${S.pst?' · '+stName(S.pst):''} · ${S.zenny}z`));
    for(const k of['potion','mega','antidote','paintball','capture','bait','hotdrink']){const it=ITEMS[k];
      const why=k==='bait'?'Used when fishing in lava':k==='capture'?'Use it in battle':k==='paintball'&&!Q?'Use it during a hunt':'';
      body.append(opt(h('span',{},it.name,h('span',{cls:'sub'},why||it.desc)),'×'+have(k),()=>{fieldUse(k);redraw()},!have(k)||!!why))}
    body.append(opt(`Sound: ${AU.muted?'off':'on'}`,'',()=>{toggleMute();redraw()}));
    body.append(opt(`Battle speed: ${SPDN[S.bspd]||'Normal'}`,'',()=>{const o=['slow','normal','fast'];S.bspd=o[(o.indexOf(S.bspd||'normal')+1)%3];save();redraw()}));
    body.append(opt(LANG==='id'?'Bahasa: Indonesia':'Language: English',LANG==='id'?'ID':'EN',()=>{setLang(LANG==='id'?'en':'id');redraw();hud()}));
    if(!Q)body.append(opt('Save game','',()=>{save();sfx('save');toast('Game saved')}));
    if(!Q)body.append(opt('Save code (backup)','',()=>{closeMenu();codeMenu()}));
    if(Q)body.append(opt(h('span',{},'Quest info',h('span',{cls:'sub'},objText())),'',async()=>{closeMenu();const q=quest(Q.id);await say([q.name,q.desc,`Faints ${Q.carts}/3 · ${fmtT(Q.time)} left.`],'Quest')}))}
  else if(tab===1){let any=false;
    for(const[gname,keys]of MATGROUPS){const ks=keys.filter(k=>have(k)>0);if(!ks.length)continue;any=true;body.append(h('div',{cls:'sec'},gname));
      for(const k of ks){const nw=Q&&Q.gathered[k]?Q.gathered[k]:0;
        body.append(h('div',{cls:'mat'},h('span',{},ITEMS[k].name),h('span',{cls:'r'},nw?h('span',{cls:'ok'},`+${nw} new  `):null,'×'+have(k))))}}
    if(!any)body.append(h('div',{cls:'note'},'No materials yet. Gather sparkling spots and hunt monsters to collect them.'))}
  else if(tab===3)storyTab(body);
  else{const list=nextForge();
    body.append(h('div',{cls:'note'},'Your next upgrades at the Smithy and what they still need.'));
    if(!list.length)body.append(h('div',{cls:'note'},'Everything is forged. Impressive!'));
    for(const[id,it]of list){const ready=canPay(it.cost,it.z);
      body.append(h('div',{cls:'mat'},h('span',{},it.name+(it.atk?`  ATK ${it.atk}`:`  DEF ${it.def}`),h('span',{cls:'sub'},reqLine(it.cost,it.z))),h('span',{cls:'r '+(ready?'ok':'')},ready?'Ready':'')))}}
},['Items','Materials','Forge list','Story'])}
function fieldUse(k){const it=ITEMS[k];if(k==='hotdrink'){if(!S.Q)return toast('Drink it during a hunt.');if(S.Q.warm)return toast('You are already warm.');S.inv[k]--;S.Q.warm=true;sfx('heal');toast('You feel warm. The cold no longer hurts.');hud();return}if(k==='capture'||k==='bait'||(k==='paintball'&&!S.Q))return;
  if(it.heal){if(S.hp>=maxHP())return toast('HP is already full.');S.inv[k]--;S.hp=Math.min(maxHP(),S.hp+it.heal);sfx('heal');toast(`Recovered ${it.heal} HP`)}
  else if(it.cure){if(!S.pst)return toast('Nothing to cure.');S.inv[k]--;S.pst=null;sfx('heal');toast('Ailment cured')}
  else if(k==='paintball'){const b=S.Q.boss;if(!b||!b.alive)return toast('No large monster here.');
    if(!bossVisible())return toast('No large monster in sight.');if(b.painted)return toast('Already marked.');S.inv[k]--;b.painted=true;sfx('paint');toast(`${MON[b.key].name} marked!`)}
  hud()}
const group=a=>{const m={};a.forEach(k=>m[k]=(m[k]||0)+1);return Object.entries(m).map(([k,n])=>`${ITEMS[k].name} ×${n}`).join(', ')||'nothing'};


/* ================= quakes & fishing ================= */
function quake(){WSHAKE=.7;sfx('quake');const[px,py]=[P.x*16+8,P.y*16+8];burst(px,py-30,'lava',16,{spd:60});
  let near=false;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(tile(P.x+dx,P.y+dy)==='L')near=true;
  if(near){S.hp=Math.max(1,S.hp-8);toast('Scorched by falling embers! −8 HP')}else toast('The ground trembles — embers rain down!');hud()}
const FISH={on:false};
const SPOTS={ice:[['frostcod',60],['salmon',30],['aurorakoi',10]],pond:[['minnow',60],['carp',30],['koi',10]],forest:[['trout',60],['eel',30],['pike',10]],lava:[['guppy',60],['gar',30],['cinderfin',10]]};
const FRAR={frostcod:0,salmon:1,aurorakoi:2,minnow:0,carp:1,koi:2,trout:0,eel:1,pike:2,guppy:0,gar:1,cinderfin:2};
const fishEl=$('#fish'),fishT=$('#fishT'),fishS=$('#fishS'),fZone=$('#fZone'),fMark=$('#fMark'),fBar=$('#fBar'),fBtn=$('#fishBtn');
async function fishStart(spot){if(FISH.on||busy)return;
  if(spot==='lava'){if(!have('bait')){await say('The lava is far too hot for normal bait. Buy Magma Bait at the General Store, or combine Firestone + Bitterbug.','Hunter');return}S.inv.bait--}
  if(S.Q){S.Q.time-=20;hud()}
  Object.assign(FISH,{on:true,spot,phase:'wait',t:0,bite:rnd(1.2,3.4),hits:0,miss:0,pos:0,dir:1,fish:null});dirStack.length=0;hintEl.hidden=true;
  sfx('cast');fishEl.hidden=false;fBar.hidden=true;fishT.textContent=spot==='lava'?'You cast into the lava...':'You cast your line...';fishS.textContent='Wait for a bite, then press A.';fBtn.textContent='Pull!'}
function fishTick(dt){if(!FISH.on)return;FISH.t+=dt;
  if(FISH.phase==='wait'&&FISH.t>FISH.bite){FISH.phase='bite';FISH.t=0;sfx('tell');fishT.textContent='! Something bit !';fishS.textContent='Press A now!'}
  else if(FISH.phase==='bite'&&FISH.t>.9)fishEnd('Too slow — the fish got away.');
  else if(FISH.phase==='reel'){FISH.pos+=FISH.dir*FISH.spd*dt;if(FISH.pos>1){FISH.pos=1;FISH.dir=-1}if(FISH.pos<0){FISH.pos=0;FISH.dir=1}fMark.style.left=FISH.pos*100+'%'}}
function fishZone(){FISH.z0=rnd(0,1-FISH.zw);fZone.style.left=FISH.z0*100+'%';fZone.style.width=FISH.zw*100+'%'}
function fishHit(){if(!FISH.on)return;
  if(FISH.phase==='wait')return fishEnd('Too early — you scared the fish away.');
  if(FISH.phase==='bite'){const tbl=SPOTS[FISH.spot].map(([k,w])=>[k,FRAR[k]===2?w+(isNight()?10:0)+(S.arm==='ar4'?10:0):w]);const k=roll(tbl),r=FRAR[k];
    Object.assign(FISH,{phase:'reel',fish:k,zw:[.32,.22,.15][r]*(S.arm==='ar4'?1.3:1),spd:[.9,1.3,1.8][r],pos:0,dir:1});fishZone();
    fBar.hidden=false;fishT.textContent=r===2?'A big one is fighting back!':'Reel it in!';fishS.textContent='Press A while the marker is in the green zone (0/3).';fBtn.textContent='Reel!';sfx('reel');return}
  if(FISH.phase!=='reel')return;
  if(FISH.pos>=FISH.z0&&FISH.pos<=FISH.z0+FISH.zw){FISH.hits++;sfx('reel');
    if(FISH.hits>=3){const k=FISH.fish;gain(k);if(S.Q)S.Q.gathered[k]=(S.Q.gathered[k]||0)+1;sfx('gather');if(FRAR[k]===2)jingle('rank');
      FISH.phase='done';fBar.hidden=true;fishT.textContent=`Caught a ${ITEMS[k].name}!`;fishS.textContent=FRAR[k]===2?'A rare catch!':'Into the bag it goes.';setTimeout(()=>fishEnd(),1200);return}
    fishZone();fishS.textContent=`Nice! Keep going (${FISH.hits}/3).`}
  else{FISH.miss++;sfx('deny');if(FISH.miss>=2)return fishEnd('The line snapped!');fishS.textContent=`Missed! The line is straining (${FISH.hits}/3).`}}
function fishEnd(msg){if(!FISH.on)return;FISH.on=false;FISH.phase='';fishEl.hidden=true;if(msg){toast(msg);sfx('splash')}updHint();hud()}
fBtn.onclick=()=>fishHit();

const CATP={x:9,y:27,fx:9,fy:27};
function catSnap(){CATP.x=CATP.fx=P.x;CATP.y=CATP.fy=P.y}
function kittenAt(x,y){const k=S.Q&&S.Q.kitten;return !!(k&&!S.Q.rescued&&k.room===S.map&&k.x===x&&k.y===y)}
function merchAt(x,y){return S.map==='village'&&merchantHere()&&x===MERCH_POS[0]&&y===MERCH_POS[1]}
function trackAt(x,y){const Q=S.Q;if(!Q||!Q.tracks)return null;return Q.tracks.find(t=>!t.got&&t.room===S.map&&t.x===x&&t.y===y)||null}
function treasureAt(x,y){const Q=S.Q;if(!Q||!Q.treasure)return null;return Q.treasure.find(t=>!t.got&&t.room===S.map&&t.x===x&&t.y===y)||null}
function questExtras(q,Z){const Q=S.Q;const free=[];
  for(const rm of Z.rooms){if(rm===Z.camp)continue;MAPS[rm].forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='.'||c===':')free.push([rm,x,y])}))}
  const take=()=>free.splice(ri(0,free.length-1),1)[0];
  Q.treasure=[];const n=ri(1,2);for(let i=0;i<n&&free.length;i++){const[rm,x,y]=take();Q.treasure.push({room:rm,x,y,got:false})}
  if(Q.boss){Q.tracks=[];Q.trackN=0;for(const rm of Z.rooms)for(let i=0;i<2;i++){const c=free.filter(f=>f[0]===rm);if(!c.length)break;const f=c[ri(0,c.length-1)];free.splice(free.indexOf(f),1);Q.tracks.push({room:rm,x:f[1],y:f[2],got:false})}}
  Q.mobs=[];Q.mobN=0;
  for(const rm of Z.rooms){if(rm===Z.camp)continue;for(let i=0;i<3;i++)spawnMob(rm,pickSmall(q),true)}
  if(q.type==='slay'){let have=Q.mobs.filter(m=>m.key===q.mon).length,guard=0;while(have<q.n+2&&guard++<20){const rms=Z.rooms.filter(r=>r!==Z.camp);if(spawnMob(rms[ri(0,rms.length-1)],q.mon,true))have++}}
  if(q.type==='rescue'){const sp=zoneSpawns(q.zone).filter(s=>s[0]!==Z.camp);const s=sp[ri(0,sp.length-1)];Q.kitten={room:s[0],x:s[1],y:s[2]}}}
function collectHere(){const Q=S.Q;if(!Q)return;
  const t=trackAt(P.x,P.y);
  if(t){t.got=true;Q.trackN=(Q.trackN||0)+1;const b=Q.boss;sfx('gather');burst(P.x*16+8,P.y*16+10,'dirt',8,{up:1});
    if(!b||!b.alive)toast('Old tracks... the monster is gone.');
    else if(Q.trackN>=3&&!b.painted){b.painted=true;sfx('paint');toast(`You've pinpointed the ${MON[b.key].name} in ${ROOMS[b.room].name}!`)}
    else toast(`Tracks lead toward ${b.room===S.map?'this area':ROOMS[b.room].name} (${Math.min(Q.trackN,3)}/3)`);hud()}
  const tr=treasureAt(P.x,P.y);
  if(tr){tr.got=true;const k=roll([['zenny',40],['rare',35],['egg',25]]);let msg;
    if(k==='zenny'){const z=Math.round(ri(150,300)*zMul());S.zenny+=z;msg=`Hidden treasure! +${z}z`;sfx('coin')}
    else{const it=k==='egg'?'egg':roll(Q.zone==='forest'?[['vscale',40],['vgem',10],['thornhide',50]]:Q.zone==='snow'?[['icecrystal',35],['frostfur',55],['pfheart',10]]:[['cscale',40],['cheart',8],['crabshell',52]]);gain(it);Q.gathered[it]=(Q.gathered[it]||0)+1;msg=`Hidden treasure! Found a ${ITEMS[it].name}`;sfx('gather')}
    burst(P.x*16+8,P.y*16+8,'gold',16,{up:1,spd:60});jingle('rank');toast(msg);hud()}}
async function rescueCat(){const Q=S.Q;if(busy||Q.rescued)return;busy=true;sfx('select');
  await say(['Mew? A tiny cat hunter was hiding in the bushes!','It sniffs your boots... and decides you are its new partner.'],'Hunter');
  const name=await askName('Tofu');
  S.cat={name,lv:1,xp:0,wep:'cw1',arm:'ca0',weps:['cw1'],arms:['ca0'],exp:null};Q.rescued=true;catSnap();busy=false;
  await say([`${name} joined you as your hunting buddy!`,`${name} fights beside you, and can go on gathering trips from the Item Chest.`],'Guild');
  await playScene('kitten');
  await checkQuest()}
function askName(def){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;res(String(v||'').trim().slice(0,10)||def)};
  openMenu('Name your buddy',body=>{const inp=h('input',{id:'catName',type:'text',maxlength:'10',value:def,autocomplete:'off',cls:'txt'});
    body.append(h('div',{cls:'note'},'Up to 10 letters.'),inp,opt('Confirm name','',()=>{const v=inp.value;MENU.onClose=null;closeMenu();fin(v)}));setTimeout(()=>{try{inp.focus();inp.select()}catch(e){}},60)});
  MENU.onClose=()=>fin(def)})}
function catXP(n){const c=S.cat;if(!c||c.lv>=10)return;c.xp+=n;while(c.lv<10&&c.xp>=c.lv*20){c.xp-=c.lv*20;c.lv++;toast(`${c.name} reached Lv ${c.lv}!`);sfx('save')}}
function checkCatReturn(){const c=S&&S.cat;if(c&&c.exp&&Date.now()>=c.exp.until&&!c.exp.told){c.exp.told=true;toast(`${c.name} is back! Collect the haul at the Item Chest.`)}}
function catTab(body){const c=S.cat;
  if(!c){body.append(h('div',{cls:'note'},'No buddy yet. Take the quest "The Lost Kitten" from the Quest Board.'));return}
  body.append(h('div',{cls:'note'},`${c.name} · Lv ${c.lv}${c.lv<10?` (${c.xp}/${c.lv*20} XP)`:' (max)'} · ATK ${catAtk()} · Heal +${12+c.lv*2+CARM[c.arm].heal}`));
  if(c.exp){const left=c.exp.until-Date.now();
    if(left<=0)body.append(opt(h('span',{},'Collect the haul',h('span',{cls:'sub'},`Back from ${CAT_EXP[c.exp.zone].name}`)),'',()=>{const E2=CAT_EXP[c.exp.zone];const got=[];const n=ri(4,6);
      for(let i=0;i<n;i++)got.push(roll(E2.tbl));if(Math.random()<.1)got.push(E2.rare);got.forEach(k=>gain(k));catXP(E2.xp);c.exp=null;catSnap();sfx('gather');save();toast('Haul: '+group(got));redraw()}));
    else body.append(h('div',{cls:'note'},`On a gathering trip to ${CAT_EXP[c.exp.zone].name}. Back in ${fmtT(Math.ceil(left/1000))}. ${c.name} won't join hunts until then.`))}
  else for(const[k,e]of Object.entries(CAT_EXP)){const lock=e.hr&&S.hr<e.hr;
    body.append(opt(h('span',{},`Send to ${e.name}`,h('span',{cls:'sub'},lock?`Requires HR ${e.hr}`:`${e.mins} min (real time) · brings back gathering materials`)),'',()=>{c.exp={zone:k,until:Date.now()+e.mins*60000};sfx('door');save();toast(`${c.name} set off to ${e.name}!`);redraw()},lock))}
  body.append(h('div',{cls:'sec'},'Weapon'));
  for(const id of c.weps)body.append(opt(CWEP[id].name,`ATK ${CWEP[id].atk}${c.wep===id?' ✓':''}`,()=>{c.wep=id;save();redraw()}));
  body.append(h('div',{cls:'sec'},'Armor'));
  for(const id of c.arms)body.append(opt(CARM[id].name,`Heal +${CARM[id].heal}${c.arm===id?' ✓':''}`,()=>{c.arm=id;save();redraw()}));
  body.append(opt('Rename buddy','',async()=>{MENU.onClose=null;closeMenu();c.name=await askName(c.name);save()}))}
function catForgeTab(body){const c=S.cat;if(!c){body.append(h('div',{cls:'note'},'Rescue a buddy first ("The Lost Kitten" quest).'));return}
  body.append(h('div',{cls:'note'},`Gear for ${c.name}. Weapons raise its attacks, armor improves its healing.`));
  for(const[set,own,key]of[[CWEP,c.weps,'wep'],[CARM,c.arms,'arm']])for(const[id,it]of Object.entries(set)){if(!it.cost)continue;const hasIt=own.includes(id);

async function merchantMenu(){if(!S.story||!S.story.merchant)await playScene('merchant');merchantShop()}

let MOBG=0;
function mobAt(x,y){const Q=S.Q;if(!Q||!Q.mobs)return null;return Q.mobs.find(m=>m.alive&&m.room===S.map&&m.x===x&&m.y===y)||null}
function pickSmall(q){const pool=ZONES[q.zone].smalls;if(q.type==='slay'&&Math.random()<.4)return q.mon;return pool[ri(0,pool.length-1)]}
function spawnMob(rm,key,initial){const Q=S.Q,m=MAPS[rm],H2=m.length,W2=m[0].length;
  const exits=[];for(let x=0;x<W2;x++){if(!SOLID.has(m[0][x]))exits.push([x,0]);if(!SOLID.has(m[H2-1][x]))exits.push([x,H2-1])}for(let y=0;y<H2;y++){if(!SOLID.has(m[y][0]))exits.push([0,y]);if(!SOLID.has(m[y][W2-1]))exits.push([W2-1,y])}
  const busyAt=(x,y)=>Q.mobs.some(o=>o.alive&&o.room===rm&&Math.abs(o.x-x)+Math.abs(o.y-y)<3)||(Q.treasure||[]).some(t=>t.room===rm&&t.x===x&&t.y===y)||(Q.tracks||[]).some(t=>t.room===rm&&t.x===x&&t.y===y)||(Q.kitten&&Q.kitten.room===rm&&Q.kitten.x===x&&Q.kitten.y===y)||(Q.boss&&Q.boss.room===rm&&Q.boss.x===x&&Q.boss.y===y);
  const c=[];for(let y=1;y<H2-1;y++)for(let x=1;x<W2-1;x++){if(!'.:,;'.includes(m[y][x]))continue;if(exits.some(([ex,ey])=>Math.abs(ex-x)+Math.abs(ey-y)<6))continue;
    if(!initial&&rm===S.map&&Math.abs(P.x-x)+Math.abs(P.y-y)<7)continue;if(busyAt(x,y))continue;c.push([x,y])}
  if(!c.length)return false;const[x,y]=c[ri(0,c.length-1)];
  Q.mobs.push({id:Q.mobN++,key,room:rm,x,y,fx:x,fy:y,mt:1,dir:['up','down','left','right'][ri(0,3)],face:Math.random()<.5?'left':'right',alive:true,cool:0,next:rnd(.4,2),chase:false});return true}
function mobFree(x,y){const m=curMap();if(x<1||y<1||y>=m.length-1||x>=m[0].length-1)return false;const c=tile(x,y);
  if(SOLID.has(c)||c==='w'||c==='L'||NODE[c])return false;if(mobAt(x,y)||kittenAt(x,y))return false;const b=S.Q.boss;return !(b&&b.alive&&b.room===S.map&&b.x===x&&b.y===y)}
function mobTick(dt){const Q=S.Q;if(!Q||!Q.mobs||S.scene!=='world')return;
  for(const m of Q.mobs)if(m.mt<1)m.mt=Math.min(1,m.mt+dt*5);
  if(busy||uiBlocking()||FISH.on)return;if(MOBG>0){MOBG-=dt;return}
  for(const m of Q.mobs){if(!m.alive||m.room!==S.map)continue;m.next-=dt;if(m.next>0)continue;
    const dx=P.x-m.x,dy=P.y-m.y,dist=Math.abs(dx)+Math.abs(dy);const sees=m.cool<=0&&dist<=4;
    if(sees&&!m.chase){m.chase=true;m.next=.45;sfx('tell');continue}
    m.chase=sees;m.next=sees?rnd(.42,.62):rnd(.9,1.9);
    let dirs;
    if(sees){dirs=[];if(dx)dirs.push(dx>0?'right':'left');if(dy)dirs.push(dy>0?'down':'up');if(Math.abs(dy)>Math.abs(dx))dirs.reverse()}
    else{if(Math.random()<.4)continue;dirs=[['up','down','left','right'][ri(0,3)]]}
    for(const d of dirs){const[ddx,ddy]=DV[d];const nx=m.x+ddx,ny=m.y+ddy;
      if(nx===P.x&&ny===P.y){m.dir=d;if(d==='left'||d==='right')m.face=d;mobEngage(m,'enemy');return}
      if(mobFree(nx,ny)){m.dir=d;if(d==='left'||d==='right')m.face=d;m.fx=m.x;m.fy=m.y;m.x=nx;m.y=ny;m.mt=0;break}}}}

  TAPM={x:tx,y:ty,until:T0+.7};sfx('move')}
cv.addEventListener('pointerdown',e=>{if(!isTouch()||S.scene!=='world'||busy||MENU||D.open||FISH.on)return;
  const r=cv.getBoundingClientRect();const lx=(e.clientX-r.left)/r.width*W+CAMX,ly=(e.clientY-r.top)/r.height*VH+CAMY;
  auInit();tapTo(Math.floor(lx/16),Math.floor(ly/16))});

/* ================= title / boot ================= */
function updAudioUI(){const m=$('#mute');if(m){m.textContent=AU.muted?'Sound: off':'Sound: on';m.setAttribute('aria-pressed',String(!AU.muted))}const v=$('#vol');if(v)v.value=Math.round(AU.vol*100)}
function toggleMute(){auInit();AU.muted=!AU.muted;if(AU.ctx)auVol();else try{localStorage.setItem('mossvale-audio',JSON.stringify({vol:AU.vol,muted:AU.muted}))}catch(e){}updAudioUI()}
$('#mute').onclick=toggleMute;
$('#vol').oninput=e=>{auInit();AU.vol=e.target.value/100;if(AU.muted&&AU.vol>0)AU.muted=false;if(AU.ctx)auVol();updAudioUI()};
updAudioUI();
function toTitle(){S.scene='title';S.map='village';$('#title').hidden=false;hud();hintEl.hidden=true;music('title');
  const m=$('#titleMenu');m.innerHTML='';const sv=loadSave();
  if(sv)m.append(opt('Continue',`HR ${sv.hr} · ${sv.zenny}z`,()=>{S=Object.assign(freshState(),sv);S.Q=null;beginWorld()}));
  m.append(opt('New hunt',null,diffMenu));
  m.append(opt('Tutorial',null,()=>tutorialMenu()));
  m.append(h('div',{cls:'small',style:'padding:.3em .4em'},'Press any key or tap to enable sound'));
  m.querySelector('button').focus()}
function diffMenu(){const m=$('#titleMenu');m.innerHTML='';
  m.append(h('div',{cls:'small',style:'padding:.2em .4em'},'Choose a difficulty. It cannot be changed later.'));
  for(const k of['easy','normal','hard'])m.append(opt(h('span',{},DIFF[k].name,h('span',{cls:'sub'},DIFF[k].desc)),null,()=>{S=freshState();S.diff=k;beginWorld()}));
  m.append(opt('Back',null,toTitle));m.querySelectorAll('button')[1].focus()}
async function beginWorld(){$('#title').hidden=true;S.scene='world';S.map='village';Object.assign(P,S.P||{x:9,y:27,dir:'down'});P.path=[];P.after=null;if(tile(P.x,P.y)!=='.'&&tile(P.x,P.y)!=='='){P.x=9;P.y=27}P.mv=null;
  if(!S.Q)S.hp=maxHP();catSnap();checkCatReturn();if(merchantHere())setTimeout(()=>toast('A traveling merchant is in town tonight!'),1500);auInit();music('village');startFade();hud();updHint();
  if(!S.intro){S.intro=true;await playScene('prologue')}
  syncStory();save()}
function start(data){
  layout();S=data&&data.S?data.S:freshState();if(!MAPS[S.map]){S.map='village';S.Q=null;S.scene='title'}
  if(data&&data.S&&S.scene!=='title'){if(S.scene==='battle')S.scene='world';$('#title').hidden=true;Object.assign(P,S.P||{});P.mv=null;music(S.Q?S.Q.zone:'village');hud();updHint()}
  else toTitle();
  requestAnimationFrame(loop)}
setInterval(()=>{if(S)S.P={x:P.x,y:P.y,dir:P.dir}},500);
setInterval(()=>{if(S&&S.scene==='world'&&!S.Q)checkCatReturn()},5000);
try{window.claude?.hot?.snapshot?.(()=>({S:JSON.parse(JSON.stringify({...S,P:{x:P.x,y:P.y,dir:P.dir}}))}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});

</script>
