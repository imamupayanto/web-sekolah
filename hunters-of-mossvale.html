<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunters of Mossvale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
:root{
  --night:#161a24; --night2:#222938; --parch:#efe0bb; --parch2:#d6c090; --hi:#fff6dc;
  --ink:#2b2118; --ember:#e0692f; --moss:#6f9a4b; --steel:#8fa3b8; --blood:#b8392c; --gold:#e9b949;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parch);font-family:"Pixelify Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 16px}
h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em;font-weight:700;text-wrap:balance}
h1 span{color:var(--ember)}
.tag{font-family:VT323,monospace;font-size:20px;color:var(--steel)}
#frame{position:relative;width:100%;aspect-ratio:4/3;background:#000;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--parch2),0 10px 0 4px #0b0d12;overflow:hidden;container-type:inline-size;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#tcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ui{position:absolute;font-size:clamp(10px,2.15cqw,19px);line-height:1.3}
.panel{background:var(--parch);color:var(--ink);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 var(--parch2),inset 3px 3px 0 var(--hi);padding:.5em .75em}
.small{font-family:VT323,monospace;font-size:1.2em;line-height:1.3;color:#6b5a44}
.bar{height:.75em;background:#4a362a;border:2px solid var(--ink);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--moss);transition:width .25s steps(6)}
.bar.f>i{background:var(--gold)}
.bar.low>i{background:var(--blood)}
#hud{top:.5em;left:.5em;width:36%;display:flex;flex-direction:column;gap:.2em}
#hudR{top:.5em;right:.5em;text-align:right;display:flex;flex-direction:column;gap:.15em;max-width:40%}
.hn{font-weight:700}
.pips{letter-spacing:.1em;color:var(--blood)}
.obj{color:#3d6b25;font-weight:600}
#hint{left:50%;bottom:.6em;transform:translateX(-50%);padding:.2em .7em;white-space:nowrap}
#toast{left:50%;top:22%;transform:translateX(-50%);padding:.3em .8em;white-space:nowrap;animation:pop .2s steps(3)}
@keyframes pop{from{transform:translate(-50%,-30%)}}
#dialog{left:.6em;right:.6em;bottom:.6em;min-height:5.2em;cursor:pointer;padding-right:2em}
#dialog .who{font-weight:700;color:var(--ember);display:block}
#dialog .more{position:absolute;right:.6em;bottom:.3em;color:var(--ember);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#menu{inset:1.1em;display:flex;flex-direction:column;gap:.45em}
#menu .mh{display:flex;justify-content:space-between;align-items:baseline;gap:1em;border-bottom:2px solid var(--ink);padding-bottom:.25em}
#menu .mh b{font-size:1.25em}
#menu .mbody{overflow:auto;flex:1;display:flex;flex-direction:column;gap:.1em;min-height:0}
#menu .note{font-family:VT323,monospace;font-size:1.2em;color:#6b5a44;padding:.1em .4em}
#menu .sec{font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:#8a6a3a;padding:.5em .4em .1em}
.opt{font:inherit;color:inherit;background:none;border:0;text-align:left;padding:.2em .45em .2em 1.3em;position:relative;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:1em;width:100%}
.opt .r{white-space:nowrap;font-family:VT323,monospace;font-size:1.2em;line-height:1}
.opt:hover,.opt:focus{background:#e3d0a0;outline:none}
.opt:focus::before,.opt:hover::before{content:"▶";position:absolute;left:.25em;color:var(--ember)}
.opt[disabled]{opacity:.5;cursor:default}
.opt[disabled]:hover{background:none}
.opt .sub{display:block;font-family:VT323,monospace;font-size:1.15em;line-height:1.3;color:#6b5a44}
.ok{color:#3d6b25}.no{color:#a8321f}
.tabs{display:flex;gap:.3em;flex-wrap:wrap}
.tab{font:inherit;background:var(--parch2);color:var(--ink);border:2px solid var(--ink);padding:.05em .6em;cursor:pointer}
.tab.on{background:var(--ink);color:var(--parch)}
.tab:focus-visible{outline:2px solid var(--ember)}
#bstat{top:.5em;left:.5em;width:36%}
#bpl{display:flex;flex-direction:column;gap:.1em;padding-bottom:.3em;border-bottom:2px dashed var(--parch2);margin-bottom:.2em}
.bpr{display:flex;justify-content:space-between;align-items:baseline;gap:.5em}
#bleft{display:flex;flex-direction:column}
#bcmds .sec{font-size:.75em;letter-spacing:.1em;text-transform:uppercase;color:#8a6a3a;padding:0 .4em .15em}
.wait{padding:.3em .5em}
#banner{left:0;right:0;top:34%;display:flex;flex-direction:column;align-items:center;gap:.1em;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(20,12,28,.85) 20%,rgba(20,12,28,.85) 80%,transparent);padding:.5em 0;border-block:2px solid var(--ember);animation:bn 1.9s steps(12) forwards}
#banner b{font-size:2.3em;letter-spacing:.08em;color:var(--parch);text-shadow:3px 3px 0 var(--ink);line-height:1}
#banner span{font-family:VT323,monospace;font-size:1.3em;color:var(--ember);letter-spacing:.2em;text-transform:uppercase}
#banner.small-b{top:40%;animation-duration:.9s}#banner.small-b b{font-size:1.5em;color:var(--gold)}
@keyframes bn{0%{transform:scaleY(0)}8%{transform:scaleY(1)}85%{opacity:1}100%{opacity:0}}
#dialog{display:flex;gap:.7em;align-items:flex-start}
.por,.mpor{image-rendering:pixelated;border:3px solid var(--ink);background:#c9b183;flex:none}
.por{width:4.4em;height:4.4em}
.mpor{width:3.2em;height:3.2em}
.dtx{flex:1;min-width:0}
#menu .mh{align-items:center}
.mt{display:flex;flex-direction:column;flex:1;min-width:0}
.zen{white-space:nowrap}
.num.weak{color:#ffb070}.num.psn{color:#9be35a;font-size:clamp(10px,2.4cqw,20px)}.num.brk{color:var(--gold);font-size:clamp(14px,3.6cqw,32px)}
.audio{display:flex;align-items:center;gap:10px;font-family:VT323,monospace;font-size:19px;color:var(--steel)}
.audio button{font:inherit;color:var(--parch);background:var(--night2);border:2px solid #3a4458;padding:0 10px;cursor:pointer}
.audio button:focus-visible,.audio input:focus-visible{outline:2px solid var(--ember)}
.audio input{width:110px;accent-color:var(--ember)}
.rage{color:var(--blood);font-weight:700}
#battle{left:.5em;right:.5em;bottom:.5em;display:grid;grid-template-columns:1.55fr 1fr;gap:.4em}
#blog{height:4.3em;overflow:hidden;font-family:VT323,monospace;font-size:1.2em;line-height:1.05;display:flex;flex-direction:column;justify-content:flex-end}
#blog .tell{color:var(--ember)}#blog .bad{color:#a8321f}#blog .good{color:#3d6b25}
#bcmds{display:flex;flex-direction:column;justify-content:flex-start;padding:.35em .3em;max-height:8.6em;overflow:auto}
#bcmds .opt{padding-block:.08em}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.num{position:absolute;transform:translate(-50%,-50%);font-family:"Pixelify Sans",monospace;font-weight:700;font-size:clamp(12px,3cqw,26px);color:#fff;text-shadow:2px 0 var(--ink),-2px 0 var(--ink),0 2px var(--ink),0 -2px var(--ink);animation:rise .9s steps(9) forwards}
.num.hurt{color:#ff8a6a}.num.crit{color:var(--gold)}.num.heal{color:#9be35a}.num.miss{color:#cfd6e0}
@keyframes rise{to{transform:translate(-50%,-190%);opacity:0}}
#title{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;background:rgba(14,12,22,.45)}
#title .logo{font-size:clamp(26px,7.5cqw,64px);font-weight:700;color:var(--parch);text-shadow:4px 4px 0 var(--ink),0 0 0 var(--ink);letter-spacing:.02em;line-height:.95;text-align:center}
#title .logo em{display:block;font-style:normal;color:var(--ember);font-size:.45em;letter-spacing:.3em;text-transform:uppercase}
#title .panel{min-width:40%}
.help{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:VT323,monospace;font-size:19px;color:var(--steel)}
.help kbd{font-family:inherit;color:var(--parch);background:var(--night2);border:1px solid #3a4458;padding:0 5px}
#pad{display:none;justify-content:space-between;align-items:center;gap:16px;padding-block:4px}
@media (pointer:coarse),(max-width:720px){#pad{display:flex}}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pb{font:inherit;font-size:20px;background:var(--night2);color:var(--parch);border:3px solid #3a4458;touch-action:none;-webkit-tap-highlight-color:transparent}
.pb:active,.pb.on{background:var(--ember);border-color:var(--ember);color:var(--ink)}
.ab{display:flex;gap:12px;align-items:center}
.ab .pb{width:68px;height:68px;border-radius:50%;font-weight:700}
#touch{inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:56%;height:58%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:30%;top:66%;width:30cqw;height:30cqw;max-width:150px;max-height:150px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(20,12,28,.22);border:2px solid rgba(255,255,255,.28);opacity:.55;transition:opacity .15s}
#stick.on{opacity:1}
#stick i{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:rgba(239,224,187,.45);border:2px solid rgba(255,255,255,.5)}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(20,12,28,.28);border:2px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);font:700 clamp(14px,5cqw,26px) "Pixelify Sans",monospace;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.tb.on{background:rgba(224,105,47,.6)}
#tbA{right:5%;bottom:12%;width:19cqw;height:19cqw;max-width:96px;max-height:96px}
#tbB{right:26%;bottom:24%;width:14cqw;height:14cqw;max-width:72px;max-height:72px}
body.touch .help{display:none}
body.touch #hint{bottom:auto;top:30%}
@media (orientation:portrait){
  .ui{font-size:clamp(10px,3.1cqw,18px)}
  #hud{width:54%}#hudR{max-width:44%}#bstat{width:62%}
  #battle{grid-template-columns:1.15fr 1fr}
  #blog{height:5.2em}
  #bcmds{max-height:10em}
  #title .panel{min-width:72%}
  .audio label{display:none}
}
#dock{display:grid;grid-template-columns:1.1fr 1fr;gap:10px;font-size:15px;align-items:start}
.dstat{display:flex;flex-direction:column;gap:6px;min-width:0}
.drow{display:flex;align-items:center;gap:6px}.drow b{width:3.2em;font-size:.9em}.drow .bar{flex:1;height:.8em}
.drow span{font-family:VT323,monospace;font-size:1.15em;min-width:4.2em;text-align:right}
.dmeta{display:flex;justify-content:space-between;gap:6px;font-family:VT323,monospace;font-size:1.2em;line-height:1}
#dSt:empty{display:none}
#dItems{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.di{font:inherit;font-size:13px;line-height:1.1;background:var(--parch2);color:var(--ink);border:2px solid var(--ink);padding:6px 4px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
.di b{font-family:VT323,monospace;font-size:1.3em;font-weight:400}
.di.bag{grid-column:1/-1;flex-direction:row;gap:8px;min-height:40px;background:var(--parch)}.di.bag b{font-size:1.1em;color:#6b5a44}
.mat{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding:.15em .45em .15em 1.3em}.mat .sub{display:block;font-family:VT323,monospace;font-size:1.15em;line-height:1.3;color:#6b5a44}
.mat .r{white-space:nowrap;font-family:VT323,monospace;font-size:1.2em}
.di:active:not([disabled]){background:var(--ember)}.di[disabled]{opacity:.45}
.di:focus-visible{outline:2px solid var(--ember)}
body.dock #hudR{display:none}body.dock .hpline{display:none}
#fish{left:12%;right:12%;bottom:26%;display:flex;flex-direction:column;gap:.4em;text-align:center}
.fbar{position:relative;height:1.4em;background:#4a362a;border:2px solid var(--ink)}
#fZone{position:absolute;top:0;bottom:0;background:#6fb04a}
#fMark{position:absolute;top:-5px;bottom:-5px;width:4px;margin-left:-2px;background:var(--ember);box-shadow:0 0 0 1px var(--ink)}
.fbtn{font:inherit;font-weight:700;background:var(--ink);color:var(--parch);border:0;padding:.4em;cursor:pointer}
.fbtn:focus-visible{outline:2px solid var(--ember)}
#tbA,#tbB{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tb small{font-size:11px;font-weight:600;margin-top:2px;opacity:.9}
.tb small:empty{display:none}
#rotate{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--parch);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
#rotate b{font:700 24px "Pixelify Sans",monospace}
body.mobile{padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body.mobile .wrap{max-width:none;height:100%;display:block}
body.mobile header,body.mobile .help,body.mobile #dock{display:none!important}
body.mobile #frame{position:fixed;inset:0;border:0;box-shadow:none;width:auto;height:auto;aspect-ratio:auto!important}
body.mobile .ui{font-size:15px}
body.mobile #hud{top:calc(6px + env(safe-area-inset-top,0px));left:6px;width:58%;padding:.35em .55em}
body.mobile #hudR{top:calc(6px + env(safe-area-inset-top,0px));right:6px;max-width:38%;padding:.35em .55em}
body.mobile #hint{display:none!important}
body.mobile #toast{top:calc(22% + env(safe-area-inset-top,0px))}
body.mobile #dialog{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:16px;min-height:6.5em}
body.mobile #menu{inset:auto 0 0 0;max-height:82%;padding-bottom:calc(.6em + env(safe-area-inset-bottom,0px));border-left:0;border-right:0;border-bottom:0;font-size:16px}
body.mobile #menu .opt{min-height:44px;align-items:center}
body.mobile #menu .tab{min-height:38px;padding:.2em .8em}
body.mobile #bstat{top:calc(6px + env(safe-area-inset-top,0px));left:6px;width:62%}
body.mobile #battle{left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr;gap:6px}
body.mobile #blog{height:3.4em;font-size:1.1em}
body.mobile #bcmds{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:none;padding:6px}
body.mobile #bcmds .opt{min-height:50px;border:2px solid var(--ink);background:var(--parch2);flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:0;padding:.3em .5em}
body.mobile #bcmds .opt::before{content:none!important}
body.mobile #bcmds .opt:focus{background:#e9d29b}
body.mobile #bcmds .sec,body.mobile #bcmds .small{grid-column:1/-1}
body.mobile #bcmds .opt.wide{grid-column:1/-1}
body.mobile #title .panel{min-width:80%}
body.mobile #title .logo{font-size:44px}
body.mobile #fish{bottom:calc(32% + env(safe-area-inset-bottom,0px));font-size:16px}
body.mobile #stickZone{width:50%;height:36%;bottom:env(safe-area-inset-bottom,0px)}
body.mobile #stick{left:48%;top:56%;width:36vw;height:36vw;max-width:180px;max-height:180px}
body.mobile #tbA{width:22vw;height:22vw;max-width:110px;max-height:110px;right:5vw;bottom:calc(9% + env(safe-area-inset-bottom,0px))}
body.mobile #tbB{width:16vw;height:16vw;max-width:80px;max-height:80px;right:29vw;bottom:calc(19% + env(safe-area-inset-bottom,0px))}
body.mobile #touch{display:none!important}
body.mobile #mbar{display:flex;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;align-items:stretch;gap:10px;padding:8px 8px 8px 10px;font-size:14px;line-height:1.25}
.mb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.mb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.mb-loc{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mb-time{font-weight:600;white-space:nowrap;color:#6b5a44;font-variant-numeric:tabular-nums}
.mb-hp .bar{flex:1;height:10px;min-width:60px}
.mb-hp span{font-size:12px;white-space:nowrap;color:#6b5a44;font-variant-numeric:tabular-nums}
.mb-sub{font-size:12px;color:#6b5a44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-sub.ok{color:#3d6b25;font-weight:600}
#mbBag{flex:none;min-width:62px;font:700 15px "Pixelify Sans",system-ui,sans-serif;background:var(--ink);color:var(--parch);border:0;padding:0 12px;cursor:pointer}
#mbBag:active{background:var(--ember)}
body.mobile .ui .small,body.mobile .ui .sub,body.mobile .ui .r,body.mobile #blog,body.mobile #menu .note,body.mobile #menu .sec,body.mobile .mat .sub{font-family:"Pixelify Sans",system-ui,sans-serif}
body.mobile .ui .small,body.mobile .ui .sub,body.mobile #menu .note,body.mobile .mat .sub{font-size:12.5px;line-height:1.5}
body.mobile .ui .r{font-size:14px;line-height:1.2}
body.mobile #menu .sec{font-size:11px;padding-top:.8em}
body.mobile #menu .mh b{font-size:17px}
body.mobile #menu .opt,body.mobile .mat{font-size:15px;gap:12px}
body.mobile #menu .opt>span:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
body.mobile #blog{font-size:13px;line-height:1.3;height:4em}
body.mobile #bstat{left:6px;right:6px;width:auto}
body.mobile #bstat .panel{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
body.mobile #bstat .bar{flex-basis:100%}
body.mobile .bpr b{font-size:14px}
body.mobile #bcmds .opt{font-size:15px;font-weight:600}
body.mobile #bcmds .opt .r{font-size:12px;font-weight:400}
body.mobile #dialog{font-size:15px;line-height:1.4}
body.mobile #dialog .who{font-size:14px;margin-bottom:2px}
body.mobile #toast{font-size:14px;white-space:normal;max-width:86%;text-align:center}
.cprev{display:flex;gap:12px;align-items:flex-end;justify-content:center;padding:.3em 0 .5em}.cprev img{image-rendering:pixelated}
.swrow{display:flex;flex-wrap:wrap;gap:6px;padding:.15em .45em .45em}.swb{min-width:30px;height:30px;border:2px solid var(--ink);cursor:pointer;padding:0 8px;font:inherit;font-size:14px;background:var(--parch2);color:var(--ink)}.swb.on{outline:3px solid var(--ember);outline-offset:1px}
.txt{display:block;width:100%;margin:.3em 0;font:14px/1.3 ui-monospace,Menlo,monospace;padding:6px 8px;border:2px solid var(--ink);background:#fff8e4;color:var(--ink);resize:vertical;word-break:break-all}
.txt:focus{outline:2px solid var(--ember)}
#menu{z-index:5}#dialog{z-index:6}
.tuthead{display:flex;justify-content:space-between;align-items:baseline;padding:.2em .45em}.tuthead b{font-size:1.15em}
.tutimg{width:100%;max-width:400px;align-self:center;image-rendering:pixelated;border:3px solid var(--ink);display:block}
.tuttext{margin:.3em .45em;line-height:1.4}
.tutnav{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.tutnav .opt{justify-content:center;border:2px solid var(--ink);background:var(--parch2)}.tutnav .opt::before{content:none!important}
.skipb{position:absolute;right:.5em;top:-1.9em;font:600 13px "Pixelify Sans",system-ui,sans-serif;background:var(--ink);color:var(--parch);border:0;padding:.25em .8em;cursor:pointer}
#bcmds.wait .opt:not(.hot){opacity:.62}
.bar.atb{height:.5em;margin-top:2px}.bar.atb>i{background:#5fa8e0;transition:none}.bar.atb.rdy>i{background:var(--gold)}
.bar.atb.e>i{background:#c86a4a}.bar.atb.t>i{background:var(--blood)}
.tellbar{margin-top:3px}.tellbar .small{font-weight:700}
#bcmds .sec.q{color:#3a6ec4}
.opt.hot{background:#f4c27a!important;animation:hotp .5s steps(2) infinite}
@keyframes hotp{50%{background:#ffe2a8}}
@media (prefers-reduced-motion:reduce){.num{animation-duration:.01s}#dialog .more{animation:none}}
</style>
</head>
<body>

<div id="rotate" hidden><b>Please rotate your phone</b><span>Hunters of Mossvale is played in portrait.</span></div>
<div class="wrap">
  <header>
    <h1>Hunters of <span>Mossvale</span></h1>
    <div class="audio"><button id="mute" type="button" aria-pressed="true">Sound: on</button><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="60"></div>
  </header>
  <div id="frame">
    <canvas id="cv" width="320" height="240" aria-label="Game screen"></canvas>
    <div id="fx"></div>
    <div id="hud" class="ui panel" hidden></div>
    <div id="hudR" class="ui panel" hidden></div>
    <div id="hint" class="ui panel" hidden></div>
    <div id="mbar" class="ui panel" hidden></div>
    <div id="bstat" class="ui" hidden></div>
    <div id="battle" class="ui" hidden>
      <div id="bleft" class="panel"><div id="bpl"></div><div id="blog"></div></div>
      <div id="bcmds" class="panel"></div>
    </div>
    <div id="toast" class="ui panel" hidden></div>
    <div id="banner" class="ui" hidden></div>
    <div id="fish" class="ui panel" hidden><b id="fishT"></b><div class="fbar" id="fBar" hidden><i id="fZone"></i><b id="fMark"></b></div><div class="small" id="fishS"></div><button type="button" id="fishBtn" class="fbtn">Pull!</button></div>
    <div id="menu" class="ui panel" hidden></div>
    <div id="dialog" class="ui panel" hidden></div>
    <div id="touch" class="ui" hidden>
      <div id="stickZone"><div id="stick"><i></i></div></div>
      <button class="tb" id="tbB" data-k="b" type="button" aria-label="Bag / back">B<small>Bag</small></button>
      <button class="tb" id="tbA" data-k="a" type="button" aria-label="Action / confirm">A<small id="tbAL"></small></button>
    </div>
    <div id="title" class="ui">
      <div class="logo"><em>A turn-based hunt</em>Hunters of<br>Mossvale</div>
      <div class="panel" id="titleMenu"></div>
    </div>
  </div>
  <div id="dock" class="panel" hidden>
    <div class="dstat">
      <div class="drow"><b>HP</b><div class="bar" id="dHpBar"><i id="dHp"></i></div><span id="dHpT"></span></div>
      <div class="drow"><b>Focus</b><div class="bar f"><i id="dFo"></i></div><span id="dFoT"></span></div>
      <div class="dmeta"><span id="dTime"></span><span id="dFaint"></span></div>
      <div class="dmeta no" id="dSt"></div>
    </div>
    <div id="dItems"></div>
  </div>
  <div class="help">
    <span><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move · choose</span>
    <span><kbd>Z</kbd>/<kbd>Space</kbd> act · confirm</span>
    <span><kbd>X</kbd>/<kbd>Esc</kbd> bag · back</span>
    <span><kbd>M</kbd> mute</span>
    <span><kbd>T</kbd> chat</span>
    <span>Watch for monster tells — then <b>Guard</b>.</span>
  </div>
</div>

const RW=20,RH=34;
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function genRoom(id){const R=ROOMS[id],cave=R.zone==='cave',r=rng(R.seed);
  const WALL=cave?'#':'T',GR=cave?':':'.',ENC=cave?';':',',PATH=cave?':':'=';
  const G=[];for(let y=0;y<RH;y++){G.push([]);for(let x=0;x<RW;x++)G[y].push(x===0||y===0||x===RW-1||y===RH-1?WALL:GR)}
  const inside=(x,y)=>x>0&&y>0&&x<RW-1&&y<RH-1;
  const kinds=cave?[['#',.5],[ENC,.35],['L',.15]]:[['T',.36],[ENC,.34],['w',.12],['r',.18]];
  for(let i=0;i<42;i++){let v=r(),k=kinds[0][0];for(const[kk,pp]of kinds){if((v-=pp)<0){k=kk;break}}
    const cx=1+Math.floor(r()*(RW-2)),cy=1+Math.floor(r()*(RH-2)),rad=k==='r'?0:k==='L'?1:1+Math.floor(r()*(k===ENC?3:2));
    for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++)if(x*x+y*y<=rad*rad+1&&inside(cx+x,cy+y))G[cy+y][cx+x]=k}
  const CX=10,CY=Math.floor(RH/2);
  const paint=(x,y)=>{for(const[dx,dy]of[[0,0],[1,0],[0,1],[1,1]])if(inside(x+dx,y+dy))G[y+dy][x+dx]=PATH};
  const carve=(x,y)=>{let n=0;while((x!==CX||y!==CY)&&n++<200){paint(x,y);const ddx=Math.sign(CX-x),ddy=Math.sign(CY-y);if(ddx&&(!ddy||r()<.5))x+=ddx;else y+=ddy}paint(CX,CY)};
  const exits=[];
  if(R.n){G[0][9]=G[0][10]=PATH;carve(9,1);exits.push([9,0])}
  if(R.s){G[RH-1][9]=G[RH-1][10]=PATH;carve(9,RH-3);exits.push([9,RH-1])}
  if(R.w){G[CY-1][0]=G[CY][0]=PATH;carve(1,CY-1);exits.push([0,CY-1])}
  if(R.e){G[CY-1][RW-1]=G[CY][RW-1]=PATH;carve(RW-3,CY-1);exits.push([RW-1,CY-1])}
  if(R.camp){for(let x=7;x<=12;x++)for(let y=RH-4;y<=RH-2;y++)G[y][x]=GR;carve(9,RH-4);G[RH-1][9]='E';exits.push([9,RH-1])}
  const SOL=new Set(['T','w','r','#','L','E']);const seen=new Set([CY*RW+CX]);const q=[[CX,CY]];
  while(q.length){const[x,y]=q.pop();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=RW||ny>=RH)continue;const k=ny*RW+nx;if(seen.has(k)||SOL.has(G[ny][nx]))continue;seen.add(k);q.push([nx,ny])}}
  for(let y=1;y<RH-1;y++)for(let x=1;x<RW-1;x++)if(!SOL.has(G[y][x])&&!seen.has(y*RW+x))G[y][x]=WALL;
  const far=(x,y)=>exits.every(([ex,ey])=>Math.abs(ex-x)+Math.abs(ey-y)>4);
  const cand=[];for(const k of seen){const x=k%RW,y=(k-x)/RW;if(inside(x,y)&&G[y][x]===GR&&far(x,y))cand.push([x,y])}
  cand.sort((a,b)=>a[1]*RW+a[0]-(b[1]*RW+b[0]));
  for(let i=cand.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
  const types=cave?['o','f','o','b','f']:['h','h','y','b','o'];const nn=R.secret?11:6+Math.floor(r()*2);
  for(let i=0;i<nn&&cand.length;i++){const[x,y]=cand.pop();G[y][x]=types[i%types.length]}
  const spawns=[];for(const[x,y]of cand){if(spawns.length>=4)break;if(spawns.every(([a,b])=>Math.abs(a-x)+Math.abs(b-y)>6))spawns.push([x,y])}
  if(!spawns.length)spawns.push([CX+1,CY+1]);
  R.spawns=spawns;MAPS[id]=G.map(row=>row.join(''))}
for(const id in ROOMS)if(ROOMS[id].zone)genRoom(id);

function buildGround(key){const m=MAPS[key];const c=document.createElement('canvas');c.width=m[0].length*16;c.height=m.length*16;const x2=c.getContext('2d');const cave=zoneOf(key)==='cave';

  else if(t==='y'){p.rect(3,11,12,4,'leather',2);p.disc(9,11,6,1,'dirt',3);p.disc(9,6,5,5,'gold',2);for(let i=0;i<3;i++)p.line(5,3+i*3,13,3+i*3,'gold',1,1,true);p.px(9,8,'ink',0,true);if(f)p.px(14,3,'ink',0,true);else p.px(3,4,'ink',0,true)}
  else if(t==='b'){p.rect(2,11,14,4,'leather',2);p.rect(2,11,14,1,'leather',3);p.disc(5+f,8,1,1,'gold',4,true);p.disc(12-f,6,1,1,'leaf',4,true);p.px(8,4+f,'gold',3,true)}

function mapObjects(key){const m=MAPS[key],o=[];const at=(x,y)=>(m[y]||'')[x]||'';
  m.forEach((row,y)=>[...row].forEach((ch,x)=>{const X=x*16,Y=y*16;
    if(ch==='T')o.push({y:Y+15,d:()=>blit(treeSpr(Math.floor(hs(x,y,5)*3),zoneOf(key)==='snow'?'snow':zoneOf(key)==='forest'),X-7,Y-19,hs(x,y,6)>.5)});
    else if(ch==='r')o.push({y:Y+14,d:()=>blit(zoneOf(key)==='snow'?iceRockSpr():rockSpr(),X-2,Y+1)});
    else if(ch==='H'&&at(x,y-1)!=='H'&&at(x-1,y)!=='H')o.push({y:Y+31,d:()=>blit(houseSpr(x+y),X-4,Y-18)});
    else if(ch==='Q')o.push({y:Y+15,d:()=>blit(boardSpr(),X-3,Y-7)});
    else if(ch==='B')o.push({y:Y+15,d:()=>{blit(npcSpr('B',Math.floor(T0*2)%2?1:0),X-3,Y-14);blit(anvilSpr(Math.floor(T0*3)%3===0?1:0),X+13,Y+4)}});
    else if(ch==='M')o.push({y:Y+15,d:()=>{blit(stallSpr(),X-12,Y-14);blit(npcSpr('M',0),X-3,Y-15+(Math.floor(T0*1.5)%2))}});
    else if(ch==='C')o.push({y:Y+15,d:()=>{blit(npcSpr('C',0),X-3,Y-14+(Math.floor(T0*1.7)%2));blit(potSpr(Math.floor(T0*4)%2),X+13,Y+2)}});
    else if(ch==='Z')o.push({y:Y+15,d:()=>blit(chestSpr(),X-1,Y+1)});
    else if(ch==='G')o.push({y:Y+15,d:()=>blit(gateSpr(),X-18,Y-24)});
    else if(ch==='E')o.push({y:Y+15,d:()=>{blit(tentSpr(),X-8,Y-12);blit(fireSpr(Math.floor(T0*8)%4),X+17,Y-2)}});
  }));return o}

    for(let i=0;i<22;i++){const x=i*15-4,hh=18+((i*5)%3)*8;pt.poly([[x,110],[x+7,110-hh],[x+14,110]],'pine',1);pt.poly([[x+4,110-hh+6],[x+7,110-hh],[x+10,110-hh+6]],'white',3)}
    x2.drawImage(pt.render({shade:false,outline:false}),0,0);
    F(x2,0,108,W,132,'snow',2);F(x2,0,108,W,2,'snow',1);for(let i=0;i<5;i++)F(x2,0,124+i*22,W,1,'snow',1)}
  else{F(x2,0,0,W,64,'water',2);F(x2,0,64,W,48,'water',4);
    pt.disc(60,26,20,5,'white',2);pt.disc(230,40,26,6,'white',2);pt.disc(150,16,14,4,'white',2);

    for(let i=0;i<27;i++){const x=i*12-6,hh=16+((i*5)%3)*7;pt.poly([[x,110],[x+7,110-hh],[x+14,110]],'leaf',1)}

  return bgCache[zone]=c}

const IDD=new Map(Object.entries(ID_WORDS));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const IDR=ID_PATTERNS.map(([en,id])=>{const ord=[];const src='^'+reEsc(en).replace(/\\\{(\d)\\\}/g,(_,n)=>{ord.push(+n);return '(.+?)'})+'$';return[new RegExp(src),id,ord]});
function trCap(s){const o=trK(s);if(o!=null)return o;if(s.includes(', ')){const p=s.split(', ');return p.map(x=>tr1(x)??x).join(', ')}return s}
function tr1(k){const d=IDD.get(k);if(d!=null)return d;
  for(const[re,id,ord]of IDR){const m=k.match(re);if(m)return id.replace(/\{(\d)\}/g,(_,n)=>trCap(m[ord.indexOf(+n)+1]))}
  return null}
function seg(k,sep){if(!k.includes(sep))return null;const p=k.split(sep);const q=p.map(x=>tr1(x.trim())??x);return q.some((v,i)=>v!==p[i])?q.join(sep):null}
function trK(k){const d=IDD.get(k);if(d!=null)return d;return seg(k,' · ')??tr1(k)??seg(k,' — ')}
function tr(s){if(LANG!=='id'||!s||typeof s!=='string')return s;const k=s.trim();if(!k)return s;
  const o=trK(k);
  if(o==null)return s;const lead=s.match(/^\s*/)[0],trail=s.match(/\s*$/)[0];return lead+o+trail}
const TRS=new WeakMap();
function trNode(n){const pe=n.parentElement;if(!pe||pe.closest('.dtx,textarea,script,style'))return;const v=n.nodeValue;
  const rec=TRS.get(n);if(rec&&rec.out===v)return;const out=tr(v);if(out!==v){TRS.set(n,{src:v,out});n.nodeValue=out}}
function trTree(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))trNode(n)}
function untrTree(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const r=TRS.get(n);if(r&&r.out===n.nodeValue){n.nodeValue=r.src;TRS.delete(n)}}}
new MutationObserver(ms=>{if(LANG!=='id')return;for(const m of ms){if(m.type==='characterData')trNode(m.target);else for(const a of m.addedNodes){if(a.nodeType===3)trNode(a);else if(a.nodeType===1)trTree(a)}}})
  .observe(document.body,{subtree:true,childList:true,characterData:true});

  if(nx<0||ny<0||ny>=cm.length||nx>=cm[0].length){const R=ROOMS[S.map],dk={up:'n',down:'s',left:'w',right:'e'}[d];if(R&&R[dk])changeRoom(R[dk],dk);return}

  const mb=S.Q&&mobAt(nx,ny);if(mb){if(mb.cool<=0)mobEngage(mb,mb.dir===d?'ambush':'player');else{P.dir=d;updHint()}return false}
  if(kittenAt(nx,ny)){rescueCat();return false}

  if(SOLID.has(tile(nx,ny))){if(!P.bumpT||T0-P.bumpT>.35){P.bumpT=T0;sfx('bump')}updHint();return false}

      if(tryMove(d)===false&&typeof stk!=='undefined'&&stk&&stk.sec&&stk.sec!==d){if(tryMove(stk.sec)===false)P.dir=d}}
    else if(P.path.length){if(tryMove(P.path.shift())===false){P.path=[];P.after=null}}
    else if(P.after){const a=P.after;P.after=null;if(a.face){P.dir=a.face;updHint()}if(a.exit)tryMove(a.exit);else if(a.act==='boss'||a.act==='mob')tryMove(P.dir);else if(a.act)interact()}}
}
function changeRoom(to,dk){const m=MAPS[to];S.map=to;P.mv=null;

  catSnap();MOBG=1.6;if(S.Q&&ROOMS[to].secret&&!(S.found=S.found||{})[to]){S.found[to]=1;setTimeout(()=>{toast('Secret area found!');sfx('break')},500)}

function updHint(){let t='';const[fx,fy]=facing();
  if(S.Q){const n=nodeAt(P.x,P.y)||nodeAt(fx,fy);const mb=mobAt(fx,fy);if(mb)t='A: Attack '+MON[mb.key].name;else if(n){const[x,y]=nxy(n);t='A: Gather '+(NODE[tile(x,y)]==='ore'?'Ore':ITEMS[NODE[tile(x,y)]].name)}
    else{const ft=tile(fx,fy);if(ft==='E')t='A: Base Camp';else if(ft==='w')t='A: Fish';else if(ft==='L')t=have('bait')?'A: Lava fishing':'Lava fishing needs Magma Bait'}}

  if(kittenAt(fx,fy))t='A: Rescue kitten';if(merchAt(fx,fy))t='A: Traveling Merchant';{const vh=vhAt(fx,fy);if(vh)t='A: '+vh.n}{const op=mpAt(fx,fy);if(op)t='A: '+MP.ps[op].n}

  const lab=!t||!t.startsWith('A: ')?'':t.startsWith('A: Gather')?'Gather':t.startsWith('A: Attack')?'Attack':/Fish|fishing/.test(t)?'Fish':t==='A: Base Camp'?'Camp':t==='A: South Gate'?'Depart':t==='A: Item Chest'?'Open':'Talk';

async function onStep(){updHint();mpStep();P.steps=(P.steps||0)+1;if(P.steps%2===0){sfx('step',zoneOf(S.map));dust(P.x*16+8,P.y*16+15)}const Q=S.Q;if(!Q)return;

  if(Q.weather==='blizzard'&&!Q.warm&&S.arm!=='ar5'&&S.arm!=='arO'&&!LZ()&&Q.steps%4===0){S.hp=Math.max(1,S.hp-1);if(Q.steps%40===0)toast('Freezing! A Hot Drink keeps you warm.')}

async function gather(k){const Q=S.Q;const[x,y]=nxy(k);let it=NODE[tile(x,y)];

  parts.forEach((p,i)=>{if(i)s.append(' · ');s.append(p)});if(z!=null){s.append(' · ');s.append(h('span',{cls:S.zenny>=z?'ok':'no'},z+'z'))}return s}

const TWISTS={nopot:{name:'No Potions',d:'Potions and Mega Potions cannot be used.'},rush:{name:'Rush',d:'The time limit is halved.'},frenzy:{name:'Frenzy',d:'Monsters hit 25% harder.'},solo:{name:'Solo',d:'Your buddy stays home.'}};
function bounties(){const day=todayKey();const pool=QUESTS.filter(q=>(q.type==='hunt'||q.type==='slay'||q.type==='alpha')&&S.done[q.id]);
  if(S.bounty&&S.bounty.day===day&&(S.bounty.list.length>=3||S.bounty.list.length>=pool.length))return S.bounty.list;
  const keep=S.bounty&&S.bounty.day===day?S.bounty.list:[];let seed=[...day].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);const r2=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const p=pool.filter(q=>!keep.some(b=>b.q===q.id)),tw=Object.keys(TWISTS),list=keep.slice();
  while(list.length<3&&p.length){const q=p.splice(Math.floor(r2()*p.length),1)[0];list.push({q:q.id,tw:tw[Math.floor(r2()*tw.length)],done:false})}
  S.bounty={day,list};return list}

function mobFree(x,y){const m=curMap();if(x<1||y<1||y>=m.length-1||x>=m[0].length-1)return false;const c=tile(x,y);
  if(SOLID.has(c)||c==='w'||c==='L'||NODE[c])return false;if(mobAt(x,y)||kittenAt(x,y))return false;const b=S.Q.boss;return !(b&&b.alive&&b.room===S.map&&b.x===x&&b.y===y)}
function mobTick(dt){const Q=S.Q;if(!Q||!Q.mobs||S.scene!=='world')return;
  for(const m of Q.mobs)if(m.mt<1)m.mt=Math.min(1,m.mt+dt*5);

  for(const m of Q.mobs){if(!m.alive||m.room!==S.map)continue;m.next-=dt;if(m.next>0)continue;
    const dx=P.x-m.x,dy=P.y-m.y,dist=Math.abs(dx)+Math.abs(dy);const sees=m.cool<=0&&dist<=4;
    if(sees&&!m.chase){m.chase=true;m.next=.45;sfx('tell');continue}
    m.chase=sees;m.next=sees?rnd(.42,.62):rnd(.9,1.9);

    else{if(Math.random()<.4)continue;dirs=[['up','down','left','right'][ri(0,3)]]}

Object.assign(STORY_ID,{"Up early? Good. The best hunters warm up before the sun does.": "Bangun pagi? Bagus. Pemburu terbaik pemanasan sebelum matahari terbit.", "Swing, recover, swing. A greatsword rewards patience.": "Ayun, pulih, ayun. Greatsword menghargai kesabaran.", "Nothing beats a hot meal after a long hunt. Eat before you head out, too.": "Tak ada yang mengalahkan makanan hangat setelah berburu. Makan juga sebelum berangkat.", "Rest well. Monsters grow stronger at night, but they drop rarer parts.": "Istirahatlah. Monster lebih kuat di malam hari, tapi menjatuhkan bahan lebih langka.", "When a monster flashes GUARD!, brace yourself. A good guard takes most of the sting out.": "Saat monster memunculkan GUARD!, bertahanlah. Tahan yang tepat meredam sebagian besar serangan.", "The Verdant Wyrm spits venom. Pack Antidotes, and hit it with fire.": "Verdant Wyrm menyemburkan racun. Bawa Antidote, dan serang dengan api.", "Frostpeak blizzards chill you to the bone. A Hot Drink keeps you warm.": "Badai salju Frostpeak menusuk sampai tulang. Hot Drink membuatmu tetap hangat.", "The Rimeback Tusker hates fire. Ice just bounces off its hide.": "Rimeback Tusker benci api. Es cuma memantul dari kulitnya.", "The Cinder Drake laughs at fire. Bring venom or ice instead.": "Cinder Drake menertawakan api. Bawa racun atau es saja.", "Your armor is your second life. Keep it upgraded with White Shards.": "Zirahmu adalah nyawa keduamu. Terus upgrade dengan White Shard.", "Subspecies are a different beast. The Crimson Wyrm fears ice, not fire.": "Subspesies itu lain cerita. Crimson Wyrm takut es, bukan api.", "Black and White Gems only come from subspecies. They take your gear past +5.": "Black dan White Gem hanya didapat dari subspesies. Itu yang membawa gear-mu melewati +5.", "Five more minutes... fine, I'm up! Race you to the Quest Board!": "Lima menit lagi... ya sudah, aku bangun! Balapan ke Papan Quest, yuk!", "Ooh, new jobs on the board! I'm taking the flashy ones.": "Ooh   body.append(h('div',{cls:'sec'},'Emotes'));const r=h('div',{cls:'swrow'});
  for(const e of MP_EMO){const b=h('button',{type:'button',cls:'swb'},e);b.onclick=()=>{if(mpSay(e)){MENU.onClose=null;closeMenu()}};r.append(b)}body.append(r);
  body.append(h('div',{cls:'sec'},'Chat'));const inp=h('input',{type:'text',maxlength:'60',autocomplete:'off',cls:'txt',placeholder:tr('Type a message…')});
  const send=()=>{if(mpSay(inp.value)){inp.value='';redraw()}};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};
  body.append(inp,opt('Send','',send));
  {const gw=MP.inbox.filter(x=>x.st==='new').length;if(gw)body.append(opt(`Gifts waiting (${gw})`,'🎁',()=>{MENU.onClose=null;closeMenu();giftMenu()}))}
  if(MP.log.length){body.append(h('div',{cls:'sec'},'Recent'));for(const[n,t]of MP.log.slice().reverse())body.append(h('div',{cls:'note'},`${n}: ${t}`))}
  const here2=Object.entries(MP.ps).filter(([,o])=>o.h);
  if(here2.length){body.append(h('div',{cls:'sec'},'Hunters here'));
    for(const[id,o]of here2)body.append(opt(h('span',{},o.n,h('span',{cls:'sub'},o.pr?`HR ${o.pr[0]}`:'')),mpMuted(o.n)?'🔇':'›',()=>{MENU.onClose=null;closeMenu();mpCard(id)}))}
  setTimeout(()=>{try{inp.focus()}catch(e){}},60)})}
/* ---- hunter card ---- */
const MP_ACH=['Wyrm Slayer','Tusker Breaker','Hunter of Mossvale','Pack Breaker','Subspecies Conqueror','Master Smith','Bounty Hunter','Buddy Partner'];
function mpAt(x,y){if(!MP||MP.st!=='on'||!S||S.map!=='village'||S.Q)return null;for(const id in MP.ps){const o=MP.ps[id];if(o.h&&o.x===x&&o.y===y)return id}return null}
function mpLookImg(o){const sv=[S.look,S.arm];S.look=o.l;S.arm=o.a;try{return portrait('hunter')}finally{S.look=sv[0];S.arm=sv[1]}}
function mpCard(id){if(!MP.ps[id])return;sfx('move');openMenu(MP.ps[id].n,body=>{const o=MP.ps[id];if(!o||!o.h){body.append(h('div',{cls:'note'},'This hunter has left the village.'));return}
  const c=mpSpr(o,'down',0);body.append(h('div',{cls:'cprev'},h('img',{src:mpLookImg(o),alt:'',style:'width:72px;height:72px'}),h('img',{src:c.toDataURL(),alt:'',style:`width:${c.width*3}px;height:${c.height*3}px`})));
  const pr=o.pr;
  if(!pr)body.append(h('div',{cls:'note'},'Profile unavailable (older game version).'));
  else{body.append(h('div',{cls:'note'},`Hunter Rank ${pr[0]} · ${pr[3]} quests cleared`));
    body.append(h('div',{cls:'sec'},'Gear'),h('div',{cls:'note'},WEAPONS[o.w].name+(pr[1]?' +'+pr[1]:'')),h('div',{cls:'note'},ARMORS[o.a].name+(pr[2]?' +'+pr[2]:'')));
    const ach=MP_ACH.filter((_,i)=>pr[4]&(1<<i));body.append(h('div',{cls:'sec'},`Titles · ${ach.length}/${MP_ACH.length}`));
    if(ach.length){const r=h('div',{cls:'swrow'});for(const a of ach)r.append(h('span',{cls:'swb on',style:'display:inline-flex;align-items:center;cursor:default'},a));body.append(r)}
    else body.append(h('div',{cls:'note'},'No titles yet.'))}
  const r=h('div',{cls:'swrow'});for(const e of MP_EMO){const b=h('button',{type:'button',cls:'swb'},e);b.onclick=()=>{if(mpSay(e)){MENU.onClose=null;closeMenu()}};r.append(b)}
  body.append(h('div',{cls:'sec'},'Emotes'),r);
  const mu=mpMuted(o.n);
  if(pr)body.append(opt('Send a gift','🎁',()=>{MENU.onClose=null;closeMenu();giftPick(id)},!!S.giftOut||mu||!mpHere()));
  if(S.giftOut)body.append(h('div',{cls:'note'},'You already have a gift waiting for an answer.'));
  body.append(opt(mu?'Unmute':'Mute','',()=>{S.mpMute=(S.mpMute||[]).filter(x=>x!==o.n.toLowerCase());if(!mu)S.mpMute.push(o.n.toLowerCase());save();redraw()}))})}
/* ---- gifts: escrow + 3-step handshake (offer → accept → final) ---- */
const mpGiftOK=k=>!!(ITEMS[k]&&(ITEMS[k].sell||ITEMS[k].use)&&!/^seed/.test(k));
function giftPick(id){let sel=null,qty=1;openMenu('Send a gift',body=>{const o=MP.ps[id];if(!o||!o.h){body.append(h('div',{cls:'note'},'This hunter has left the village.'));return}
  body.append(h('div',{cls:'note'},`To ${o.n}. They must accept within 45 seconds, or the gift comes back to you.`));
  if(!sel||have(sel)<1){sel=null;const ks=Object.keys(S.inv).filter(k=>have(k)>0&&mpGiftOK(k));if(!ks.length)body.append(h('div',{cls:'note'},'Nothing to give.'));
    for(const k of ks)body.append(opt(ITEMS[k].name,'×'+have(k),()=>{sel=k;qty=1;redraw()}));return}
  const mx=Math.min(99,have(sel));qty=Math.max(1,Math.min(qty,mx));body.append(h('div',{cls:'sec'},`${ITEMS[sel].name} · ${qty}/${mx}`));
  const r=h('div',{cls:'swrow'});for(const[l,f]of[['-5',q=>q-5],['-1',q=>q-1],['+1',q=>q+1],['+5',q=>q+5],['Max',()=>99]]){const b=h('button',{type:'button',cls:'swb'},l);b.onclick=()=>{qty=Math.max(1,Math.min(mx,f(qty)));redraw()};r.append(b)}
  body.append(r,opt(`Send ${qty}× ${ITEMS[sel].name}`,'🎁',()=>{if(giftSend(id,sel,qty)){MENU.onClose=null;closeMenu()}}),opt('Choose another item','',()=>{sel=null;redraw()}))})}
function giftSend(id,k,n){const o=MP.ps[id];if(MP.st!=='on'||S.giftOut||!mpHere()||!o||!o.h||!mpGiftOK(k)||!Number.isInteger(n)||n<1||n>99||have(k)<n)return false;
  const gid=Math.random().toString(36).slice(2,12),ts=mpNext(),ch=MP.ch;S.inv[k]-=n;S.giftOut={gid,to:id,name:o.n,k,n,sess:MP.sess,until:mpNow()+GIFT_TTL+5};save();
  mpSign(['g',MP.id,id,gid,k,n,ts]).then(sig=>{if(ch===MP.ch)ch.send({type:'broadcast',event:'gift',payload:{id:MP.id,to:id,gid,k,n,ts,sig}})});
  sfx('coin');toast(`Gift sent to ${o.n}. Waiting…`);hud();return true}
function giftRefund(msg){const g=S.giftOut;if(!g)return;S.giftOut=null;gain(g.k,g.n);save();toast(msg);hud()}
function giftTick(){if(!S)return;const g=S.giftOut;if(g&&(g.sess!==MP.sess||mpNow()>g.until))giftRefund('No answer. Gift returned.');
  const t=mpNow();for(const x of MP.inbox)if(t>x.until){if(x.st==='wait')toast('Gift expired.');x.st='gone'}
  const n0=MP.inbox.length;MP.inbox=MP.inbox.filter(x=>x.st==='new'||x.st==='wait');if(MP.inbox.length!==n0)hud()}
async function mpOnGift(m){if(!m||m.to!==MP.id||typeof m.id!=='string'||typeof m.gid!=='string'||m.gid.length>16||typeof m.ts!=='number'||typeof m.k!=='string')return;
  const o=MP.ps[m.id],c=MP.vk[m.id];if(!o||!c||!o.h||mpMuted(o.n)||MP.gseen.has(m.gid)||MP.inbox.length>=3)return;
  if(!mpGiftOK(m.k)||!Number.isInteger(m.n)||m.n<1||m.n>99)return;
  if(!await mpVerify(c.key,['g',m.id,m.to,m.gid,m.k,m.n,m.ts],m.sig)||MP.gseen.has(m.gid))return;MP.gseen.add(m.gid);
  MP.inbox.push({gid:m.gid,from:m.id,name:o.n,k:m.k,n:m.n,until:mpNow()+GIFT_TTL,st:'new'});sfx('coin');hud();
  if(mpHere()&&!MENU&&!D.open&&!busy)giftMenu();else toast(`🎁 ${o.n} sent you a gift — open the Online menu.`)}
function giftMenu(){openMenu('Gift',body=>{const g=MP.inbox.find(x=>x.st==='new');if(!g){body.append(h('div',{cls:'note'},'No gifts waiting.'));return}
  body.append(h('div',{cls:'note'},`${g.name} wants to give you ${g.n}× ${ITEMS[g.k].name}.`));
  body.append(opt('Accept','✓',()=>giftReply(g,true)),opt('Decline','✕',()=>giftReply(g,false)))})}
function giftReply(g,ok){if(g.st!=='new')return;g.st=ok?'wait':'gone';const ts=mpNext(),ch=MP.ch;
  mpSign(['ga',MP.id,g.from,g.gid,ok,ts]).then(sig=>{if(ch===MP.ch)ch.send({type:'broadcast',event:'gack',payload:{id:MP.id,to:g.from,gid:g.gid,ok,ts,sig}})});
  if(ok){g.until=mpNow()+12;toast('Accepting…')}if(MENU){MENU.onClose=null;closeMenu()}hud();if(MP.inbox.some(x=>x.st==='new'))setTimeout(()=>{if(!MENU&&!D.open)giftMenu()},400)}
async function mpOnGack(m){const g=S&&S.giftOut;if(!g||g.sess!==MP.sess||!m||m.to!==MP.id||m.gid!==g.gid||m.id!==g.to||typeof m.ts!=='number'||typeof m.ok!=='boolean')return;const c=MP.vk[m.id];if(!c)return;
  if(!await mpVerify(c.key,['ga',m.id,m.to,m.gid,m.ok,m.ts],m.sig)||S.giftOut!==g)return;
  if(!m.ok){giftRefund(`${g.name} declined. Gift returned.`);return}
  S.giftOut=null;save();const ts=mpNext(),ch=MP.ch,sig=await mpSign(['gf',MP.id,g.to,g.gid,ts]),pl={id:MP.id,to:g.to,gid:g.gid,ts,sig};
  if(ch===MP.ch){ch.send({type:'broadcast',event:'gfin',payload:pl});setTimeout(()=>{if(ch===MP.ch)ch.send({type:'broadcast',event:'gfin',payload:pl})},600)}
  sfx('forge');toast('Gift delivered!');hud()}
async function mpOnGfin(m){if(!m||m.to!==MP.id||typeof m.ts!=='number')return;const g=MP.inbox.find(x=>x.gid===m.gid&&x.from===m.id&&x.st==='wait'),c=MP.vk[m.id];if(!g||!c)return;
  if(!await mpVerify(c.key,['gf',m.id,m.to,m.gid,m.ts],m.sig)||g.st!=='wait')return;g.st='gone';MP.inbox=MP.inbox.filter(x=>x!==g);
  gain(g.k,g.n);save();sfx('forge');toast(`Received ${g.n}× ${ITEMS[g.k].name} from ${g.name}!`);hud()}
Object.assign(POR,{'Online':'hunter'});
for(const[k,v]of Object.entries({'Online':'Online','Emotes':'Emote','Chat':'Chat','Send':'Kirim','Recent':'Terbaru','Type a message…':'Ketik pesan…','Connecting…':'Menghubungkan…','Wait a moment…':'Tunggu sebentar…',
  'Chat works in Mossvale village.':'Chat hanya di desa Mossvale.','Online mode is off. Fill MP_URL and MP_KEY in the game file.':'Mode online mati. Isi MP_URL dan MP_KEY di file game.',
  'Could not connect. Retrying automatically…':'Gagal terhubung. Mencoba lagi otomatis…','Online needs a secure (https) page.':'Mode online butuh halaman aman (https).',
  'Hunters here':'Pemburu di sini','Mute':'Bisukan','Unmute':'Suarakan','chat':'chat','Online (chat & emotes)':'Online (chat & emote)'}))IDD.set(k,v);
{const ord=[0];IDR.unshift([/^(.+?) hunters in Mossvale$/,'{0} pemburu di Mossvale',ord]);IDR.unshift([/^Online \((.+?)\)$/,'Online ({0})',ord])}
for(const[k,v]of Object.entries({"This hunter has left the village.": "Pemburu ini sudah meninggalkan desa.", "Profile unavailable (older game version).": "Profil tidak tersedia (versi game lama).", "Gear": "Perlengkapan", "Titles": "Gelar", "No titles yet.": "Belum ada gelar.", "Wyrm Slayer": "Pembasmi Wyrm", "Tusker Breaker": "Penakluk Tusker", "Hunter of Mossvale": "Pemburu Mossvale", "Pack Breaker": "Penghancur Kawanan", "Subspecies Conqueror": "Penakluk Subspesies", "Master Smith": "Ahli Tempa", "Bounty Hunter": "Pemburu Bounty", "Buddy Partner": "Sahabat Kucing", "Send a gift": "Kirim hadiah", "You already have a gift waiting for an answer.": "Kamu masih punya hadiah yang menunggu jawaban.", "Nothing to give.": "Tidak ada yang bisa diberikan.", "Choose another item": "Pilih item lain", "Max": "Maks", "Gift": "Hadiah", "No gifts waiting.": "Tidak ada hadiah yang menunggu.", "Accept": "Terima", "Decline": "Tolak", "Accepting…": "Menerima…", "Gift delivered!": "Hadiah terkirim!", "No answer. Gift returned.": "Tidak dijawab. Hadiah dikembalikan.", "Gift expired.": "Hadiah kedaluwarsa."}))IDD.set(k,v);
for(const[en,id]of [["{0} quests cleared", "{0} quest selesai"], ["To {0}. They must accept within 45 seconds, or the gift comes back to you.", "Untuk {0}. Ia harus menerima dalam 45 detik, atau hadiah kembali padamu."], ["Send {0}× {1}", "Kirim {0}× {1}"], ["Gift sent to {0}. Waiting…", "Hadiah dikirim ke {0}. Menunggu…"], ["{0} declined. Gift returned.", "{0} menolak. Hadiah dikembalikan."], ["🎁 {0} sent you a gift — open the Online menu.", "🎁 {0} mengirimimu hadiah — buka menu Online."], ["{0} wants to give you {1}× {2}.", "{0} ingin memberimu {1}× {2}."], ["Received {0}× {1} from {2}!", "Menerima {0}× {1} dari {2}!"], ["Gifts waiting ({0})", "Hadiah menunggu ({0})"]]){const ord=[];const src='^'+reEsc(en).replace(/\\\{(\d)\\\}/g,(_,n)=>{ord.push(+n);return '(.+?)'})+'$';IDR.unshift([new RegExp(src),id,ord])}
mpInit();
