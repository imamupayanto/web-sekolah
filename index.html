<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDN 2 Pesantren</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #241910; background: #F2E9D6; min-height: 100vh; display: flex; flex-direction: column; }

.screen { flex: 1; display: flex; flex-direction: column; }
.tab-bar { background: #FAF4E8; border-top: 2px solid #241910; padding: 8px; display: flex; justify-content: space-around; gap: 4px; position: sticky; bottom: 0; z-index: 10; }
.tab-btn { flex: 1; padding: 6px 4px; border: 2px solid #241910; border-radius: 14px; background: transparent; color: #241910; font-family: inherit; font-weight: 700; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.08s; }
.tab-btn.active { background: #241910; color: #FAF4E8; box-shadow: 2px 2px 0 #241910; }
.tab-btn:active { transform: translate(2px, 2px); }

.brand-bar { padding: 14px 18px; color: #FAF4E8; flex-shrink: 0; }
.brand-header { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.brand-logo { width: 34px; height: 34px; border-radius: 50%; background: #FAF4E8; border: 2px solid #241910; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #241910; flex-shrink: 0; }
.brand-title-big { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 24px; line-height: 1.05; letter-spacing: -0.6px; }

.content { flex: 1; padding: 14px; }

.card { background: #fff; border: 2px solid #241910; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 4px 4px 0 #241910; }
.card.dark    { background: #241910; color: #FAF4E8; }
.card.forest  { background: #3D5C3A; color: #FAF4E8; }
.card.mustard { background: #E8B23A; color: #241910; }
.card.sky     { background: #7CA8B8; color: #241910; }
.card.terra   { background: #D96B3D; color: #FAF4E8; }
.card.crimson { background: #A33A2C; color: #FAF4E8; }

.section-title { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 10px; margin-top: 4px; letter-spacing: -0.3px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.quick-tile { padding: 12px; min-height: 88px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
.quick-tile:active { transform: translate(2px,2px); box-shadow: none !important; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: #FAF4E8; color: #241910; border: 1.5px solid #241910; font-weight: 700; font-size: 11px; white-space: nowrap; }
.pill.dark    { background: #241910; color: #FAF4E8; border-color: #241910; }
.pill.terra   { background: #D96B3D; color: #FAF4E8; border-color: #D96B3D; }
.pill.forest  { background: #3D5C3A; color: #FAF4E8; border-color: #3D5C3A; }
.pill.sky     { background: #7CA8B8; color: #241910; border-color: #7CA8B8; }
.pill.mustard { background: #E8B23A; color: #241910; border-color: #E8B23A; }

.news-img  { width: 80px; flex-shrink: 0; border-right: 2px solid #241910; height: 100px; }
.news-body { flex: 1; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; }
.news-title { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 13px; line-height: 1.3; }
.news-date  { font-size: 11px; color: #5C4A38; font-weight: 500; }

.back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border: 2px solid rgba(255,255,255,0.5); border-radius: 999px; background: rgba(0,0,0,0.15); color: #FAF4E8; cursor: pointer; font-family: inherit; font-weight: 700; font-size: 11px; margin-bottom: 8px; }
.back-btn:hover { background: rgba(0,0,0,0.25); }

.tag-badge { padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.18); color: #FAF4E8; border: 1.5px solid rgba(255,255,255,0.35); font-weight: 700; font-size: 10px; }

.mapel-card { cursor: pointer; margin-bottom: 12px; }
.mapel-card:active { transform: translate(2px,2px); box-shadow: none !important; }
.play-btn { width: 100%; padding: 11px; background: #E8B23A; color: #241910; border: 2px solid #241910; border-radius: 12px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 3px 3px 0 #241910; margin-top: 12px; }
.play-btn:active { transform: translate(2px,2px); box-shadow: none; }
</style>
</head>
<body>

<div class="screen" id="screen"></div>
<div class="tab-bar">
  <button class="tab-btn active" data-tab="home">🏠 Beranda</button>
  <button class="tab-btn" data-tab="news">📰 Berita</button>
  <button class="tab-btn" data-tab="belajar">📚 Belajar</button>
  <button class="tab-btn" data-tab="game">🎮 Game</button>
</div>

<script>
const BASE = "https://sdnegeri2pesantren.vercel.app";
let state = { tab: "home", sub: null };

function go(tab, sub) {
  state = { tab, sub: sub || null };
  document.querySelectorAll(".tab-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  render();
  window.scrollTo(0, 0);
}

function openLink(url) {
  window.open(url, '_blank');
}

function render() {
  const screen = document.getElementById("screen");
  if (state.tab === "home")         screen.innerHTML = renderHome();
  else if (state.tab === "news")    screen.innerHTML = renderNews();
  else if (state.tab === "belajar") {
    if (!state.sub)              screen.innerHTML = renderBelajar();
    else if (state.sub === "osn") screen.innerHTML = renderOSN();
    else if (state.sub === "tka") screen.innerHTML = renderTKA();
  }
  else if (state.tab === "game") screen.innerHTML = renderGame();
}

/* ── HOME ── */
function renderHome() { return `
  <div class="brand-bar" style="background:#D96B3D;">
    <div class="brand-header">
      <div class="brand-logo">S</div>
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:0.85;">SDN 2 Pesantren</div>
        <div style="font-size:9px;font-weight:500;opacity:0.7;">Wanayasa · Banjarnegara</div>
      </div>
    </div>
    <div class="brand-title-big">Halo, <span style="background:#E8B23A;color:#241910;padding:0 8px;border-radius:8px;border:2px solid #241910;display:inline-block;transform:rotate(-2deg);">Sahabat!</span></div>
    <div style="margin-top:4px;font-size:13px;font-weight:500;opacity:0.9;">Selamat datang di rumah belajar kita 🏫</div>
  </div>
  <div class="content">
    <div class="card forest">
      <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;color:#E8B23A;text-transform:uppercase;margin-bottom:6px;">✨ Motivasi Hari Ini</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;line-height:1.3;color:#FAF4E8;">"Belajar bukan tentang pintar — tapi tentang berani mencoba."</div>
    </div>

    <div class="section-title">Akses Cepat</div>
    <div class="grid-2">
      <div class="card mustard quick-tile" onclick="go('news')">
        <div style="font-size:22px;">📰</div>
        <div><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">Berita</div><div style="font-size:11px;font-weight:600;opacity:0.7;">Info sekolah</div></div>
      </div>
      <div class="card sky quick-tile" onclick="go('belajar')">
        <div style="font-size:22px;">📚</div>
        <div><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">Belajar</div><div style="font-size:11px;font-weight:600;opacity:0.7;">OSN & TKA</div></div>
      </div>
      <div class="card terra quick-tile" onclick="go('game')">
        <div style="font-size:22px;">🎮</div>
        <div><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">Game</div><div style="font-size:11px;font-weight:600;opacity:0.75;">2 game seru</div></div>
      </div>
      <div class="card dark quick-tile" style="opacity:0.6;cursor:default;">
        <div style="font-size:22px;">🏆</div>
        <div><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;">Prestasi</div><div style="font-size:11px;font-weight:600;opacity:0.6;">Segera hadir</div></div>
      </div>
    </div>

    <div class="card mustard">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;margin-bottom:5px;">📌 Penting · 27 Apr 2026</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin-bottom:4px;">Upacara Hari Pendidikan Nasional</div>
      <div style="font-size:12px;color:#5C4A38;line-height:1.5;">Seluruh siswa wajib hadir pukul 07.00 dengan seragam putih-merah lengkap.</div>
    </div>

    <div class="section-title">Profil Sekolah</div>
    <div class="card dark">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        ${[["6","Tingkat Kelas"],["A","Akreditasi"],["12+","Guru & Staff"],["Merdeka","Kurikulum"]].map(([v,l])=>`
        <div style="text-align:center;padding:10px;background:rgba(255,255,255,0.07);border-radius:12px;border:1.5px solid rgba(255,255,255,0.1);">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#E8B23A;">${v}</div>
          <div style="font-size:10px;font-weight:600;opacity:0.6;margin-top:2px;">${l}</div>
        </div>`).join("")}
      </div>
    </div>
  </div>
`; }

/* ── BERITA ── */
function renderNews() { return `
  <div class="brand-bar" style="background:#3D5C3A;">
    <div class="brand-header">
      <div class="brand-logo" style="background:#3D5C3A;color:#FAF4E8;border-color:#FAF4E8;">N</div>
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:0.85;">Berita Sekolah</div>
        <div style="font-size:9px;font-weight:500;opacity:0.7;">Yang lagi terjadi di sini</div>
      </div>
    </div>
    <div class="brand-title-big">Berita Terbaru</div>
  </div>
  <div class="content">
    <div class="card" style="display:flex;overflow:hidden;margin-bottom:14px;">
      <div class="news-img" style="background:repeating-linear-gradient(45deg,#D96B3D,#D96B3D 10px,#B5532A 10px,#B5532A 20px);width:100px;height:130px;"></div>
      <div class="news-body" style="justify-content:space-between;">
        <div>
          <span class="pill dark">★ Terbaru</span>
          <div class="news-title" style="margin-top:6px;">Berita akan segera hadir</div>
          <div style="font-size:11px;color:#5C4A38;margin-top:4px;line-height:1.4;">Konten berita sekolah sedang disiapkan oleh admin. Pantau terus!</div>
        </div>
        <div class="news-date">— · —</div>
      </div>
    </div>

    <div class="section-title">Berita Lainnya</div>
    ${[
      ["repeating-linear-gradient(45deg,#E8B23A,#E8B23A 10px,#D49E2A 10px,#D49E2A 20px)","terra","Kegiatan"],
      ["repeating-linear-gradient(45deg,#3D5C3A,#3D5C3A 10px,#2A4128 10px,#2A4128 20px)","forest","Event"],
      ["repeating-linear-gradient(45deg,#7CA8B8,#7CA8B8 10px,#5A8898 10px,#5A8898 20px)","sky","Agenda"],
    ].map(([bg,pill,label])=>`
    <div class="card" style="display:flex;overflow:hidden;">
      <div class="news-img" style="background:${bg};"></div>
      <div class="news-body">
        <span class="pill ${pill}">${label}</span>
        <div class="news-title">Konten segera hadir</div>
        <div class="news-date">—</div>
      </div>
    </div>`).join("")}
  </div>
`; }

/* ── BELAJAR HUB ── */
function renderBelajar() { return `
  <div class="brand-bar" style="background:#7CA8B8;">
    <div class="brand-header">
      <div class="brand-logo">B</div>
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:0.85;">Belajar</div>
        <div style="font-size:9px;font-weight:500;opacity:0.7;">Latihan soal online</div>
      </div>
    </div>
    <div class="brand-title-big">Belajar</div>
  </div>
  <div class="content">
    <div class="section-title">🏅 Olimpiade Sains Nasional</div>
    <div class="card terra mapel-card" onclick="go('belajar','osn')">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="font-size:34px;">🔬</div>
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;">Latihan OSN</div>
          <div style="font-size:12px;opacity:0.9;margin-top:2px;">IPA · IPS · Matematika</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
        <span class="tag-badge">IPA</span>
        <span class="tag-badge">IPS</span>
        <span class="tag-badge">Matematika</span>
      </div>
      <div style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.15);border-radius:10px;font-size:12px;font-weight:700;text-align:center;">Pilih Mapel →</div>
    </div>

    <div class="section-title">📝 Tes Kemampuan Akademik</div>
    <div class="card forest mapel-card" onclick="go('belajar','tka')">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="font-size:34px;">📐</div>
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;">Latihan TKA</div>
          <div style="font-size:12px;opacity:0.9;margin-top:2px;">Matematika · Bahasa Indonesia</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;">
        <span class="tag-badge">Matematika</span>
        <span class="tag-badge">Bindo</span>
      </div>
      <div style="margin-top:10px;padding:8px;background:rgba(0,0,0,0.15);border-radius:10px;font-size:12px;font-weight:700;text-align:center;">Pilih Mapel →</div>
    </div>
  </div>
`; }

/* ── OSN LIST ── */
function renderOSN() {
  const items = [
    { emoji:"🔬", title:"OSN IPA",       sub:"Ilmu Pengetahuan Alam",     path:"osn-ipa.html",        bg:"#D96B3D" },
    { emoji:"🌏", title:"OSN IPS",       sub:"Ilmu Pengetahuan Sosial",   path:"osn-ips.html",        bg:"#7CA8B8" },
    { emoji:"📐", title:"OSN Matematika",sub:"Olimpiade Matematika SD",   path:"osn-matematika.html", bg:"#3D5C3A" },
  ];
  return `
  <div class="brand-bar" style="background:#D96B3D;">
    <div class="brand-header">
      <button class="back-btn" onclick="go('belajar')">← Kembali</button>
    </div>
    <div class="brand-title-big">Latihan OSN</div>
  </div>
  <div class="content">
    <div style="font-size:12px;color:#5C4A38;margin-bottom:14px;">Pilih mata pelajaran OSN:</div>
    ${items.map(it=>`
    <div class="card mapel-card" onclick="openLink('${BASE}/${it.path}')">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:50px;height:50px;border-radius:14px;background:${it.bg};border:2px solid #241910;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">${it.emoji}</div>
        <div style="flex:1;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;">${it.title}</div>
          <div style="font-size:12px;color:#5C4A38;margin-top:2px;">${it.sub}</div>
        </div>
        <div style="font-size:20px;color:#5C4A38;">→</div>
      </div>
      <div style="margin-top:10px;padding:8px 12px;background:#FAF4E8;border-radius:10px;border:1.5px solid #241910;font-size:12px;font-weight:700;text-align:center;">Mulai Latihan →</div>
    </div>`).join("")}
  </div>
`; }

/* ── TKA LIST ── */
function renderTKA() {
  const items = [
    { emoji:"📐", title:"TKA Matematika",      sub:"Operasi hitung, geometri & statistika", path:"latihan-tka.html",      bg:"#E8B23A" },
    { emoji:"📖", title:"TKA Bahasa Indonesia", sub:"Membaca, tata bahasa & ejaan",          path:"latihan-tka-bindo.html", bg:"#7CA8B8" },
  ];
  return `
  <div class="brand-bar" style="background:#3D5C3A;">
    <div class="brand-header">
      <button class="back-btn" onclick="go('belajar')">← Kembali</button>
    </div>
    <div class="brand-title-big">Latihan TKA</div>
  </div>
  <div class="content">
    <div style="font-size:12px;color:#5C4A38;margin-bottom:14px;">Pilih mata pelajaran TKA:</div>
    ${items.map(it=>`
    <div class="card mapel-card" onclick="openLink('${BASE}/${it.path}')">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:50px;height:50px;border-radius:14px;background:${it.bg};border:2px solid #241910;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;">${it.emoji}</div>
        <div style="flex:1;">
          <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;">${it.title}</div>
          <div style="font-size:12px;color:#5C4A38;margin-top:2px;">${it.sub}</div>
        </div>
        <div style="font-size:20px;color:#5C4A38;">→</div>
      </div>
      <div style="margin-top:10px;padding:8px 12px;background:#FAF4E8;border-radius:10px;border:1.5px solid #241910;font-size:12px;font-weight:700;text-align:center;">Mulai Latihan →</div>
    </div>`).join("")}
  </div>
`; }

/* ── GAME ── */
function renderGame() { return `
  <div class="brand-bar" style="background:#A33A2C;">
    <div class="brand-header">
      <div class="brand-logo" style="background:#A33A2C;color:#FAF4E8;border-color:rgba(255,255,255,0.4);">G</div>
      <div>
        <div style="font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:0.85;">Game Edukasi</div>
        <div style="font-size:9px;font-weight:500;opacity:0.7;">Buatan SDN 2 Pesantren</div>
      </div>
    </div>
    <div class="brand-title-big">Game <span style="background:#E8B23A;color:#241910;padding:0 8px;border-radius:8px;border:2px solid #241910;display:inline-block;transform:rotate(2deg);">Edu</span></div>
  </div>
  <div class="content">
    <div class="card dark" style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="width:40px;height:40px;border-radius:12px;background:#E8B23A;color:#241910;border:2px solid #FAF4E8;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🏆</div>
      <div>
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;">Game Edukasi SDN 2 Pesantren</div>
        <div style="font-size:11px;opacity:0.7;margin-top:2px;">Belajar sambil bermain, makin seru!</div>
      </div>
    </div>

    <div class="card terra">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.5px;margin-bottom:4px;">🔤 Anagram</div>
      <div style="font-size:12px;font-weight:600;opacity:0.92;margin-bottom:6px;">Susun huruf jadi kata yang bener</div>
      <div style="font-size:11px;opacity:0.85;line-height:1.5;margin-bottom:10px;">Acak — atur ulang. Mainkan tiap hari biar makin jago kosakata!</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        <span class="tag-badge">B. Indonesia</span>
        <span class="tag-badge">6+ thn</span>
        <span class="tag-badge">5 menit</span>
      </div>
      <button class="play-btn" onclick="openLink('${BASE}/Game-Anagram.html')">▶ Mainkan Sekarang</button>
    </div>

    <div class="card forest">
      <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.5px;margin-bottom:4px;">🛒 Toko Kuku</div>
      <div style="font-size:12px;font-weight:600;opacity:0.92;margin-bottom:6px;">Jualan + ngitung kembalian</div>
      <div style="font-size:11px;opacity:0.85;line-height:1.5;margin-bottom:10px;">Layanin pelanggan, hitung uang, jaga toko. Asah matematika dapur!</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
        <span class="tag-badge">Matematika</span>
        <span class="tag-badge">7+ thn</span>
        <span class="tag-badge">10 menit</span>
      </div>
      <button class="play-btn" onclick="openLink('${BASE}/toko-kuku.html')">▶ Mainkan Sekarang</button>
    </div>
  </div>
`; }

/* ── INIT ── */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => go(btn.dataset.tab));
});
render();
</script>
</body>
</html>
