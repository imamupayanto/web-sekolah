a sisi\nR: Jajargenjang|alas × tinggi|jumlah keempat sisi\nR: Trapesium|(jumlah sisi sejajar) : 2 × tinggi|jumlah keempat sisi\nR: Layang-layang|d1 × d2 : 2|jumlah keempat sisi\nR: Belah ketupat|d1 × d2 : 2|4 × s\nR: Lingkaran|π × r × r|π × d atau 2 × π × r\n## Lingkaran\n- **Diameter = 2 × jari-jari**. Jari-jari = diameter : 2.\n- **π = 22/7** jika jari-jari atau diameter kelipatan 7 (7, 14, 21, 28, ...). **π = 3,14** jika bukan kelipatan 7 (10, 20, 50, ...).\n- **Setengah lingkaran**: luas = 1/2 × π × r × r. Kelilingnya = 1/2 × keliling lingkaran + diameter.\n## Ciri-ciri bangun datar\nT: Bangun|Ciri|Simetri lipat\nR: Persegi|4 sisi sama panjang, 4 sudut siku-siku|4\nR: Persegi panjang|sisi berhadapan sama panjang, 4 sudut siku-siku|2\nR: Belah ketupat|4 sisi sama panjang, sudut tidak siku-siku, diagonal berpotongan tegak lurus|2\nR: Jajargenjang|sisi berhadapan sejajar dan sama panjang|0\nR: Trapesium|sepasang sisi sejajar|0 (sama kaki: 1)\nR: Layang-layang|dua pasang sisi berdekatan sama panjang|1\nR: Segitiga sama sisi|3 sisi sama, tiap sudut 60°|3\n## Sudut dan Pythagoras\n- Jumlah sudut dalam **segitiga = 180°**. Sudut ketiga = 180° − (dua sudut lain). Jumlah sudut **segi empat = 360°**.\n- **Teorema Pythagoras** (segitiga siku-siku): sisi miring² = sisi tegak 1² + sisi tegak 2². Tripel yang sering muncul: 3-4-5, 6-8-10, 5-12-13, 8-15-17.\n- Mencari sisi tegak: sisi tegak² = sisi miring² − sisi tegak lain².\n## Contoh soal\nX: Luas lingkaran berjari-jari 14 cm (π = 22/7).\nS: r = 14 kelipatan 7, jadi pakai π = 22/7.\nS: L = 22/7 × 14 × 14 = 22 × 2 × 14.\nS: 22 × 2 = 44 dan 44 × 14 = 616.\nJ: 616 cm²\nX: Luas trapesium dengan sisi sejajar 10 cm dan 16 cm serta tinggi 8 cm.\nS: Jumlah sisi sejajar: 10 + 16 = 26.\nS: 26 : 2 = 13.\nS: 13 × 8 = 104.\nJ: 104 cm²\nX: Persegi panjang berkeliling 50 cm dan panjang 15 cm. Berapa luasnya?\nS: Keliling = 2 × (p + l), maka p + l = 50 : 2 = 25.\nS: l = 25 − 15 = 10 cm.\nS: L = 15 × 10 = 150.\nJ: 150 cm²\nX: Segitiga siku-siku bersisi tegak 6 cm dan 8 cm. Berapa panjang sisi miringnya?\nS: 6² + 8² = 36 + 64 = 100.\nS: Sisi miring = √100 = 10.\nS: Ini tripel 3-4-5 dikali 2.\nJ: 10 cm\nX: Luas setengah lingkaran berjari-jari 7 cm (π = 22/7).\nS: Luas lingkaran penuh = 22/7 × 7 × 7 = 154.\nS: Setengah lingkaran = 154 : 2 = 77.\nJ: 77 cm²\nX: Luas lingkaran berdiameter 20 cm (π = 3,14).\nS: r = 20 : 2 = 10 cm. Bukan kelipatan 7, pakai π = 3,14.\nS: L = 3,14 × 10 × 10 = 3,14 × 100 = 314.\nJ: 314 cm²\n## Kesalahan yang sering terjadi\n! Pada luas lingkaran, yang dipakai adalah jari-jari (r), bukan diameter.\n! Luas segitiga dan layang-layang atau belah ketupat jangan lupa dibagi 2.\n! Pada jajargenjang dan trapesium, **tinggi** tegak lurus alas, bukan sisi miringnya.\n! Keliling satuannya cm, luas satuannya cm². Periksa yang ditanyakan.\n! Jangan salah memakai π: lihat apakah r kelipatan 7.\n\n# Bangun Ruang\n> Tiga hal yang diuji: unsur-unsur (sisi, rusuk, titik sudut), rumus volume, dan konversi satuan ke liter.\n## Unsur dan rumus\nT: Bangun|Sisi|Rusuk|Titik sudut|Volume\nR: Kubus|6|12|8|s × s × s\nR: Balok|6|12|8|p × l × t\nR: Prisma segitiga|5|9|6|luas alas × tinggi\nR: Limas segi empat|5|8|5|1/3 × luas alas × tinggi\nR: Tabung|3|2|0|π × r × r × t\nR: Kerucut|2|1|1 titik puncak|1/3 × π × r × r × t\n## Luas permukaan\nT: Bangun|Luas permukaan\nR: Kubus|6 × s × s\nR: Balok|2 × (p×l + p×t + l×t)\nR: Tabung|2 × π × r × (r + t) atau 2πr² + 2πrt\nR: Kerucut|π × r × (r + s), dengan s = garis pelukis\n- **Prisma** (alas segi-n): sisi = n + 2, rusuk = 3n, titik sudut = 2n. **Limas** (alas segi-n): sisi = n + 1, rusuk = 2n, titik sudut = n + 1.\n- **Jaring-jaring kubus** = 6 persegi sama besar. Jaring-jaring balok = 6 persegi panjang (tiga pasang sama).\n## Volume dan satuan\n- **1 liter = 1 dm³ = 1.000 cm³**. Dari cm³ ke liter: bagi 1.000. Dari m³ ke liter: kali 1.000.\n- Volume kubus = s³. Rusuk kubus = ∛volume.\n- Limas dan kerucut memiliki faktor **1/3**, tabung dan prisma tidak.\n## Contoh soal\nX: Volume tabung berjari-jari 7 cm dan tinggi 10 cm (π = 22/7).\nS: Luas alas = 22/7 × 7 × 7 = 154 cm².\nS: Volume = luas alas × tinggi = 154 × 10.\nJ: 1.540 cm³\nX: Volume kerucut berjari-jari 7 cm dan tinggi 12 cm (π = 22/7).\nS: Luas alas = 22/7 × 7 × 7 = 154.\nS: Volume = 1/3 × 154 × 12 = 154 × 4 = 616.\nJ: 616 cm³\nX: Luas permukaan balok berukuran 10 cm × 6 cm × 4 cm.\nS: p×l = 60, p×t = 40, l×t = 24. Jumlahnya 60 + 40 + 24 = 124.\nS: Luas permukaan = 2 × 124 = 248.\nJ: 248 cm²\nX: Banyak sisi prisma segitiga.\nS: Alasnya segitiga, jadi n = 3.\nS: Sisi = n + 2 = 5 (2 segitiga dan 3 persegi panjang).\nJ: 5\n## Kesalahan yang sering terjadi\n! Lupa faktor 1/3 pada kerucut dan limas.\n! Volume tabung memakai r², bukan r saja.\n! Luas permukaan kubus rusuk 5 cm adalah 150 cm². Itu bukan 125 cm³ (volume).\n! cm³ ke liter dibagi 1.000, bukan 100.\n! Tabung punya 3 sisi: alas, tutup, dan selimut. Tidak punya titik sudut.\n\n# Statistika dan Peluang\n> Median selalu butuh data yang diurutkan. Peluang selalu berupa pecahan dari semua kemungkinan.\n## Ukuran pemusatan data\n- **Rata-rata (mean)** = jumlah semua data : banyak data. Jumlah data = rata-rata × banyak data.\n- **Median** = nilai tengah setelah data diurutkan. Banyak data ganjil: ambil yang paling tengah. Banyak data genap: median = (dua data tengah) : 2.\n- **Modus** = data yang paling sering muncul. **Jangkauan** = data terbesar − data terkecil.\n- Rata-rata gabungan: (jumlah data lama + data baru) : banyak data seluruhnya. Nilai yang dibutuhkan = banyak data baru × rata-rata target − jumlah lama.\n## Peluang\n- **Peluang = banyak kejadian yang diharapkan : banyak semua kemungkinan**.\n- Nilai peluang antara 0 sampai 1. Peluang 0 = mustahil, peluang 1 = pasti terjadi.\n- Dadu: semua kemungkinan 6. Genap = {2, 4, 6} → 3/6 = 1/2. Ganjil = 3/6. Lebih dari 4 = {5, 6} → 2/6 = 1/3. Koin: angka atau gambar masing-masing 1/2.\n## Jenis diagram\nT: Diagram|Kegunaan\nR: Batang|membandingkan jumlah antar kategori\nR: Garis|melihat perubahan dari waktu ke waktu\nR: Lingkaran|menunjukkan persentase bagian dari keseluruhan\nR: Gambar (piktogram)|menunjukkan jumlah dengan lambang gambar\n## Contoh soal\nX: Tentukan median data 5, 9, 7, 6, 8, 4.\nS: Urutkan: 4, 5, 6, 7, 8, 9.\nS: Ada 6 data (genap), dua data tengah adalah 6 dan 7.\nS: Median = (6 + 7) : 2 = 6,5.\nJ: 6,5\nX: Rata-rata nilai 4 anak adalah 80. Nilai anak kelima 90 ditambahkan. Berapa rata-rata sekarang?\nS: Jumlah empat nilai = 4 × 80 = 320.\nS: Jumlah lima nilai = 320 + 90 = 410.\nS: Rata-rata = 410 : 5 = 82.\nJ: 82\nX: Data tinggi badan: 135, 140, 138, 142, 145 (cm). Tentukan mediannya.\nS: Urutkan: 135, 138, 140, 142, 145.\nS: Ada 5 data (ganjil), median adalah data ke-3.\nJ: 140 cm\nX: Data 12, 15, 9, 20, 17. Tentukan jangkauannya.\nS: Terbesar 20, terkecil 9.\nS: 20 − 9 = 11.\nJ: 11\nX: Kantong berisi 5 bola merah dan 3 bola biru. Berapa peluang terambil bola biru?\nS: Kejadian yang diharapkan: 3 (bola biru).\nS: Semua kemungkinan: 5 + 3 = 8.\nJ: 3/8\n## Kesalahan yang sering terjadi\n! Mencari median tanpa mengurutkan data. Selalu urutkan dulu.\n! Pada banyak data genap, lupa mengambil rata-rata dari dua data tengah.\n! Modus adalah datanya (misalnya 8), bukan berapa kali muncul (3 kali).\n! Peluang tidak boleh lebih dari 1.\n\n# Pola Bilangan dan Persamaan\n> Langkah pertama selalu sama: HITUNG SELISIH antar suku yang berdekatan, lalu tentukan jenis polanya.\n## Mengenali jenis pola\nT: Selisih / rasio|Jenis pola|Contoh\nR: Selisih tetap (+)|barisan tambah|2, 5, 8, 11 (beda +3)\nR: Selisih tetap (−)|barisan kurang|100, 94, 88, 82 (beda −6)\nR: Selisih bertambah tetap|segitiga atau kuadrat|1, 3, 6, 10, 15 (selisih 2, 3, 4, 5)\nR: Hasil bagi tetap|barisan kali|3, 6, 12, 24 (× 2)\nR: Bilangan kuadrat|n²|1, 4, 9, 16, 25\nR: Bilangan pangkat tiga|n³|1, 8, 27, 64, 125\nR: Bilangan segitiga|n(n+1)/2|1, 3, 6, 10, 15, 21\nR: Fibonacci (jumlah dua suku sebelumnya)|1, 1, 2, 3, 5, 8, 13|1+1=2, 1+2=3, ...\n## Rumus suku ke-n\n- Pola beda tetap: **Un = U1 + (n − 1) × beda**. Jika pola berkurang, bedanya negatif.\n- Pola kali tetap: tiap suku dikali bilangan yang sama (rasio).\n- Pola segitiga suku ke-n: n × (n + 1) : 2. Pola kuadrat suku ke-n: n × n.\n## Persamaan sederhana\n- Pindahkan angka ke ruas lain dengan **operasi kebalikan**: tambah ↔ kurang, kali ↔ bagi.\n- Kerjakan terbalik dari bentuk: kalau 3 × n + 5, hilangkan +5 dulu, baru bagi 3.\n## Contoh soal\nX: Pola 2, 5, 8, 11, .... Berapa suku ke-10?\nS: Beda = 5 − 2 = 3, suku pertama 2.\nS: U10 = 2 + (10 − 1) × 3 = 2 + 27.\nJ: 29\nX: Pola 100, 94, 88, 82, .... Berapa suku ke-8?\nS: Berkurang 6 setiap suku.\nS: U8 = 100 − (8 − 1) × 6 = 100 − 42.\nJ: 58\nX: Bilangan berikutnya dari 1, 3, 6, 10, 15, ....\nS: Selisihnya: 2, 3, 4, 5 (bertambah 1).\nS: Selisih berikutnya 6, jadi 15 + 6 = 21.\nS: Cek dengan rumus segitiga: 6 × 7 : 2 = 21.\nJ: 21\nX: Jika 3 × n + 5 = 26, berapa nilai n?\nS: Pindahkan +5: 3 × n = 26 − 5 = 21.\nS: n = 21 : 3 = 7.\nS: Cek: 3 × 7 + 5 = 26.\nJ: 7\n## Kesalahan yang sering terjadi\n! Menulis U10 = 2 + 10 × 3 = 32. Seharusnya (n − 1) × beda karena suku pertama sudah dihitung.\n! Pada pola berkurang, lupa mengurangi. Beda negatif.\n! Pada persamaan, memindah angka tetapi lupa mengubah operasinya menjadi kebalikan.\n\n# Rumus Kilat\n> Halaman ini untuk dibaca ulang sehari sebelum lomba. Kalau ada yang belum ingat, buka topiknya.\n## Bilangan dan operasi\n- Tanda sama pada kali atau bagi → positif. Tanda beda → negatif. a − (−b) = a + b.\n- Urutan: kurung → kali/bagi (kiri) → tambah/kurang (kiri).\n- Pembulatan: lihat angka di kanan. 5 ke atas → naik.\n## KPK dan FPB\n- KPK: semua faktor, pangkat terbesar (\"bersamaan lagi\"). FPB: faktor sama, pangkat terkecil (\"dibagi sama banyak\").\n- KPK × FPB = a × b (dua bilangan).\n## Pecahan dan persen\n- Bagi pecahan = kali kebalikan. Tambah atau kurang = samakan penyebut.\n- p% dari x = p/100 × x. Diskon: bayar = (100% − diskon) × harga.\n- 1/8 = 0,125; 3/8 = 0,375; 1/4 = 0,25; 3/4 = 0,75; 1/5 = 0,2; 3/5 = 0,6.\n## Kuadrat dan akar\n- 11² = 121; 12² = 144; 13² = 169; 14² = 196; 15² = 225; 16² = 256; 18² = 324; 25² = 625.\n- 3³ = 27; 4³ = 64; 5³ = 125; 6³ = 216; 7³ = 343; 8³ = 512; 9³ = 729.\n## Satuan\n- 1 km = 1.000 m; 1 ton = 1.000 kg; 1 kuintal = 100 kg; 1 liter = 1.000 cm³; 1 windu = 8 th; 1 dasawarsa = 10 th; 1 lusin = 12; 1 gros = 144; 1 rim = 500.\n## Kecepatan dan debit\n- J = K × W. K = J : W. W = J : K. km/jam ÷ 3,6 = m/detik.\n- Berpapasan: jarak : (K1 + K2). Debit = volume : waktu. 1 m³ = 1.000 liter.\n## Bangun datar\n- Persegi s². Persegi panjang p × l. Segitiga 1/2 × a × t. Jajargenjang a × t. Trapesium (a + b) : 2 × t.\n- Layang-layang dan belah ketupat d1 × d2 : 2. Lingkaran π r². Keliling lingkaran π d.\n- Pythagoras: c² = a² + b². Tripel 3-4-5, 6-8-10, 5-12-13.\n## Bangun ruang\n- Kubus s³. Balok p × l × t. Tabung π r² t. Prisma luas alas × t. Limas dan kerucut 1/3 × luas alas × t.\n- Luas permukaan kubus 6s². Balok 2(pl + pt + lt).\n## Statistika dan pola\n- Mean = jumlah : banyak. Median: urutkan dulu. Modus: paling sering. Jangkauan = terbesar − terkecil.\n- Peluang = diharapkan : semua kemungkinan.\n- Un = U1 + (n − 1) × beda.\n";

function buatSoal(topik, n){

}

function md(lines){
  let h = '', ul = false, tb = null, ex = null;
  const cl = () => { if (ul) { h += '</ul>'; ul = false; } };
  const ct = () => { if (tb) { h += '<div class="tw"><table><thead><tr>' + tb.h.map(c => `<th>${inl(c)}</th>`).join('') + '</tr></thead><tbody>' + tb.r.map(r => '<tr>' + tb.h.map((_, i) => `<td>${inl(r[i] || '')}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>'; tb = null; } };
  const ce = () => { if (ex) { h += `<div class="contoh"><div class="cq"><span>Contoh</span>${inl(ex.q)}</div><ol>${ex.s.map(x => `<li>${inl(x)}</li>`).join('')}</ol><div class="cj">✔ Jawaban: ${inl(ex.j)}</div></div>`; ex = null; } };
  for (const l of lines) {
    if (l.startsWith('S: ')) { if (ex) ex.s.push(l.slice(3)); continue; }
    if (l.startsWith('J: ')) { if (ex) ex.j = l.slice(3); continue; }
    if (l.startsWith('R: ')) { if (tb) tb.r.push(l.slice(3).split('|')); continue; }
    ce();
    if (l.startsWith('X: ')) { cl(); ct(); ex = { q: l.slice(3), s: [], j: '' }; continue; }
    if (l.startsWith('T: ')) { cl(); ct(); tb = { h: l.slice(3).split('|'), r: [] }; continue; }
    ct();
    if (l.startsWith('## ')) { cl(); h += `<h3>${inl(l.slice(3))}</h3>`; }
    else if (l.startsWith('- ')) { if (!ul) { h += '<ul>'; ul = true; } h += `<li>${inl(l.slice(2))}</li>`; }
    else if (l.startsWith('> ')) { cl(); h += `<p class="tip">💡 ${inl(l.slice(2))}</p>`; }
    else if (l.startsWith('! ')) { cl(); h += `<p class="warn">⚠️ ${inl(l.slice(2))}</p>`; }
    else if (l.trim()) { cl(); h += `<p>${inl(l)}</p>`; }
  }
  cl(); ct(); ce(); return h;
}

function mulaiSesi(soal, mode, topik, n){
  if (!soal.length) { alert('Belum ada soal untuk pilihan ini.'); return; }
  S = { nama: NAMA, kode: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), soal, jawab: Array(soal.length).fill(null), idx: 0, mulai: Date.now(), selesai: null, mode, durMenit: mode === 'lomba' ? menitUntuk(soal.length) : 0, topikPilih: topik || [] };
  simpan(); viewQuiz();
}

function renderSoal(pilihBaru = -1){

  card.innerHTML = `

    ${kunci ? `<div class="fb ${j === s.k ? 'ok' : 'no'}">${j === s.k ? '✅ Benar! Mantap.' : `❌ Belum tepat. Jawaban yang benar: <b>${esc(s.o[s.k])}</b>`}</div>
      <div class="ex">💡 <b>Pembahasan</b>${pemb(s.p)}</div>

  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {

    simpan(); renderSoal(S.jawab[S.idx] === i ? i : -1);

function daftarSoal(){

/* ---------- HASIL ---------- */
function hitung(st){
  let benar = 0, salah = 0, kosong = 0; const per = {}, salahIds = [];
  TOPIK.forEach((_, i) => per[i] = { b: 0, n: 0 });
  st.soal.forEach((s, i) => { per[s.g].n++; const j = st.jawab[i];
    if (j === null) { kosong++; salahIds.push(s.id); } else if (j === s.k) { benar++; per[s.g].b++; } else { salah++; salahIds.push(s.id); } });
  return { benar, salah, kosong, per, salahIds, nilai: Math.round(benar / st.soal.length * 1000) / 10 };
}
function selesai(status, tampilkan = true){
  stopTimer();
  let baru = false;
  if (!S.selesai) {
    baru = true;
    S.selesai = Date.now(); S.status = status;
    if (!belajar(S)) {
      const h = hitung(S);
      const topik = {}; TOPIK.forEach((t, i) => { if (h.per[i].n) topik[t[0]] = `${h.per[i].b}/${h.per[i].n}`; });
      const payload = { kode: S.kode, nama: S.nama, mulai: fmtTgl(S.mulai), durasi: Math.round((S.selesai - S.mulai) / 6000) / 10, status: `${status} · ${S.soal.length} soal · Matematika · ${labelTopik(S.topikPilih)}`, nilai: h.nilai, benar: h.benar, salah: h.salah, kosong: h.kosong, jumlahSoal: S.soal.length, mapel: { 'Matematika': h.benar }, topik, salahIds: h.salahIds.join(', ') };
      const q = store.get('mtk_antrian') || []; q.push(payload); store.set('mtk_antrian', q);
    }
    simpan();
  }
  if (tampilkan) viewHasil('semua', baru);
}
async function kirimAntrian(){
  const q = store.get('mtk_antrian') || [];
  if (!q.length) return 'kosong';
  if (!/^https:\/\//.test(SCRIPT_URL)) return 'belum';
  const sisa = [];
  for (const p of q) {
    try { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) }); }
    catch (e) { sisa.push(p); }
  }
  store.set('mtk_antrian', sisa);
  return sisa.length ? 'gagal' : 'ok';
}
async function statusKirim(){
  const el = document.getElementById('send'); if (!el) return;
  el.className = 'send wait'; el.textContent = '📨 Mengirim nilai ke guru…';
  const r = await kirimAntrian();
  if (!document.getElementById('send')) return;
  if (r === 'ok' || r === 'kosong') { el.className = 'send ok'; el.textContent = '✓ Nilai sudah terkirim ke guru.'; }
  else if (r === 'belum') { el.className = 'send bad'; el.textContent = 'Alamat rekap belum diatur oleh guru, nilai disimpan di perangkat ini.'; }
  else { el.className = 'send bad'; el.innerHTML = 'Gagal mengirim (cek internet). <button class="btn small" id="ulangkirim">Kirim ulang</button>'; document.getElementById('ulangkirim').onclick = statusKirim; }
}
function konfeti(){
  if (!gerak) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const warna = TOPIK.map(t => t[2]);
  box.innerHTML = Array.from({ length: 70 }, () => `<i style="left:${Math.random() * 100}%;background:${warna[Math.floor(Math.random() * warna.length)]};animation-duration:${1.8 + Math.random() * 1.6}s;animation-delay:${Math.random() * .5}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}
function viewHasil(filter = 'semua', baru = false){
  lastView = 'hasil'; stopTimer();
  const h = hitung(S), bel = belajar(S);
  const [emo, pesan, rc] = h.nilai >= 85 ? ['🏆', 'Luar biasa! Pertahankan!', '#16a34a'] : h.nilai >= 70 ? ['🌟', 'Bagus! Sedikit lagi menuju juara.', '#3b82f6'] : h.nilai >= 50 ? ['💪', 'Cukup baik. Pelajari pembahasannya, ya.', '#f59e0b'] : ['📚', 'Tetap semangat! Baca materi lalu coba lagi.', '#e5484d'];
  const ada = TOPIK.map((_, i) => i).filter(i => h.per[i].n > 0);
  const lemah = ada.filter(i => h.per[i].b / h.per[i].n < 0.7).sort((a, b) => h.per[a].b / h.per[a].n - h.per[b].b / h.per[b].n);
  tampil(`
  <section class="card score">

    <div class="stats"><div class="stat ok"><b>${h.benar}</b>Benar</div><div class="stat bad"><b>${h.salah}</b>Salah</div><div class="stat no"><b>${h.kosong}</b>Kosong</div></div>
    ${bel ? '<div class="send wait">🧠 Mode Belajar: nilai tidak dikirim ke guru.</div>' : '<div id="send" class="send wait">📨 Mengirim nilai ke guru…</div>'}
  </section>
  <section class="card"><h2>Nilai per topik</h2>
    ${ada.map(i => { const t = TOPIK[i], p = h.per[i], pct = Math.round(p.b / p.n * 100);
      return `<div class="bar" style="--c:${t[2]}"><div class="row"><span><span class="ic">${t[1]}</span>${t[0]}</span><span>${p.b}/${p.n}</span></div><div class="track"><div class="fill" data-w="${pct}"></div></div></div>`; }).join('')}
    ${lemah.length ? `<p class="sub">🎯 Perlu diperkuat</p><p class="muted" style="margin:2px 0 8px">Baca materinya dulu, lalu latih lagi.</p><div class="pick">${lemah.map(i => `<button data-lm="${i}" style="--c:${TOPIK[i][2]}" class="on">${TOPIK[i][1]} ${esc(TOPIK[i][0])}</button>`).join('')}</div>` : '<p class="tip">💡 Semua topik sudah di atas 70%. Pertahankan!</p>'}

  else { angka.textContent = fmt(h.nilai); ring.style.setProperty('--p', h.nilai); }
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'), 60));
  if (baru && h.nilai >= 70) konfeti();
  document.querySelectorAll('#pemb .tabs button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#pemb .tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('revs').innerHTML = daftarPembahasan(b.dataset.f);
  });
  document.getElementById('pemb').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) materiSheet(+b.dataset.g); });
  document.querySelectorAll('[data-lm]').forEach(b => b.onclick = () => viewRingkasan(+b.dataset.lm));
  const ul = document.getElementById('ulang');
  if (ul) ul.onclick = () => { const ids = new Set(h.salahIds); mulaiSesi(shuffle(BANK.filter(s => ids.has(s.id))).map(rakit), 'belajar', [], ids.size); };
  document.getElementById('lagi').onclick = () => { store.del('mtk_sesi'); viewHome(); };
  document.getElementById('ringk').onclick = () => viewRingkasan(lemah.length ? lemah[0] : 0);
  document.getElementById('home').onclick = () => viewHome();
  top0(); if (!bel) statusKirim();
}
function daftarPembahasan(f){
  const items = S.soal.map((s, i) => ({ s, i, j: S.jawab[i] })).filter(({ s, j }) =>
    f === 'semua' || (f === 'benar' && j === s.k) || (f === 'salah' && j !== null && j !== s.k) || (f === 'kosong' && j === null));
  if (!items.length) return '<p class="muted">Tidak ada soal di kategori ini.</p>';
  return items.map(({ s, i, j }) => { const t = TOPIK[s.g];
    const [sc, lbl] = j === s.k ? ['var(--ok)', '✓ BENAR'] : j === null ? ['var(--warn)', '○ KOSONG'] : ['var(--bad)', '✗ SALAH'];
    return `
    <div class="rev" style="--sc:${sc}"><div class="head"><span class="badge">${lbl}</span>No. ${i + 1} · ${t[1]} ${esc(s.t)}</div>
      <p class="q">${esc(s.q)}</p>
      ${s.o.map((o, k) => `<div class="ro ${k === s.k ? 'k' : (k === j ? 'x' : '')}">${'ABCD'[k]}. ${esc(o)}${k === s.k ? ' ✓' : (k === j ? ' ✗ (jawabanmu)' : '')}</div>`).join('')}
      ${j === null ? '<div class="kosong">Soal ini tidak kamu jawab.</div>' : ''}
      <div class="ex">💡 <b>Pembahasan</b>${pemb(s.p)}</div>
      <button class="btn small ghost" data-g="${s.g}" style="margin-top:10px">📖 Materi: ${esc(t[0])}</button></div>`; }).join('');
}

/* ---------- MATERI DAN RANGKUMAN ---------- */
function viewRingkasan(ix = 0){
  stopTimer();
  const asal = lastView === 'hasil' && S && S.selesai ? 'hasil' : 'home';
  const warna = warnaBagian(ix), jml = TOPIK[ix] ? BANK.filter(s => s.g === ix).length : 0;
  tampil(`
  <div class="rtabs"><div class="tabs">${BAGIAN.map((b, i) => `<button data-i="${i}" class="${i === ix ? 'on' : ''}" style="--c:${warnaBagian(i)}">${ikonBagian(i)} ${esc(SHORT[i] || b.judul)}</button>`).join('')}</div></div>
  <section class="card rk" style="--c:${warna}"><div class="rkhead"><span class="ic">${ikonBagian(ix)}</span><h2>${esc(BAGIAN[ix].judul)}</h2></div>${md(BAGIAN[ix].baris)}
    ${jml ? `<button class="btn primary" id="latih">✍️ Latihan topik ini (${Math.min(jml, 20)} soal)</button>` : ''}
    <div class="pn"><button class="btn small" id="sblm" ${ix === 0 ? 'disabled' : ''}>‹ Topik sebelumnya</button><button class="btn small" id="sbrt" ${ix === BAGIAN.length - 1 ? 'disabled' : ''}>Topik berikutnya ›</button></div>
  </section>
  <button class="btn" id="kembali">‹ Kembali ${asal === 'hasil' ? 'ke hasil' : 'ke menu'}</button>`);
  const on = document.querySelector('.rtabs .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  document.querySelectorAll('.rtabs button').forEach(b => b.onclick = () => viewRingkasan(+b.dataset.i));
  const lt = document.getElementById('latih');
  if (lt) lt.onclick = () => { if (!NAMA) { viewHome(); return; } mulaiSesi(buatSoal([ix], 20), 'belajar', [ix], 20); };
  document.getElementById('sblm').onclick = () => viewRingkasan(ix - 1);
  document.getElementById('sbrt').onclick = () => viewRingkasan(ix + 1);
  document.getElementById('kembali').onclick = () => asal === 'hasil' ? viewHasil() : viewHome();
  top0();
}

window.addEventListener('beforeunload', e => { if (lastView === 'quiz' && S && !belajar(S)) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('online', () => kirimAntrian());
viewHome();

</script>
