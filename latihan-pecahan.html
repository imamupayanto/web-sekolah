<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CDEBFF">
<title>Latihan Pecahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#CDEBFF;--card:#FFFFFF;--ink:#22305A;--muted:#5B6A8E;--shadow:#22305A;--line:#E3ECF8;
  --yellow:#FFD23F;--pink:#FF6FA5;--mint:#2ECC8B;--blue:#3D8BFD;--lilac:#9B7BFF;--orange:#FF8C42;--red:#F0465A;
  --add:#1FAF6E;--sub:#3D8BFD;--mul:#E0487F;--div:#8A5CF6;
  --dotA:rgba(255,210,63,.55);--dotB:rgba(255,111,165,.35);--dotC:rgba(46,204,139,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#142046;--card:#1E2B57;--ink:#F1F5FF;--muted:#AEBBDD;--shadow:#070B1C;--line:#2A3A6E;--dotA:rgba(255,210,63,.18);--dotB:rgba(255,111,165,.16);--dotC:rgba(46,204,139,.16)}}
:root[data-theme="dark"]{--sky:#142046;--card:#1E2B57;--ink:#F1F5FF;--muted:#AEBBDD;--shadow:#070B1C;--line:#2A3A6E;--dotA:rgba(255,210,63,.18);--dotB:rgba(255,111,165,.16);--dotC:rgba(46,204,139,.16)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;
  background-color:var(--sky);
  background-image:radial-gradient(circle at 18px 22px,var(--dotA) 6px,transparent 7px),radial-gradient(circle at 86px 64px,var(--dotB) 5px,transparent 6px),radial-gradient(circle at 46px 104px,var(--dotC) 7px,transparent 8px);
  background-size:130px 130px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 32px}
.quizmode .wrap{padding-bottom:120px}
.disp,h1,h2,.btn,.opt,.expr,.score{font-family:"Baloo 2","Nunito",system-ui,sans-serif}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--shadow);padding:22px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .06em;font-variant-numeric:lining-nums tabular-nums}
.fr>span{padding:0 .16em;white-space:nowrap}
.fr>span:first-child{border-bottom:.075em solid currentColor;padding-bottom:.04em}
.fr>span:last-child{padding-top:.04em}
.mx{display:inline-flex;align-items:center;gap:.05em}
.op{margin:0 .2em;font-weight:800}
/* buttons */
.btn{font-weight:800;font-size:19px;border:3px solid var(--ink);border-radius:16px;padding:11px 20px;min-height:52px;background:var(--yellow);color:#22305A;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.big{font-size:24px;padding:14px 28px;width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.icon{width:46px;height:46px;min-height:0;padding:0;border-radius:14px;font-size:20px;box-shadow:3px 3px 0 var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:4px 12px;border-radius:999px;color:#fff;border:2px solid var(--ink)}
/* start */
.title{font-family:"Baloo 2",sans-serif;font-size:clamp(46px,14vw,76px);font-weight:800;line-height:.95;margin:4px 0 14px;letter-spacing:.5px}
.title span{display:inline-block;text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
.title span:nth-child(odd){transform:rotate(-4deg)}.title span:nth-child(even){transform:rotate(3deg) translateY(2px)}
.hero{display:flex;align-items:center;gap:18px;margin:4px 0 18px}
.pie{flex:none;width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);
  background:repeating-conic-gradient(from 0deg,var(--ink) 0 1.6deg,transparent 1.6deg 90deg),conic-gradient(var(--pink) 0 270deg,#fff 270deg)}
.hero .expr{margin:0;font-size:clamp(40px,11vw,58px);justify-content:flex-start}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.fact{border:3px solid var(--ink);border-radius:18px;padding:10px 8px;text-align:center;font-weight:800;font-size:14px;color:#22305A}
.fact b{display:block;font-family:"Baloo 2",sans-serif;font-size:28px;line-height:1.1}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
/* quiz header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sky);padding:10px 0 8px;margin:-16px 0 10px}
.prog{height:14px;border:3px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 12px,#58DCA6 12px 24px);transition:width .3s}
.count{font-family:"Baloo 2",sans-serif;font-size:22px;font-weight:800}
.timer{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.timer.warn{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.dots{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:36px;height:36px;border-radius:11px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:800;font-size:13px;cursor:pointer;padding:0}
.dot.done{background:var(--blue);color:#fff}
.dot.cur{box-shadow:0 0 0 3px var(--yellow);transform:translateY(-2px)}
/* question */
.qcard{padding:0;overflow:hidden}
.qhead{padding:10px 16px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800}
.expr{font-size:clamp(50px,15vw,86px);font-weight:800;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;margin:18px 0 20px}
.expr .eq{margin-left:.2em;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px 16px}
.opt{position:relative;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:20px;color:#22305A;padding:12px 10px;font-size:clamp(28px,8.5vw,38px);font-weight:800;min-height:104px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.opt:nth-child(1){background:#FFE58A}.opt:nth-child(2){background:#FFC4DA}.opt:nth-child(3){background:#B9F3D8}.opt:nth-child(4){background:#D9CDFF}
.opt .k{position:absolute;top:8px;left:10px;font:800 14px "Nunito",sans-serif;width:26px;height:26px;border-radius:50%;border:2px solid #22305A;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.opt.sel{border-width:4px;box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ink);animation:pop .3s}
.opt.sel .k{background:#22305A;color:#fff}
@keyframes pop{40%{transform:scale(1.07)}}
/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:3px solid var(--ink);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.bottom .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.bottom .btn{width:100%;padding:10px 8px}
.finlink{display:block;margin:16px auto 0;background:none;border:0;color:var(--ink);font-weight:800;text-decoration:underline;cursor:pointer;padding:8px}
/* result */
.badge{width:min(220px,62vw);aspect-ratio:1;margin:6px auto 4px;border-radius:50%;border:5px solid var(--ink);display:grid;place-content:center;text-align:center;box-shadow:6px 6px 0 var(--shadow);color:#22305A;
  background:repeating-conic-gradient(var(--yellow) 0 15deg,#FFE58A 15deg 30deg)}
.score{font-size:clamp(72px,22vw,104px);font-weight:800;line-height:.85}
.stars{text-align:center;font-size:44px;letter-spacing:6px;margin:10px 0 4px}
.stars .off{color:var(--line);-webkit-text-stroke:1.5px var(--ink)}
.stars .on{color:var(--yellow);-webkit-text-stroke:1.5px var(--ink)}
.center{text-align:center}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{border:3px solid var(--ink);border-radius:16px;padding:10px 12px;background:var(--card)}
.stat b{font-family:"Baloo 2",sans-serif;font-size:26px;display:block;line-height:1.1}
.stat small{font-weight:800;font-size:13px;color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.notice{background:var(--red);color:#fff;font-weight:800;border-radius:14px;padding:8px 14px;margin-bottom:12px;text-align:center}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 4px}
.tabs .btn{font-size:17px;padding:8px}
.rv{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px 16px;margin-top:14px;box-shadow:4px 4px 0 var(--shadow)}
.rv.ok{border-top:12px solid var(--mint)}
.rv.no{border-top:12px solid var(--red)}
.rv .expr{font-size:clamp(32px,9vw,40px);justify-content:flex-start;margin:6px 0 10px}
.ans{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-bottom:6px}
.ans .v{font-family:"Baloo 2",sans-serif;font-size:26px;font-weight:800}
.tag{font-weight:800;border-radius:99px;padding:2px 10px;font-size:14px;color:#fff;margin-left:6px}
.tag.good{background:var(--mint)}.tag.bad{background:var(--red)}
summary{cursor:pointer;font-weight:800;color:var(--blue);padding:8px 0;font-size:16px}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin-bottom:12px}
.mathline{display:block;font-family:"Baloo 2",sans-serif;font-size:23px;margin-top:6px;overflow-x:auto;white-space:nowrap;padding-bottom:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,40,.55);display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-width:420px;width:100%}
.modal h2{margin:0 0 6px;font-size:26px}
.modal .row .btn{flex:1}
.modes{display:grid;gap:12px}
.setup{margin-top:18px;display:grid;gap:10px}
.pin{display:grid;gap:4px;font-weight:800;font-size:14px}
.pin input{font:700 20px "Nunito",sans-serif;padding:10px 14px;border:3px solid var(--ink);border-left:14px solid var(--pc);border-radius:14px;background:var(--card);color:var(--ink);min-height:52px;width:100%}
.pin input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
body.multimode{height:100%}
.multimode #app{max-width:none;height:100%;display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{--pc:var(--pink);background:var(--card);border:3px solid var(--ink);border-top:14px solid var(--pc);border-radius:22px;box-shadow:4px 4px 0 var(--shadow);padding:12px;display:flex;flex-direction:column;min-height:0;overflow:auto}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(18px,1.7vw,26px)}
.pname{background:var(--pc);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:0 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col .prog{height:12px;margin:8px 0}
.col .prog i{background:var(--pc)}
.mdots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-bottom:6px}
.mdots .dot{width:auto;height:24px;font-size:11px;border-radius:7px}
.mdots .dot.done{background:var(--pc)}
.mdots .dot.cur{transform:none}
.mq{flex:1;display:flex;flex-direction:column;justify-content:center}
.col .expr{font-size:clamp(34px,4.4vw,76px);margin:10px 0 14px}
.col .opts{padding:0;gap:10px}
.col .opt{min-height:clamp(72px,12vh,128px);font-size:clamp(22px,2.5vw,40px)}
.col .opt .k{width:22px;height:22px;font-size:12px;top:6px;left:8px}
.pnav{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;margin-top:12px}
.pnav .btn{min-height:52px;padding:6px 10px;font-size:clamp(15px,1.3vw,18px)}
.pdone{flex:1;display:grid;place-content:center;text-align:center;font-family:"Baloo 2",sans-serif;font-size:32px}
.rk{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-left:14px solid var(--pc);border-radius:18px;padding:10px 14px;margin-top:10px}
.medal{font-size:40px}
.rkname{flex:1;display:grid;line-height:1.25}
.rkname b{font-family:"Baloo 2",sans-serif;font-size:24px}
.rkname small{color:var(--muted);font-weight:700}
.rkscore{font-family:"Baloo 2",sans-serif;font-size:48px;font-weight:800}
.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ptabs .btn{font-size:16px;padding:8px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card>.row .btn.big{flex:1;min-width:200px}
@media (max-width:820px){.mgrid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:88%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.col{scroll-snap-align:center}.col .expr{font-size:46px}.col .opt{font-size:28px}}
@media (min-width:600px){.facts{gap:14px}.meta{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap" id="app"></div>
<div id="nav"></div>
<script>
const OPS={
  '+':{name:'Penjumlahan',sym:'+',color:'var(--add)'},
  '-':{name:'Pengurangan',sym:'−',color:'var(--sub)'},
  'x':{name:'Perkalian',sym:'×',color:'var(--mul)'},
  ':':{name:'Pembagian',sym:'÷',color:'var(--div)'}
};
const BANK={
'+':"1/5 2/5|3/8 1/8|1/2 1/3|2/9 4/9|1/6 1/3|3/11 5/11|1/4 2/5|5/12 1/12|2/3 1/6|4/13 6/13|1/2 1/5|7/15 4/15|1/3 1/4|2/7 4/7|3/4 1/8|5/17 9/17|1/6 3/4|3/5 3/5|2/5 1/10|7/16 5/16|1/3 2/9|3/4 1/2|9/19 7/19|2/3 1/5|5/14 3/7|7/20 9/20|3/8 1/4|5/6 1/2|4/9 1/3|1/4 3/10",
'-':"4/5 1/5|7/9 4/9|1/2 1/3|5/8 3/8|3/4 1/6|9/10 3/10|2/3 1/4|11/12 5/12|4/5 1/2|6/7 2/7|5/6 1/3|13/14 5/14|3/5 1/4|10/11 4/11|7/8 1/4|15/16 7/16|2/3 2/9|12/13 5/13|9/10 2/5|14/15 2/15|3/4 1/5|16/17 9/17|5/6 3/4|17/20 7/20|1/3 1/5|18/19 6/19|7/10 1/2|5/12 1/4|8/9 1/3|11/14 2/7",
'x':"1/2 1/3|2/5 1/2|3/4 1/3|2/3 2/5|1/4 1/5|3/5 5/6|2/7 7/8|4/9 3/4|1/2 3/7|5/8 2/5|3/10 2/3|2/3 5/6|1/3 2/5|6/7 1/2|3/4 3/4|5/6 2/5|4/5 3/8|7/10 5/7|3/8 4/9|9/10 2/3|1/6 3/5|5/12 3/5|2/9 3/4|7/8 4/7|3/5 1/3|8/9 3/16|5/7 3/5|4/11 1/2|2/5 5/9|10/17 1/2",
':':"1/2 1/4|2/3 1/3|3/5 1/5|1/4 1/2|4/7 1/7|2/5 1/2|3/4 3/8|5/6 1/3|1/3 1/2|7/8 1/4|4/9 1/3|3/10 3/5|5/12 1/4|2/7 4/7|3/8 1/2|9/10 3/5|1/5 3/5|8/15 4/5|6/11 3/11|4/5 2/3|7/12 1/6|3/14 3/7|5/8 5/6|2/3 4/5|9/16 3/4|1/6 1/3|10/13 5/13|3/4 1/5|7/10 7/20|11/18 11/12"
};
const N=30;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const simp=([n,d])=>{const g=gcd(n,d);return[n/g,d/g]};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rawCalc=(op,a,b,c,d)=>op==='+'?(b===d?[a+c,b]:[a*d+c*b,b*d]):op==='-'?(b===d?[a-c,b]:[a*d-c*b,b*d]):op==='x'?[a*c,b*d]:[a*d,b*c];
const calc=rawCalc;
const key=([n,d])=>simp([n,d]).join('/');
const fr=(t,b)=>`<span class="fr"><span>${t}</span><span>${b}</span></span>`;
const disp=([n,d])=>fr(n,d);
const okSize=([n,d])=>n>0&&d>0&&n<=400&&d<=400;
const exprHTML=q=>`${fr(q.a,q.b)}<span class="op">${OPS[q.op].sym}</span>${fr(q.c,q.d)}`;

function makeOptions(q){
  const{op,a,b,c,d}=q,ans=q.ans,seen=new Set([key(ans)]),out=[];
  const mistakes=[];
  Object.keys(OPS).forEach(o=>{if(o!==op)mistakes.push(rawCalc(o,a,b,c,d))});
  if(op==='+')mistakes.push([a+c,b+d],[a+c,b*d]);
  if(op==='-'){mistakes.push([a-c,b*d]);if(b!==d&&b>d)mistakes.push([a-c,b-d])}
  if(op==='x')mistakes.push([a+c,b*d],[a*d,b*c]);
  if(op===':')mistakes.push([b*c,a*d],[a*c,b*d]);
  const[n,dd]=ans;
  const near=[[n+1,dd],[n-1,dd],[dd,n],[n,dd+1],[n+2,dd],[n,dd-1]];
  for(const f of [...shuffle(mistakes),...shuffle(near)]){
    if(out.length===3)break;
    if(!okSize(f))continue;
    const k=key(f);if(seen.has(k))continue;
    seen.add(k);out.push(f);
  }
  while(out.length<3){
    const f=[1+(Math.random()*dd*1.5|0),dd],k=key(f);
    if(okSize(f)&&!seen.has(k)){seen.add(k);out.push(f)}
  }
  return shuffle([ans,...out]);
}

function steps(q){
  const{op,a,b,c,d}=q,sym=OPS[op].sym,s=[],[rn,rd]=q.ans;
  const line=h=>`<span class="mathline">${h}</span>`;
  if(op==='+'||op==='-'){
    const verb=op==='+'?'jumlahkan':'kurangkan';
    if(b===d){
      s.push(`Penyebutnya sudah sama, yaitu ${b}. Cukup ${verb} pembilangnya, penyebutnya tetap.`+line(`${fr(a,b)}<span class="op">${sym}</span>${fr(c,b)} = ${fr(`${a} ${sym} ${c}`,b)} = ${fr(rn,rd)}`));
    }else{
      const A=a*d,C=c*b;
      s.push(`Penyebutnya berbeda (${b} dan ${d}). Samakan penyebut dengan mengalikan kedua penyebut: ${b} × ${d} = ${rd}.`);
      s.push(`Ubah kedua pecahan agar penyebutnya ${rd}.`+line(`${fr(a,b)} = ${fr(`${a}×${d}`,`${b}×${d}`)} = ${fr(A,rd)}`)+line(`${fr(c,d)} = ${fr(`${c}×${b}`,`${d}×${b}`)} = ${fr(C,rd)}`));
      s.push(`Sekarang ${verb} pembilangnya.`+line(`${fr(A,rd)}<span class="op">${sym}</span>${fr(C,rd)} = ${fr(`${A} ${sym} ${C}`,rd)} = ${fr(rn,rd)}`));
    }
  }else if(op==='x'){
    s.push('Kalikan pembilang dengan pembilang, dan penyebut dengan penyebut.'+line(`${fr(a,b)}<span class="op">×</span>${fr(c,d)} = ${fr(`${a}×${c}`,`${b}×${d}`)} = ${fr(rn,rd)}`));
  }else{
    s.push(`Pembagian pecahan diubah menjadi perkalian dengan kebalikan pecahan kedua. Kebalikan dari ${fr(c,d)} adalah ${fr(d,c)}.`+line(`${fr(a,b)}<span class="op">÷</span>${fr(c,d)} = ${fr(a,b)}<span class="op">×</span>${fr(d,c)}`));
    s.push('Lalu kalikan seperti biasa.'+line(`${fr(a,b)}<span class="op">×</span>${fr(d,c)} = ${fr(`${a}×${d}`,`${b}×${c}`)} = ${fr(rn,rd)}`));
  }
  return s;
}

const TIME=30*60;
let S={},timerId=null;
const app=document.getElementById('app'),nav=document.getElementById('nav');
const top0=()=>window.scrollTo(0,0);
const mmss=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;

/* ---- sound ---- */
let ac=null,muted=false;
try{muted=localStorage.getItem('pecahan-mute')==='1'}catch(e){}
function tone(f,dur,type='triangle',vol=.14,delay=0){
  if(muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);
  }catch(e){}
}
const SFX={
  tap:()=>tone(520,.07,'triangle',.1),
  pick:()=>{tone(660,.08,'square',.06);tone(990,.12,'square',.05,.07)},
  start:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.13,i*.09)),
  warn:()=>{tone(880,.14,'sawtooth',.07);tone(880,.14,'sawtooth',.07,.2)},
  good:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.1)),
  ok:()=>[523,659,784].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.12)),
  low:()=>[392,330,262].forEach((f,i)=>tone(f,.25,'sine',.13,i*.16))
};
function soundBtn(){return `<button class="btn ghost icon" id="snd" aria-label="${muted?'Nyalakan suara':'Matikan suara'}">${muted?'🔇':'🔊'}</button>`}
function bindSound(){const b=document.getElementById('snd');if(b)b.onclick=()=>{muted=!muted;try{localStorage.setItem('pecahan-mute',muted?'1':'0')}catch(e){}b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-label',muted?'Nyalakan suara':'Matikan suara');SFX.tap()}}

/* ---- timer ---- */
let G=null;
const left=()=>Math.max(0,TIME-Math.floor((Date.now()-G.start)/1000));
function tick(){
  const t=left(),el=document.getElementById('timer');
  if(el){el.textContent='⏱ '+mmss(t);el.classList.toggle('warn',t<=60)}
  if(t===60&&!G.w60){G.w60=1;SFX.warn()}
  if(t<=10&&t>0&&G.lastBeep!==t){G.lastBeep=t;tone(1200,.06,'square',.06)}
  if(t===0&&!G.ended){G.timeUp=true;G===S?endTest():endMulti()}
}

/* ---- screens ---- */
function newTest(){
  S={qs:makeSet(),pick:Array(N).fill(null),cur:0,filter:'all',start:Date.now()};G=S;
  clearInterval(timerId);timerId=setInterval(tick,1000);
  SFX.start();renderQuiz();top0();
}

function renderStart(){
  document.body.classList.remove('quizmode','multimode');nav.innerHTML='';
  const colors=['var(--pink)','var(--yellow)','var(--mint)','var(--blue)','var(--orange)','var(--lilac)'];
  const word=(w,o)=>[...w].map((ch,i)=>`<span style="color:${colors[(i+o)%6]}">${ch}</span>`).join('');
  app.innerHTML=`<div class="row between" style="margin-bottom:6px"><span></span>${soundBtn()}</div>
  <div class="card">
    <div class="title" aria-label="Latihan Pecahan">${word('Latihan',0)}<br>${word('Pecahan',3)}</div>
    <div class="hero"><div class="pie" role="img" aria-label="Pizza dengan 3 dari 4 potong berwarna"></div>
      <div class="expr">${fr(3,4)}<span class="op">=</span><span class="eq" style="margin:0">?</span></div></div>
    <div class="facts">
      <div class="fact" style="background:#FFE58A"><b>30</b>soal acak</div>
      <div class="fact" style="background:#FFC4DA"><b>30</b>menit</div>
      <div class="fact" style="background:#B9F3D8"><b>4</b>operasi</div>
    </div>
    <div class="legend">${Object.values(OPS).map(o=>`<span class="chip" style="background:${o.color}">${o.sym} ${o.name}</span>`).join('')}</div>
    <p class="muted">Pilih satu jawaban di tiap soal. Nilai dan pembahasan muncul setelah kamu selesai atau waktunya habis.</p>
    <div class="modes"><button class="btn big" id="go">🙋 Main sendiri</button><button class="btn big pink" id="go3">👥 Main bertiga (layar besar)</button></div>
    <div class="setup" id="setup" hidden>
      ${names.map((n,i)=>`<label class="pin" style="--pc:${PCOL[i]}"><span>Nama pemain ${i+1}</span><input id="nm${i}" value="${esc(n)}" maxlength="14" autocomplete="off"></label>`).join('')}
      <button class="btn big" id="start3">Mulai bertiga!</button>
    </div>
  </div>`;
  document.getElementById('go').onclick=newTest;bindSound();
  document.getElementById('go3').onclick=()=>{SFX.tap();const s=document.getElementById('setup');s.hidden=false;s.scrollIntoView({block:'center'});document.getElementById('nm0').select()};
  document.getElementById('start3').onclick=()=>{names=[0,1,2].map(i=>document.getElementById('nm'+i).value);startMulti()};
}

function renderQuiz(){
  document.body.classList.add('quizmode');
  const q=S.qs[S.cur],o=OPS[q.op],done=S.pick.filter(x=>x!==null).length,last=S.cur===N-1;
  app.innerHTML=`<div class="bar">
      <div class="row between"><span class="count">Soal ${S.cur+1}/${N}</span>
        <div class="row" style="gap:8px"><span class="timer" id="timer">⏱ ${mmss(left())}</span>${soundBtn()}</div></div>
      <div class="prog" aria-label="${done} dari ${N} terjawab"><i style="width:${done/N*100}%"></i></div>
      <div class="dots" id="dots">${S.qs.map((_,i)=>`<button class="dot${S.pick[i]!==null?' done':''}${i===S.cur?' cur':''}" data-i="${i}" aria-label="Soal ${i+1}">${i+1}</button>`).join('')}</div>
    </div>
    <div class="card qcard">
      <div class="qhead" style="background:${o.color}"><span>${o.sym} ${o.name}</span><span>${done} terjawab</span></div>
      <div class="expr">${exprHTML(q)}<span class="eq">= ?</span></div>
      <div class="opts">${q.opts.map((f,i)=>`<button class="opt${S.pick[S.cur]===i?' sel':''}" data-o="${i}" aria-pressed="${S.pick[S.cur]===i}"><span class="k">${'ABCD'[i]}</span>${disp(f)}</button>`).join('')}</div>
    </div>
    <button class="finlink" id="fin">Selesai dan lihat nilai</button>`;
  nav.innerHTML=`<div class="bottom"><div class="in">
    <button class="btn ghost" id="prev" ${S.cur===0?'disabled':''}>◀ Kembali</button>
    <button class="btn ${last?'pink':''}" id="next">${last?'Selesai 🏁':'Lanjut ▶'}</button></div></div>`;
  tick();if(S.ended)return;bindSound();
  const cur=app.querySelector('.dot.cur'),dots=document.getElementById('dots');
  dots.scrollLeft=cur.offsetLeft-dots.clientWidth/2+18;
  app.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{SFX.tap();S.cur=+b.dataset.i;renderQuiz()});
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    SFX.pick();S.pick[S.cur]=+b.dataset.o;const at=S.cur;renderQuiz();
    if(at<N-1)setTimeout(()=>{if(S.cur===at&&!S.ended){S.cur++;renderQuiz()}},420);
  });
  document.getElementById('prev').onclick=()=>{SFX.tap();S.cur--;renderQuiz()};
  document.getElementById('next').onclick=()=>{SFX.tap();last?finish():(S.cur++,renderQuiz())};
  document.getElementById('fin').onclick=finish;
}

function finish(){
  const empty=S.pick.filter(x=>x===null).length;
  if(!empty)return endTest();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>Masih ada ${empty} soal kosong</h2>
    <p class="muted">Soal yang kosong dihitung salah. Mau kembali mengerjakannya dulu?</p>
    <div class="row"><button class="btn" id="back">Kerjakan dulu</button><button class="btn ghost" id="sure">Tetap selesai</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById('back').onclick=()=>{m.remove();S.cur=S.pick.indexOf(null);renderQuiz()};
  document.getElementById('sure').onclick=()=>{m.remove();endTest()};
  document.getElementById('back').focus();
}

function endTest(){
  if(S.ended)return;S.ended=true;clearInterval(timerId);
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  S.used=Math.min(TIME,Math.floor((Date.now()-S.start)/1000));
  S.ok=S.qs.map((q,i)=>S.pick[i]!==null&&key(q.opts[S.pick[i]])===key(q.ans));
  S.score=Math.round(S.ok.filter(Boolean).length/N*100);
  (S.score>=80?SFX.good:S.score>=60?SFX.ok:SFX.low)();
  renderResult();top0();
}

function renderResult(){
  document.body.classList.remove('quizmode');nav.innerHTML='';
  const ok=S.ok,right=ok.filter(Boolean).length,score=S.score,wrong=N-right;
  const stars=score>=90?3:score>=70?2:score>=50?1:0;
  const msg=score>=90?'Luar biasa! Kamu jago pecahan!':score>=70?'Bagus sekali! Sedikit lagi sempurna.':score>=50?'Lumayan! Baca pembahasan yang salah, lalu coba lagi.':'Ayo semangat! Pelajari pembahasannya pelan-pelan, lalu coba lagi.';
  const stat=Object.entries(OPS).map(([k,o])=>{
    const idx=S.qs.map((q,i)=>q.op===k?i:-1).filter(i=>i>=0),r=idx.filter(i=>ok[i]).length;
    return `<div class="stat"><small>${o.sym} ${o.name}</small><b>${r}/${idx.length}</b><div class="mbar"><i style="width:${r/idx.length*100}%;background:${o.color}"></i></div></div>`;
  }).join('');
  const items=reviewHTML(S.qs,S.pick,ok,S.filter);
  app.innerHTML=`<div class="row between" style="margin-bottom:6px"><span></span>${soundBtn()}</div>
    <div class="card">
      ${S.timeUp?'<div class="notice">⏰ Waktu habis!</div>':''}
      <div class="badge"><div class="score">${score}</div><b>nilai</b></div>
      <div class="stars" aria-label="${stars} dari 3 bintang">${[0,1,2].map(i=>`<span class="${i<stars?'on':'off'}">★</span>`).join('')}</div>
      <p class="center"><b>${right} benar</b> dari ${N} soal. ${msg}</p>
      <div class="meta">${stat}</div>
      <p class="center muted">⏱ Waktu mengerjakan: ${Math.floor(S.used/60)} menit ${S.used%60} detik</p>
      <div class="row"><button class="btn big" id="again">Main lagi, soal baru!</button><button class="btn ghost big" id="menu">Menu utama</button></div>
    </div>
    <div class="tabs">
      <button class="btn ${S.filter==='all'?'':'ghost'}" data-f="all">Semua (${N})</button>
      <button class="btn ${S.filter==='wrong'?'pink':'ghost'}" data-f="wrong">Yang salah (${wrong})</button>
    </div>
    ${items}`;
  document.getElementById('again').onclick=newTest;bindSound();
  document.getElementById('menu').onclick=()=>{SFX.tap();renderStart();top0()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{SFX.tap();S.filter=b.dataset.f;const y=window.scrollY;renderResult();window.scrollTo(0,y)});
}
/* ---- shared helpers ---- */
const PCOL=['var(--pink)','var(--blue)','var(--orange)'];
let names=['Pemain 1','Pemain 2','Pemain 3'],M=null;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starsHTML=sc=>{const n=sc>=90?3:sc>=70?2:sc>=50?1:0;return `<span class="stars" style="font-size:inherit;margin:0" aria-label="${n} dari 3 bintang">${[0,1,2].map(i=>`<span class="${i<n?'on':'off'}">★</span>`).join('')}</span>`};
function makeSet(){
  const counts=shuffle([8,8,7,7]),list=[];
  Object.keys(OPS).forEach((op,i)=>{
    shuffle(BANK[op].split('|')).slice(0,counts[i]).forEach(t=>{
      const[[a,b],[c,d]]=t.split(' ').map(x=>x.split('/').map(Number));
      const q={op,a,b,c,d};q.ans=calc(op,a,b,c,d);q.opts=makeOptions(q);list.push(q);
    });
  });
  return shuffle(list);
}
function reviewHTML(qs,pick,ok,filter){
  const h=qs.map((q,i)=>{
    if(filter==='wrong'&&ok[i])return '';
    const p=pick[i],o=OPS[q.op];
    return `<div class="rv ${ok[i]?'ok':'no'}">
      <div class="row between"><b>Soal ${i+1}</b><span class="chip" style="background:${o.color}">${o.sym} ${o.name}</span></div>
      <div class="expr">${exprHTML(q)}</div>
      <div class="ans">
        <span>Jawaban</span><span>${p===null?'<span class="tag bad" style="margin:0">Tidak dijawab</span>':`<span class="v">${disp(q.opts[p])}</span><span class="tag ${ok[i]?'good':'bad'}">${ok[i]?'Benar':'Salah'}</span>`}</span>
        ${ok[i]?'':`<span>Jawaban benar</span><span class="v">${disp(q.ans)}</span>`}
      </div>
      <details ${ok[i]?'':'open'}><summary>Lihat pembahasan</summary><ol class="steps">${steps(q).map(t=>`<li>${t}</li>`).join('')}</ol></details>
    </div>`;
  }).join('');
  return h||'<div class="card" style="margin-top:14px">Tidak ada soal yang salah. Hebat! 🎉</div>';
}
function askModal(title,text,yes,no,onYes){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h2>${title}</h2><p class="muted">${text}</p>
    <div class="row"><button class="btn" id="mNo">${no}</button><button class="btn ghost" id="mYes">${yes}</button></div></div>`;
  document.body.appendChild(m);
  document.getElementById('mNo').onclick=()=>m.remove();
  document.getElementById('mYes').onclick=()=>{m.remove();onYes()};
  document.getElementById('mNo').focus();
}

/* ---- 3 players ---- */
function startMulti(){
  const set=makeSet();
  M={start:Date.now(),view:0,filter:'all',players:names.map((n,i)=>({name:n.trim()||`Pemain ${i+1}`,color:PCOL[i],
    qs:shuffle(set).map(q=>({...q,opts:shuffle(q.opts)})),pick:Array(N).fill(null),cur:0,done:false,arm:false}))};
  G=M;clearInterval(timerId);timerId=setInterval(tick,1000);SFX.start();renderMulti();
}
function renderMulti(){
  document.body.classList.remove('quizmode');document.body.classList.add('multimode');nav.innerHTML='';
  app.innerHTML=`<div class="mtop row between"><span class="count">👥 Mode 3 Pemain</span>
    <div class="row" style="gap:8px"><span class="timer" id="timer"></span>${soundBtn()}<button class="btn ghost" id="stop" style="min-height:46px;padding:4px 14px;font-size:16px">Akhiri</button></div></div>
    <div class="mgrid">${M.players.map((_,i)=>`<section class="col" id="col${i}" aria-label="${esc(M.players[i].name)}"></section>`).join('')}</div>`;
  M.players.forEach((_,i)=>renderCol(i));tick();bindSound();
  document.getElementById('stop').onclick=()=>askModal('Akhiri permainan?','Semua pemain langsung dinilai. Soal yang kosong dihitung salah.','Akhiri sekarang','Lanjut main',endMulti);
}
function renderCol(i){
  const P=M.players[i],el=document.getElementById('col'+i);if(!el)return;
  const done=P.pick.filter(x=>x!==null).length;
  el.style.setProperty('--pc',P.color);
  const head=`<div class="phead"><span class="pname">${esc(P.name)}</span><span>${done}/${N}</span></div><div class="prog"><i style="width:${done/N*100}%"></i></div>`;
  if(P.done){el.innerHTML=head+`<div class="pdone"><div style="font-size:72px">🏁</div><b>Selesai!</b><p class="muted" style="font-size:17px;font-family:Nunito,sans-serif">${done} soal dijawab dalam ${mmss(P.used)}.<br>Menunggu pemain lain…</p></div>`;return}
  const q=P.qs[P.cur],o=OPS[q.op],last=P.cur===N-1,empty=N-done;
  el.innerHTML=head+`<div class="mdots">${P.qs.map((_,k)=>`<button class="dot${P.pick[k]!==null?' done':''}${k===P.cur?' cur':''}" data-k="${k}" aria-label="Soal ${k+1}">${k+1}</button>`).join('')}</div>
    <div class="mq"><div class="row between"><span class="chip" style="background:${o.color}">${o.sym} ${o.name}</span><b>Soal ${P.cur+1}</b></div>
      <div class="expr">${exprHTML(q)}<span class="eq">= ?</span></div>
      <div class="opts">${q.opts.map((f,k)=>`<button class="opt${P.pick[P.cur]===k?' sel':''}" data-o="${k}" aria-pressed="${P.pick[P.cur]===k}"><span class="k">${'ABCD'[k]}</span>${disp(f)}</button>`).join('')}</div></div>
    <div class="pnav"><button class="btn ghost" data-a="prev" aria-label="Soal sebelumnya" ${P.cur===0?'disabled':''}>◀</button>
      <button class="btn" data-a="next" ${last?'disabled':''}>Lanjut ▶</button>
      <button class="btn pink" data-a="fin">${P.arm?`${empty} kosong, yakin?`:'Selesai'}</button></div>`;
  el.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{SFX.tap();P.cur=+b.dataset.k;P.arm=false;renderCol(i)});
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    SFX.pick();P.pick[P.cur]=+b.dataset.o;P.arm=false;const at=P.cur;renderCol(i);
    if(at<N-1)setTimeout(()=>{if(P.cur===at&&!P.done&&!M.ended){P.cur++;renderCol(i)}},420);
  });
  el.querySelector('[data-a=prev]').onclick=()=>{SFX.tap();P.cur--;P.arm=false;renderCol(i)};
  el.querySelector('[data-a=next]').onclick=()=>{SFX.tap();P.cur++;P.arm=false;renderCol(i)};
  el.querySelector('[data-a=fin]').onclick=()=>{
    if(empty&&!P.arm){P.arm=true;SFX.tap();return renderCol(i)}
    P.done=true;P.used=Math.min(TIME,Math.floor((Date.now()-M.start)/1000));SFX.ok();renderCol(i);
    if(M.players.every(x=>x.done))setTimeout(endMulti,600);
  };
}
function endMulti(){
  if(M.ended)return;M.ended=true;clearInterval(timerId);
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const el=Math.min(TIME,Math.floor((Date.now()-M.start)/1000));
  M.players.forEach(P=>{if(!P.done)P.used=el;P.ok=P.qs.map((q,k)=>P.pick[k]!==null&&key(q.opts[P.pick[k]])===key(q.ans));P.right=P.ok.filter(Boolean).length;P.score=Math.round(P.right/N*100)});
  M.rank=[0,1,2].sort((a,b)=>M.players[b].score-M.players[a].score||M.players[a].used-M.players[b].used);
  SFX.good();renderMultiResult();top0();
}
function renderMultiResult(){
  document.body.classList.remove('multimode','quizmode');nav.innerHTML='';
  const medal=['🥇','🥈','🥉'],P=M.players[M.view],wrong=N-P.right;
  app.innerHTML=`<div class="row between" style="margin-bottom:6px"><span></span>${soundBtn()}</div>
    <div class="card">
      ${M.timeUp?'<div class="notice">⏰ Waktu habis!</div>':''}
      <div class="title" style="font-size:clamp(36px,9vw,54px);text-align:center"><span style="color:var(--yellow)">Juara!</span></div>
      ${M.rank.map((pi,r)=>{const X=M.players[pi];return `<div class="rk" style="--pc:${X.color}">
        <span class="medal">${medal[r]}</span>
        <div class="rkname"><b>${esc(X.name)}</b><small>${X.right} benar, waktu ${mmss(X.used)}</small><span style="font-size:24px">${starsHTML(X.score)}</span></div>
        <span class="rkscore">${X.score}</span></div>`}).join('')}
      <div class="row" style="margin-top:16px"><button class="btn big" id="again3">Main lagi bertiga</button><button class="btn ghost big" id="menu">Menu utama</button></div>
    </div>
    <h2 class="disp" style="margin:24px 0 0">Pembahasan</h2>
    <div class="ptabs">${M.players.map((X,i)=>`<button class="btn ${M.view===i?'':'ghost'}" data-p="${i}" style="${M.view===i?`background:${X.color};color:#fff`:''}">${esc(X.name)}</button>`).join('')}</div>
    <div class="tabs" style="margin-top:10px">
      <button class="btn ${M.filter==='all'?'':'ghost'}" data-f="all">Semua (${N})</button>
      <button class="btn ${M.filter==='wrong'?'pink':'ghost'}" data-f="wrong">Yang salah (${wrong})</button>
    </div>
    ${reviewHTML(P.qs,P.pick,P.ok,M.filter)}`;
  bindSound();
  document.getElementById('again3').onclick=startMulti;
  document.getElementById('menu').onclick=()=>{SFX.tap();renderStart();top0()};
  const keep=fn=>()=>{SFX.tap();fn();const y=window.scrollY;renderMultiResult();window.scrollTo(0,y)};
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=keep(()=>M.view=+b.dataset.p));
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=keep(()=>M.filter=b.dataset.f));
}
renderStart();
</script>
