<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tanding LCC · SD Negeri 2 Pesantren</title>
<meta name="theme-color" content="#1e1b4b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5ff;--ink:#1e2440;--muted:#66708a;--line:#e1e5f2;--pri:#4f46e5;--grad:linear-gradient(135deg,#4f46e5,#3b82f6 55%,#06b6d4);--ok:#16a34a;--okbg:#e6f8ec;--bad:#e5484d;--badbg:#fdecee;--ai:#7c3aed;--aibg:#f1eaff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:2.05vmin}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- PENGATURAN ---------- */
.setup{position:fixed;background:linear-gradient(160deg,#1e1b4b,#312e81 45%,#0e7490);color:#fff;overflow:auto;align-items:center;padding:1rem 2rem}
.setup .wrap{width:min(100%,74rem)}
.brand{display:flex;align-items:center;gap:.9rem;margin-bottom:.7rem}
.brand .lg{font-size:2.3rem}.brand h1{margin:0;font-size:1.9rem;font-weight:900;line-height:1.1}.brand p{margin:.2rem 0 0;opacity:.85;font-weight:700;font-size:1.05rem}
.panel{background:#ffffff14;border:.1rem solid #ffffff26;border-radius:1.4rem;padding:.85rem 1.2rem;margin-bottom:.8rem}
.panel h2{margin:0 0 .55rem;font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.5rem}
.row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.seg{display:inline-flex;background:#ffffff1a;border-radius:1rem;padding:.3rem;gap:.3rem;flex-wrap:wrap}
.seg button{border:0;background:none;color:#fff;font-weight:800;font-size:1rem;padding:.5rem 1rem;border-radius:.8rem;min-width:3.2rem}
.seg button.on{background:#fff;color:#1e1b4b}
.lbl{font-weight:800;font-size:1rem;opacity:.9;min-width:7rem}
.names{display:grid;gap:.45rem;margin-top:.6rem}
.names input{width:100%;font-size:1.1rem;font-weight:800;padding:.6rem 1rem;border-radius:.9rem;border:.12rem solid #ffffff40;background:#ffffff1f;color:#fff;outline:none;user-select:text;-webkit-user-select:text}
.names input::placeholder{color:#ffffffa0}
.names input:focus{border-color:#fff;background:#ffffff2e}
.ailist{display:grid;gap:.45rem;margin-top:.6rem}
.airow .seg{flex-wrap:nowrap}.airow .seg button{font-size:.92rem;padding:.45rem .7rem;min-width:0;white-space:nowrap}
.airow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.airow .nm{font-weight:900;font-size:1.05rem;min-width:4.5rem}
.lvinfo{font-size:.88rem;opacity:.8;margin:.5rem 0 0;line-height:1.4}
.target{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;background:#fff;color:#1e1b4b;border-radius:1rem;overflow:hidden}
.step button{border:0;background:none;font-size:1.5rem;font-weight:900;width:2.9rem;height:2.9rem;color:#1e1b4b}
.step b{font-size:1.8rem;font-weight:900;min-width:4rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{border:.12rem solid #ffffff40;background:#ffffff14;color:#fff;font-weight:800;font-size:.92rem;padding:.42rem .75rem;border-radius:999rem}
.chips button.on{background:#fff;color:#1e1b4b;border-color:#fff}
.go{position:sticky;bottom:.6rem;z-index:2;display:block;width:100%;border:0;border-radius:1.2rem;padding:.9rem;font-size:1.5rem;font-weight:900;color:#1e1b4b;background:linear-gradient(90deg,#fde047,#facc15);box-shadow:0 .5rem 1.5rem -.5rem #facc15aa;margin-top:.4rem}
.go:active{transform:scale(.99)}
.back{display:inline-block;margin-top:1rem;color:#fff;opacity:.8;font-weight:800;text-decoration:none;font-size:1rem}
/* ---------- ARENA ---------- */
.arena{background:var(--bg)}
.hud{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:1.2rem;align-items:center;padding:.8rem 1.2rem;background:#1e1b4b;color:#fff}
.hud .t{font-weight:900;font-size:1.1rem;line-height:1.15}.hud .t small{display:block;font-weight:700;opacity:.75;font-size:.85rem}
.race{display:grid;gap:.45rem}
.lane{display:grid;grid-template-columns:8.2rem 1fr 6rem;align-items:center;gap:.7rem}
.lane .who{font-weight:900;font-size:1.05rem;white-space:nowrap}
.lane .sc{font-weight:900;font-size:1.35rem;text-align:right;font-variant-numeric:tabular-nums}.lane .sc small{font-size:.85rem;opacity:.7}
.track{position:relative;height:2.2rem;border-radius:999rem;background:#ffffff1c;overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999rem;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.track .runner{position:absolute;top:50%;font-size:1.9rem;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 .15rem .2rem #0006)}
.track .flag{position:absolute;right:-.6rem;top:50%;transform:translateY(-55%);font-size:1.7rem}
.lane.siswa .runner{transform:translate(-50%,-50%) scaleX(-1)}
.lane.siswa .fill{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
.lane.ai .fill{background:linear-gradient(90deg,#8b5cf6,#d946ef)}
.aistrip{display:flex;gap:.5rem;flex-wrap:wrap;margin-left:8.9rem}
.aichip{display:inline-flex;align-items:center;gap:.4rem;background:#ffffff17;border-radius:999rem;padding:.2rem .7rem;font-size:.85rem;font-weight:800}
.aichip .st{min-width:4.3rem;opacity:.85}
.aichip.ok{background:#16a34a}.aichip.bad{background:#e5484d}
.dots i{display:inline-block;width:.35rem;height:.35rem;border-radius:50%;background:#fff;margin:0 .06rem;animation:dot 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25}}
.tools{display:flex;gap:.5rem}
.tools button{border:0;background:#ffffff1f;color:#fff;font-weight:900;font-size:.95rem;padding:.6rem .85rem;border-radius:.8rem}
.board{flex:1;min-height:0;display:grid;gap:.9rem;padding:.9rem}
.board.n2{grid-template-columns:1fr 1fr}.board.n3{grid-template-columns:1fr 1fr 1fr}
.pl{--c:#3b82f6;position:relative;display:flex;flex-direction:column;min-height:0;background:#fff;border-radius:1.4rem;border:.3rem solid var(--c);box-shadow:0 .6rem 1.6rem -1rem #1e244066;overflow:hidden}
.pl .ph{flex:none;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.65rem 1rem;background:var(--c);color:#fff}
.pl .ph .nm{font-weight:900;font-size:1.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ph .pt{font-weight:900;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;background:#ffffff2e;border-radius:.8rem;padding:.25rem .7rem;min-width:3.6rem;text-align:center}
.pl .meta{flex:none;display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem 0;font-weight:800;font-size:.95rem;color:var(--muted)}
.mchip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999rem;padding:.2rem .7rem;font-size:.9rem;font-weight:900;background:color-mix(in srgb,var(--mc) 14%,#fff);color:color-mix(in srgb,var(--mc) 80%,#000)}
.pl .q{flex:1;min-height:0;overflow:auto;padding:.6rem 1.1rem;font-weight:900;font-size:1.75rem;line-height:1.3;display:flex;align-items:center}
.n3 .pl .q{font-size:1.5rem}
.pl .q.m{font-size:1.4rem}.n3 .pl .q.m{font-size:1.22rem}
.pl .q.l{font-size:1.15rem;line-height:1.35}.n3 .pl .q.l{font-size:1.02rem}
.pl .opts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:.65rem;padding:.4rem 1rem 1rem}
.op{display:flex;align-items:center;gap:.6rem;text-align:left;border:.18rem solid var(--line);background:#f8f9fe;border-radius:1rem;padding:.75rem .8rem;min-height:5.2rem;font-weight:800;font-size:1.22rem;line-height:1.2;color:var(--ink)}
.n3 .op{font-size:1.08rem;min-height:4.8rem;padding:.6rem .7rem}
.op .L{flex:none;width:2.1rem;height:2.1rem;border-radius:.65rem;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:900;font-size:1.05rem}
.op:active{transform:scale(.98)}
.op.ok{background:var(--okbg);border-color:var(--ok);color:#11683a}.op.ok .L{background:var(--ok)}
.op.bad{background:var(--badbg);border-color:var(--bad);color:#a52a2e}.op.bad .L{background:var(--bad)}
.op.dim{opacity:.45}
.pl.flash-ok{animation:fok .6s}.pl.flash-bad{animation:fbad .5s}
@keyframes fok{30%{box-shadow:0 0 0 .6rem #16a34a66}}
@keyframes fbad{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.pop{position:absolute;left:50%;top:38%;margin-left:-2.5rem;width:5rem;text-align:center;font-size:4.5rem;text-shadow:0 .2rem .6rem #fff;font-weight:900;pointer-events:none;animation:naik 1s ease forwards}
.pop.ok{color:var(--ok)}.pop.bad{color:var(--bad)}
@keyframes naik{from{opacity:0;transform:translateY(.8rem)}25%{opacity:1}to{opacity:0;transform:translateY(-2rem)}}
.cover{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#1e1b4bf5;backdrop-filter:blur(6px);color:#fff;text-align:center}
.cover .big{font-size:11rem;font-weight:900;line-height:1;animation:zoom .9s ease}
@keyframes zoom{from{transform:scale(1.6);opacity:0}30%{opacity:1}}
.cover h2{font-size:3rem;margin:.3rem 0}.cover p{font-size:1.3rem;opacity:.85;margin:.3rem 0 1.2rem}
.cbtn{border:0;border-radius:1rem;padding:.9rem 1.8rem;font-size:1.3rem;font-weight:900;margin:.4rem;background:#fff;color:#1e1b4b}
.cbtn.y{background:#facc15}
/* ---------- HASIL ---------- */
.result{background:linear-gradient(160deg,#1e1b4b,#312e81 50%,#0e7490);color:#fff;overflow:auto;align-items:center;padding:2rem}
.result .wrap{width:min(100%,72rem)}
.winner{text-align:center;margin:.5rem 0 1.4rem}
.winner .tr{font-size:6rem;line-height:1}
.winner h1{font-size:3.2rem;margin:.4rem 0 .2rem;font-weight:900}
.winner p{font-size:1.3rem;opacity:.9;margin:0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:1.2rem;align-items:stretch;margin-bottom:1.2rem}
.team{background:#ffffff14;border:.15rem solid #ffffff26;border-radius:1.4rem;padding:1.1rem 1.3rem}
.team.win{border-color:#facc15;background:#facc1522}
.team h2{margin:0 0 .6rem;font-size:1.4rem;display:flex;justify-content:space-between;align-items:center}
.team h2 b{font-size:2.2rem}
.vsx{align-self:center;font-weight:900;font-size:2rem;opacity:.7}
table{width:100%;border-collapse:collapse;font-size:1.05rem}
th{text-align:left;font-weight:800;opacity:.75;padding:.35rem .4rem;font-size:.9rem}
td{padding:.45rem .4rem;border-top:.08rem solid #ffffff22;font-weight:800}
td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
.mvp{font-size:.8rem;background:#facc15;color:#1e1b4b;border-radius:999rem;padding:.1rem .5rem;margin-left:.4rem;font-weight:900}
.rev{background:#fff;color:var(--ink);border-radius:1.4rem;padding:1.2rem 1.4rem;margin-bottom:1.2rem}
.rev h2{margin:0 0 .3rem;font-size:1.35rem}
.rev .who{margin:1rem 0 .4rem;font-weight:900;font-size:1.1rem;color:var(--c)}
.rv{border:.12rem solid var(--line);border-left:.45rem solid var(--bad);border-radius:.9rem;padding:.7rem .9rem;margin:.5rem 0;font-size:1rem}
.rv .qq{font-weight:800;margin-bottom:.3rem}
.rv .ans{color:#11683a;font-weight:800}.rv .yours{color:#a52a2e;font-weight:800}
.rv .ex{color:var(--muted);margin-top:.2rem}
.actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.notes{background:#fff;color:var(--ink);border-radius:1.4rem;padding:1.2rem 1.4rem;margin-bottom:1.2rem}
.notes h2{margin:0 0 .6rem;font-size:1.35rem}
.note{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem 0;border-top:.08rem solid var(--line);font-size:1.05rem;line-height:1.45}
.note:first-of-type{border-top:0}
.note .dot{flex:none;width:1rem;height:1rem;border-radius:50%;margin-top:.3rem}
.note b{font-weight:900}
.tag{display:inline-block;font-size:.85rem;font-weight:900;border-radius:999rem;padding:.08rem .6rem;margin-left:.35rem;color:#fff;vertical-align:.1rem}
.histtop{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.histtop h1{margin:0;font-size:2.2rem}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin-bottom:1.1rem}
.sum div{background:#ffffff17;border-radius:1.1rem;padding:.8rem;text-align:center;font-weight:800;font-size:.95rem}.sum b{display:block;font-size:2.1rem;font-weight:900}
.box{background:#ffffff14;border:.12rem solid #ffffff26;border-radius:1.3rem;padding:1rem 1.2rem;margin-bottom:1.1rem}
.box h2{margin:0 0 .5rem;font-size:1.25rem}
.match{background:#ffffff10;border-radius:1rem;margin:.55rem 0;overflow:hidden}
.match summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;padding:.75rem 1rem;font-weight:800}
.match summary::-webkit-details-marker{display:none}
.match .res{font-size:.9rem;font-weight:900;border-radius:.6rem;padding:.25rem .6rem}
.res.w{background:#16a34a}.res.l{background:#e5484d}.res.d{background:#64748b}
.match .sc{font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}
.match .det{padding:.2rem 1rem 1rem}
.match .det .note{border-color:#ffffff22;color:#fff}
.empty{opacity:.8;font-weight:700;padding:1rem 0}
.danger{background:none;border:.12rem solid #ffffff55;color:#fff;border-radius:.9rem;padding:.6rem 1rem;font-weight:800;font-size:1rem}
.danger.yakin{background:#e5484d;border-color:#e5484d}
.histbtn{position:absolute;top:1.1rem;right:2rem;border:.12rem solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:1rem;padding:.6rem 1.1rem;font-weight:900;font-size:1rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-2vh;width:.8vmin;height:1.3vmin;border-radius:.2vmin;animation:jatuh linear forwards}
@keyframes jatuh{to{transform:translateY(106vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-aspect-ratio:1/1){html{font-size:1.6vmax}.board.n3{grid-template-columns:1fr}.board.n2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ====== PENGATURAN ====== */
const NAMA_SEKOLAH = "SD Negeri 2 Pesantren";
const JEDA_SETELAH_JAWAB_MS = { benar: 700, salah: 1600 }; // lama jawaban benar ditampilkan
/* ======================== */

const MAPEL = [["PP","Pend. Pancasila","🦅","#e5484d"],["MTK","Matematika","🔢","#3b82f6"],["IPAS","IPAS","🔬","#16a34a"],["BIN","Bahasa Indonesia","📖","#f59e0b"],["IPU","IPU","🌏","#8b5cf6"],["KL","Kearifan Lokal","⛰️","#0d9488"]];
const INFO = Object.fromEntries(MAPEL.map(m => [m[1], { ic: m[2], c: m[3] }]));

/* ---------- SUARA ---------- */
let AC = null;
function bunyi(jenis) {
  if (!CFG.suara) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const nada = { benar: [[660, .08], [990, .12]], salah: [[220, .22]], tik: [[520, .09]], go: [[880, .3]], menang: [[523, .14], [659, .14], [784, .14], [1047, .35]], kalah: [[392, .2], [330, .2], [262, .4]] }[jenis] || [];
    let t = AC.currentTime;
    nada.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = jenis === 'salah' ? 'sawtooth' : 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .9; });
  } catch (e) {}
}

/* ---------- PERMAINAN ---------- */
let G = null, loopId = null, lastT = 0, wakeLock = null;
function stopLoop() { if (loopId) { clearInterval(loopId); loopId = null; } }
const skorTim = arr => arr.reduce((a, p) => a + p.skor, 0);

function mulaiGame() {
  const pool = BANK.filter(s => CFG.mapel.includes(s.m));
  G = {
    pool, target: CFG.target, jalan: false, jeda: false, selesai: false, mulai: 0, durasi: 0,
    siswa: Array.from({ length: CFG.nSiswa }, (_, i) => ({ nama: (CFG.nama[i] || '').trim() || `Siswa ${i + 1}`, warna: WARNA_SISWA[i], skor: 0, benar: 0, salah: 0, antri: shuffle(pool), ix: -1, cur: null, kunci: false, salahList: [], mapel: {}, waktu: 0, nJawab: 0, t0: 0 })),
    ai: Array.from({ length: CFG.nAI }, (_, i) => { const lv = LEVEL[CFG.level[i]] || LEVEL.sedang; return { nama: NAMA_AI[i], lv, skor: 0, benar: 0, salah: 0, sisa: 0, st: 'mikir' }; })
  };
  G.ai.forEach(a => a.sisa = aiWaktu(a));
  G.siswa.forEach(p => soalBerikut(p));
  renderArena();
  hitungMundur();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {}); } catch (e) {}
}
function aiWaktu(a) { return rand(a.lv.min, a.lv.max) * 1000; }
function soalBerikut(p) {
  p.ix++;
  if (p.ix >= p.antri.length) { p.antri = shuffle(G.pool); p.ix = 0; }
  const s = p.antri[p.ix], o = shuffle([s.a, ...s.w]);
  p.cur = { ...s, o, k: o.indexOf(s.a) };
  p.kunci = false;
  p.t0 = performance.now();
}

function renderArena() {
  app.innerHTML = `
  <div class="screen arena">
    <header class="hud">

function letupan(i, ok) {

function jawab(i, k) {

function langkahAI(dt) {
  G.ai.forEach(a => {

    const benar = Math.random() < a.lv.acc;
    if (benar) { a.skor++; a.benar++; a.st = 'ok'; } else { a.skor--; a.salah++; a.st = 'bad'; }

/* ---------- RIWAYAT & CATATAN PERFORMA ---------- */
const KUNCI_RIWAYAT = 'lcc_tanding_riwayat';
const muatRiwayat = () => store.get(KUNCI_RIWAYAT) || [];
function rekamDariG() {
  const semua = CFG.mapel.length === MAPEL.length;
  return {
    id: G.mulai, tgl: G.mulai, durasi: G.durasi, target: G.target, mapel: semua ? 'Semua mapel' : CFG.mapel.join(', '),
    pemenang: G.pemenang, dihentikan: G.dihentikan, skorS: skorTim(G.siswa), skorA: skorTim(G.ai),
    siswa: G.siswa.map(p => ({ nama: p.nama, warna: p.warna, skor: p.skor, benar: p.benar, salah: p.salah, detik: p.nJawab ? Math.round(p.waktu / p.nJawab / 100) / 10 : 0, mapel: p.mapel })),
    ai: G.ai.map(a => ({ nama: a.nama, level: a.lv.nama, ic: a.lv.ic, skor: a.skor, benar: a.benar, salah: a.salah }))
  };
}
function simpanRiwayat() {
  const r = rekamDariG(); const list = muatRiwayat().filter(x => x.id !== r.id);
  list.unshift(r); store.set(KUNCI_RIWAYAT, list.slice(0, 200));
}
const pct = (b, s) => (b + s) ? Math.round(b / (b + s) * 100) : 0;
function predikat(a) { return a >= 85 ? ['Sangat baik', '#16a34a'] : a >= 70 ? ['Baik', '#2563eb'] : a >= 50 ? ['Cukup', '#d97706'] : ['Perlu latihan', '#e5484d']; }
function catatanSiswa(p) {
  const n = p.benar + p.salah;
  if (!n) return 'Belum menjawab soal.';
  const a = pct(p.benar, p.salah), arr = Object.entries(p.mapel || {}).filter(([, v]) => v.b + v.s >= 2).map(([m, v]) => [m, pct(v.b, v.s)]);
  arr.sort((x, y) => y[1] - x[1]);
  let t = `Akurasi <b>${a}%</b> (${p.benar} benar, ${p.salah} salah)`;
  if (p.detik) t += `, rata-rata <b>${String(p.detik).replace('.', ',')} detik</b> per soal`;
  t += '.';
  if (arr.length && arr[0][1] >= 70) t += ` Kuat di <b>${esc(arr[0][0])}</b>.`;
  const lemah = arr.filter(([, v]) => v < 60).slice(-1)[0];
  if (lemah && (!arr.length || lemah[0] !== arr[0][0])) t += ` Perlu latihan <b>${esc(lemah[0])}</b>.`;
  if (p.detik && p.detik < 5 && a < 60) t += ' Terlalu terburu-buru, baca soal lebih teliti.';
  else if (p.detik > 15 && a >= 80) t += ' Teliti, tinggal latih kecepatan.';
  return t;
}
function catatanTim(r) {
  const b = r.siswa.reduce((s, p) => s + p.benar, 0), sl = r.siswa.reduce((s, p) => s + p.salah, 0), a = pct(b, sl);
  const sel = Math.abs(r.skorS - r.skorA);
  const hasil = r.pemenang === 'siswa' ? `Menang dengan selisih <b>${sel} poin</b>` : r.pemenang === 'ai' ? `Kalah dengan selisih <b>${sel} poin</b>` : 'Hasil seri';
  const ai = r.ai.map(x => x.ic + ' ' + x.level).join(', ');
  if (!(b + sl)) return `${hasil} melawan AI (${ai}). Belum ada soal yang dijawab.`;
  return `${hasil} melawan AI (${ai}). Akurasi tim <b>${a}%</b> (${b} benar, ${sl} salah).` + (sl > b / 2 ? ' Banyak jawaban salah yang mengurangi poin. Lebih baik teliti daripada cepat.' : '');
}
function catatanHTML(r) {
  const tb = r.siswa.reduce((s, p) => s + p.benar, 0), ts = r.siswa.reduce((s, p) => s + p.salah, 0), [pt, pc] = tb + ts ? predikat(pct(tb, ts)) : ['–', '#94a3b8'];
  return `<div class="note"><span class="dot" style="background:#1e1b4b"></span><div><b>👦 Tim Siswa</b><span class="tag" style="background:${pc}">${pt}</span><br>${catatanTim(r)}</div></div>` +
    r.siswa.map(p => { const [l, c] = predikat(pct(p.benar, p.salah)); return `<div class="note"><span class="dot" style="background:${p.warna}"></span><div><b>${esc(p.nama)}</b> · ${p.skor} poin<span class="tag" style="background:${p.benar + p.salah ? c : '#94a3b8'}">${p.benar + p.salah ? l : '–'}</span><br>${catatanSiswa(p)}</div></div>`; }).join('');
}
const fmtTgl = ts => { const d = new Date(ts), z = n => String(n).padStart(2, '0'); return `${z(d.getDate())}/${z(d.getMonth() + 1)}/${d.getFullYear()} ${z(d.getHours())}.${z(d.getMinutes())}`; };
function viewRiwayat(dariHasil = false) {
  const list = muatRiwayat();
  const menang = list.filter(r => r.pemenang === 'siswa').length, kalah = list.filter(r => r.pemenang === 'ai').length;
  const per = {};
  list.forEach(r => r.siswa.forEach(p => { const k = p.nama.trim().toLowerCase(); const o = per[k] = per[k] || { nama: p.nama, main: 0, menang: 0, poin: 0, b: 0, s: 0, dt: 0, nd: 0, mapel: {} };
    o.main++; if (r.pemenang === 'siswa') o.menang++; o.poin += p.skor; o.b += p.benar; o.s += p.salah; if (p.detik) { o.dt += p.detik; o.nd++; }
    Object.entries(p.mapel || {}).forEach(([m, v]) => { const x = o.mapel[m] = o.mapel[m] || { b: 0, s: 0 }; x.b += v.b; x.s += v.s; }); }));
  const siswa = Object.values(per).sort((a, b) => pct(b.b, b.s) - pct(a.b, a.s));
  app.innerHTML = `
  <div class="screen result"><div class="wrap">
    <div class="histtop"><h1>📜 Riwayat Pertandingan</h1><button class="cbtn" id="kembali">‹ Kembali</button></div>
    <div class="sum"><div><b>${list.length}</b>Pertandingan</div><div><b style="color:#4ade80">${menang}</b>Siswa menang</div><div><b style="color:#f87171">${kalah}</b>AI menang</div><div><b>${list.length ? Math.round(menang / list.length * 100) : 0}%</b>Tingkat menang</div></div>
    <section class="box"><h2>👦 Performa siswa (semua pertandingan)</h2>
      ${siswa.length ? `<table><thead><tr><th>Nama</th><th class="n">Main</th><th class="n">Menang</th><th class="n">Total poin</th><th class="n">Akurasi</th><th class="n">Detik/soal</th><th>Kuat</th><th>Perlu latihan</th></tr></thead><tbody>
      ${siswa.map(o => { const a = pct(o.b, o.s), [l, c] = predikat(a), ms = Object.entries(o.mapel).filter(([, v]) => v.b + v.s >= 3).map(([m, v]) => [m, pct(v.b, v.s)]).sort((x, y) => y[1] - x[1]);
        const kuat = ms.length && ms[0][1] >= 70 ? ms[0][0] : '–', lemah = ms.length > 1 && ms[ms.length - 1][1] < 60 ? ms[ms.length - 1][0] : '–';
        return `<tr><td>${esc(o.nama)}<span class="tag" style="background:${c}">${l}</span></td><td class="n">${o.main}</td><td class="n">${o.menang}</td><td class="n">${o.poin}</td><td class="n">${a}%</td><td class="n">${o.nd ? String(Math.round(o.dt / o.nd * 10) / 10).replace('.', ',') : '–'}</td><td>${esc(kuat)}</td><td>${esc(lemah)}</td></tr>`; }).join('')}</tbody></table>` : '<p class="empty">Belum ada data.</p>'}
    </section>
    <section class="box"><h2>🗂 Daftar pertandingan</h2>
      ${list.length ? list.map(r => `<details class="match"><summary><span class="res ${r.pemenang === 'siswa' ? 'w' : r.pemenang === 'ai' ? 'l' : 'd'}">${r.pemenang === 'siswa' ? 'MENANG' : r.pemenang === 'ai' ? 'KALAH' : 'SERI'}</span>
          <span>${fmtTgl(r.tgl)} · ${r.siswa.map(p => esc(p.nama)).join(', ')}<br><small style="opacity:.75">Target ${r.target} · ${esc(r.mapel)} · AI: ${r.ai.map(a => a.ic + ' ' + a.level).join(', ')}${r.dihentikan ? ' · dihentikan' : ''}</small></span>
          <span class="sc">${r.skorS} – ${r.skorA}</span></summary><div class="det">${catatanHTML(r)}</div></details>`).join('') : '<p class="empty">Belum ada pertandingan. Ayo mulai bertanding!</p>'}
    </section>
    ${list.length ? '<button class="danger" id="hapus">🗑 Hapus semua riwayat</button>' : ''}
  </div></div>`;
  document.getElementById('kembali').onclick = () => dariHasil && G && G.selesai ? viewHasil(G.pemenang, G.dihentikan) : (G = null, viewSetup());
  const h = document.getElementById('hapus');
  if (h) h.onclick = () => { if (!h.classList.contains('yakin')) { h.classList.add('yakin'); h.textContent = 'Sentuh sekali lagi untuk menghapus'; setTimeout(() => { h.classList.remove('yakin'); h.textContent = '🗑 Hapus semua riwayat'; }, 4000); return; } store.set(KUNCI_RIWAYAT, []); viewRiwayat(dariHasil); };
}

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.jalan && !G.jeda && !G.selesai) jeda(); });
viewSetup();
</script>
</body>
</html>
