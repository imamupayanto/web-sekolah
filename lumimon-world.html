.dst{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}.dst button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}.dst .di{font-size:24px}.dst b{font-size:13px}.dst small{font-size:11px;opacity:.8}

.qc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:#1a2346;border:1px solid #2e3a6a;margin-top:6px;font-size:13px}.qc .qi{font-size:24px}.qc .qd{font-size:12px;color:#c9d2ea}.qc .qr{font-size:11px;color:#ffd23c;margin-top:2px}
.qc.dn{opacity:.55}.qc.on{border-color:#ffd23c;box-shadow:0 0 0 2px rgba(255,210,60,.35)}.qc.boss{background:linear-gradient(135deg,#4a1020,#24123a);border-color:#e8303a}.qc.lk{opacity:.75}.qc button{padding:7px 12px;font-size:13px}.qa{font-size:11px;font-weight:800;color:#ffd23c}

#gcard{position:fixed;left:8px;top:calc(48px + env(safe-area-inset-top));padding:6px 10px;border-radius:12px;background:rgba(10,8,22,.86);border:2px solid #8a6ad0;color:#fff;font-size:13px;z-index:2;max-width:70vw}

.hn.hide,#act.hide{display:none}.ht2{font-weight:900;color:#ffd23c;margin:10px 0 2px;font-size:14px}

/* lembar menu */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}

.bar{height:8px;border-radius:5px;background:#0e1420;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--sun)}

.tasTop{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.tasAv{display:flex;align-items:flex-end;gap:2px;background:radial-gradient(#3a4a80,#222d55);border-radius:12px;padding:6px 4px}
#tasAv{width:64px;height:128px;image-rendering:pixelated}#tasAvB{width:32px;height:64px;image-rendering:pixelated;opacity:.85}
.tslots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.tsl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;min-height:60px;border-radius:10px;background:#1a2346;border:2px solid #2e3a6a;font-size:9.5px;color:#fff;cursor:pointer;text-align:center}
.tsl b{font-size:18px;opacity:.4}.tsl.has{background:#2a3a58;border-color:#4a6aa8}.tsl.on{border-color:#ffd23c;box-shadow:0 0 0 2px rgba(255,210,60,.35)}
.tsl i{font-style:normal;font-size:8.5px;color:#7cf29a;line-height:1.1}.tsl:not(.has) i{color:#7a86a8}
.efx{display:flex;flex-wrap:wrap;gap:4px}.efx span{padding:3px 8px;border-radius:10px;background:#123a2a;border:1px solid #3ccf91;color:#c8ffd8;font-size:11px;font-weight:800}.efx em{font-size:12px;color:var(--mut)}
.ttab{display:flex;gap:5px;overflow-x:auto;margin:10px 0 4px;padding-bottom:3px}.ttab button{flex:0 0 auto;padding:5px 9px;font-size:11.5px;border-radius:12px;background:#1a2346;color:#fff;border:1px solid #2e3a6a;box-shadow:none}.ttab button.on{background:#ffd23c;color:#2a1a0a;border-color:#ffd23c}
.tg{font-size:11px;text-align:center;line-height:1.2;flex:0 0 auto}.tg.on{color:#7cf29a;font-weight:800}.tg small{font-size:9px;color:var(--mut);font-weight:400}
@keyframes avpop{40%{transform:scale(1.12) translateY(-4px);box-shadow:0 0 18px #ffd23c}}.avpop{animation:avpop .45s}
.kback{width:100%;padding:7px;font-size:13px;margin-bottom:8px}
.kteam{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;background:#2a3a58;border:2px solid #4a6aa8;cursor:pointer;min-height:92px;justify-content:center}
.kt img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}.kt span{font-size:10px;color:#fff;text-align:center;line-height:1.1}.kt em{position:absolute;left:4px;top:2px;font-style:normal;font-size:14px}
.kt.kemp{background:#1a2346;border:2px dashed #3a4880;cursor:default}.kt.kemp b{font-size:24px;color:#7a86a8}.kt.kemp span{color:#7a86a8}
.kx{position:absolute;right:-4px;top:-4px;width:24px;height:24px;padding:0;border-radius:50%;font-size:12px;background:#e8303a;color:#fff;border:2px solid #0a0f22;box-shadow:none}
.kgrid .int{background:#2f5a3a!important;outline:2px solid #7cf29a}.kgrid .kb{position:absolute;left:2px;top:1px;font-size:11px}.kgrid .ks{position:absolute;right:3px;top:1px;font-size:9px;color:#fde047}
.kgrid>div[data-t]{background:#2a3a58}

#bAdm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(4px + env(safe-area-inset-bottom));z-index:8;padding:3px 10px;font-size:11px;border-radius:10px;background:rgba(40,20,60,.85);color:#ffd23c;border:1px solid #8a6ad0;box-shadow:none;display:none}
.ads{background:#1a2346;border:1px solid #2e3a6a;border-radius:12px;padding:8px 10px;margin-top:8px}.ads>b{display:block;color:#ffd23c;margin-bottom:4px}
.adr{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.adr span{flex:1}.adr input[type=range]{flex:1.3}.adr b{width:38px;text-align:right;color:#7cf29a}
.adr input[type=number]{width:56px;padding:4px;border-radius:8px;border:1px solid #3a4880;background:#0f1530;color:#fff}.adr select{padding:4px;border-radius:8px;background:#0f1530;color:#fff;border:1px solid #3a4880;max-width:55%}
.adr button,.adb button,.ads>button{padding:5px 10px;font-size:12px}.adb{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.adr input[type=checkbox]{width:22px;height:22px}

const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

function mix(a, b, t) { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
