<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Upgrade — SDN 2 Pesantren</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --surface:#12152a; --surface2:#1a1f3a;
  --purple:#7c4dff; --pink:#c040fb; --amber:#ffb700;
  --cyan:#00e5ff; --green:#22c55e; --red:#f43f5e;
  --text:#e8eaf6; --muted:#7986cb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Nunito',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  user-select:none;
}

/* ── STARFIELD ── */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{
  position:absolute;border-radius:50%;
  animation:floatUp var(--dur) linear infinite;
  animation-delay:var(--del);opacity:0;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(100vh) scale(0);}
  10%{opacity:.5;}90%{opacity:.2;}
  100%{opacity:0;transform:translateY(-10vh) scale(1);}
}

/* ── WRAP ── */
.wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;gap:.8rem;
  padding:1.2rem 1rem;
  width:100%;max-width:480px;
}

/* ── BADGE ── */
.badge{
  font-size:.65rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  background:rgba(124,77,255,.18);border:1px solid rgba(124,77,255,.4);
  color:var(--purple);padding:.3rem 1rem;border-radius:99px;
  animation:fadeIn .5s ease both;
}

/* ── TITLE ── */
.title-wrap{text-align:center;animation:fadeIn .5s ease .1s both;}
.title{
  font-family:'Cinzel Decorative',serif;font-size:clamp(16px,4.5vw,24px);
  font-weight:700;
  background:linear-gradient(135deg,#ffb700,#ff6a00 40%,#c040fb 70%,#7c4dff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.subtitle{font-size:.75rem;font-weight:600;color:var(--muted);margin-top:.3rem;}

/* ── CS BOX ── */
.cs-box{
  background:var(--surface);border:1px solid rgba(124,77,255,.3);
  border-radius:14px;padding:.5rem 1.4rem;
  font-family:'Fredoka One',cursive;font-size:.95rem;
  color:var(--muted);display:flex;align-items:center;gap:.5rem;
  animation:fadeIn .5s ease .2s both;
}
.cs-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

/* ── SCOREBOARD ── */
.scoreboard{
  display:flex;gap:.7rem;animation:fadeIn .5s ease .3s both;
}
.sc{
  background:var(--surface);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:.4rem 1rem;text-align:center;min-width:80px;
}
.sc-label{font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.sc-val{
  font-family:'Fredoka One',cursive;font-size:1.6rem;line-height:1.1;
  background:linear-gradient(135deg,var(--amber),#ff6a00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sc-val.cv{
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── GRID ── */
#grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;width:min(90vw,360px);
  animation:fadeIn .5s ease .4s both;
}

/* ── HOLE ── */
.hole{
  position:relative;
  background:var(--surface2);
  border:1.5px solid rgba(255,255,255,.07);
  border-radius:16px;
  height:100px;overflow:hidden;
  cursor:pointer;
}
.hole-inner{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;align-items:flex-end;justify-content:center;
  height:100%;
  transform:translateY(100%);
  transition:transform .18s cubic-bezier(.34,1.3,.64,1);
  pointer-events:none;
}
.hole.up .hole-inner{ transform:translateY(10%); }
.hole-emoji{font-size:2.6rem;line-height:1;padding-bottom:6px;}

/* dirt bar */
.hole::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:22px;
  background:linear-gradient(180deg,transparent,rgba(10,8,20,.9));
  border-radius:0 0 14px 14px;pointer-events:none;z-index:2;
}

/* hit flash */
.hole.hit .hole-inner{animation:hitAnim .25s ease forwards;}
@keyframes hitAnim{
  0%{transform:translateY(10%);}
  40%{transform:translateY(-8%) scale(1.15);}
  100%{transform:translateY(100%);}
}
/* miss flash */
.hole.miss{animation:missFlash .3s ease;}
@keyframes missFlash{0%,100%{background:var(--surface2);}50%{background:rgba(244,63,94,.15);}}

/* rarity glow */
.hole.rare .hole-inner{filter:drop-shadow(0 0 10px #ffb700);}
.hole.bomb .hole-inner{filter:drop-shadow(0 0 10px #f43f5e);}

/* ── FLOAT SCORE ── */
.float-score{
  position:fixed;font-family:'Fredoka One',cursive;font-size:1.3rem;
  pointer-events:none;z-index:999;
  animation:floatScore .7s ease forwards;
}
@keyframes floatScore{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-55px) scale(1.3);}
}

/* ── COMBO FLASH ── */
#combo-flash{
  position:fixed;top:42%;left:50%;
  transform:translate(-50%,-50%);
  font-family:'Fredoka One',cursive;font-size:2.2rem;
  pointer-events:none;z-index:998;display:none;
}
#combo-flash.show{display:block;animation:comboAnim .55s ease forwards;}
@keyframes comboAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.8);}
}

/* ── SPEED BADGE ── */
#speed-badge{
  font-size:.65rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  padding:.25rem .8rem;border-radius:99px;
  background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);
  color:var(--green);transition:all .3s;
  animation:fadeIn .5s ease .5s both;
}
#speed-badge.fast{background:rgba(255,183,0,.15);border-color:rgba(255,183,0,.4);color:var(--amber);}
#speed-badge.turbo{background:rgba(244,63,94,.15);border-color:rgba(244,63,94,.4);color:var(--red);}

.hint-text{
  font-size:.7rem;font-weight:600;color:var(--muted);text-align:center;
  animation:fadeIn .5s ease .6s both;
}
.hint-text span{color:var(--text);font-weight:800;}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div id="particles"></div>
<div id="combo-flash"></div>

<div class="wrap">
  <div class="badge">🔧 SDN 2 Pesantren</div>

  <div class="title-wrap">
    <div class="title">Sedang Upgrade!</div>
    <div class="subtitle">Soal-soal baru sedang disiapkan untukmu ✨</div>
  </div>

  <div class="cs-box">
    <div class="cs-dot"></div>
    Coming Soon
  </div>

  <div class="scoreboard">
    <div class="sc">
      <div class="sc-label">Skor</div>
      <div class="sc-val" id="score-el">0</div>
    </div>
    <div class="sc">
      <div class="sc-label">Combo</div>
      <div class="sc-val cv" id="combo-el">x1</div>
    </div>
    <div class="sc">
      <div class="sc-label">Meleset</div>
      <div class="sc-val" id="miss-el" style="background:linear-gradient(135deg,#f43f5e,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">0</div>
    </div>
  </div>

  <div id="grid"></div>

  <div id="speed-badge">🐢 Normal</div>

  <div class="hint-text">
    Pukul hewan yang muncul! Hindari <span>💣 Bom</span> — kena bom kombo reset!
  </div>
</div>

<script>
// ── STARFIELD ──
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
for(let i=0;i<130;i++){
  const x=Math.random()*canvas.width, y=Math.random()*canvas.height;
  const r=Math.random()*1.4+.2, op=Math.random()*.6+.1;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${op})`; ctx.fill();
}

// ── PARTICLES ──
const pw=document.getElementById('particles');
const pc=['#7c4dff','#c040fb','#ffb700','#00e5ff','#22c55e'];
for(let i=0;i<16;i++){
  const el=document.createElement('div'); el.className='particle';
  const s=3+Math.random()*5;
  el.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${pc[Math.floor(Math.random()*pc.length)]};--dur:${6+Math.random()*8}s;--del:${Math.random()*8}s;`;
  pw.appendChild(el);
}

// ── GAME ──
const NORMAL = ['🐱','🐶','🐰','🐹','🦊','🐸','🐝','🦜','🐛','🐌'];
const RARE   = ['🦄','🐉','🦁','🐯','🦅'];
const BOMB   = '💣';

const grid = document.getElementById('grid');
const scoreEl = document.getElementById('score-el');
const comboEl = document.getElementById('combo-el');
const missEl  = document.getElementById('miss-el');
const speedBadge = document.getElementById('speed-badge');
const comboFlash = document.getElementById('combo-flash');

let score=0, combo=1, misses=0, totalHits=0;
let comboTimer=null;

// Build 9 holes
const holes=[];
for(let i=0;i<9;i++){
  const hole=document.createElement('div');
  hole.className='hole';
  const inner=document.createElement('div');
  inner.className='hole-inner';
  const em=document.createElement('div');
  em.className='hole-emoji';
  inner.appendChild(em);
  hole.appendChild(inner);
  grid.appendChild(hole);
  holes.push({el:hole,inner,em,active:false,timer:null,type:null});
}

function getSpeedMs(){
  if(totalHits>=40) return 700;
  if(totalHits>=25) return 900;
  if(totalHits>=12) return 1100;
  return 1400;
}
function updateSpeedBadge(){
  if(totalHits>=40){speedBadge.textContent='🚀 Turbo!';speedBadge.className='turbo';}
  else if(totalHits>=25){speedBadge.textContent='⚡ Cepat!';speedBadge.className='fast';}
  else if(totalHits>=12){speedBadge.textContent='🏃 Mulai Cepat';speedBadge.className='';}
  else{speedBadge.textContent='🐢 Normal';speedBadge.className='';}
}

function popUp(hIdx){
  const h=holes[hIdx];
  if(h.active) return;

  const isBomb = totalHits>=8 && Math.random()<0.12;
  const isRare = !isBomb && Math.random()<0.1;
  const emoji  = isBomb ? BOMB : isRare ? RARE[Math.floor(Math.random()*RARE.length)] : NORMAL[Math.floor(Math.random()*NORMAL.length)];

  h.active=true; h.type=isBomb?'bomb':isRare?'rare':'normal';
  h.em.textContent=emoji;
  h.el.classList.add('up');
  if(isRare) h.el.classList.add('rare');
  if(isBomb) h.el.classList.add('bomb');

  const stayMs = getSpeedMs();
  h.timer=setTimeout(()=>{
    if(h.active){
      // missed (only penalize if not bomb)
      if(h.type!=='bomb'){
        misses++;
        missEl.textContent=misses;
        resetCombo();
        h.el.classList.add('miss');
        setTimeout(()=>h.el.classList.remove('miss'),300);
      }
      hideHole(hIdx);
    }
  }, stayMs);

  h.el.onclick=()=>{
    if(!h.active) return;
    clearTimeout(h.timer);
    const cx=h.el.getBoundingClientRect().left+h.el.offsetWidth/2;
    const cy=h.el.getBoundingClientRect().top+h.el.offsetHeight/2;

    if(h.type==='bomb'){
      // hit bomb
      resetCombo();
      showFloat(cx,cy,'💥 BOM!','#f43f5e');
      h.el.classList.add('miss');
      setTimeout(()=>h.el.classList.remove('miss'),300);
    } else {
      const pts=(h.type==='rare'?50:10)*combo;
      score+=pts; totalHits++;
      combo=Math.min(combo+1,10);
      scoreEl.textContent=score;
      comboEl.textContent='x'+combo;
      updateSpeedBadge();
      showFloat(cx,cy,'+'+pts, combo>=5?'#ffb700':combo>=3?'#00e5ff':'#22c55e');
      showComboFlash();
      clearTimeout(comboTimer);
      comboTimer=setTimeout(resetCombo,2200);
    }
    h.el.classList.add('hit');
    setTimeout(()=>hideHole(hIdx),250);
  };
}

function hideHole(i){
  const h=holes[i];
  h.active=false; h.type=null;
  h.el.classList.remove('up','rare','bomb','hit');
}

function resetCombo(){
  combo=1; comboEl.textContent='x1';
}

function showFloat(x,y,txt,color){
  const el=document.createElement('div');
  el.className='float-score';
  el.textContent=txt; el.style.color=color;
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),700);
}

function showComboFlash(){
  const labels={3:'Nice! 🔥',5:'Great! ⚡',7:'Amazing! 💫',10:'MAX! 🏆'};
  const lbl=labels[combo];
  if(lbl){
    comboFlash.textContent=lbl;
    comboFlash.className='show';
    setTimeout(()=>comboFlash.className='',600);
  }
}

// ── SPAWN LOOP ──
function scheduleNext(){
  const active=holes.filter(h=>h.active).length;
  const maxActive= totalHits>=30 ? 4 : totalHits>=15 ? 3 : 2;
  const delay= totalHits>=40 ? 350 : totalHits>=25 ? 500 : totalHits>=12 ? 650 : 850;

  if(active<maxActive){
    const avail=holes.map((h,i)=>h.active?-1:i).filter(i=>i>=0);
    if(avail.length){
      const idx=avail[Math.floor(Math.random()*avail.length)];
      popUp(idx);
    }
  }
  setTimeout(scheduleNext, delay + Math.random()*200);
}
scheduleNext();
</script>
</body>
</html>
