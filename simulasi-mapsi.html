{cat:"quran",type:"mc",q:`Dalam ilmu dakwah dikenal dua istilah: hidayatul irsyad (menunjukkan/menyampaikan jalan kebenaran) dan hidayatut taufik (membuka hati seseorang untuk menerima &amp; mengamalkan kebenaran). Nabi Muhammad Saw. mampu memberikan hidayah kepada pamannya, Abu Thalib, hanya dalam pengertian pertama, bukan yang kedua. Kesimpulan paling tepat dari fakta ini adalah&hellip;`,opts:["Nabi dianggap gagal dalam berdakwah kepada keluarganya","Hidayah dalam arti membuka hati untuk beriman (taufik) adalah kewenangan mutlak Allah, sedangkan tugas rasul/manusia hanya menyampaikan (irsyad)","Abu Thalib sebenarnya sudah beriman secara diam-diam","Dakwah kepada anggota keluarga sendiri tidak dianjurkan"],correct:1,expl:`QS Al-Qashash:56 menegaskan Nabi Saw. tidak dapat memberi hidayah (taufik) kepada siapa pun yang dicintainya, karena Allah-lah yang memberi petunjuk kepada siapa yang Dia kehendaki. Tugas manusia hanya menyampaikan (irsyad).`},
{cat:"quran",type:"mc",q:`Perhatikan dua kisah nabi: (1) Nabi Yunus a.s. yang ditelan ikan besar setelah meninggalkan kaumnya tanpa izin Allah, lalu bertaubat dengan doa "Laa ilaaha illaa anta subhaanaka innii kuntu minazh-zhaalimiin"; (2) Nabi Ayyub a.s. yang sabar menghadapi ujian sakit bertahun-tahun. Benang merah/hikmah utama dari KEDUA kisah ini adalah&hellip;`,opts:["Semua nabi pasti pernah berbuat dosa besar","Kesabaran dan segera kembali (bertaubat/bertawakal) kepada Allah adalah kunci keluar dari kesulitan, betapa pun beratnya ujian tersebut","Doa hanya efektif jika diucapkan dalam kondisi benar-benar terdesak","Ujian berat hanya menimpa para nabi, bukan manusia biasa"],correct:1,expl:`Kedua kisah menekankan bahwa jalan keluar dari kesulitan adalah kesabaran yang disertai kembali &amp; berserah diri kepada Allah &mdash; Nabi Yunus melalui taubat, Nabi Ayyub melalui kesabaran panjang tanpa putus asa.`},

{cat:"tajwid",type:"mc",q:`Perhatikan potongan ayat: "ذَرَّةٍ خَيْرًا يَرَهُ" (QS Az-Zalzalah:7). Jika dianalisis secara berurutan, hukum bacaan yang tepat pada penggalan ini adalah&hellip;`,opts:["Ikhfa, lalu Idgham Bilagunnah","Izhar Halqi, lalu Idgham Bigunnah","Iqlab, lalu Ikhfa","Idgham Bigunnah, lalu Izhar Halqi"],correct:1,expl:`Tanwin pada ذَرَّةٍ bertemu huruf خ (huruf halqi) = Izhar Halqi. Tanwin pada خَيْرًا bertemu huruf ي (huruf idgham bighunnah) = Idgham Bigunnah. Urutannya: Izhar Halqi lalu Idgham Bigunnah.`},
{cat:"tajwid",type:"mc",q:`Dua ayat sama-sama mengandung mad far'i karena bertemu hamzah, tetapi posisinya berbeda: pada ayat pertama huruf mad dan hamzah berada dalam satu kata, pada ayat kedua hamzah berada di awal kata setelah huruf mad. Pernyataan paling tepat mengenai kedua mad ini adalah&hellip;`,opts:["Keduanya selalu dibaca sama panjang, yaitu 2 harakat","Ayat pertama (Mad Wajib Muttasil) wajib dibaca panjang 4&ndash;5 harakat, sedangkan ayat kedua (Mad Jaiz Munfasil) boleh dibaca lebih pendek, yaitu 2, 4, atau 5 harakat","Ayat kedua wajib dibaca lebih panjang daripada ayat pertama","Keduanya termasuk Mad Tabi'i biasa yang dibaca 2 harakat"],correct:1,expl:`Mad Wajib Muttasil (huruf mad &amp; hamzah dalam satu kata) wajib dibaca panjang, 4&ndash;5 harakat. Mad Jaiz Munfasil (huruf mad &amp; hamzah di kata berbeda) bersifat "jaiz" (boleh), sehingga panjangnya lebih fleksibel: 2, 4, atau 5 harakat.`},
{cat:"tajwid",type:"mc",q:`Ketika seorang siswa mewaqafkan bacaan pada kata yang berakhiran fathatain, seperti عَلِيْمًا حَكِيْمًا, bunyi tanwin tersebut berubah menjadi bacaan panjang menyerupai alif. Hukum bacaan ini disebut&hellip;`,opts:["Mad Iwad","Mad Badal","Mad Lin","Mad Silah"],correct:0,expl:`Mad Iwad terjadi ketika kata berakhiran fathatain diwaqafkan; bunyi tanwin berubah menjadi bacaan mad seperti alif (kecuali pada ta marbutah, yang justru berubah menjadi bunyi "h" mati).`},
{cat:"tajwid",type:"mc",q:`Perhatikan kata يَوْمَ الْخُرُوْجِ dan خَوْفٍ. Huruf wau sukun atau ya sukun yang didahului harakat fathah, lalu diwaqafkan pada huruf setelahnya, menghasilkan bacaan yang dilunakkan/dilemaskan. Hukum bacaan ini disebut&hellip;`,opts:["Mad Lin (Mad Layyin)","Mad Tabi'i","Mad Arid Lissukun","Mad Badal"],correct:0,expl:`Mad Lin (Layyin) terjadi ketika wau sukun atau ya sukun didahului harakat fathah dan berada sebelum huruf yang diwaqafkan, dibaca dengan cara yang lunak/lemas.`},
{cat:"tajwid",type:"mc",q:`Mad yang terjadi ketika huruf Mad Tabi'i bertemu dengan huruf hidup yang berada di akhir kata, lalu kata tersebut diwaqafkan (dihentikan) sehingga huruf terakhirnya menjadi sukun, disebut&hellip;`,opts:["Mad Arid Lissukun","Mad Lazim","Mad Badal","Mad Tamkin"],correct:0,expl:`Mad Arid Lissukun terjadi ketika Mad Tabi'i bertemu huruf hidup di akhir kata yang diwaqafkan, sehingga huruf tersebut menjadi sukun karena waqaf (bukan sukun asli).`},
{cat:"tajwid",type:"mc",q:`Perhatikan pernyataan-pernyataan tentang hukum bacaan berikut. Manakah pernyataan yang TIDAK tepat?`,opts:["Mad Wajib Muttasil selalu dibaca 4&ndash;5 harakat","Mad Jaiz Munfasil boleh dibaca 2 harakat saat washal (disambung dengan kata berikutnya)","Idgham Mimi terjadi ketika mim sukun bertemu huruf mim, dibaca dengan dengung","Idgham Mutajanisain terjadi ketika nun sukun bertemu huruf nun, dibaca izhar"],correct:3,expl:`Pernyataan D keliru pada dua hal: nun sukun bertemu nun yang sejenis disebut Idgham Mitslain/Mutamatsilain (bukan Mutajanisain, yang berarti huruf sama makhraj tapi beda sifat), dan hukumnya adalah melebur dengan dengung, bukan dibaca izhar.`},

{cat:"aqidah",type:"mc",q:`Perhatikan dua Asmaul Husna: Al-'Adl (Maha Adil) dan Ar-Rahman (Maha Pengasih). Seorang pelaku kejahatan tetap diberi rezeki &amp; kesehatan oleh Allah meski belum bertobat. Sifat Allah manakah yang paling menonjol dalam situasi ini, dan mengapa keadilan-Nya tidak serta-merta berupa hukuman segera?`,opts:["Ar-Rahman menonjol karena rahmat-Nya meliputi seluruh makhluk termasuk yang durhaka, sedangkan Al-'Adl akan ditegakkan secara sempurna kelak di akhirat","Ini adalah bukti bahwa Allah tidak adil kepada hamba-Nya","Al-'Adl menonjol karena hukuman pasti datang seketika di dunia","Kedua sifat tersebut saling meniadakan satu sama lain"],correct:0,expl:`Rahmat Allah (Ar-Rahman) meliputi seluruh makhluk-Nya di dunia, termasuk yang durhaka, sebagai kesempatan untuk bertaubat. Keadilan-Nya (Al-'Adl) akan ditegakkan secara sempurna &amp; menyeluruh di hari akhir.`},
{cat:"aqidah",type:"mc",q:`Bandingkan makna Al-Ghafur (Maha Pengampun) dan Al-'Afuww (Maha Pemaaf). Perbedaan nuansa makna yang paling tepat antara keduanya adalah&hellip;`,opts:["Al-Ghafur menekankan menutupi &amp; mengampuni dosa, sedangkan Al-'Afuww menekankan menghapuskan dosa itu seakan tidak pernah terjadi","Keduanya benar-benar identik tanpa ada perbedaan makna","Al-'Afuww hanya berlaku untuk dosa yang dilakukan di dunia","Al-Ghafur hanya berlaku untuk dosa-dosa kecil"],correct:0,expl:`Al-Ghafur menekankan sisi menutupi &amp; mengampuni dosa (ghafara = menutupi), sedangkan Al-'Afuww menekankan penghapusan bekas dosa tersebut seolah tidak pernah terjadi ('afaa = menghapus).`},
{cat:"aqidah",type:"mc",q:`Seorang anak lahir dari keluarga non-muslim di pedalaman yang belum pernah tersentuh dakwah Islam sama sekali. Pandangan yang paling sesuai dengan konsep keadilan Allah terkait status keimanannya kelak adalah&hellip;`,opts:["Otomatis masuk neraka karena tidak beriman kepada Islam","Allah Maha Adil &amp; Maha Mengetahui; orang yang belum sampai dakwah kepadanya (belum tegak hujjah) diperlakukan sesuai keadilan-Nya, berbeda dari yang menolak kebenaran setelah jelas baginya","Semua manusia, apa pun keyakinannya, otomatis masuk surga","Statusnya sama persis dengan orang yang mendengar dakwah lalu menolaknya"],correct:1,expl:`Prinsip keadilan Allah menegaskan bahwa balasan berkaitan dengan sampai atau tidaknya hujjah (dakwah) kepada seseorang; ini berbeda dari kasus orang yang jelas-jelas menolak kebenaran setelah mengetahuinya.`},
{cat:"aqidah",type:"mc",q:`Nabi Ibrahim a.s. tetap mempersiapkan kayu bakar &amp; tali sebelum peristiwa penyembelihan Ismail, meski beliau yakin akan pertolongan Allah. Konsep tawakal yang benar berdasarkan teladan ini adalah&hellip;`,opts:["Tawakal berarti pasrah sepenuhnya tanpa melakukan usaha apa pun","Tawakal adalah menyerahkan hasil akhir kepada Allah SETELAH melakukan ikhtiar/usaha maksimal, bukan meniadakan usaha","Tawakal hanya diperlukan ketika seseorang menghadapi bencana besar","Melakukan usaha justru meniadakan makna tawakal yang sesungguhnya"],correct:1,expl:`Tawakal yang benar bukan meniadakan usaha, melainkan menyerahkan hasil akhir kepada Allah setelah ikhtiar maksimal dilakukan &mdash; sebagaimana Nabi Ibrahim tetap mempersiapkan sarana sebelum berserah pada ketetapan Allah.`},
{cat:"aqidah",type:"mc",q:`Bandingkan nifaq i'tiqadi (kemunafikan akidah, mengeluarkan seseorang dari Islam) dengan nifaq amali (kemunafikan perbuatan, tidak mengeluarkan dari Islam meski berdosa besar). Seorang muslim yang kadang berbohong &amp; mengingkari janji, namun tetap meyakini keesaan Allah dan risalah Nabi Muhammad Saw. dalam hatinya, termasuk kategori&hellip;`,opts:["Nifaq i'tiqadi, sehingga keluar dari Islam","Nifaq amali, berdosa besar namun tidak otomatis keluar dari Islam","Murtad dari agama Islam","Musyrik karena menyekutukan Allah"],correct:1,expl:`Selama akidah/keyakinan dasarnya (tauhid &amp; kerasulan Nabi) tetap utuh, sifat-sifat munafik dalam perbuatan (nifaq amali) menjadikannya berdosa besar, tetapi tidak mengeluarkannya dari Islam seperti nifaq i'tiqadi.`},
{cat:"aqidah",type:"mc",q:`Seorang siswa gagal ujian meski sudah belajar sungguh-sungguh, lalu introspeksi metode belajarnya &amp; berusaha lebih baik pada kesempatan berikutnya. Sikap ini tepat dalam kerangka keimanan pada qada &amp; qadar karena&hellip;`,opts:["Kegagalan adalah takdir mutlak yang tidak boleh direspons dengan evaluasi diri","Ikhtiar &amp; evaluasi diri tetap diperlukan karena manusia tidak mengetahui qadar-nya sebelum terjadi (qada), sehingga usaha maksimal tetap wajib dilakukan","Sebaiknya berhenti berusaha karena hasil akhir sudah ditentukan sejak azali","Evaluasi diri bertentangan dengan keimanan kepada qada dan qadar"],correct:1,expl:`Manusia wajib berikhtiar semaksimal mungkin karena tidak mengetahui qadar (ketetapan) yang berlaku baginya sebelum ia terjadi (qada); evaluasi &amp; usaha lanjutan adalah bagian dari ikhtiar itu sendiri, bukan bertentangan dengan takdir.`},

{cat:"akhlak",type:"mc",q:`Bandingkan dua sikap terhadap kemungkaran: (1) diam saja karena "itu bukan urusan saya", dan (2) menegur dengan cara kasar hingga menimbulkan permusuhan. Sikap yang paling sesuai dengan prinsip amar makruf nahi mungkar dalam Islam adalah&hellip;`,opts:["Sikap (1), karena dianggap lebih aman","Sikap (2), karena dianggap lebih tegas","Bukan keduanya secara mutlak; sebaiknya menegur dengan hikmah &amp; cara bijaksana sesuai kemampuan (dengan tangan, lisan, atau minimal hati)","Kemungkaran orang lain sama sekali bukan tanggung jawab siapa pun"],correct:2,expl:`Amar makruf nahi mungkar diajarkan dengan bertahap sesuai kemampuan (tangan, lisan, atau hati) dan dengan cara yang bijaksana &mdash; bukan dengan sikap acuh maupun kekerasan yang justru menimbulkan permusuhan baru.`},
{cat:"akhlak",type:"mc",q:`Seorang siswa menjuarai lomba dengan cara yang jujur, namun temannya yang kalah menyebarkan gosip bahwa ia curang. Sikap akhlak paling tepat yang mencerminkan sabar sekaligus menjaga kehormatan diri adalah&hellip;`,opts:["Membalas dengan menyebarkan gosip serupa kepada temannya","Diam, mengklarifikasi dengan bukti secara baik-baik, dan memaafkan tanpa menyimpan dendam","Melaporkan ke pihak berwajib tanpa mengklarifikasi terlebih dahulu","Mengundurkan diri dari kejuaraan agar masalah selesai"],correct:1,expl:`Akhlak mulia menuntun untuk mengklarifikasi fitnah dengan bukti secara baik-baik, tanpa membalas keburukan dengan keburukan serupa, dan tetap memaafkan sebagai wujud kelapangan hati.`},
{cat:"akhlak",type:"mc",q:`Bandingkan konsep izzah (harga diri/kemuliaan) dengan takabbur (sombong). Perbedaan mendasar antara keduanya adalah&hellip;`,opts:["Izzah adalah menjaga kehormatan diri tanpa merendahkan orang lain, sedangkan takabbur adalah menolak kebenaran &amp; meremehkan orang lain karena merasa lebih tinggi","Keduanya pada dasarnya sama saja, hanya berbeda istilah","Izzah selalu berujung pada sikap sombong terhadap sesama","Takabbur diperbolehkan selama disertai alasan yang kuat"],correct:0,expl:`Izzah adalah menjaga martabat &amp; kehormatan diri sesuai ajaran Islam tanpa merendahkan orang lain, sedangkan takabbur adalah sikap batin yang menolak kebenaran &amp; memandang rendah orang lain karena merasa lebih unggul.`},
{cat:"akhlak",type:"mc",q:`Seorang teman meminta dirahasiakan bahwa ia mencontek saat ujian, sementara aturan sekolah mewajibkan pelaporan kecurangan demi keadilan bagi siswa lain. Sikap paling tepat yang menyeimbangkan amanah (menjaga rahasia) dan keadilan adalah&hellip;`,opts:["Merahasiakannya sepenuhnya demi menjaga amanah persahabatan","Langsung melaporkannya tanpa berbicara terlebih dahulu dengan temannya","Menasihati teman secara pribadi agar mengakui/berhenti; bila menyangkut hak orang banyak, amanah menjaga rahasia bukan alasan membiarkan kezaliman terus terjadi","Mengabaikan masalah tersebut karena dianggap bukan urusannya"],correct:2,expl:`Amanah menjaga rahasia tidak berlaku mutlak ketika menyangkut hak &amp; keadilan bagi orang banyak. Langkah paling bijak adalah menasihati secara pribadi terlebih dahulu, sembari tetap mempertimbangkan keadilan bagi siswa lain.`},

{cat:"fiqih",type:"mc",q:`Bandingkan hukum menjamak salat karena hujan lebat dengan menjamak salat karena bepergian jauh (safar). Persamaan dasar hukum (illat) dari kedua kondisi ini adalah&hellip;`,opts:["Adanya kesulitan (masyaqqah) yang menjadi sebab keringanan (rukhsah) dalam syariat","Karena keduanya wajib dilakukan setiap hari tanpa kecuali","Karena keduanya sama-sama membatalkan wudu","Tidak ada persamaan sama sekali di antara keduanya"],correct:0,expl:`Baik safar maupun hujan lebat sama-sama mengandung unsur kesulitan (masyaqqah) yang menjadi dasar (illat) diberikannya rukhsah menjamak salat dalam syariat Islam.`},
{cat:"fiqih",type:"mc",q:`Seorang musafir menempuh perjalanan jauh, namun kemudian menetap lebih dari 4 hari di kota tujuan untuk urusan pekerjaan. Bagaimana status salatnya (boleh qashar atau tidak)?`,opts:["Tetap boleh mengqashar salat selamanya karena statusnya musafir","Setelah berniat menetap dalam waktu yang lama (umumnya lebih dari 4 hari menurut sebagian ulama), ia kembali wajib salat secara sempurna (tidak qashar) karena statusnya berubah menjadi muqim","Wajib mengqashar hanya pada hari pertama kedatangan","Boleh memilih bebas kapan saja tanpa ada batasan waktu"],correct:1,expl:`Rukhsah qashar berlaku selama seseorang berstatus musafir. Ketika ia berniat menetap dalam waktu yang cukup lama di suatu tempat, statusnya berubah menjadi muqim sehingga wajib salat secara sempurna kembali.`},

{cat:"tajwid",type:"mc",q:`Mad Jaiz Munfasil terjadi ketika&hellip;`,opts:["Huruf mad bertemu hamzah dalam satu kata","Huruf mad bertemu hamzah, tetapi berada pada kata yang berbeda","Huruf mad bertemu huruf bertasydid","Bacaan diwaqafkan pada huruf hidup"],correct:1,expl:`Mad Jaiz Munfasil terjadi ketika huruf mad berada di akhir kata dan hamzah berada di awal kata berikutnya (berbeda kata).`},
{cat:"tajwid",type:"mc",q:`Waqaf dalam ilmu tajwid artinya&hellip;`,opts:["Menyambung bacaan","Berhenti sejenak dalam membaca Al-Qur'an","Mengulang bacaan","Mempercepat bacaan"],correct:1,expl:`Waqaf artinya berhenti sejenak ketika membaca Al-Qur'an, biasanya pada tanda-tanda waqaf tertentu atau akhir ayat.`},
{cat:"tajwid",type:"mc",q:`Washal dalam ilmu tajwid artinya&hellip;`,opts:["Berhenti membaca","Menyambung bacaan ke kata/ayat berikutnya","Mengulang huruf","Membaca dengan nada tinggi"],correct:1,expl:`Washal artinya menyambung bacaan, yaitu meneruskan bacaan tanpa berhenti ke kata atau ayat selanjutnya.`},
{cat:"tajwid",type:"mc",q:`Qalqalah yang terjadi karena huruf qalqalah berharakat sukun asli di tengah kata disebut&hellip;`,opts:["Qalqalah Kubra","Qalqalah Sughra","Qalqalah Wajib","Qalqalah Akbar"],correct:1,expl:`Qalqalah Sughra (kecil) terjadi ketika huruf qalqalah bersukun asli di tengah kata, dipantulkan secara ringan.`},
{cat:"tajwid",type:"mc",q:`Qalqalah yang terjadi karena huruf qalqalah di akhir kata diwaqafkan (dihentikan) disebut&hellip;`,opts:["Qalqalah Sughra","Qalqalah Kubra","Qalqalah Tabi'i","Qalqalah Ashliyah"],correct:1,expl:`Qalqalah Kubra (besar) terjadi ketika huruf qalqalah berada di akhir kata dan diwaqafkan, sehingga pantulannya lebih jelas/kuat dibanding qalqalah sughra.`},

{cat:"aqidah",type:"mc",q:`Rukun iman dalam Islam berjumlah&hellip;`,opts:["4","5","6","7"],correct:2,expl:`Rukun iman ada 6: iman kepada Allah, malaikat, kitab, rasul, hari akhir, serta qada dan qadar.`},
{cat:"aqidah",type:"mc",q:`Rukun iman yang pertama adalah&hellip;`,opts:["Iman kepada Allah","Iman kepada malaikat","Iman kepada kitab","Iman kepada rasul"],correct:0,expl:`Rukun iman pertama adalah iman kepada Allah, meyakini keesaan dan keberadaan-Nya sebagai pencipta seluruh alam.`},
{cat:"aqidah",type:"mc",q:`Meyakini adanya makhluk gaib ciptaan Allah dari cahaya yang selalu taat kepada-Nya termasuk rukun iman kepada&hellip;`,opts:["Kitab","Malaikat","Rasul","Qada dan qadar"],correct:1,expl:`Iman kepada malaikat adalah meyakini keberadaan malaikat sebagai makhluk gaib dari cahaya yang selalu taat menjalankan perintah Allah.`},
{cat:"aqidah",type:"mc",q:`Salah satu sifat wajib bagi Allah adalah "Wujud" yang artinya&hellip;`,opts:["Kekal","Berbeda dengan makhluk","Ada","Berkuasa"],correct:2,expl:`Sifat wajib Wujud artinya Allah itu ada, keberadaan-Nya adalah wajib/pasti, bukan sesuatu yang mungkin ada atau tidak ada.`},
{cat:"aqidah",type:"mc",q:`Lawan dari sifat wajib "Wujud" bagi Allah adalah sifat mustahil&hellip;`,opts:["Fana","'Adam","Jahlun","'Ajzun"],correct:1,expl:`Sifat mustahil bagi Allah yang berlawanan dengan Wujud (ada) adalah 'Adam, yang artinya tiada/tidak ada.`},
{cat:"aqidah",type:"mc",q:`Asmaul husna "Al-Wahhab" memiliki arti&hellip;`,opts:["Maha Pemberi","Maha Pengasih","Maha Penyayang","Maha Adil"],correct:0,expl:`Al-Wahhab artinya Maha Pemberi, yaitu Allah memberikan karunia kepada makhluk-Nya tanpa mengharap balasan apa pun.`},
{cat:"aqidah",type:"mc",q:`Asmaul husna "Ar-Razzaq" memiliki arti&hellip;`,opts:["Maha Pemberi Rezeki","Maha Pengampun","Maha Melihat","Maha Mendengar"],correct:0,expl:`Ar-Razzaq artinya Maha Pemberi Rezeki, yaitu Allah memberikan rezeki kepada seluruh makhluk-Nya di alam semesta.`},
{cat:"aqidah",type:"mc",q:`Malaikat yang bertugas membagikan rezeki kepada seluruh makhluk adalah&hellip;`,opts:["Jibril","Mikail","Israfil","Izrail"],correct:1,expl:`Malaikat Mikail bertugas mengatur dan membagikan rezeki kepada seluruh makhluk Allah, termasuk hujan dan tumbuh-tumbuhan.`},
{cat:"aqidah",type:"mc",q:`Malaikat yang bertugas meniup sangkakala pada hari kiamat adalah&hellip;`,opts:["Israfil","Munkar","Nakir","Malik"],correct:0,expl:`Malaikat Israfil bertugas meniup sangkakala (terompet) yang menandai datangnya hari kiamat dan kebangkitan seluruh manusia.`},
{cat:"aqidah",type:"mc",q:`Malaikat yang bertugas mencabut nyawa seluruh makhluk hidup adalah&hellip;`,opts:["Jibril","Mikail","Izrail","Raqib"],correct:2,expl:`Malaikat Izrail (Malaikat Maut) bertugas mencabut nyawa seluruh makhluk hidup ketika ajalnya telah tiba.`},
{cat:"aqidah",type:"mc",q:`Dua malaikat yang bertugas menanyai manusia di dalam kubur adalah&hellip;`,opts:["Raqib dan Atid","Munkar dan Nakir","Malik dan Ridwan","Jibril dan Mikail"],correct:1,expl:`Malaikat Munkar dan Nakir bertugas menanyai manusia di alam kubur tentang keimanannya kepada Allah, Nabi, dan agamanya.`},
{cat:"aqidah",type:"mc",q:`Dua malaikat yang bertugas mencatat amal baik dan buruk manusia adalah&hellip;`,opts:["Raqib dan Atid","Munkar dan Nakir","Malik dan Ridwan","Jibril dan Israfil"],correct:0,expl:`Malaikat Raqib mencatat amal baik dan Malaikat Atid mencatat amal buruk manusia selama hidup di dunia.`},
{cat:"aqidah",type:"mc",q:`Malaikat yang bertugas menjaga pintu neraka adalah&hellip;`,opts:["Ridwan","Malik","Mikail","Israfil"],correct:1,expl:`Malaikat Malik bertugas menjaga pintu neraka dan mengatur para penghuninya.`},
{cat:"aqidah",type:"mc",q:`Malaikat yang bertugas menjaga pintu surga adalah&hellip;`,opts:["Malik","Ridwan","Munkar","Atid"],correct:1,expl:`Malaikat Ridwan bertugas menjaga pintu surga dan menyambut para penghuninya.`},
{cat:"aqidah",type:"mc",q:`Kitab Al-Qur'an diturunkan Allah kepada nabi&hellip;`,opts:["Nabi Musa a.s.","Nabi Isa a.s.","Nabi Muhammad Saw.","Nabi Daud a.s."],correct:2,expl:`Kitab Al-Qur'an diturunkan Allah kepada Nabi Muhammad Saw. sebagai kitab suci terakhir dan penyempurna kitab-kitab sebelumnya.`},
{cat:"aqidah",type:"mc",q:`Kitab Taurat diturunkan Allah kepada nabi&hellip;`,opts:["Nabi Musa a.s.","Nabi Muhammad Saw.","Nabi Isa a.s.","Nabi Daud a.s."],correct:0,expl:`Kitab Taurat diturunkan Allah kepada Nabi Musa a.s. sebagai pedoman bagi kaum Bani Israil.`},
{cat:"aqidah",type:"mc",q:`Kitab Injil diturunkan Allah kepada nabi&hellip;`,opts:["Nabi Musa a.s.","Nabi Isa a.s.","Nabi Daud a.s.","Nabi Muhammad Saw."],correct:1,expl:`Kitab Injil diturunkan Allah kepada Nabi Isa a.s. sebagai pedoman bagi umatnya.`},
{cat:"aqidah",type:"mc",q:`Kitab Zabur diturunkan Allah kepada nabi&hellip;`,opts:["Nabi Daud a.s.","Nabi Musa a.s.","Nabi Isa a.s.","Nabi Ibrahim a.s."],correct:0,expl:`Kitab Zabur diturunkan Allah kepada Nabi Daud a.s., berisi banyak zikir dan pujian kepada Allah.`},
{cat:"aqidah",type:"mc",q:`Rasul yang mendapat gelar Ulul Azmi karena kesabaran luar biasa dalam berdakwah berjumlah&hellip;`,opts:["3 rasul","5 rasul","7 rasul","10 rasul"],correct:1,expl:`Rasul Ulul Azmi berjumlah 5, yaitu Nabi Nuh, Ibrahim, Musa, Isa, dan Muhammad Saw., dikenal karena kesabaran luar biasa dalam menghadapi ujian dakwah.`},
{cat:"aqidah",type:"mc",q:`Meyakini bahwa segala sesuatu yang terjadi di alam semesta sudah ditetapkan Allah, namun manusia tetap wajib berusaha (ikhtiar), termasuk rukun iman kepada&hellip;`,opts:["Kitab-kitab Allah","Hari akhir","Qada dan qadar","Rasul-rasul Allah"],correct:2,expl:`Iman kepada qada dan qadar adalah meyakini ketetapan Allah atas segala sesuatu, sambil tetap wajib berikhtiar karena manusia tidak mengetahui takdirnya sebelum terjadi.`},

{cat:"akhlak",type:"mc",q:`Sikap berbakti kepada orang tua selama tidak diperintah bermaksiat kepada Allah disebut&hellip;`,opts:["Birrul walidain","Silaturahmi","Tawaduk","Amanah"],correct:0,expl:`Birrul walidain adalah sikap berbakti, menghormati, dan menaati orang tua selama tidak diperintahkan untuk bermaksiat kepada Allah.`},
{cat:"akhlak",type:"mc",q:`Adab yang baik terhadap guru di sekolah adalah&hellip;`,opts:["Membantah pendapat guru di depan kelas","Menghormati, mendengarkan, dan mengamalkan ilmu yang diajarkan","Mengabaikan nasihat guru","Berbicara sendiri saat guru menjelaskan"],correct:1,expl:`Adab kepada guru meliputi menghormati, mendengarkan penjelasan dengan baik, dan mengamalkan ilmu yang telah diajarkan.`},
{cat:"akhlak",type:"mc",q:`Sikap selalu berkata benar dan sesuai kenyataan disebut sifat&hellip;`,opts:["Sidiq","Kizib","Khianat","Kitman"],correct:0,expl:`Sidiq artinya jujur, yaitu selalu berkata benar sesuai kenyataan dan tidak berdusta.`},
{cat:"akhlak",type:"mc",q:`Lawan dari sifat jujur (sidiq) adalah sifat&hellip;`,opts:["Amanah","Kizib (dusta)","Tabligh","Fatanah"],correct:1,expl:`Kizib artinya dusta atau bohong, merupakan lawan dari sifat jujur (sidiq) yang harus dijauhi seorang muslim.`},
{cat:"akhlak",type:"mc",q:`Adab makan yang dianjurkan dalam Islam antara lain&hellip;`,opts:["Makan sambil berdiri dan berjalan-jalan","Membaca basmalah sebelum makan dan hamdalah setelahnya","Makan dengan tergesa-gesa","Mengambil makanan sebanyak-banyaknya walau tidak habis"],correct:1,expl:`Di antara adab makan adalah membaca basmalah sebelum mulai makan dan membaca hamdalah (Alhamdulillah) setelah selesai makan.`},
{cat:"akhlak",type:"mc",q:`Adab bertamu yang baik menurut ajaran Islam adalah&hellip;`,opts:["Masuk rumah tanpa mengetuk pintu terlebih dahulu","Mengucapkan salam dan meminta izin sebelum masuk","Datang bertamu larut malam tanpa pemberitahuan","Bertamu dalam waktu yang sangat lama tanpa memperhatikan tuan rumah"],correct:1,expl:`Adab bertamu yang baik adalah mengetuk pintu atau memberi salam, serta meminta izin kepada tuan rumah sebelum masuk ke rumahnya.`},
{cat:"akhlak",type:"mc",q:`Sikap yang baik dalam menyambut tamu yang datang ke rumah adalah&hellip;`,opts:["Membiarkan tamu menunggu lama di luar","Menyambut dengan wajah ramah dan menjamunya sesuai kemampuan","Menampakkan wajah cemberut kepada tamu","Menolak tamu tanpa alasan yang jelas"],correct:1,expl:`Islam mengajarkan untuk menyambut tamu dengan wajah ramah dan menjamunya sesuai kemampuan, sebagai bagian dari akhlak mulia.`},
{cat:"akhlak",type:"mc",q:`Sifat wajib rasul yang berarti "dapat dipercaya" adalah&hellip;`,opts:["Sidiq","Amanah","Tabligh","Fatanah"],correct:1,expl:`Amanah artinya dapat dipercaya, yaitu seorang rasul selalu menjaga kepercayaan yang diberikan kepadanya, termasuk dalam menyampaikan wahyu.`},
{cat:"akhlak",type:"mc",q:`Sifat wajib rasul yang berarti "menyampaikan" adalah&hellip;`,opts:["Sidiq","Amanah","Tabligh","Fatanah"],correct:2,expl:`Tabligh artinya menyampaikan, yaitu seorang rasul wajib menyampaikan seluruh wahyu yang diterimanya kepada umat tanpa disembunyikan.`},
{cat:"akhlak",type:"mc",q:`Sifat wajib rasul yang berarti "cerdas" adalah&hellip;`,opts:["Sidiq","Amanah","Tabligh","Fatanah"],correct:3,expl:`Fatanah artinya cerdas, yaitu seorang rasul memiliki kecerdasan tinggi agar mampu menghadapi berbagai tantangan dalam berdakwah.`},
{cat:"akhlak",type:"mc",q:`Sikap rendah hati dan tidak merasa lebih tinggi dari orang lain disebut&hellip;`,opts:["Takabur","Tawaduk","Hasad","Riya"],correct:1,expl:`Tawaduk artinya rendah hati, yaitu sikap tidak merasa lebih baik atau lebih tinggi dari orang lain meskipun memiliki banyak kelebihan.`},
{cat:"akhlak",type:"mc",q:`Sikap merasa lebih tinggi dan meremehkan orang lain disebut&hellip;`,opts:["Tawaduk","Takabur (sombong)","Qanaah","Zuhud"],correct:1,expl:`Takabur artinya sombong, yaitu sikap merasa lebih tinggi dari orang lain dan meremehkan mereka, termasuk akhlak tercela yang harus dijauhi.`},
{cat:"akhlak",type:"mc",q:`Salah satu adab yang harus dijaga ketika berada di dalam masjid adalah&hellip;`,opts:["Berbicara keras dan bercanda berlebihan","Menjaga kebersihan dan ketenangan","Membawa makanan dan memakannya sembarangan","Bermain-main tanpa memperhatikan orang lain yang beribadah"],correct:1,expl:`Adab di masjid antara lain menjaga kebersihan, ketenangan, serta kekhusyukan, karena masjid adalah tempat suci untuk beribadah.`},
{cat:"akhlak",type:"mc",q:`Sikap yang dianjurkan terhadap tetangga dalam ajaran Islam adalah&hellip;`,opts:["Bersikap acuh tak acuh","Saling tolong-menolong dan menjaga hubungan baik","Menyebarkan aib tetangga","Mengganggu ketenangan tetangga"],correct:1,expl:`Islam mengajarkan untuk berbuat baik kepada tetangga, saling tolong-menolong, dan menjaga hubungan baik sebagai bagian dari akhlak mulia.`},
{cat:"akhlak",type:"mc",q:`Sikap yang tepat ketika berbeda pendapat dengan teman adalah&hellip;`,opts:["Memaksakan pendapat sendiri dengan marah","Menghargai pendapat teman dan menyelesaikannya dengan musyawarah","Memutus pertemanan begitu saja","Mengejek pendapat teman yang berbeda"],correct:1,expl:`Perbedaan pendapat sebaiknya disikapi dengan saling menghargai dan diselesaikan melalui musyawarah yang baik, sesuai ajaran Islam.`},
{cat:"akhlak",type:"mc",q:`Akhlak yang baik terhadap hewan peliharaan menurut ajaran Islam adalah&hellip;`,opts:["Menyayangi dan memberinya makan/minum yang cukup","Menyiksa hewan tanpa alasan","Membiarkan hewan kelaparan","Menelantarkan hewan peliharaan"],correct:0,expl:`Islam mengajarkan untuk menyayangi hewan, memberinya makan dan minum yang cukup, serta tidak menyiksanya tanpa alasan yang dibenarkan.`},
{cat:"akhlak",type:"mc",q:`Sikap menjaga kebersihan lingkungan merupakan wujud dari&hellip;`,opts:["Sikap boros","Sebagian dari iman","Sikap riya","Sikap takabur"],correct:1,expl:`Menjaga kebersihan lingkungan merupakan wujud akhlak mulia, sebagaimana hadis Nabi Saw. yang menyebutkan bahwa kebersihan adalah sebagian dari iman.`},
{cat:"akhlak",type:"mc",q:`Sikap suka memaafkan kesalahan orang lain disebut&hellip;`,opts:["Al-'Afw (pemaaf)","Hasad","Ananiyah","Kikir"],correct:0,expl:`Al-'Afw artinya pemaaf, yaitu sikap mudah memaafkan kesalahan orang lain tanpa menyimpan dendam.`},
{cat:"akhlak",type:"mc",q:`Sikap suka memberi dan tidak kikir terhadap sesama disebut&hellip;`,opts:["Sakha (dermawan)","Bakhil","Hasad","Riya"],correct:0,expl:`Sakha artinya dermawan, yaitu sikap gemar memberi dan berbagi kepada sesama tanpa mengharap imbalan.`},
{cat:"akhlak",type:"mc",q:`Membicarakan keburukan atau aib orang lain di belakangnya, meskipun hal itu benar, disebut&hellip;`,opts:["Tabayun","Ghibah","Musyawarah","Tasamuh"],correct:1,expl:`Ghibah artinya menggunjing, yaitu membicarakan aib atau keburukan orang lain di belakangnya, dan hal ini dilarang dalam Islam meskipun yang dibicarakan itu benar adanya.`},

{cat:"fiqih",type:"mc",q:`Rukun Islam berjumlah&hellip;`,opts:["4","5","6","7"],correct:1,expl:`Rukun Islam ada 5: syahadat, salat, zakat, puasa Ramadan, dan haji bagi yang mampu.`},
{cat:"fiqih",type:"mc",q:`Salah satu syarat wajib melaksanakan salat adalah&hellip;`,opts:["Kaya raya","Baligh dan berakal","Sudah menikah","Memiliki jabatan"],correct:1,expl:`Syarat wajib salat di antaranya beragama Islam, baligh, dan berakal sehat, tanpa memandang status ekonomi atau pernikahan.`},
{cat:"fiqih",type:"mc",q:`Rukun wudu yang benar berjumlah&hellip;`,opts:["4 rukun","5 rukun","6 rukun","7 rukun"],correct:2,expl:`Rukun wudu ada 6: niat, membasuh wajah, membasuh kedua tangan sampai siku, mengusap sebagian kepala, membasuh kedua kaki sampai mata kaki, dan tertib.`},
{cat:"fiqih",type:"mc",q:`Berikut ini yang termasuk hal yang membatalkan wudu adalah&hellip;`,opts:["Makan dan minum","Buang angin (kentut)","Berbicara dengan orang lain","Berjalan kaki"],correct:1,expl:`Di antara hal yang membatalkan wudu adalah keluarnya sesuatu dari kubul/dubur seperti buang angin, buang air kecil, atau buang air besar.`},
{cat:"fiqih",type:"mc",q:`Jumlah rakaat salat fardu dalam sehari semalam adalah&hellip;`,opts:["15 rakaat","17 rakaat","19 rakaat","21 rakaat"],correct:1,expl:`Salat fardu lima waktu berjumlah 17 rakaat: Subuh (2), Zuhur (4), Asar (4), Magrib (3), dan Isya (4).`},
{cat:"fiqih",type:"mc",q:`Sujud yang dilakukan karena lupa dalam salat, misalnya lupa jumlah rakaat, disebut&hellip;`,opts:["Sujud syukur","Sujud tilawah","Sujud sahwi","Sujud rukun"],correct:2,expl:`Sujud sahwi dilakukan ketika seseorang lupa atau ragu dalam salatnya, misalnya lupa jumlah rakaat, dilakukan sebelum atau sesudah salam.`},
{cat:"fiqih",type:"mc",q:`Tayamum dilakukan sebagai pengganti wudu dalam kondisi&hellip;`,opts:["Saat cuaca sangat panas","Tidak ada air atau berhalangan menggunakan air","Ketika hendak tidur","Setelah selesai salat"],correct:1,expl:`Tayamum adalah bersuci menggunakan debu yang dilakukan sebagai pengganti wudu atau mandi wajib ketika tidak ada air atau ada uzur syar'i untuk menggunakannya.`},
{cat:"fiqih",type:"mc",q:`Zakat fitrah yang dikeluarkan umat Islam pada bulan Ramadan biasanya berupa&hellip;`,opts:["Uang tunai saja","Makanan pokok seperti beras","Pakaian baru","Perhiasan emas"],correct:1,expl:`Zakat fitrah umumnya dikeluarkan berupa makanan pokok, seperti beras, sesuai kadar yang telah ditentukan (kurang lebih 2,5&ndash;3 kg per jiwa).`},
{cat:"fiqih",type:"mc",q:`Puasa yang wajib dilaksanakan oleh setiap muslim yang balig dan mampu setiap tahunnya adalah puasa&hellip;`,opts:["Puasa Senin-Kamis","Puasa Ramadan","Puasa Arafah","Puasa Syawal"],correct:1,expl:`Puasa Ramadan adalah puasa wajib yang harus dilaksanakan setiap muslim yang balig, berakal, dan mampu, selama satu bulan penuh di bulan Ramadan.`},
{cat:"fiqih",type:"mc",q:`Rukun puasa yang utama adalah&hellip;`,opts:["Niat dan menahan diri dari yang membatalkan puasa sejak fajar hingga magrib","Sahur dan berbuka tepat waktu","Membaca doa berbuka dengan keras","Bersedekah setiap hari selama puasa"],correct:0,expl:`Rukun puasa adalah niat (di malam hari atau sebelum fajar) dan menahan diri dari segala yang membatalkan puasa mulai terbit fajar hingga terbenam matahari.`},
{cat:"fiqih",type:"mc",q:`Berikut ini yang membatalkan puasa adalah&hellip;`,opts:["Tidur di siang hari","Makan dan minum dengan sengaja","Menggosok gigi tanpa pasta","Mandi di siang hari"],correct:1,expl:`Makan dan minum dengan sengaja di siang hari saat berpuasa termasuk hal yang membatalkan puasa.`},
{cat:"fiqih",type:"mc",q:`Ibadah haji merupakan rukun Islam kelima yang wajib dilaksanakan bagi&hellip;`,opts:["Semua muslim tanpa terkecuali","Muslim yang mampu (istita'ah) secara fisik, ilmu, dan harta","Hanya bagi laki-laki dewasa","Hanya bagi penduduk Mekkah"],correct:1,expl:`Haji wajib dilaksanakan sekali seumur hidup bagi muslim yang mampu (istita'ah), baik secara fisik, ilmu, maupun harta/bekal perjalanan.`},
{cat:"fiqih",type:"mc",q:`Berikut ini yang termasuk rukun haji adalah&hellip;`,opts:["Ihram, wukuf di Arafah, tawaf ifadah, sa'i, dan tahalul","Membeli oleh-oleh di Mekkah","Mengunjungi Masjid Nabawi","Berfoto di depan Ka'bah"],correct:0,expl:`Rukun haji di antaranya ihram, wukuf di Arafah, tawaf ifadah, sa'i antara Safa dan Marwah, serta tahalul, yang harus dilaksanakan agar hajinya sah.`},
{cat:"fiqih",type:"mc",q:`Batas atau tempat tertentu yang menjadi awal memulai ihram bagi jamaah haji disebut&hellip;`,opts:["Miqat","Multazam","Sa'i","Mabit"],correct:0,expl:`Miqat adalah batas tempat dan waktu yang ditentukan bagi jamaah haji atau umrah untuk memulai niat ihram.`},
{cat:"fiqih",type:"mc",q:`Thaharah dalam istilah fikih artinya&hellip;`,opts:["Bersuci dari hadas dan najis","Berpuasa penuh","Salat berjamaah","Bersedekah kepada fakir miskin"],correct:0,expl:`Thaharah artinya bersuci, yaitu menyucikan diri dari hadas (kecil maupun besar) dan najis, sebagai syarat sahnya ibadah seperti salat.`},
{cat:"fiqih",type:"mc",q:`Najis mutawasitah (najis sedang), seperti air kencing, umumnya disucikan dengan cara&hellip;`,opts:["Cukup diusap dengan tisu kering","Dibasuh dengan air hingga hilang warna, bau, dan rasanya","Dijemur di bawah sinar matahari saja","Ditutup dengan kain tanpa dibasuh"],correct:1,expl:`Najis mutawasitah disucikan dengan membasuhnya menggunakan air hingga hilang warna, bau, dan rasa najis tersebut.`},
{cat:"fiqih",type:"mc",q:`Melaksanakan salat secara berjamaah di masjid memiliki keutamaan dibandingkan salat sendirian, yaitu&hellip;`,opts:["Pahalanya sama saja dengan salat sendirian","Pahalanya lebih besar dibanding salat sendirian","Hukumnya menjadi tidak sah jika sendirian","Hanya dianjurkan bagi laki-laki lanjut usia"],correct:1,expl:`Salat berjamaah memiliki keutamaan pahala yang lebih besar dibandingkan salat sendirian, sebagaimana disebutkan dalam hadis Nabi Saw.`},
{cat:"fiqih",type:"mc",q:`Salat sunnah yang dikerjakan mengiringi salat fardu, baik sebelum maupun sesudahnya, disebut salat sunnah&hellip;`,opts:["Rawatib","Tahajud","Duha","Istikharah"],correct:0,expl:`Salat sunnah rawatib adalah salat sunnah yang dikerjakan mengiringi salat fardu, baik qabliyah (sebelum) maupun ba'diyah (sesudah).`},
{cat:"fiqih",type:"mc",q:`Zakat yang dikenakan atas harta kekayaan seperti emas, perak, dan hasil perniagaan yang telah mencapai nisab dan haul disebut&hellip;`,opts:["Zakat fitrah","Zakat mal","Sedekah wajib","Infak sunnah"],correct:1,expl:`Zakat mal adalah zakat yang dikenakan atas harta kekayaan seperti emas, perak, hasil perniagaan, atau simpanan yang telah mencapai nisab dan haul (satu tahun kepemilikan).`},
{cat:"fiqih",type:"mc",q:`Salah satu adab yang dianjurkan ketika hendak masuk ke dalam masjid adalah&hellip;`,opts:["Mendahulukan kaki kiri sambil berdoa","Mendahulukan kaki kanan sambil berdoa masuk masjid","Masuk tanpa membaca doa apa pun","Berbicara keras saat masuk"],correct:1,expl:`Adab masuk masjid yang dianjurkan adalah mendahulukan kaki kanan sambil membaca doa masuk masjid, sebagai bentuk penghormatan terhadap tempat ibadah.`},

{cat:"tarikh",type:"mc",q:`Nabi Muhammad Saw. dilahirkan di kota&hellip;`,opts:["Madinah","Mekkah","Thaif","Yerusalem"],correct:1,expl:`Nabi Muhammad Saw. dilahirkan di kota Mekkah, tepatnya pada tahun Gajah (sekitar tahun 570 M).`},
{cat:"tarikh",type:"mc",q:`Nabi Muhammad Saw. menerima wahyu pertama di Gua Hira pada usia&hellip;`,opts:["25 tahun","30 tahun","40 tahun","50 tahun"],correct:2,expl:`Nabi Muhammad Saw. menerima wahyu pertama di Gua Hira ketika berusia 40 tahun, menandai awal kenabian beliau.`},
{cat:"tarikh",type:"mc",q:`Peristiwa pindahnya Nabi Muhammad Saw. beserta para sahabat dari Mekkah ke Madinah disebut&hellip;`,opts:["Isra Mikraj","Hijrah","Fathu Makkah","Nuzulul Qur'an"],correct:1,expl:`Hijrah adalah peristiwa pindahnya Nabi Muhammad Saw. dan para sahabat dari Mekkah ke Madinah karena tekanan kaum kafir Quraisy.`},
{cat:"tarikh",type:"mc",q:`Sahabat yang menemani Nabi Muhammad Saw. saat hijrah ke Madinah, termasuk bersembunyi di Gua Sur, adalah&hellip;`,opts:["Umar bin Khattab","Abu Bakar Ash-Shiddiq","Utsman bin Affan","Ali bin Abi Thalib"],correct:1,expl:`Abu Bakar Ash-Shiddiq menemani Nabi Muhammad Saw. saat hijrah ke Madinah, termasuk bersembunyi bersama di Gua Sur dari kejaran kaum kafir Quraisy.`},
{cat:"tarikh",type:"mc",q:`Perang pertama yang dimenangkan kaum muslimin melawan kaum kafir Quraisy terjadi di&hellip;`,opts:["Perang Badar","Perang Uhud","Perang Khandaq","Perang Hunain"],correct:0,expl:`Perang Badar terjadi pada tahun ke-2 Hijriah dan menjadi kemenangan besar pertama kaum muslimin melawan kaum kafir Quraisy meski jumlah pasukan lebih sedikit.`},
{cat:"tarikh",type:"mc",q:`Perang yang terjadi karena sebagian pasukan pemanah muslim turun dari bukit sebelum waktunya sehingga kaum muslimin sempat terdesak adalah&hellip;`,opts:["Perang Badar","Perang Uhud","Perang Khandaq","Fathu Makkah"],correct:1,expl:`Pada Perang Uhud, sebagian pasukan pemanah muslim turun dari bukit sebelum diperintahkan, sehingga kaum muslimin sempat terdesak oleh serangan balik pasukan Quraisy.`},
{cat:"tarikh",type:"mc",q:`Perang yang menggunakan strategi menggali parit untuk menghadang pasukan musuh yang jauh lebih besar disebut&hellip;`,opts:["Perang Badar","Perang Uhud","Perang Khandaq","Perang Hunain"],correct:2,expl:`Perang Khandaq (perang parit) terjadi ketika kaum muslimin menggali parit di sekeliling Madinah atas usul Salman Al-Farisi untuk menghadang pasukan sekutu Quraisy.`},
{cat:"tarikh",type:"mc",q:`Peristiwa pembebasan kota Mekkah oleh kaum muslimin tanpa peperangan besar terjadi pada tahun&hellip;`,opts:["2 Hijriah","5 Hijriah","8 Hijriah","10 Hijriah"],correct:2,expl:`Fathu Makkah (pembebasan kota Mekkah) terjadi pada tahun 8 Hijriah, di mana kaum muslimin memasuki Mekkah hampir tanpa perlawanan berarti.`},
{cat:"tarikh",type:"mc",q:`Khalifah pertama yang menggantikan kepemimpinan setelah Nabi Muhammad Saw. wafat adalah&hellip;`,opts:["Umar bin Khattab","Abu Bakar Ash-Shiddiq","Utsman bin Affan","Ali bin Abi Thalib"],correct:1,expl:`Abu Bakar Ash-Shiddiq menjadi khalifah pertama menggantikan kepemimpinan umat Islam setelah Nabi Muhammad Saw. wafat.`},
{cat:"tarikh",type:"mc",q:`Khalifah kedua yang dikenal dengan gelar Al-Faruq (pembeda antara hak dan batil) adalah&hellip;`,opts:["Abu Bakar Ash-Shiddiq","Umar bin Khattab","Utsman bin Affan","Ali bin Abi Thalib"],correct:1,expl:`Umar bin Khattab, khalifah kedua, dikenal dengan gelar Al-Faruq karena ketegasannya dalam membedakan perkara yang hak dan batil.`},
{cat:"tarikh",type:"mc",q:`Khalifah ketiga yang dikenal karena membukukan (menyeragamkan) mushaf Al-Qur'an adalah&hellip;`,opts:["Abu Bakar Ash-Shiddiq","Umar bin Khattab","Utsman bin Affan","Ali bin Abi Thalib"],correct:2,expl:`Utsman bin Affan, khalifah ketiga, dikenal karena inisiatifnya menyeragamkan penulisan mushaf Al-Qur'an menjadi satu standar bacaan (Mushaf Utsmani).`},
{cat:"tarikh",type:"mc",q:`Khalifah keempat yang merupakan sepupu sekaligus menantu Nabi Muhammad Saw. adalah&hellip;`,opts:["Abu Bakar Ash-Shiddiq","Umar bin Khattab","Utsman bin Affan","Ali bin Abi Thalib"],correct:3,expl:`Ali bin Abi Thalib, khalifah keempat, merupakan sepupu sekaligus menantu Nabi Muhammad Saw. karena menikah dengan putri beliau, Fatimah az-Zahra.`},
{cat:"tarikh",type:"mc",q:`Naskah Al-Qur'an mulai dikumpulkan menjadi satu mushaf pada masa kekhalifahan&hellip;`,opts:["Abu Bakar Ash-Shiddiq","Umar bin Khattab","Utsman bin Affan","Ali bin Abi Thalib"],correct:0,expl:`Pengumpulan ayat-ayat Al-Qur'an yang tercecer menjadi satu mushaf pertama kali dilakukan pada masa kekhalifahan Abu Bakar Ash-Shiddiq, atas usul Umar bin Khattab.`},
{cat:"tarikh",type:"mc",q:`Nabi Muhammad Saw. wafat pada usia&hellip;`,opts:["60 tahun","63 tahun","70 tahun","73 tahun"],correct:1,expl:`Nabi Muhammad Saw. wafat pada usia 63 tahun di kota Madinah.`},
{cat:"tarikh",type:"mc",q:`Wanita yang menyusui Nabi Muhammad Saw. pada masa kecilnya adalah&hellip;`,opts:["Aminah","Halimah Sa'diyah","Khadijah","Fatimah"],correct:1,expl:`Halimah Sa'diyah adalah wanita dari Bani Sa'ad yang menyusui dan mengasuh Nabi Muhammad Saw. pada masa kecilnya di daerah pedalaman.`},
{cat:"tarikh",type:"mc",q:`Setelah ayah dan ibunya wafat, Nabi Muhammad Saw. kecil diasuh oleh kakeknya yang bernama&hellip;`,opts:["Abu Thalib","Abdul Muthalib","Abu Lahab","Hamzah"],correct:1,expl:`Setelah ibunya, Aminah, wafat, Nabi Muhammad Saw. diasuh oleh kakeknya, Abdul Muthalib, hingga sang kakek wafat pula.`},
{cat:"tarikh",type:"mc",q:`Setelah Abdul Muthalib wafat, Nabi Muhammad Saw. diasuh oleh pamannya yang bernama&hellip;`,opts:["Abu Thalib","Abu Lahab","Al-Abbas","Hamzah"],correct:0,expl:`Setelah kakeknya, Abdul Muthalib, wafat, Nabi Muhammad Saw. diasuh oleh pamannya, Abu Thalib, yang selalu melindungi beliau dalam berdakwah.`},
{cat:"tarikh",type:"mc",q:`Istri pertama Nabi Muhammad Saw. yang dikenal sebagai wanita saudagar kaya dan pertama kali beriman kepada risalahnya adalah&hellip;`,opts:["Aisyah","Khadijah binti Khuwailid","Hafsah","Zainab"],correct:1,expl:`Khadijah binti Khuwailid adalah istri pertama Nabi Muhammad Saw., seorang saudagar kaya yang sangat mendukung dakwah beliau dan menjadi orang pertama yang beriman.`},
{cat:"tarikh",type:"mc",q:`Sebelum diangkat menjadi rasul, Nabi Muhammad Saw. dikenal oleh masyarakat Mekkah dengan gelar "Al-Amin" yang berarti&hellip;`,opts:["Yang dipercaya","Yang kaya raya","Yang pemberani","Yang cerdas"],correct:0,expl:`Al-Amin artinya "yang dapat dipercaya", gelar yang diberikan masyarakat Mekkah kepada Nabi Muhammad Saw. sebelum diangkat menjadi rasul karena kejujuran dan sifat amanahnya.`},
{cat:"tarikh",type:"mc",q:`Peristiwa perjalanan malam Nabi Muhammad Saw. dari Masjidil Haram ke Masjidil Aqsa kemudian naik ke Sidratul Muntaha disebut&hellip;`,opts:["Hijrah","Isra Mikraj","Fathu Makkah","Nuzulul Qur'an"],correct:1,expl:`Isra Mikraj adalah peristiwa perjalanan malam Nabi Muhammad Saw. dari Masjidil Haram ke Masjidil Aqsa (Isra), kemudian naik ke Sidratul Muntaha (Mikraj), membawa perintah salat lima waktu.`}

const TAJWID_TOPIC = {
  dasar:"Dasar Tajwid",
  makhraj:"Makhraj",
  ghunnah:"Ghunnah",
  mad:"Mad",
  nun:"Nun Sukun &amp; Tanwin",
  mim:"Mim Sukun",
  waqaf:"Waqaf"
};
const TJ_LVNAME = {1:"Mudah",2:"Sedang",3:"Sulit",0:"Campur"};

const TAJWID_MATERI = [
{title:"Pengantar Ilmu Tajwid",body:`
  <p>Secara bahasa, <b>tajwid</b> berarti memperbaiki (tahsin). Secara istilah, tajwid adalah membaca Al-Qur'an dengan benar sebagaimana bacaan Rasulullah Saw. &mdash; mengeluarkan huruf dari <b>makhraj</b>-nya, memenuhi <b>sifat</b>-nya, dan memperhatikan <b>hukum bacaan</b>. Mempelajari ilmu tajwid hukumnya fardhu kifayah, sedangkan mempraktikkannya saat membaca Al-Qur'an hukumnya <b>fardhu &lsquo;ain</b> bagi setiap pembaca.</p>
  <p class="sub">Lahn Jali &mdash; kesalahan nyata</p>
  <p>Salah harakat, salah makhraj, atau salah sifat huruf, yang bisa mengubah makna. Sengaja melakukannya hukumnya <b>haram</b>.</p>
  <p class="sub">Lahn Khafi &mdash; kesalahan samar</p>
  <p>Ghunnah kurang dengung, mad kurang panjang, atau mad dipanjangkan melebihi kadarnya. Tidak mengubah makna, tetapi tetap mengurangi kesempurnaan bacaan.</p>
  <p class="sub">Isti&rsquo;adzah &amp; Basmalah</p>
  <p>Isti&rsquo;adzah dibaca keras bila tilawah keras dan ada yang mendengarkan, dan dibaca pelan bila sendirian. Basmalah dibaca di awal setiap surat <b>kecuali At-Taubah</b>; bila memulai dari tengah surat, boleh dibaca boleh tidak.</p>`},
{title:"Makharijul Huruf (Tempat Keluarnya Huruf)",body:`
  <p>Tempat keluarnya huruf hijaiah. Ada 5 tempat utama:</p>
  <table><thead><tr><th>Tempat</th><th>Bagian</th><th>Huruf</th></tr></thead><tbody>
  <tr><td><b>Al-Jauf</b><br><span style="color:var(--ink-soft);font-size:.8em">rongga mulut</span></td><td>1 makhraj</td><td>3 huruf mad: ا و ي</td></tr>
  <tr><td rowspan="3"><b>Al-Halq</b><br><span style="color:var(--ink-soft);font-size:.8em">tenggorokan</span></td><td>Aqshal halq (bawah)</td><td>ء هـ</td></tr>
  <tr><td>Wasathul halq (tengah)</td><td>ع ح</td></tr>
  <tr><td>Adnal halq (atas)</td><td>غ خ</td></tr>
  <tr><td><b>Al-Lisan</b><br><span style="color:var(--ink-soft);font-size:.8em">lidah</span></td><td>10 makhraj</td><td>Pangkal, tengah, tepi, dan ujung lidah</td></tr>
  <tr><td><b>Asy-Syafatan</b><br><span style="color:var(--ink-soft);font-size:.8em">dua bibir</span></td><td>2 makhraj</td><td>ف dari perut bibir bawah &amp; ujung gigi seri atas &middot; ب م و dari dua bibir</td></tr>
  <tr><td><b>Al-Khaisyum</b><br><span style="color:var(--ink-soft);font-size:.8em">rongga hidung</span></td><td>1 makhraj</td><td>Segala bunyi <b>ghunnah</b> (dengung)</td></tr>
  </tbody></table>`},
{title:"Ghunnah &mdash; Nun &amp; Mim Bertasydid",body:`
  <p>Ghunnah = suara dengung dari rongga hidung. Setiap <span class="arabic" style="font-size:1.1em">نّ</span> dan <span class="arabic" style="font-size:1.1em">مّ</span> bertasydid <b>wajib</b> dibaca dengung &plusmn;2 harakat &mdash; inilah tingkat ghunnah yang paling sempurna.</p>
  <table><thead><tr><th>Huruf</th><th>Contoh Bacaan</th></tr></thead><tbody>
  <tr><td>Nun bertasydid</td><td>إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ &middot; مِنَ الْجِنَّةِ وَالنَّاسِ</td></tr>
  <tr><td>Mim bertasydid</td><td>عَمَّ يَتَسَاءَلُونَ &middot; ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ</td></tr>
  </tbody></table>`},
{title:"Mad &mdash; Memanjangkan Bacaan",body:`
  <p><b>Huruf mad:</b> alif setelah fathah &middot; ya' sukun setelah kasrah &middot; waw sukun setelah dhammah. <b>Huruf lin:</b> ya' atau waw sukun setelah <i>fathah</i> &mdash; contoh بَيْتٍ, خَوْفٍ.</p>
  <table><thead><tr><th>Jenis</th><th>Panjang &amp; Sebab</th><th>Contoh</th></tr></thead><tbody>
  <tr><td><b>Mad Asli</b><br><span style="color:var(--ink-soft);font-size:.8em">Thabi'i</span></td><td><b>2 harakat</b><br><span style="color:var(--ink-soft);font-size:.8em">tanpa sebab apa pun</span></td><td>قَالَ &middot; يَقُولُ &middot; قِيلَ &middot; نُوحِيهَا</td></tr>
  <tr><td rowspan="2"><b>Mad Far'i</b><br><span style="color:var(--ink-soft);font-size:.8em">cabang</span></td><td><b>4&ndash;5 harakat</b><br><span style="color:var(--ink-soft);font-size:.8em">mad bertemu hamzah</span></td><td>جَاءَ &middot; السَّمَاءِ &middot; أُولَٰئِكَ &middot; يَا أَيُّهَا</td></tr>
  <tr><td><b>6 harakat</b><br><span style="color:var(--ink-soft);font-size:.8em">mad bertemu tasydid / sukun</span></td><td>وَلَا الضَّالِّينَ &middot; الْحَاقَّةُ &middot; الطَّامَّةُ</td></tr>
  </tbody></table>`},
{title:"Hukum Nun Sukun &amp; Tanwin (Lengkap)",body:`
  <p class="sub">a. Idzhar Halqi &mdash; dibaca jelas, tanpa dengung</p>
  <p>Bila nun sukun/tanwin bertemu 6 huruf tenggorokan: ء هـ ع ح غ خ</p>
  <table><thead><tr><th>Huruf</th><th>Contoh (nun sukun)</th><th>Contoh (tanwin)</th></tr></thead><tbody>
  <tr><td>ء</td><td>مَنْ أَنْصَارِي</td><td>رَسُولٌ أَمِينٌ</td></tr>
  <tr><td>هـ</td><td>مِنْهُمْ</td><td>جُرُفٍ هَارٍ</td></tr>
  <tr><td>ع</td><td>أَنْعَمْتَ</td><td>سَمِيعٌ عَلِيمٌ</td></tr>
  <tr><td>ح</td><td>وَانْحَرْ</td><td>عَلِيمٌ حَكِيمٌ</td></tr>
  <tr><td>غ</td><td>مِنْ غِلٍّ</td><td>عَفُوًّا غَفُورًا</td></tr>
  <tr><td>خ</td><td>وَالْمُنْخَنِقَةُ</td><td>عَلِيمٌ خَبِيرٌ</td></tr>
  </tbody></table>
  <p class="sub">b. Idgham &mdash; dimasukkan ke huruf berikutnya</p>
  <p><b>Bighunnah</b> (dengan dengung) &mdash; huruf ي ن م و:</p>
  <table><tbody>
  <tr><td style="width:30px">ي</td><td>مَنْ يَعْمَلْ</td></tr>
  <tr><td>ن</td><td>مِنْ نِعْمَةٍ</td></tr>
  <tr><td>م</td><td>عَذَابٌ مُقِيمٌ</td></tr>
  <tr><td>و</td><td>مِنْ وَالٍ</td></tr>
  </tbody></table>
  <p><b>Bilaghunnah</b> (tanpa dengung) &mdash; huruf ل ر:</p>
  <table><tbody>
  <tr><td style="width:30px">ل</td><td>مِنْ لَدُنْهُ &middot; هُدًى لِلْمُتَّقِينَ</td></tr>
  <tr><td>ر</td><td>مِنْ رَبِّهِمْ &middot; غَفُورٌ رَحِيمٌ</td></tr>
  </tbody></table>
  <p><b>Pengecualian:</b> bila nun sukun dan huruf idgham berada dalam <b>satu kata</b>, bacaannya tetap <b>jelas</b> (idzhar mutlak): دُنْيَا &middot; بُنْيَانٌ &middot; صِنْوَانٌ &middot; قِنْوَانٌ</p>
  <p class="sub">c. Iqlab &mdash; diubah menjadi mim + dengung</p>
  <p>Hanya 1 huruf: ب. Nun sukun/tanwin diubah menjadi mim samar pada ba, disertai ghunnah. Contoh: مِنْ بَعْدِ &middot; أَنْبِئْهُمْ &middot; سَمِيعٌ بَصِيرٌ &middot; لَيُنْبَذَنَّ</p>
  <p class="sub">d. Ikhfa Haqiqi &mdash; dibaca samar + dengung</p>
  <p>15 huruf selain huruf idzhar, idgham, dan iqlab: ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك</p>
  <table><tbody>
  <tr><td>ت</td><td>مِنْ تَحْتِهَا</td><td>ث</td><td>مَنْ ثَقُلَتْ</td></tr>
  <tr><td>ج</td><td>أَنْجَيْنَاكُمْ</td><td>د</td><td>أَنْدَادًا</td></tr>
  <tr><td>ذ</td><td>مُنْذِرٌ</td><td>ز</td><td>أَنْزَلْنَا</td></tr>
  <tr><td>س</td><td>الْإِنْسَانُ</td><td>ش</td><td>مَنْ شَاءَ</td></tr>
  <tr><td>ص</td><td>مَنْصُورًا</td><td>ض</td><td>مَنْضُودٍ</td></tr>
  <tr><td>ط</td><td>يَنْطِقُونَ</td><td>ظ</td><td>يَنْظُرُونَ</td></tr>
  <tr><td>ف</td><td>أَنْفُسَهُمْ</td><td>ق</td><td>مِنْ قَبْلُ</td></tr>
  <tr><td>ك</td><td>مَنْ كَانَ</td><td></td><td></td></tr>
  </tbody></table>`},
{title:"Hukum Mim Sukun",body:`
  <table><thead><tr><th>Hukum</th><th>Huruf</th><th>Cara Baca</th><th>Contoh</th></tr></thead><tbody>
  <tr><td><b>Ikhfa Syafawi</b></td><td>ب</td><td>Samar di bibir + dengung</td><td>تَرْمِيهِمْ بِحِجَارَةٍ</td></tr>
  <tr><td><b>Idgham Mitslain</b><br><span style="color:var(--ink-soft);font-size:.8em">mimi</span></td><td>م</td><td>Dimasukkan + dengung</td><td>لَهُمْ مَا يَشَاءُونَ &middot; كَمْ مِنْ فِئَةٍ</td></tr>
  <tr><td><b>Idzhar Syafawi</b></td><td>26 huruf<br><span style="color:var(--ink-soft);font-size:.8em">selain م dan ب</span></td><td>Jelas, tanpa dengung</td><td>أَنْعَمْتَ عَلَيْهِمْ &middot; أَلَمْ نَشْرَحْ</td></tr>
  </tbody></table>
  <p class="sub">Paling sering keliru</p>
  <p>Mim sukun bertemu و atau ف tetap <b>idzhar syafawi</b> &mdash; dibaca jelas, jangan didengungkan. Contoh: عَلَيْهِمْ وَلَا الضَّالِّينَ &middot; هُمْ فِيهَا</p>`},
{title:"Tanda Waqaf",body:`
  <table><thead><tr><th>Tanda</th><th>Nama</th><th>Hukum</th></tr></thead><tbody>
  <tr><td>لا</td><td>Waqaf La Washal</td><td>Tidak boleh berhenti bila di tengah ayat; boleh berhenti bila di akhir ayat.</td></tr>
  <tr><td>م</td><td>Waqaf Lazim</td><td>Diutamakan berhenti &mdash; kalimat sudah sempurna.</td></tr>
  <tr><td>صلى</td><td>Washal Aula</td><td>Lebih baik diteruskan, tetapi boleh berhenti.</td></tr>
  <tr><td>قلى</td><td>Waqaf Aula</td><td>Lebih baik berhenti, walaupun nafas masih kuat.</td></tr>
  <tr><td>ج</td><td>Waqaf Jaiz</td><td>Boleh berhenti, boleh lanjut &mdash; sama baiknya.</td></tr>
  <tr><td>&#8756; &#8756;</td><td>Waqaf Muraqabah / Ta&rsquo;anuq</td><td>Muncul dua kali; harus berhenti di salah satu saja, tidak boleh di keduanya.</td></tr>
  </tbody></table>`}
];

const TAJWID_BANK=[
{l:1,t:"dasar",q:"Secara bahasa, kata \"tajwid\" berarti…",o:["Memperbaiki (tahsin)","Memanjangkan","Mendengungkan","Menyamarkan"],a:0,e:"Tajwid secara bahasa berarti memperbaiki, sepadan dengan kata tahsin. Secara istilah: membaca Al-Qur'an sebagaimana bacaan Rasulullah Saw."},
{l:1,t:"dasar",q:"Hukum membaca Al-Qur'an dengan tajwid bagi setiap pembacanya adalah…",o:["Fardhu 'ain","Fardhu kifayah","Sunnah muakkad","Mubah"],a:0,e:"Mempelajari ilmu tajwid fardhu kifayah, tetapi mempraktikkannya saat membaca Al-Qur'an hukumnya fardhu 'ain — kewajiban setiap individu."},
{l:1,t:"dasar",q:"Berikut yang termasuk kesalahan Jali adalah…",o:["Salah membaca harakat","Ghunnah kurang dengung","Mad kurang panjang","Mad melebihi kadar"],a:0,e:"Lahn Jali = kesalahan nyata: salah harakat, salah makhraj, atau salah sifat huruf. Tiga pilihan lainnya termasuk lahn khafi."},
{l:1,t:"dasar",q:"Kurang mendengungkan ghunnah termasuk kesalahan…",o:["Khafi (samar)","Jali (nyata)","Fahisy","Tidak termasuk kesalahan"],a:0,e:"Lahn Khafi adalah kesalahan yang tidak nyata dan tidak mengubah makna, seperti kurang ghunnah atau kurang panjang mad."},
{l:1,t:"ghunnah",q:"Ghunnah menurut bahasa berarti…",o:["Dengung atau gema","Jelas","Samar","Memasukkan"],a:0,e:"Ghunnah artinya dengung/gema; secara istilah suara yang keluar dari rongga hidung menyertai nun dan mim."},
{l:1,t:"ghunnah",q:"Suara ghunnah keluar dari…",o:["Rongga hidung (al-khaisyum)","Tenggorokan (al-halq)","Dua bibir (asy-syafatan)","Rongga mulut (al-jauf)"],a:0,e:"Al-Khaisyum adalah makhraj rongga hidung; dari sinilah keluar segala bunyi ghunnah."},
{l:1,t:"ghunnah",q:"Huruf yang wajib dibaca ghunnah bila bertasydid adalah…",o:["Nun dan mim","Lam dan ra","Ba dan mim","Ya dan waw"],a:0,e:"Hanya nun (نّ) dan mim (مّ) bertasydid yang wajib dibaca ghunnah, dan inilah ghunnah tingkat paling sempurna."},
{l:1,t:"ghunnah",q:"Hukum bacaan pada lafaz berikut adalah…",ar:"إِنَّا أَعْطَيْنَاكَ",o:["Ghunnah","Ikhfa","Idgham bilaghunnah","Idzhar halqi"],a:0,e:"Terdapat nun bertasydid pada إِنَّا, sehingga wajib dibaca dengung ±2 harakat."},
{l:1,t:"ghunnah",q:"Hukum bacaan pada lafaz berikut adalah…",ar:"عَمَّ يَتَسَاءَلُونَ",o:["Ghunnah","Iqlab","Idzhar syafawi","Ikhfa syafawi"],a:0,e:"Pada عَمَّ terdapat mim bertasydid — dibaca ghunnah (dengung) ±2 harakat."},
{l:1,t:"nun",q:"Jumlah huruf idzhar halqi ada…",o:["6 huruf","4 huruf","2 huruf","15 huruf"],a:0,e:"Huruf idzhar halqi ada 6, semuanya keluar dari tenggorokan: ء هـ ع ح غ خ."},
{l:1,t:"nun",q:"Huruf berikut yang termasuk huruf idzhar halqi adalah…",o:["غ","ب","ل","ت"],a:0,e:"Ghain (غ) keluar dari adnal halq, termasuk 6 huruf halq. Ba = iqlab, lam = idgham bilaghunnah, ta = ikhfa."},
{l:1,t:"nun",q:"Huruf idgham bighunnah adalah…",o:["ي ن م و","ل ر","ب","ء هـ ع ح غ خ"],a:0,e:"Dikenal dengan singkatan \"yanmu\": ya, nun, mim, waw."},
{l:1,t:"nun",q:"Huruf idgham bilaghunnah adalah…",o:["ل dan ر","ي dan و","م dan ن","ب dan م"],a:0,e:"Hanya lam dan ra; nun sukun/tanwin dilebur tanpa dengung."},
{l:1,t:"nun",q:"Huruf iqlab berjumlah…",o:["1 huruf, yaitu ب","2 huruf","4 huruf","6 huruf"],a:0,e:"Iqlab hanya terjadi bila nun sukun atau tanwin bertemu ba (ب)."},
{l:1,t:"nun",q:"Jumlah huruf ikhfa haqiqi ada…",o:["15 huruf","6 huruf","4 huruf","10 huruf"],a:0,e:"Ikhfa memiliki 15 huruf, yaitu sisa huruf hijaiyah selain huruf idzhar, idgham, dan iqlab."},
{l:1,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"أَنْعَمْتَ",o:["Idzhar halqi","Ikhfa haqiqi","Idgham bighunnah","Iqlab"],a:0,e:"Nun sukun bertemu 'ain (ع) — huruf halq — sehingga dibaca jelas tanpa dengung."},
{l:1,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مَنْ يَعْمَلْ",o:["Idgham bighunnah","Idgham bilaghunnah","Idzhar halqi","Ikhfa"],a:0,e:"Nun sukun bertemu ya (ي), salah satu huruf \"yanmu\", dilebur dengan dengung."},
{l:1,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"غَفُورٌ رَحِيمٌ",o:["Idgham bilaghunnah","Idgham bighunnah","Idzhar halqi","Iqlab"],a:0,e:"Tanwin bertemu ra (ر), dilebur tanpa dengung; ra menjadi seolah bertasydid."},
{l:1,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مِنْ بَعْدِ",o:["Iqlab","Ikhfa","Idzhar","Idgham bighunnah"],a:0,e:"Nun sukun bertemu ba (ب): bunyi nun diubah menjadi mim samar disertai ghunnah."},
{l:1,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مِنْ قَبْلُ",o:["Ikhfa haqiqi","Idzhar halqi","Iqlab","Idgham bilaghunnah"],a:0,e:"Nun sukun bertemu qaf (ق), salah satu dari 15 huruf ikhfa — dibaca samar disertai dengung."},
{l:1,t:"nun",q:"Idzhar menurut bahasa berarti…",o:["Jelas","Samar","Memasukkan","Mengubah"],a:0,e:"Idzhar = jelas; hurufnya diucapkan dari makhrajnya tanpa tambahan ghunnah."},
{l:1,t:"nun",q:"Idgham menurut bahasa berarti…",o:["Memasukkan","Menjelaskan","Membalik","Menyamarkan"],a:0,e:"Idgham = memasukkan; huruf sukun digabungkan ke huruf berharakat sesudahnya menjadi satu huruf bertasydid."},
{l:1,t:"nun",q:"Iqlab menurut bahasa berarti…",o:["Mengubah","Menyamarkan","Menjelaskan","Memanjangkan"],a:0,e:"Qalb/iqlab = mengubah; nun sukun atau tanwin diubah menjadi mim yang tersembunyi pada ba."},
{l:1,t:"nun",q:"Ikhfa menurut bahasa berarti…",o:["Samar atau tertutup","Jelas","Memasukkan","Berhenti"],a:0,e:"Ikhfa = samar; diucapkan antara idzhar dan idgham, tanpa tasydid, tetap disertai ghunnah."},
{l:1,t:"mad",q:"Mad menurut bahasa berarti…",o:["Memanjangkan dan menambah","Menyamarkan","Mendengungkan","Menahan"],a:0,e:"Mad artinya memanjangkan; secara istilah memanjangkan suara dengan huruf mad atau huruf lin."},
{l:1,t:"mad",q:"Panjang bacaan mad asli (thabi'i) adalah…",o:["2 harakat","4 harakat","5 harakat","6 harakat"],a:0,e:"Mad thabi'i tidak dipengaruhi sebab apa pun, dibaca tepat 2 harakat."},
{l:1,t:"mad",q:"Huruf mad berjumlah…",o:["3: alif, ya sukun, waw sukun","2: alif dan ya","4: alif, ya, waw, nun","6 huruf"],a:0,e:"Alif setelah fathah, ya sukun setelah kasrah, dan waw sukun setelah dhammah."},
{l:1,t:"mad",q:"Hukum bacaan lafaz berikut adalah…",ar:"قَالَ",o:["Mad thabi'i, 2 harakat","Mad far'i, 4 harakat","Mad far'i, 6 harakat","Bukan bacaan mad"],a:0,e:"Alif jatuh setelah huruf berharakat fathah tanpa sebab lain — mad asli 2 harakat."},
{l:1,t:"mim",q:"Mim sukun bertemu huruf ba (ب) dibaca…",o:["Ikhfa syafawi","Idzhar syafawi","Idgham mitslain","Iqlab"],a:0,e:"Mim sukun bertemu ba dibaca samar di bibir disertai dengung — ikhfa syafawi."},
{l:1,t:"mim",q:"Mim sukun bertemu huruf mim berharakat dibaca…",o:["Idgham mitslain","Ikhfa syafawi","Idzhar syafawi","Idzhar halqi"],a:0,e:"Disebut juga idgham mimi/mutamatsilain: dimasukkan ke huruf berikutnya disertai dengung."},
{l:1,t:"mim",q:"Mim sukun bertemu huruf selain م dan ب dibaca…",o:["Idzhar syafawi","Ikhfa syafawi","Idgham mitslain","Ghunnah"],a:0,e:"Dibaca jelas tanpa dengung; disebut syafawi karena makhraj mim ada di bibir."},
{l:1,t:"mim",q:"Huruf idzhar syafawi berjumlah…",o:["26 huruf","6 huruf","15 huruf","2 huruf"],a:0,e:"28 huruf hijaiyah dikurangi mim dan ba = 26 huruf."},
{l:1,t:"waqaf",q:"Waqaf secara bahasa berarti…",o:["Menahan (berhenti)","Menyambung","Mengulang","Memanjangkan"],a:0,e:"Waqaf artinya menahan, yakni menghentikan bacaan pada tempat tertentu."},
{l:1,t:"waqaf",q:"Tanda waqaf ﺝ (jim) bermakna…",o:["Boleh berhenti, boleh lanjut","Wajib berhenti","Dilarang berhenti","Harus mengulang"],a:0,e:"Tanda jim = waqaf jaiz: berhenti dan meneruskan sama-sama diperbolehkan."},
{l:1,t:"waqaf",q:"Tanda waqaf لا yang berada di tengah ayat bermakna…",o:["Tidak boleh berhenti","Wajib berhenti","Lebih baik berhenti","Harus mengulang dari awal"],a:0,e:"Waqaf La Washal: tidak boleh berhenti bila di tengah ayat; bila berada di akhir ayat, boleh berhenti."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"وَانْحَرْ",o:["Idzhar halqi","Ikhfa haqiqi","Iqlab","Idgham bighunnah"],a:0,e:"Nun sukun bertemu ha (ح) dari wasathul halq — dibaca jelas tanpa dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"عَلِيمٌ حَكِيمٌ",o:["Idzhar halqi","Idgham bighunnah","Ikhfa","Iqlab"],a:0,e:"Tanwin bertemu ha (ح), termasuk 6 huruf halq — dibaca jelas."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"رَسُولٌ أَمِينٌ",o:["Idzhar halqi","Ikhfa haqiqi","Idgham bighunnah","Idgham bilaghunnah"],a:0,e:"Tanwin bertemu hamzah (ء) — huruf halq paling bawah — dibaca jelas."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مِنْ نِعْمَةٍ",o:["Idgham bighunnah","Idzhar halqi","Ghunnah musyaddadah","Ikhfa"],a:0,e:"Nun sukun bertemu nun berharakat: dilebur menjadi nun bertasydid disertai dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"عَذَابٌ مُقِيمٌ",o:["Idgham bighunnah","Ikhfa syafawi","Idzhar halqi","Iqlab"],a:0,e:"Tanwin bertemu mim — termasuk huruf \"yanmu\" — dilebur dengan dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مِنْ وَالٍ",o:["Idgham bighunnah","Idzhar syafawi","Idgham bilaghunnah","Ikhfa"],a:0,e:"Nun sukun bertemu waw (و), salah satu huruf idgham bighunnah."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مِنْ لَدُنْهُ",o:["Idgham bilaghunnah","Idgham bighunnah","Idzhar halqi","Ikhfa"],a:0,e:"Nun sukun bertemu lam — dilebur tanpa dengung sama sekali."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"هُدًى لِلْمُتَّقِينَ",o:["Idgham bilaghunnah","Idgham bighunnah","Idzhar halqi","Iqlab"],a:0,e:"Tanwin bertemu lam: bunyi tanwin hilang, dilebur ke lam tanpa dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"سَمِيعٌ بَصِيرٌ",o:["Iqlab","Ikhfa syafawi","Idgham bighunnah","Idzhar halqi"],a:0,e:"Tanwin bertemu ba: tanwin diubah menjadi mim samar disertai ghunnah 2 harakat."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"أَنْبِئْهُمْ",o:["Iqlab","Ikhfa haqiqi","Idzhar halqi","Idgham bighunnah"],a:0,e:"Nun sukun bertemu ba dalam satu kata — tetap iqlab, dibaca \"ambi'hum\" dengan dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"يَنْظُرُونَ",o:["Ikhfa haqiqi","Idzhar halqi","Idgham bighunnah","Iqlab"],a:0,e:"Nun sukun bertemu zha (ظ), salah satu dari 15 huruf ikhfa."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"الْإِنْسَانُ",o:["Ikhfa haqiqi","Idzhar halqi","Idgham bilaghunnah","Ghunnah"],a:0,e:"Nun sukun bertemu sin (س) — dibaca samar disertai dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"أَنْدَادًا",o:["Ikhfa haqiqi","Iqlab","Idzhar halqi","Idgham bighunnah"],a:0,e:"Nun sukun bertemu dal (د), termasuk huruf ikhfa."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مَنْ شَاءَ",o:["Ikhfa haqiqi","Idzhar halqi","Idgham bighunnah","Idgham bilaghunnah"],a:0,e:"Nun sukun bertemu syin (ش) — ikhfa, dibaca samar dengan dengung."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مَنْصُورًا",o:["Ikhfa haqiqi","Idzhar halqi","Iqlab","Ghunnah"],a:0,e:"Nun sukun bertemu shad (ص), salah satu huruf ikhfa."},
{l:2,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"مُنْذِرٌ",o:["Ikhfa haqiqi","Idgham bighunnah","Idzhar halqi","Iqlab"],a:0,e:"Nun sukun bertemu dzal (ذ) — termasuk 15 huruf ikhfa."},
{l:2,t:"mim",q:"Hukum bacaan lafaz berikut adalah…",ar:"تَرْمِيهِمْ بِحِجَارَةٍ",o:["Ikhfa syafawi","Idzhar syafawi","Idgham mitslain","Iqlab"],a:0,e:"Mim sukun bertemu ba: dibaca samar dengan merapatkan dua bibir disertai dengung."},
{l:2,t:"mim",q:"Hukum bacaan lafaz berikut adalah…",ar:"لَهُمْ مَا يَشَاءُونَ",o:["Idgham mitslain","Ikhfa syafawi","Idzhar syafawi","Idgham bighunnah"],a:0,e:"Mim sukun bertemu mim berharakat — dilebur menjadi satu mim bertasydid dengan dengung."},
{l:2,t:"mim",q:"Hukum bacaan lafaz berikut adalah…",ar:"كَمْ مِنْ فِئَةٍ",o:["Idgham mitslain","Idzhar syafawi","Ikhfa syafawi","Iqlab"],a:0,e:"Pada كَمْ مِنْ, mim sukun bertemu mim — idgham mitslain (mimi) disertai dengung."},
{l:2,t:"mim",q:"Hukum bacaan lafaz berikut adalah…",ar:"أَلَمْ نَشْرَحْ",o:["Idzhar syafawi","Idgham mitslain","Ikhfa syafawi","Ikhfa haqiqi"],a:0,e:"Mim sukun bertemu nun — bukan mim dan bukan ba — sehingga dibaca jelas."},
{l:2,t:"mim",q:"Hukum mim sukun pada lafaz berikut adalah…",ar:"عَلَيْهِمْ وَلَا الضَّالِّينَ",o:["Idzhar syafawi","Ikhfa syafawi","Idgham mitslain","Ghunnah"],a:0,e:"Mim sukun bertemu waw tetap dibaca JELAS. Justru di sinilah banyak orang keliru mendengungkannya."},
{l:2,t:"mim",q:"Hukum mim sukun pada lafaz berikut adalah…",ar:"هُمْ فِيهَا",o:["Idzhar syafawi","Ikhfa syafawi","Idgham mitslain","Iqlab"],a:0,e:"Mim sukun bertemu fa dibaca jelas tanpa dengung, meski makhrajnya berdekatan."},
{l:2,t:"mad",q:"Sebab bacaan mad pada lafaz berikut adalah…",ar:"يَقُولُ",o:["Waw sukun setelah dhammah","Alif setelah fathah","Ya sukun setelah kasrah","Bertemu hamzah"],a:0,e:"Mad thabi'i: waw sukun jatuh setelah huruf berharakat dhammah, dibaca 2 harakat."},
{l:2,t:"mad",q:"Panjang bacaan pada lafaz berikut adalah…",ar:"جَاءَ",o:["4–5 harakat","2 harakat","6 harakat","1 harakat"],a:0,e:"Huruf mad bertemu hamzah, sehingga menjadi mad far'i yang dibaca 4 atau 5 harakat."},
{l:2,t:"mad",q:"Panjang bacaan pada lafaz berikut adalah…",ar:"وَلَا الضَّالِّينَ",o:["6 harakat","2 harakat","4 harakat","3 harakat"],a:0,e:"Huruf mad bertemu huruf bertasydid, dibaca panjang 6 harakat."},
{l:2,t:"mad",q:"Panjang bacaan pada lafaz berikut adalah…",ar:"الطَّامَّةُ",o:["6 harakat","2 harakat","4 harakat","5 harakat"],a:0,e:"Alif mad bertemu mim bertasydid — dibaca 6 harakat."},
{l:2,t:"mad",q:"Mad far'i dibaca 4 atau 5 harakat apabila tanda mad bertemu…",o:["Hamzah","Tasydid","Sukun","Tanwin"],a:0,e:"Bertemu hamzah = 4–5 harakat; bertemu tasydid atau sukun = 6 harakat."},
{l:2,t:"mad",q:"Yang dimaksud huruf lin adalah…",o:["Ya atau waw sukun setelah fathah","Ya sukun setelah kasrah","Waw sukun setelah dhammah","Alif setelah fathah"],a:0,e:"Huruf lin contohnya pada بَيْتٍ dan خَوْفٍ — dibaca lunak, bukan mad thabi'i."},
{l:2,t:"makhraj",q:"Huruf ب م و keluar dari makhraj…",o:["Asy-syafatan (dua bibir)","Al-halq (tenggorokan)","Al-lisan (lidah)","Al-jauf (rongga mulut)"],a:0,e:"Ba dan mim dari dua bibir tertutup; waw dari dua bibir yang dimoncongkan sehingga ada celah suara."},
{l:2,t:"makhraj",q:"Huruf ف keluar dari…",o:["Perut bibir bawah bertemu ujung dua gigi seri atas","Dua bibir tertutup rapat","Ujung lidah dan gigi atas","Tenggorokan bagian tengah"],a:0,e:"Inilah yang membedakan makhraj fa dari ba dan mim, meski sama-sama pada kelompok asy-syafatan."},
{l:2,t:"makhraj",q:"Huruf ء dan هـ keluar dari…",o:["Aqshal halq (tenggorokan bawah)","Wasathul halq (tengah)","Adnal halq (atas)","Al-jauf"],a:0,e:"Aqshal halq adalah bagian tenggorokan yang paling jauh/bawah."},
{l:2,t:"makhraj",q:"Huruf ع dan ح keluar dari…",o:["Wasathul halq (tenggorokan tengah)","Aqshal halq","Adnal halq","Asy-syafatan"],a:0,e:"'Ain dan ha berada di pertengahan tenggorokan."},
{l:2,t:"makhraj",q:"Huruf غ dan خ keluar dari…",o:["Adnal halq (tenggorokan atas)","Wasathul halq","Aqshal halq","Al-lisan"],a:0,e:"Adnal halq adalah bagian tenggorokan yang paling dekat dengan mulut."},
{l:2,t:"makhraj",q:"Dari makhraj Al-Jauf keluar…",o:["Tiga huruf mad","Enam huruf halq","Bunyi ghunnah","Huruf qalqalah"],a:0,e:"Al-Jauf (rongga mulut) memiliki satu makhraj dan darinya keluar alif, waw sukun, dan ya sukun."},
{l:2,t:"makhraj",q:"Dari makhraj Al-Khaisyum keluar…",o:["Segala bunyi ghunnah","Huruf mad","Huruf halq","Huruf qalqalah"],a:0,e:"Al-Khaisyum adalah rongga hidung, sumber seluruh dengung dalam bacaan."},
{l:2,t:"makhraj",q:"Al-Lisan (lidah) memiliki jumlah makhraj sebanyak…",o:["10 makhraj","4 makhraj","2 makhraj","1 makhraj"],a:0,e:"Al-Lisan terbagi menjadi empat bagian (pangkal, tengah, tepi, ujung lidah) yang seluruhnya memuat 10 makhraj."},
{l:2,t:"waqaf",q:"Tanda waqaf ﺻﻠﻰ bermakna…",o:["Meneruskan bacaan lebih baik","Wajib berhenti","Dilarang berhenti","Harus mengulang"],a:0,e:"Washal aula: washal (meneruskan) lebih utama, meski berhenti tetap boleh."},
{l:2,t:"waqaf",q:"Tanda waqaf ﻗﻠﻰ bermakna…",o:["Lebih baik berhenti","Lebih baik lanjut","Dilarang berhenti","Wajib berhenti"],a:0,e:"Waqaf aula: berhenti lebih utama walaupun nafas masih kuat."},
{l:2,t:"waqaf",q:"Tanda titik tiga yang muncul dua kali (∴ ∴) disebut…",o:["Waqaf muraqabah — berhenti di salah satunya","Waqaf lazim — wajib berhenti di keduanya","Waqaf jaiz — bebas","Waqaf la washal"],a:0,e:"Disebut juga waqaf ta'anuq (terikat): harus berhenti pada salah satu tanda saja, tidak boleh keduanya."},
{l:2,t:"waqaf",q:"Tanda waqaf م (mim) disebut waqaf lazim, artinya…",o:["Diutamakan berhenti karena kalimat sudah sempurna","Boleh berhenti boleh lanjut","Dilarang berhenti","Meneruskan lebih baik"],a:0,e:"Waqaf lazim menandai akhir kalimat yang sempurna sehingga berhenti lebih diutamakan."},
{l:3,t:"nun",q:"Mengapa nun sukun dibaca idzhar ketika bertemu huruf halq?",o:["Karena makhraj huruf halq jauh dari makhraj nun sehingga sulit didengungkan","Karena huruf halq bertasydid","Karena huruf halq termasuk huruf mad","Karena huruf halq keluar dari hidung"],a:0,e:"Idzhar berarti mengeluarkan huruf dari makhrajnya tanpa tambahan ghunnah; jauhnya makhraj halq dari nun membuat peleburan tidak mungkin."},
{l:3,t:"nun",q:"Lafaz دُنْيَا, بُنْيَانٌ, صِنْوَانٌ, قِنْوَانٌ dibaca…",o:["Idzhar, karena nun dan huruf idgham berada dalam satu kata","Idgham bighunnah seperti biasa","Iqlab","Ikhfa haqiqi"],a:0,e:"Ini pengecualian yang disebut idzhar mutlak: idgham hanya berlaku bila nun sukun dan hurufnya berada di dua kata berbeda."},

{l:3,t:"nun",q:"Jumlah 15 huruf ikhfa diperoleh dari perhitungan…",o:["28 huruf − 6 idzhar − 6 idgham − 1 iqlab","28 huruf − 10 idzhar − 3 idgham","29 huruf − 14 lainnya","28 huruf − 6 idzhar − 7 idgham"],a:0,e:"Huruf ikhfa adalah sisa huruf hijaiyah setelah dikurangi huruf idzhar (6), idgham bighunnah dan bilaghunnah (4+2=6), serta iqlab (1)."},
{l:3,t:"nun",q:"Pada lafaz berikut, yang terjadi pada nun sukun adalah…",ar:"مِنْ رَبِّهِمْ",o:["Dilebur ke ra tanpa dengung, ra menjadi bertasydid","Dilebur disertai dengung","Diubah menjadi mim","Dibaca samar"],a:0,e:"Idgham bilaghunnah: bunyi nun hilang seluruhnya, tidak boleh ada sisa dengung."},
{l:3,t:"nun",q:"Hukum bacaan yang terdapat pada lafaz berikut adalah…",ar:"كُنْتُمْ",o:["Ikhfa haqiqi (nun sukun bertemu ta)","Idzhar halqi","Iqlab","Idgham mitslain"],a:0,e:"Ta (ت) termasuk 15 huruf ikhfa, sehingga nun sukun dibaca samar disertai dengung dalam satu kata."},
{l:3,t:"nun",q:"Lafaz berikut mengandung DUA hukum bacaan sekaligus, yaitu…",ar:"أَنْعَمْتَ",o:["Idzhar halqi dan idzhar syafawi","Ikhfa haqiqi dan ikhfa syafawi","Idgham bighunnah dan iqlab","Iqlab dan idzhar syafawi"],a:0,e:"Nun sukun bertemu 'ain = idzhar halqi; lalu mim sukun bertemu ta = idzhar syafawi. Keduanya dibaca jelas."},
{l:3,t:"mim",q:"Mengapa mim sukun yang bertemu و dan ف wajib dibaca idzhar syafawi dengan sempurna?",o:["Karena makhrajnya berdekatan dengan mim sehingga rawan tertukar menjadi dengung","Karena keduanya huruf halq","Karena keduanya huruf mad","Karena keduanya tidak boleh disambung"],a:0,e:"Waw sama-sama dari dua bibir dan fa dari bibir bawah, sehingga pembaca mudah keliru mendengungkannya; justru harus dijelaskan."},
{l:3,t:"mim",q:"Perbedaan pokok idgham mitslain dan ikhfa syafawi adalah…",o:["Mitslain: mim bertemu mim lalu dilebur; ikhfa syafawi: mim bertemu ba lalu disamarkan","Mitslain tanpa dengung, ikhfa syafawi dengan dengung","Mitslain terjadi pada nun, ikhfa syafawi pada mim","Keduanya sama, hanya beda istilah"],a:0,e:"Keduanya sama-sama berdengung, tetapi berbeda huruf pemicu dan cara pengucapannya."},
{l:3,t:"ghunnah",q:"Tingkatan ghunnah yang paling sempurna terdapat pada…",o:["Nun dan mim bertasydid","Ikhfa haqiqi","Idgham bighunnah","Idzhar halqi"],a:0,e:"Ghunnah musyaddadah adalah tingkat dengung paling sempurna, dan membacanya hukumnya wajib."},
{l:3,t:"ghunnah",q:"Ukuran panjang dengung ghunnah yang umum dipakai adalah…",o:["Sekitar 2 harakat","Sekitar 6 harakat","Tidak ada ukuran","Sekitar 4–5 harakat"],a:0,e:"Kurang dari kadar tersebut termasuk lahn khafi — kesalahan samar yang tidak mengubah makna."},
{l:3,t:"mad",q:"Panjang bacaan pada lafaz berikut dan sebabnya adalah…",ar:"يَا أَيُّهَا",o:["4–5 harakat, karena huruf mad bertemu hamzah","2 harakat, mad thabi'i","6 harakat, bertemu tasydid","2 harakat, huruf lin"],a:0,e:"Alif mad pada يَا langsung bertemu hamzah pada أَيُّهَا sehingga menjadi mad far'i."},
{l:3,t:"mad",q:"Yang membedakan mad far'i dari mad asli adalah…",o:["Mad far'i dipengaruhi sebab berupa hamzah, sukun, atau tasydid","Mad far'i selalu 2 harakat","Mad asli selalu dibaca 6 harakat","Mad far'i tidak memakai huruf mad"],a:0,e:"Mad asli murni 2 harakat tanpa sebab; adanya sebab itulah yang menambah panjangnya menjadi 4, 5, atau 6 harakat."},
{l:3,t:"mad",q:"Lafaz بَيْتٍ dan خَوْفٍ mengandung…",o:["Huruf lin, yaitu ya/waw sukun setelah fathah","Mad thabi'i 2 harakat","Mad far'i 6 harakat","Ghunnah"],a:0,e:"Huruf lin berbeda dari huruf mad karena huruf sebelumnya berharakat fathah, bukan kasrah atau dhammah."},
{l:3,t:"dasar",q:"Sengaja melakukan kesalahan Jali dalam membaca Al-Qur'an hukumnya…",o:["Haram","Makruh","Mubah","Sunnah dihindari saja"],a:0,e:"Karena lahn jali dapat mengubah bacaan dan bahkan maknanya, melakukannya dengan sengaja hukumnya haram."},
{l:3,t:"dasar",q:"Memanjangkan mad melebihi kadar yang seharusnya termasuk…",o:["Lahn khafi","Lahn jali","Bukan kesalahan","Sunnah qiraah"],a:0,e:"Bersama kurangnya ghunnah dan kurangnya mad, ini termasuk kesalahan samar yang tidak mengubah makna."},
{l:3,t:"dasar",q:"Isti'adzah dibaca dengan suara keras apabila…",o:["Tilawah dengan suara keras dan ada orang lain yang mendengarkan","Sedang membaca sendirian","Selalu, dalam keadaan apa pun","Hanya saat shalat"],a:0,e:"Bila tilawah pelan atau sendirian, isti'adzah dibaca pelan. Saat bergantian membaca, boleh dibaca oleh pembaca pertama saja."},
{l:3,t:"dasar",q:"Surat dalam Al-Qur'an yang tidak diawali basmalah adalah…",o:["At-Taubah","Al-Fatihah","An-Nas","Al-Ikhlas"],a:0,e:"Basmalah dibaca ketika memulai awal setiap surat kecuali surat At-Taubah."},
{l:3,t:"dasar",q:"Bila tilawah dimulai dari pertengahan surat, membaca basmalah hukumnya…",o:["Boleh dibaca, boleh tidak","Wajib dibaca","Dilarang dibaca","Wajib diganti isti'adzah"],a:0,e:"Ketentuan ini berbeda dengan awal surat, yang basmalahnya dibaca (kecuali At-Taubah)."},

{l:3,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"وَيْلٌ لِكُلِّ",o:["Idgham bilaghunnah","Idgham bighunnah","Ikhfa haqiqi","Idzhar halqi"],a:0,e:"Tanwin bertemu lam, dilebur tanpa dengung — bunyi tanwin hilang sepenuhnya."},
{l:3,t:"nun",q:"Hukum bacaan lafaz berikut adalah…",ar:"فَأَمَّا مَنْ ثَقُلَتْ",o:["Ikhfa haqiqi","Idzhar halqi","Idgham bighunnah","Iqlab"],a:0,e:"Nun sukun bertemu tsa (ث), termasuk 15 huruf ikhfa. Perhatikan pula مَّا yang berghunnah."},
{l:3,t:"nun",q:"Hukum nun sukun pada lafaz berikut adalah…",ar:"أَنْجَيْنَاكُمْ",o:["Ikhfa haqiqi","Idgham bighunnah","Idzhar halqi","Iqlab"],a:0,e:"Nun sukun bertemu jim (ج) di dalam satu kata — tetap dibaca ikhfa disertai dengung."},
{l:3,t:"mim",q:"Hukum bacaan lafaz berikut adalah…",ar:"أَمْ مَنْ",o:["Idgham mitslain","Idzhar syafawi","Ikhfa syafawi","Iqlab"],a:0,e:"Mim sukun bertemu mim berharakat: dilebur menjadi mim bertasydid dengan dengung."},
{l:3,t:"mad",q:"Lafaz الْحَاقَّةُ dibaca 6 harakat karena…",o:["Huruf mad bertemu huruf bertasydid","Huruf mad bertemu hamzah","Termasuk mad asli","Terdapat huruf lin"],a:0,e:"Mad yang bertemu tasydid atau sukun dipanjangkan 6 harakat — lebih panjang daripada mad yang bertemu hamzah."}

  <p class="sub">Ghunnah</p>
  <p>Dengung pada nun atau mim yang bertasydid (misalnya &#1573;&#1616;&#1606;&#1617;&#1614;&#1575;), ditahan &plusmn;2 harakat. Ghunnah juga menyertai Idgham Bighunnah dan Iqlab.</p>`},
{title:"Hukum Mad (Panjang Bacaan)",body:`
  <p><b>Mad Tabi'i</b> (2 harakat): fathah + alif, kasrah + ya sukun, atau dammah + wau sukun, tanpa hamzah/sukun setelahnya.</p>
  <p><b>Mad Wajib Muttasil</b> (4&ndash;5 harakat): huruf mad bertemu hamzah dalam satu kata yang sama.</p>
  <p><b>Mad Jaiz Munfasil</b> (2, 4, atau 5 harakat): huruf mad bertemu hamzah, tetapi di kata yang berbeda.</p>`},
{title:"Qalqalah",body:`
  <p>Huruf qalqalah: <b>ب ج د ط ق</b> (mudah diingat: "baju di toko"/"qatbu jad").</p>
  <p><b>Qalqalah Sughra</b>: huruf qalqalah bersukun asli, berada di tengah kata.</p>
  <p><b>Qalqalah Kubra</b>: huruf qalqalah menjadi sukun karena diwaqafkan, berada di akhir kata.</p>`},
{title:"Alif Lam Qamariyah &amp; Syamsiyah",body:`
  <p><b>Al-Qamariyah</b>: lam dibaca jelas. Huruf: ا ب ج ح خ ع غ ف ق ك م و ه ي.</p>
  <p><b>Al-Syamsiyah</b>: lam melebur (tidak dibaca), huruf setelahnya bertasydid. Huruf: ت ث د ذ ر ز س ش ص ض ط ظ ل ن.</p>`},
{title:"Harakat, Makharijul Huruf &amp; Penulisan",body:`
  <p><b>Fathah</b> (&#1614;) mengubah bunyi huruf menjadi "a", <b>kasrah</b> (&#1616;) menjadi "i", <b>dammah</b> (&#1615;) menjadi "u" &mdash; ketiganya berbeda, bukan sama. <b>Sukun</b> (&#1618;) membuat huruf mati dan tidak pernah berada di awal kata.</p>
  <p>Enam huruf hijaiah yang tidak dapat disambung ke huruf sesudahnya: <b>ا د ذ ر ز و</b>.</p>
  <p>Ha (ح) dan ha (ه) adalah huruf yang berbeda makhraj dan sifatnya, tidak boleh dipertukarkan. Kesalahan makharijul huruf mengurangi kesempurnaan bacaan, tetapi tidak membatalkan salat.</p>`},
{title:"Asmaul Husna",body:`
