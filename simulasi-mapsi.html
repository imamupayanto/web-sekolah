  <p>Dakwah periode Makkah dilakukan bertahap: sembunyi-sembunyi lalu terang-terangan. Hijrah ke Madinah membangun fondasi masyarakat Islam. Fathu Makkah dan Haji Wada menegaskan akhlak mulia dan pesan persamaan derajat.</p>
  <p><b>Abu Bakar</b>: memerangi nabi palsu &amp; pembangkang zakat. <b>Umar bin Khattab</b>: ekspansi wilayah &amp; penataan administrasi negara (diwan, Baitul Mal). <b>Utsman bin Affan</b>: standardisasi mushaf Al-Qur'an. <b>Ali bin Abi Thalib</b>: dikenal karena keadilan dan keluasan ilmunya.</p>`}
];
</script>
<script>
/* =========================================================
   STATE & LOGIC
========================================================= */
const state = {
  tab: "home",
  screen: "start", // start | quiz | result
  activeCat: "all",
  order: [],
  idx: 0,
  answers: {},
  flags: {},
  reviewOpen: {},
  reviewFilter: "all"
};

function loadHistory(){
  try{
    return JSON.parse(localStorage.getItem("mihrab_history")||"[]");
  }catch(e){ return []; }
}
function saveHistoryEntry(entry){
  try{
    const h = loadHistory();
    h.unshift(entry);
    localStorage.setItem("mihrab_history", JSON.stringify(h.slice(0,8)));
  }catch(e){ /* ignore */ }
}

function catCount(cat){
  if(cat==="all") return QUESTIONS.length;
  return QUESTIONS.filter(q=>q.cat===cat).length;
}

function buildOrder(cat){
  const idxs = QUESTIONS.map((q,i)=>i).filter(i=> cat==="all" || QUESTIONS[i].cat===cat);
  return idxs;
}

function startQuiz(){
  state.order = buildOrder(state.activeCat);
  state.idx = 0;
  state.answers = {};
  state.flags = {};
  state.screen = "quiz";
  render();
}

function currentQ(){
  return QUESTIONS[state.order[state.idx]];
}

function selectOption(oi){
  const qi = state.order[state.idx];
  state.answers[qi] = oi;
  render();
}

function toggleFlag(){
  const qi = state.order[state.idx];
  state.flags[qi] = !state.flags[qi];
  render();
}

function goto(delta){
  state.idx = Math.min(Math.max(0, state.idx+delta), state.order.length-1);
  render();
}

function finishQuiz(){
  state.screen = "result";
  const graded = state.order.filter(i=>QUESTIONS[i].correct!==null);
  let correctCount = 0;
  graded.forEach(i=>{ if(state.answers[i]===QUESTIONS[i].correct) correctCount++; });
  const pct = graded.length? Math.round(100*correctCount/graded.length) : 0;
  saveHistoryEntry({
    date: new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}),
    cat: state.activeCat==="all" ? "Semua Kategori" : CATS[state.activeCat],
    score: correctCount, total: graded.length, pct: pct
  });
  render();
}

function restart(){
  state.screen = "start";
  render();
}

function fmtCat(c){ return CATS[c] || c; }

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  const main = document.getElementById("main");
  if(state.tab==="materi"){ main.innerHTML = renderMateri(); return; }
  if(state.screen==="start"){ main.innerHTML = renderStart(); attachStartEvents(); return; }
  if(state.screen==="quiz"){ main.innerHTML = renderQuiz(); attachQuizEvents(); return; }
  if(state.screen==="result"){ main.innerHTML = renderResult(); attachResultEvents(); }
}

function renderStart(){
  const hist = loadHistory();
  const chips = ["all",...Object.keys(CATS)].map(c=>{
    const label = c==="all" ? "Semua Soal" : fmtCat(c);
    return `<button class="chip ${state.activeCat===c?'active':''}" data-cat="${c}">${label} <span class="n">(${catCount(c)})</span></button>`;
  }).join("");

  const histHtml = hist.length ? `
    <div class="startcard history">
      <h3>Riwayat Simulasi Terakhir</h3>
      ${hist.map(h=>`<div class="hist-item"><span>${h.date} &middot; ${h.cat}</span><span class="hist-score">${h.score}/${h.total} &middot; ${h.pct}%</span></div>`).join("")}
    </div>` : "";

  return `
    <p class="lede">Latihan soal simulasi lomba Mata Pelajaran PAI &amp; BTQ (MAPSI). Pilih cakupan materi, lalu kerjakan seperti simulasi ujian: jawaban dan pembahasan baru muncul setelah kamu menyelesaikan seluruh soal.</p>
    <div class="cats">${chips}</div>
    <div class="startcard">
      <h2>Siap memulai?</h2>
      <p>${catCount(state.activeCat)} soal &middot; kategori: <b>${state.activeCat==="all"?"Semua Soal":fmtCat(state.activeCat)}</b></p>
      <div class="row">
        <button class="btn btn-primary" id="startBtn">Mulai Simulasi</button>
        <button class="btn btn-ghost" id="goMateriBtn">Baca Materi Dulu</button>
      </div>
    </div>
    ${histHtml}
  `;
}

function attachStartEvents(){
  document.querySelectorAll(".chip").forEach(c=>{
    c.addEventListener("click", ()=>{ state.activeCat = c.dataset.cat; render(); });
  });
  const sb = document.getElementById("startBtn");
  if(sb) sb.addEventListener("click", startQuiz);
  const gm = document.getElementById("goMateriBtn");
  if(gm) gm.addEventListener("click", ()=>{ state.tab="materi"; render(); });
}

function renderBeads(){
  const beads = state.order.map((qi,i)=>{
    let cls = "bead";
    if(i===state.idx) cls += " current";
    if(state.flags[qi]) cls += " flagged";
    else if(state.answers[qi]!==undefined) cls += " done";
    return `<span class="${cls}" title="Soal ${i+1}"></span>`;
  }).join("");
  return `<div class="beads-wrap"><div class="beads">${beads}</div></div>`;
}

function renderQuiz(){
  const q = currentQ();
  const qi = state.order[state.idx];
  const answered = state.answers[qi];
  const opts = q.opts.map((o,oi)=>{
    const isArabicOpt = /[؀-ۿ]/.test(o);
    return `<button class="opt ${answered===oi?'selected':''}" data-oi="${oi}">
      <span class="opt-mark">${String.fromCharCode(65+oi)}</span>
      <span class="${isArabicOpt?'arabic':''}">${o}</span>
    </button>`;
  }).join("");

  const isLast = state.idx === state.order.length-1;
  const answeredCount = Object.keys(state.answers).length;

  return `
    ${renderBeads()}
    <div class="progressline"><span>Soal <b>${state.idx+1}</b> / ${state.order.length}</span><span>Terjawab: <b>${answeredCount}</b></span></div>
    <div class="qcard">
      <span class="qcat">${fmtCat(q.cat)}</span>
      <p class="qtext">${renderQText(q.q)}</p>
      <div class="opts">${opts}</div>
      <div class="qfooter">
        <button class="flagbtn ${state.flags[qi]?'on':''}" id="flagBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 3v18M6 4h11l-3 4 3 4H6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
          ${state.flags[qi] ? "Ditandai ragu" : "Tandai ragu-ragu"}
        </button>
        <div class="navbtns">
          <button class="btn btn-ghost" id="prevBtn" ${state.idx===0?"disabled":""}>&larr; Sebelumnya</button>
          ${isLast
            ? `<button class="btn btn-gold" id="finishBtn">Selesai &amp; Lihat Hasil</button>`
            : `<button class="btn btn-primary" id="nextBtn">Selanjutnya &rarr;</button>`}
        </div>
      </div>
    </div>
  `;
}

function renderQText(t){
  // wrap standalone arabic lines in .arabic span, keep line breaks
  return t.split("\n").map(line=>{
    const isArabicLine = /[؀-ۿ]/.test(line) && line.replace(/[؀-ۿ\s]/g,"").length < line.length*0.4;
    return isArabicLine ? `<span class="arabic">${line}</span>` : line;
  }).join("\n");
}

function attachQuizEvents(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", ()=> selectOption(parseInt(b.dataset.oi,10)));
  });
  const fb = document.getElementById("flagBtn");
  if(fb) fb.addEventListener("click", toggleFlag);
  const pb = document.getElementById("prevBtn");
  if(pb) pb.addEventListener("click", ()=>goto(-1));
  const nb = document.getElementById("nextBtn");
  if(nb) nb.addEventListener("click", ()=>goto(1));
  const fin = document.getElementById("finishBtn");
  if(fin) fin.addEventListener("click", finishQuiz);
}

function scoreWheel(pct){
  const r = 46, c = 2*Math.PI*r;
  const off = c * (1-pct/100);
  return `<svg class="wheel" width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--parchment-3)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--teal)" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-family="Amiri, serif" font-size="26" font-weight="700" fill="var(--ink)">${pct}%</text>
  </svg>`;
}

function renderResult(){
  const graded = state.order.filter(i=>QUESTIONS[i].correct!==null);
  const ungraded = state.order.filter(i=>QUESTIONS[i].correct===null);
  let correctCount = 0;
  graded.forEach(i=>{ if(state.answers[i]===QUESTIONS[i].correct) correctCount++; });
  const pct = graded.length? Math.round(100*correctCount/graded.length) : 0;

  const byCat = {};
  state.order.forEach(i=>{
    const q = QUESTIONS[i];
    if(q.correct===null) return;
    byCat[q.cat] = byCat[q.cat] || {correct:0,total:0};
    byCat[q.cat].total++;
    if(state.answers[i]===q.correct) byCat[q.cat].correct++;
  });
  const catRows = Object.keys(byCat).map(c=>{
    const d = byCat[c];
    const p = Math.round(100*d.correct/d.total);
    return `<div class="catbar-row">
      <div class="catbar-label"><span>${fmtCat(c)}</span><b>${d.correct}/${d.total}</b></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  const filterChips = ["all","wrong","correct","flagged"].map(f=>{
    const labels = {all:"Semua",wrong:"Salah",correct:"Benar",flagged:"Ditandai ragu"};
    return `<button class="chip ${state.reviewFilter===f?'active':''}" data-rf="${f}">${labels[f]}</button>`;
  }).join("");

  const items = state.order.map((qi,i)=>{
    const q = QUESTIONS[qi];
    const ua = state.answers[qi];
    const ungr = q.correct===null;
    const isCorrect = !ungr && ua===q.correct;
    if(state.reviewFilter==="wrong" && (isCorrect||ungr)) return "";
    if(state.reviewFilter==="correct" && !isCorrect) return "";
    if(state.reviewFilter==="flagged" && !state.flags[qi]) return "";

    const badgeCls = ungr ? "skip" : (isCorrect ? "correct" : "wrong");
    const badgeTxt = ungr ? "?" : (isCorrect ? "&#10003;" : "&#10007;");
    const open = state.reviewOpen[qi] ? "open" : "";

    const optsHtml = q.opts.map((o,oi)=>{
      let cls = "opt";
      if(!ungr && oi===q.correct) cls += " correct";
      if(!ungr && ua===oi && ua!==q.correct) cls += " userwrong";
      const isArabicOpt = /[؀-ۿ]/.test(o);
      const mark = ua===oi ? " (jawabanmu)" : (!ungr && oi===q.correct ? " (kunci)" : "");
      return `<div class="${cls}"><span class="opt-mark">${String.fromCharCode(65+oi)}</span><span class="${isArabicOpt?'arabic':''}">${o}${mark}</span></div>`;
    }).join("");

    return `<div class="rev-item ${open}" data-qi="${qi}">
      <div class="rev-head" data-toggle="${qi}">
        <span class="rev-badge ${badgeCls}">${badgeTxt}</span>
        <span class="rev-num">#${i+1}</span>
        <span class="rev-q">${q.q.replace(/\n/g," ").replace(/<[^>]+>/g,"").slice(0,70)}</span>
        <svg class="rev-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </div>
      <div class="rev-body">
        <p class="qtext">${renderQText(q.q)}</p>
        <div class="opts">${optsHtml}</div>
        <div class="expl"><b>Pembahasan:</b> ${q.expl}</div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="scorewrap">
      ${scoreWheel(pct)}
      <div class="score-meta">
        <h2>Hasil Simulasi</h2>
        <p><span class="score-big">${correctCount}</span> / ${graded.length} benar &middot; kategori: ${state.activeCat==="all"?"Semua Soal":fmtCat(state.activeCat)}</p>
        ${ungraded.length ? `<p class="noimg-note">${ungraded.length} soal berbasis gambar/tabel tidak disertakan dalam penilaian otomatis.</p>` : ""}
      </div>
    </div>
    <div class="catbars">
      <h3>Rincian per Kategori</h3>
      ${catRows}
    </div>
    <div class="row" style="margin-bottom:18px;">
      <button class="btn btn-primary" id="restartBtn">Ulangi / Pilih Kategori Lain</button>
      <button class="btn btn-ghost" id="materiBtn">Buka Materi</button>
    </div>
    <div class="cats">${filterChips}</div>
    <div class="review-list">${items || '<p class="lede">Tidak ada soal pada filter ini.</p>'}</div>
  `;
}

function attachResultEvents(){
  const rb = document.getElementById("restartBtn");
  if(rb) rb.addEventListener("click", restart);
  const mb = document.getElementById("materiBtn");
  if(mb) mb.addEventListener("click", ()=>{ state.tab="materi"; render(); });
  document.querySelectorAll("[data-rf]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.reviewFilter = c.dataset.rf; render(); });
  });
  document.querySelectorAll("[data-toggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const qi = h.dataset.toggle;
      state.reviewOpen[qi] = !state.reviewOpen[qi];
      render();
    });
  });
}

function renderMateri(){
  const cards = MATERI.map(m=>`<div class="mcard"><h3>${m.title}</h3><div class="tablewrap">${m.body}</div></div>`).join("");
  return `<p class="lede">Ringkasan kaidah tajwid, asmaul husna, fikih ibadah, dan sirah yang paling sering diujikan dalam simulasi MAPSI.</p><div class="materi-grid">${cards}</div>`;
}

/* ---------- tabs & theme ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{ state.tab = t.dataset.tab; render(); });
});

function applyTheme(t){
  const root = document.documentElement;
  if(t){ root.setAttribute("data-theme", t); } else { root.removeAttribute("data-theme"); }
  try{ localStorage.setItem("mihrab_theme", t||""); }catch(e){}
}
(function initTheme(){
  let saved = "";
  try{ saved = localStorage.getItem("mihrab_theme")||""; }catch(e){}
  if(saved) applyTheme(saved);
})();
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if(!cur) next = prefersDark ? "light" : "dark";
  else if(cur==="dark") next = "light";
  else next = "dark";
  applyTheme(next);
});

render();
</script>
</body>
</html>
