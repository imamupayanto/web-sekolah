  <p>Hati-hati soal jebakan pasangan nama &amp; arti yang tertukar &mdash; misalnya Al-Malik sering dikira "Maha Pengampun" (harusnya Al-Ghaffar), atau As-Sami' dikira "Maha Melihat" (harusnya Al-Bashir).</p>`},
{title:"Rukun Iman (ringkas)",body:`
  <p>Iman kepada Allah, malaikat, kitab-kitab-Nya, rasul-rasul-Nya, hari akhir, serta qada &amp; qadar.</p>
  <p><b>Malaikat</b>: setiap malaikat punya tugas mulia masing-masing, misalnya Jibril (menyampaikan wahyu) dan Mikail (mengatur rezeki &amp; hujan) &mdash; bukan berjenjang "paling mulia".</p>
  <p><b>Kitab</b>: Taurat (Musa), <b>Zabur (Daud &mdash; berisi zikir &amp; pujian/mazmur, bukan syariat/hukum)</b>, Injil (Isa), Al-Qur'an (Muhammad, penyempurna &amp; standar mushaf dijaga sejak Khalifah Utsman).</p>
  <p><b>Qada &amp; Qadar</b>: ikhtiar (usaha) manusia tetap bagian dari takdir Allah; hasil ikhtiar juga merupakan takdir-Nya.</p>
  <p>Islam tidak mengenal konsep dosa warisan: kisah Nabi Adam melanggar larangan Allah adalah kisah nyata (bukan fiksi), tetapi setiap manusia lahir suci (fitrah) dan bertanggung jawab atas perbuatannya sendiri.</p>`},
{title:"Fikih Ibadah",body:`
  <p><b>Rukun Haji</b>: ihram, wukuf di Arafah (9 Zulhijah), tawaf ifadah, sa'i, tahalul, tertib.</p>
  <p><b>8 Mustahik Zakat</b>: fakir, miskin, amil, mualaf, riqab, gharim (berutang untuk kepentingan yang dibenarkan agama), sabilillah, ibnu sabil.</p>
  <p><b>Zakat vs Infak vs Sedekah</b>: zakat wajib dengan nisab tertentu; infak &amp; sedekah sukarela tanpa batas &mdash; menyumbang harta untuk kepentingan umum (mis. renovasi masjid) termasuk infak.</p>
  <p><b>Puasa Sunnah</b>: Asyura (10 Muharram) dianjurkan disertai Tasu'a (9 Muharram) agar berbeda dari kaum Yahudi; juga ada puasa Syawal, Arafah, dan salat sunnah Duha.</p>
  <p><b>Kurban</b>: bukan sekadar menyembelih, melainkan melatih keikhlasan &amp; meningkatkan ketakwaan &mdash; yang sampai kepada Allah adalah ketakwaan, bukan daging/darahnya.</p>
  <p><b>Salat Rawatib</b>: muakkad 12 rakaat, ditambah ghairu muakkad sehingga totalnya 22 rakaat. Zikir setelah salat fardu berfungsi sebagai pelengkap &amp; penyempurna ibadah, bukan pengganti salat sunah.</p>
  <p>Musafir mendapat rukhsah (keringanan), misalnya tidak wajib salat Jumat dan cukup diganti Zuhur. Bersuci tetap wajib diusahakan semampunya (misalnya tayamum) walau sedang sakit keras. Makanan dari hewan yang tidak disembelih secara syar'i adalah haram, apalagi jika disertai kebohongan kepada pembeli.</p>`},

  <p>Basmalah (memulai dengan nama Allah) dan Hamdalah (memuji &amp; bersyukur) sering dikira sama padahal berbeda makna &amp; fungsi.</p>`},
{title:"Akhlak &amp; Adab",body:`
  <p><b>Jujur</b>: kejujuran yang utuh berarti jujur pada diri sendiri, guru, dan teman &mdash; termasuk menolak ajakan mencontek meski berisiko dijauhi.</p>
  <p><b>Toleransi</b>: menghargai perbedaan pendapat &amp; suku, tidak memaksakan agama kepada orang lain, sejalan dengan semangat "laa ikraaha fid diin".</p>
  <p><b>Disiplin</b>: menaati aturan yang benar &amp; selaras ajaran agama; aturan yang bertentangan dengan agama tidak wajib dipatuhi.</p>
  <p><b>Sabar &amp; Memaafkan</b>: menahan emosi demi menjaga persatuan, serta memaafkan kesalahan orang lain (teladan Fathu Makkah).</p>
  <p><b>Ciri Munafik</b>: berpura-pura taat di depan orang lain padahal hati &amp; perilakunya bertentangan (berkata dusta, ingkar janji, khianat amanah).</p>
  <p><b>Amanah</b>: dapat dipercaya menjaga titipan, termasuk mengelola &amp; melaporkan keuangan secara transparan.</p>
  <p><b>Birrul Walidain &amp; Empati</b>: mendahulukan bakti kepada orang tua, serta peduli dan turut merasakan kesulitan orang lain.</p>
  <p><b>Lingkungan</b>: menjaga kebersihan &amp; kelestarian alam adalah amanah dari Allah, bukan sekadar demi tampilan atau lomba.</p>`},
{title:"Sirah Nabawiyah, Kisah Para Nabi &amp; Khulafaur Rasyidin",body:`
  <p>Dakwah periode Makkah dilakukan bertahap: sembunyi-sembunyi (3 tahun) lalu terang-terangan. Hijrah ke Madinah membangun fondasi masyarakat Islam, ditandai pembangunan masjid &amp; persaudaraan Muhajirin-Ansar. Fathu Makkah dan Haji Wada menegaskan akhlak mulia (memaafkan musuh) dan pesan persamaan derajat, larangan riba, serta berpegang pada Al-Qur'an &amp; Sunnah.</p>
  <p>Julukan <b>Al-Amin</b> diberikan kepada Nabi Muhammad Saw. karena kejujuran &amp; amanahnya sejak sebelum diangkat menjadi rasul.</p>
  <p><b>Nabi Adam a.s.</b>: manusia pertama; kisahnya nyata, bukan fiksi, dan tidak mewariskan dosa kepada keturunannya. <b>Nabi Nuh a.s.</b>: berdakwah 950 tahun tanpa putus asa; banjir besar adalah hukuman bagi kaum yang durhaka. <b>Nabi Ibrahim a.s.</b>: menghancurkan berhala (menyisakan yang terbesar untuk menguji kecerdikan kaumnya) demi menegakkan tauhid. <b>Nabi Musa a.s.</b>: hijrah dari Mesir ke Madyan mengajarkan bahwa hijrah membuka jalan kebaikan &amp; pertolongan Allah.</p>
  <p>Salah satu kebiasaan buruk masyarakat Arab jahiliah adalah mengubur hidup-hidup bayi perempuan karena dianggap aib.</p>
  <p><b>Abu Bakar</b>: memerangi nabi palsu &amp; pembangkang zakat. <b>Umar bin Khattab</b>: ekspansi wilayah &amp; penataan administrasi negara (diwan, Baitul Mal). <b>Utsman bin Affan</b>: standardisasi mushaf Al-Qur'an demi menjaga kemurnian bacaan. <b>Ali bin Abi Thalib</b>: dikenal karena keadilan dan keluasan ilmunya.</p>`}
];
</script>
<script>
/* =========================================================
   STATE & LOGIC
========================================================= */
const VERSIONS = [
  {key:"acak", label:"Acak (Latihan)", desc:"Urutan soal &amp; posisi jawaban diacak ulang setiap kali mulai &mdash; cocok untuk latihan mandiri."},
  {key:"a", label:"Paket A", desc:"Urutan soal &amp; posisi jawaban tetap (tidak berubah setiap dibuka) &mdash; cocok untuk ujian tatap muka."},
  {key:"b", label:"Paket B", desc:"Susunan berbeda dari Paket A, juga tetap &mdash; berikan ke sebagian siswa agar posisi duduk berdekatan tidak dapat saling mencontek."},
  {key:"c", label:"Paket C (Level Lanjutan)", desc:"Soal HOTS (Higher Order Thinking Skills) &mdash; level di atas Paket A &amp; B: analisis, perbandingan dalil, dan sintesis, bukan sekadar hafalan."},
  {key:"bank", label:"Latihan Fleksibel (Bank Soal)", desc:"Bank soal baru berisi 120 soal (20 per kategori) &mdash; pilih sendiri jumlah soal 10&ndash;50 lewat slider, diacak setiap kali mulai."}
];

// which question bank a version draws from
function pool(version){
  if(version==="c") return HOTS_QUESTIONS;
  if(version==="bank") return BANK_QUESTIONS;
  return QUESTIONS;
}

const state = {
  tab: "home",
  screen: "start", // start | quiz | result
  activeCat: "all",
  activeVersion: "acak",
  activePool: QUESTIONS,
  bankCount: 20,
  order: [],
  idx: 0,
  answers: {},
  flags: {},
  optionOrder: {},
  reviewOpen: {},
  reviewFilter: "all",
  // -- Khusus Tajwid: segmen mandiri, state terpisah dari simulasi utama --
  tjView: "materi", // materi | latihan
  tjScreen: "setup", // setup | quiz | result
  tjLv: 1,
  tjNum: 10,
  tjQuiz: [],
  tjIdx: 0,
  tjReviewOpen: {},
  tjReviewFilter: "all"
};

// keep the "jumlah soal" slider within [10, jumlah tersedia di kategori terpilih] (maks 50)
function clampBankCount(){
  const max = Math.min(50, catCount(state.activeCat, "bank"));
  const min = Math.min(10, max);
  state.bankCount = Math.max(min, Math.min(state.bankCount, max));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// deterministic PRNG (mulberry32) so "Paket A/B" always render the same order
function mulberry32(seed){
  let t = seed >>> 0;
  return function(){
    t |= 0; t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtVersion(v){
  const found = VERSIONS.find(x=>x.key===v);
  return found ? found.label : v;
}

function loadHistory(){
  try{
    return JSON.parse(localStorage.getItem("mihrab_history")||"[]");
  }catch(e){ return []; }
}
function saveHistoryEntry(entry){
  try{
    const h = loadHistory();
    h.unshift(entry);
    localStorage.setItem("mihrab_history", JSON.stringify(h.slice(0,8)));
  }catch(e){ /* ignore */ }
}

function catCount(cat, version){
  const p = pool(version || state.activeVersion);
  if(cat==="all") return p.length;
  return p.filter(q=>q.cat===cat).length;
}

function buildOrder(cat, version){
  const p = pool(version);
  const idxs = p.map((q,i)=>i).filter(i=> cat==="all" || p[i].cat===cat);
  if(version==="bank"){
    const shuffled = shuffle(idxs);
    const n = Math.min(state.bankCount, shuffled.length);
    return shuffled.slice(0, n);
  }
  if(version==="acak") return shuffle(idxs);
  return seededShuffle(idxs, hashStr("order|"+version+"|"+cat));
}

function startQuiz(){
  const v = state.activeVersion;
  if(v==="bank") clampBankCount();
  state.activePool = pool(v);
  state.order = buildOrder(state.activeCat, v);
  state.idx = 0;
  state.answers = {};
  state.flags = {};
  state.optionOrder = {};
  state.order.forEach(qi=>{
    const n = state.activePool[qi].opts.length;
    const base = Array.from({length:n},(_,k)=>k);
    state.optionOrder[qi] = (v==="acak"||v==="bank") ? shuffle(base) : seededShuffle(base, hashStr("opt|"+v+"|"+qi));
  });
  state.screen = "quiz";
  render();
}

function currentQ(){
  return state.activePool[state.order[state.idx]];
}

// displayPos -> original option index for a given question index
function origIdx(qi, displayPos){
  const ord = state.optionOrder[qi];
  return ord ? ord[displayPos] : displayPos;
}

function selectOption(displayPos){
  const qi = state.order[state.idx];
  state.answers[qi] = origIdx(qi, displayPos);
  render();
}

function toggleFlag(){
  const qi = state.order[state.idx];
  state.flags[qi] = !state.flags[qi];
  render();
}

function goto(delta){
  state.idx = Math.min(Math.max(0, state.idx+delta), state.order.length-1);
  render();
}

function finishQuiz(){
  state.screen = "result";
  const graded = state.order.filter(i=>state.activePool[i].correct!==null);
  let correctCount = 0;
  graded.forEach(i=>{ if(state.answers[i]===state.activePool[i].correct) correctCount++; });
  const pct = graded.length? Math.round(100*correctCount/graded.length) : 0;
  saveHistoryEntry({
    date: new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}),
    cat: state.activeCat==="all" ? "Semua Kategori" : CATS[state.activeCat],
    version: fmtVersion(state.activeVersion),
    score: correctCount, total: graded.length, pct: pct
  });
  render();
}

function restart(){
  state.screen = "start";
  render();
}

function fmtCat(c){ return CATS[c] || c; }

/* ---------- rendering ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===state.tab));
  const main = document.getElementById("main");
  if(state.tab==="materi"){ main.innerHTML = renderMateri(); return; }
  if(state.tab==="tajwid"){ renderTajwid(main); return; }
  if(state.screen==="start"){ main.innerHTML = renderStart(); attachStartEvents(); return; }
  if(state.screen==="quiz"){ main.innerHTML = renderQuiz(); attachQuizEvents(); return; }
  if(state.screen==="result"){ main.innerHTML = renderResult(); attachResultEvents(); }
}

function renderStart(){
  const hist = loadHistory();
  const chips = ["all",...Object.keys(CATS)].map(c=>{
    const label = c==="all" ? "Semua Soal" : fmtCat(c);
    const n = catCount(c, state.activeVersion);
    if(n===0) return "";
    return `<button class="chip ${state.activeCat===c?'active':''}" data-cat="${c}">${label} <span class="n">(${n})</span></button>`;
  }).join("");

  const versionChips = VERSIONS.map(v=>{
    return `<button class="chip ${state.activeVersion===v.key?'active':''}" data-version="${v.key}">${v.label}</button>`;
  }).join("");
  const activeVersion = VERSIONS.find(v=>v.key===state.activeVersion);
  const isBank = state.activeVersion==="bank";

  const histHtml = hist.length ? `
    <div class="startcard history">
      <h3>Riwayat Simulasi Terakhir</h3>
      ${hist.map(h=>`<div class="hist-item"><span>${h.date} &middot; ${h.cat}${h.version?` &middot; ${h.version}`:""}</span><span class="hist-score">${h.score}/${h.total} &middot; ${h.pct}%</span></div>`).join("")}
    </div>` : "";

  let bankMax = 50, bankMin = 10;
  if(isBank){
    clampBankCount();
    bankMax = Math.min(50, catCount(state.activeCat, "bank"));
    bankMin = Math.min(10, bankMax);
  }

  const sliderHtml = isBank ? `
    <div class="bankslider">
      <label for="bankCountRange">Jumlah Soal: <b id="bankCountVal">${state.bankCount}</b> soal</label>
      <input type="range" id="bankCountRange" min="${bankMin}" max="${bankMax}" step="1" value="${state.bankCount}">
      <div class="bankslider-minmax"><span>${bankMin}</span><span>${bankMax}</span></div>
    </div>` : "";

  const displayCount = isBank ? state.bankCount : catCount(state.activeCat);

  return `
    <p class="lede">Latihan soal simulasi lomba Mata Pelajaran PAI &amp; BTQ (MAPSI). Pilih cakupan materi &amp; versi soal, lalu kerjakan seperti simulasi ujian: jawaban dan pembahasan baru muncul setelah kamu menyelesaikan seluruh soal.</p>
    <p class="section-label">Cakupan Materi</p>
    <div class="cats">${chips}</div>
    <p class="section-label">Versi Soal</p>
    <div class="cats">${versionChips}</div>
    <p class="version-desc">${activeVersion ? activeVersion.desc : ""}</p>
    ${sliderHtml}
    <div class="startcard">
      <h2>Siap memulai?</h2>
      <p><span id="startSoalCount">${displayCount}</span> soal &middot; kategori: <b>${state.activeCat==="all"?"Semua Soal":fmtCat(state.activeCat)}</b> &middot; versi: <b>${fmtVersion(state.activeVersion)}</b></p>
      <div class="row">
        <button class="btn btn-primary" id="startBtn">Mulai Simulasi</button>
        <button class="btn btn-ghost" id="goMateriBtn">Baca Materi Dulu</button>
      </div>
    </div>
    ${histHtml}
  `;
}

function attachStartEvents(){
  document.querySelectorAll(".chip[data-cat]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.activeCat = c.dataset.cat; render(); });
  });
  document.querySelectorAll(".chip[data-version]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.activeVersion = c.dataset.version; render(); });
  });
  const bankRange = document.getElementById("bankCountRange");
  if(bankRange){
    bankRange.addEventListener("input", ()=>{
      state.bankCount = parseInt(bankRange.value, 10);
      const label = document.getElementById("bankCountVal");
      if(label) label.textContent = state.bankCount;
      const startCountEl = document.getElementById("startSoalCount");
      if(startCountEl) startCountEl.textContent = state.bankCount;
    });
  }
  const sb = document.getElementById("startBtn");
  if(sb) sb.addEventListener("click", startQuiz);
  const gm = document.getElementById("goMateriBtn");
  if(gm) gm.addEventListener("click", ()=>{ state.tab="materi"; render(); });
}

function renderBeads(){
  const beads = state.order.map((qi,i)=>{
    let cls = "bead";
    if(i===state.idx) cls += " current";
    if(state.flags[qi]) cls += " flagged";
    else if(state.answers[qi]!==undefined) cls += " done";
    return `<span class="${cls}" title="Soal ${i+1}"></span>`;
  }).join("");
  return `<div class="beads-wrap"><div class="beads">${beads}</div></div>`;
}

function renderQuiz(){
  const q = currentQ();
  const qi = state.order[state.idx];
  const answered = state.answers[qi];
  const order = state.optionOrder[qi] || q.opts.map((_,k)=>k);
  const opts = order.map((oi,displayPos)=>{
    const o = q.opts[oi];
    const isArabicOpt = /[؀-ۿ]/.test(o);
    return `<button class="opt ${answered===oi?'selected':''}" data-oi="${displayPos}">
      <span class="opt-mark">${String.fromCharCode(65+displayPos)}</span>
      <span class="${isArabicOpt?'arabic':''}">${o}</span>
    </button>`;
  }).join("");

  const isLast = state.idx === state.order.length-1;
  const answeredCount = Object.keys(state.answers).length;

  return `
    ${renderBeads()}
    <div class="progressline"><span>Soal <b>${state.idx+1}</b> / ${state.order.length} &middot; ${fmtVersion(state.activeVersion)}</span><span>Terjawab: <b>${answeredCount}</b></span></div>
    <div class="qcard">
      <span class="qcat">${fmtCat(q.cat)}</span>
      <p class="qtext">${renderQText(q.q)}</p>
      <div class="opts">${opts}</div>
      <div class="qfooter">
        <button class="flagbtn ${state.flags[qi]?'on':''}" id="flagBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 3v18M6 4h11l-3 4 3 4H6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
          ${state.flags[qi] ? "Ditandai ragu" : "Tandai ragu-ragu"}
        </button>
        <div class="navbtns">
          <button class="btn btn-ghost" id="prevBtn" ${state.idx===0?"disabled":""}>&larr; Sebelumnya</button>
          ${isLast
            ? `<button class="btn btn-gold" id="finishBtn">Selesai &amp; Lihat Hasil</button>`
            : `<button class="btn btn-primary" id="nextBtn">Selanjutnya &rarr;</button>`}
        </div>
      </div>
    </div>
  `;
}

function renderQText(t){
  // wrap standalone arabic lines in .arabic span, keep line breaks
  return t.split("\n").map(line=>{
    const isArabicLine = /[؀-ۿ]/.test(line) && line.replace(/[؀-ۿ\s]/g,"").length < line.length*0.4;
    return isArabicLine ? `<span class="arabic">${line}</span>` : line;
  }).join("\n");
}

function attachQuizEvents(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", ()=> selectOption(parseInt(b.dataset.oi,10)));
  });
  const fb = document.getElementById("flagBtn");
  if(fb) fb.addEventListener("click", toggleFlag);
  const pb = document.getElementById("prevBtn");
  if(pb) pb.addEventListener("click", ()=>goto(-1));
  const nb = document.getElementById("nextBtn");
  if(nb) nb.addEventListener("click", ()=>goto(1));
  const fin = document.getElementById("finishBtn");
  if(fin) fin.addEventListener("click", finishQuiz);
}

function scoreWheel(pct){
  const r = 46, c = 2*Math.PI*r;
  const off = c * (1-pct/100);
  return `<svg class="wheel" width="120" height="120" viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--parchment-3)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--teal)" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 60 60)"/>
    <text x="60" y="66" text-anchor="middle" font-family="Amiri, serif" font-size="26" font-weight="700" fill="var(--ink)">${pct}%</text>
  </svg>`;
}

function renderResult(){
  const graded = state.order.filter(i=>state.activePool[i].correct!==null);
  const ungraded = state.order.filter(i=>state.activePool[i].correct===null);
  let correctCount = 0;
  graded.forEach(i=>{ if(state.answers[i]===state.activePool[i].correct) correctCount++; });
  const pct = graded.length? Math.round(100*correctCount/graded.length) : 0;

  const byCat = {};
  state.order.forEach(i=>{
    const q = state.activePool[i];
    if(q.correct===null) return;
    byCat[q.cat] = byCat[q.cat] || {correct:0,total:0};
    byCat[q.cat].total++;
    if(state.answers[i]===q.correct) byCat[q.cat].correct++;
  });
  const catRows = Object.keys(byCat).map(c=>{
    const d = byCat[c];
    const p = Math.round(100*d.correct/d.total);
    return `<div class="catbar-row">
      <div class="catbar-label"><span>${fmtCat(c)}</span><b>${d.correct}/${d.total}</b></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  const filterChips = ["all","wrong","correct","flagged"].map(f=>{
    const labels = {all:"Semua",wrong:"Salah",correct:"Benar",flagged:"Ditandai ragu"};
    return `<button class="chip ${state.reviewFilter===f?'active':''}" data-rf="${f}">${labels[f]}</button>`;
  }).join("");

  const items = state.order.map((qi,i)=>{
    const q = state.activePool[qi];
    const ua = state.answers[qi];
    const ungr = q.correct===null;
    const isCorrect = !ungr && ua===q.correct;
    if(state.reviewFilter==="wrong" && (isCorrect||ungr)) return "";
    if(state.reviewFilter==="correct" && !isCorrect) return "";
    if(state.reviewFilter==="flagged" && !state.flags[qi]) return "";

    const badgeCls = ungr ? "skip" : (isCorrect ? "correct" : "wrong");
    const badgeTxt = ungr ? "?" : (isCorrect ? "&#10003;" : "&#10007;");
    const open = state.reviewOpen[qi] ? "open" : "";

    const revOrder = state.optionOrder[qi] || q.opts.map((_,k)=>k);
    const optsHtml = revOrder.map((oi,displayPos)=>{
      const o = q.opts[oi];
      let cls = "opt";
      if(!ungr && oi===q.correct) cls += " correct";
      if(!ungr && ua===oi && ua!==q.correct) cls += " userwrong";
      const isArabicOpt = /[؀-ۿ]/.test(o);
      const mark = ua===oi ? " (jawabanmu)" : (!ungr && oi===q.correct ? " (kunci)" : "");
      return `<div class="${cls}"><span class="opt-mark">${String.fromCharCode(65+displayPos)}</span><span class="${isArabicOpt?'arabic':''}">${o}${mark}</span></div>`;
    }).join("");

    return `<div class="rev-item ${open}" data-qi="${qi}">
      <div class="rev-head" data-toggle="${qi}">
        <span class="rev-badge ${badgeCls}">${badgeTxt}</span>
        <span class="rev-num">#${i+1}</span>
        <span class="rev-q">${q.q.replace(/\n/g," ").replace(/<[^>]+>/g,"").slice(0,70)}</span>
        <svg class="rev-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </div>
      <div class="rev-body">
        <p class="qtext">${renderQText(q.q)}</p>
        <div class="opts">${optsHtml}</div>
        <div class="expl"><b>Pembahasan:</b> ${q.expl}</div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="scorewrap">
      ${scoreWheel(pct)}
      <div class="score-meta">
        <h2>Hasil Simulasi</h2>
        <p><span class="score-big">${correctCount}</span> / ${graded.length} benar &middot; kategori: ${state.activeCat==="all"?"Semua Soal":fmtCat(state.activeCat)} &middot; versi: ${fmtVersion(state.activeVersion)}</p>
        ${ungraded.length ? `<p class="noimg-note">${ungraded.length} soal berbasis gambar/tabel tidak disertakan dalam penilaian otomatis.</p>` : ""}
      </div>
    </div>
    <div class="catbars">
      <h3>Rincian per Kategori</h3>
      ${catRows}
    </div>
    <div class="row" style="margin-bottom:18px;">
      <button class="btn btn-primary" id="restartBtn">Ulangi / Pilih Kategori Lain</button>
      <button class="btn btn-ghost" id="materiBtn">Buka Materi</button>
    </div>
    <div class="cats">${filterChips}</div>
    <div class="review-list">${items || '<p class="lede">Tidak ada soal pada filter ini.</p>'}</div>
  `;
}

function attachResultEvents(){
  const rb = document.getElementById("restartBtn");
  if(rb) rb.addEventListener("click", restart);
  const mb = document.getElementById("materiBtn");
  if(mb) mb.addEventListener("click", ()=>{ state.tab="materi"; render(); });
  document.querySelectorAll("[data-rf]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.reviewFilter = c.dataset.rf; render(); });
  });
  document.querySelectorAll("[data-toggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const qi = h.dataset.toggle;
      state.reviewOpen[qi] = !state.reviewOpen[qi];
      render();
    });
  });
}

function renderMateri(){
  const cards = MATERI.map(m=>`<div class="mcard"><h3>${m.title}</h3><div class="tablewrap">${m.body}</div></div>`).join("");
  return `<p class="lede">Ringkasan kaidah tajwid, asmaul husna, fikih ibadah, dan sirah yang paling sering diujikan dalam simulasi MAPSI.</p><div class="materi-grid">${cards}</div>`;
}

/* =========================================================
   KHUSUS TAJWID — render & logic (segmen mandiri)
========================================================= */
function tjCount(lv){
  return lv===0 ? TAJWID_BANK.length : TAJWID_BANK.filter(q=>q.l===lv).length;
}
function tjFmtTopic(t){ return TAJWID_TOPIC[t] || t; }

function renderTajwid(main){
  const subnav = `
    <div class="tj-subnav">
      <button class="tab ${state.tjView==='materi'?'active':''}" id="tjSubMateri">Materi Tajwid</button>
      <button class="tab ${state.tjView==='latihan'?'active':''}" id="tjSubLatihan">Latihan Soal</button>
    </div>`;
  let body;
  if(state.tjView==="materi"){
    body = renderTajwidMateri();
  } else if(state.tjScreen==="setup"){
    body = renderTajwidSetup();
  } else if(state.tjScreen==="quiz"){
    body = renderTajwidQuiz();
  } else {
    body = renderTajwidResult();
  }
  main.innerHTML = subnav + body;

  document.getElementById("tjSubMateri").addEventListener("click", ()=>{ state.tjView="materi"; render(); });
  document.getElementById("tjSubLatihan").addEventListener("click", ()=>{ state.tjView="latihan"; render(); });

  if(state.tjView==="materi") return;
  if(state.tjScreen==="setup") attachTajwidSetupEvents();
  else if(state.tjScreen==="quiz") attachTajwidQuizEvents();
  else attachTajwidResultEvents();
}

function renderTajwidMateri(){
  const cards = TAJWID_MATERI.map(m=>`<div class="mcard"><h3>${m.title}</h3><div class="tablewrap">${m.body}</div></div>`).join("");
  return `<p class="lede">Segmen khusus pendalaman ilmu tajwid SD Negeri 2 Pesantren: 7 bab materi dan 100 soal latihan tersendiri, dari dasar tajwid hingga tanda waqaf.</p><div class="materi-grid">${cards}</div>`;
}

function renderTajwidSetup(){
  const levels = [{key:1,label:"Mudah"},{key:2,label:"Sedang"},{key:3,label:"Sulit"},{key:0,label:"Campur"}];
  const lvChips = levels.map(lv=>`<button class="chip ${state.tjLv===lv.key?'active':''}" data-tjlv="${lv.key}">${lv.label} <span class="n">(${tjCount(lv.key)})</span></button>`).join("");

  const max = tjCount(state.tjLv);
  let numOpts = [5,10,20,50].filter(n=>n<max);
  numOpts.push(max);
  if(!numOpts.includes(state.tjNum)) state.tjNum = numOpts.includes(10) ? 10 : numOpts[0];
  const numChips = numOpts.map(n=>`<button class="chip ${state.tjNum===n?'active':''}" data-tjnum="${n}">${n===max?'Semua':n+' soal'} ${n===max?`<span class="n">(${n})</span>`:''}</button>`).join("");

  const topicRows = Object.keys(TAJWID_TOPIC).map(k=>{
    const c1=TAJWID_BANK.filter(q=>q.t===k&&q.l===1).length;
    const c2=TAJWID_BANK.filter(q=>q.t===k&&q.l===2).length;
    const c3=TAJWID_BANK.filter(q=>q.t===k&&q.l===3).length;
    return `<tr><td>${tjFmtTopic(k)}</td><td>${c1}</td><td>${c2}</td><td>${c3}</td><td><b>${c1+c2+c3}</b></td></tr>`;
  }).join("");

  return `
    <p class="lede">Latihan khusus hukum bacaan tajwid: ${TAJWID_BANK.length} soal mencakup 7 bab. Pilih tingkat kesulitan dan jumlah soal, lalu kerjakan seperti biasa &mdash; skor dan pembahasan muncul di akhir latihan.</p>
    <p class="section-label">Tingkat Kesulitan</p>
    <div class="cats">${lvChips}</div>
    <p class="section-label">Jumlah Soal</p>
    <div class="cats">${numChips}</div>
    <div class="startcard">
      <h2>Siap latihan tajwid?</h2>
      <p>${state.tjNum} soal &middot; tingkat: <b>${TJ_LVNAME[state.tjLv]}</b></p>
      <div class="row">
        <button class="btn btn-primary" id="tjStartBtn">Mulai Latihan</button>
        <button class="btn btn-ghost" id="tjMateriBtn">Baca Materi Tajwid</button>
      </div>
    </div>
    <div class="mcard" style="margin-top:22px">
      <h3>Isi Bank Soal Tajwid</h3>
      <div class="tablewrap"><table><thead><tr><th>Bab</th><th>Mudah</th><th>Sedang</th><th>Sulit</th><th>Total</th></tr></thead><tbody>${topicRows}</tbody></table></div>
    </div>
  `;
}

function attachTajwidSetupEvents(){
  document.querySelectorAll("[data-tjlv]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.tjLv = parseInt(c.dataset.tjlv,10); render(); });
  });
  document.querySelectorAll("[data-tjnum]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.tjNum = parseInt(c.dataset.tjnum,10); render(); });
  });
  const sb = document.getElementById("tjStartBtn");
  if(sb) sb.addEventListener("click", tjStartQuiz);
  const mb = document.getElementById("tjMateriBtn");
  if(mb) mb.addEventListener("click", ()=>{ state.tjView="materi"; render(); });
}

function tjStartQuiz(){
  const pool = state.tjLv===0 ? TAJWID_BANK.slice() : TAJWID_BANK.filter(q=>q.l===state.tjLv);
  const picked = shuffle(pool.slice()).slice(0, Math.min(state.tjNum, pool.length));
  state.tjQuiz = picked.map(q=>{
    const optIdx = shuffle(q.o.map((_,i)=>i));
    return {q, optIdx, pick:null, flagged:false};
  });
  state.tjIdx = 0;
  state.tjReviewOpen = {};
  state.tjReviewFilter = "all";
  state.tjScreen = "quiz";
  render();
}

function tjCurrent(){ return state.tjQuiz[state.tjIdx]; }

function tjSelect(displayPos){
  const it = tjCurrent();
  it.pick = it.optIdx[displayPos];
  render();
}

function tjGoto(delta){
  state.tjIdx = Math.min(Math.max(0, state.tjIdx+delta), state.tjQuiz.length-1);
  render();
}

function renderTajwidBeads(){
  const beads = state.tjQuiz.map((it,i)=>{
    let cls = "bead";
    if(i===state.tjIdx) cls += " current";
    if(it.pick!==null) cls += " done";
    return `<span class="${cls}" title="Soal ${i+1}"></span>`;
  }).join("");
  return `<div class="beads-wrap"><div class="beads">${beads}</div></div>`;
}

function renderTajwidQuiz(){
  const it = tjCurrent();
  const q = it.q;
  const opts = it.optIdx.map((oi,displayPos)=>{
    const o = q.o[oi];
    const isArabicOpt = /[؀-ۿ]/.test(o);
    return `<button class="opt ${it.pick===oi?'selected':''}" data-oi="${displayPos}">
      <span class="opt-mark">${String.fromCharCode(65+displayPos)}</span>
      <span class="${isArabicOpt?'arabic':''}">${o}</span>
    </button>`;
  }).join("");
  const isLast = state.tjIdx === state.tjQuiz.length-1;
  const answeredCount = state.tjQuiz.filter(x=>x.pick!==null).length;
  const qFull = q.q + (q.ar ? "\n"+q.ar : "");

  return `
    ${renderTajwidBeads()}
    <div class="progressline"><span>Soal <b>${state.tjIdx+1}</b> / ${state.tjQuiz.length} &middot; ${TJ_LVNAME[q.l]}</span><span>Terjawab: <b>${answeredCount}</b></span></div>
    <div class="qcard">
      <span class="qcat">${tjFmtTopic(q.t)}</span>
      <p class="qtext">${renderQText(qFull)}</p>
      <div class="opts">${opts}</div>
      <div class="qfooter" style="justify-content:flex-end">
        <div class="navbtns">
          <button class="btn btn-ghost" id="tjPrevBtn" ${state.tjIdx===0?"disabled":""}>&larr; Sebelumnya</button>
          ${isLast
            ? `<button class="btn btn-gold" id="tjFinishBtn">Selesai &amp; Lihat Hasil</button>`
            : `<button class="btn btn-primary" id="tjNextBtn">Selanjutnya &rarr;</button>`}
        </div>
      </div>
    </div>
  `;
}

function attachTajwidQuizEvents(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click", ()=> tjSelect(parseInt(b.dataset.oi,10)));
  });
  const pb = document.getElementById("tjPrevBtn");
  if(pb) pb.addEventListener("click", ()=>tjGoto(-1));
  const nb = document.getElementById("tjNextBtn");
  if(nb) nb.addEventListener("click", ()=>tjGoto(1));
  const fin = document.getElementById("tjFinishBtn");
  if(fin) fin.addEventListener("click", ()=>{ state.tjScreen="result"; render(); });
}

function renderTajwidResult(){
  const total = state.tjQuiz.length;
  let correctCount = 0;
  state.tjQuiz.forEach(it=>{ if(it.pick===it.q.a) correctCount++; });
  const pct = total ? Math.round(100*correctCount/total) : 0;

  const byTopic = {};
  state.tjQuiz.forEach(it=>{
    const t = it.q.t;
    byTopic[t] = byTopic[t] || {correct:0,total:0};
    byTopic[t].total++;
    if(it.pick===it.q.a) byTopic[t].correct++;
  });
  const topicRows = Object.keys(byTopic).map(t=>{
    const d = byTopic[t];
    const p = Math.round(100*d.correct/d.total);
    return `<div class="catbar-row">
      <div class="catbar-label"><span>${tjFmtTopic(t)}</span><b>${d.correct}/${d.total}</b></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  const filterChips = ["all","wrong","correct"].map(f=>{
    const labels = {all:"Semua",wrong:"Salah",correct:"Benar"};
    return `<button class="chip ${state.tjReviewFilter===f?'active':''}" data-tjrf="${f}">${labels[f]}</button>`;
  }).join("");

  const items = state.tjQuiz.map((it,i)=>{
    const q = it.q;
    const isCorrect = it.pick===q.a;
    if(state.tjReviewFilter==="wrong" && isCorrect) return "";
    if(state.tjReviewFilter==="correct" && !isCorrect) return "";

    const badgeCls = isCorrect ? "correct" : "wrong";
    const badgeTxt = isCorrect ? "&#10003;" : "&#10007;";
    const open = state.tjReviewOpen[i] ? "open" : "";

    const optsHtml = it.optIdx.map((oi,displayPos)=>{
      const o = q.o[oi];
      let cls = "opt";
      if(oi===q.a) cls += " correct";
      if(it.pick===oi && it.pick!==q.a) cls += " userwrong";
      const isArabicOpt = /[؀-ۿ]/.test(o);
      const mark = it.pick===oi ? " (jawabanmu)" : (oi===q.a ? " (kunci)" : "");
      return `<div class="${cls}"><span class="opt-mark">${String.fromCharCode(65+displayPos)}</span><span class="${isArabicOpt?'arabic':''}">${o}${mark}</span></div>`;
    }).join("");

    const qFull = q.q + (q.ar ? "\n"+q.ar : "");
    return `<div class="rev-item ${open}" data-tji="${i}">
      <div class="rev-head" data-tjtoggle="${i}">
        <span class="rev-badge ${badgeCls}">${badgeTxt}</span>
        <span class="rev-num">#${i+1}</span>
        <span class="rev-q">${q.q.replace(/\n/g," ").slice(0,70)}</span>
        <svg class="rev-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </div>
      <div class="rev-body">
        <p class="qtext">${renderQText(qFull)}</p>
        <div class="opts">${optsHtml}</div>
        <div class="expl"><b>Pembahasan:</b> ${q.e}</div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="scorewrap">
      ${scoreWheel(pct)}
      <div class="score-meta">
        <h2>Hasil Latihan Tajwid</h2>
        <p><span class="score-big">${correctCount}</span> / ${total} benar &middot; tingkat: ${TJ_LVNAME[state.tjLv]}</p>
      </div>
    </div>
    <div class="catbars">
      <h3>Rincian per Bab</h3>
      ${topicRows}
    </div>
    <div class="row" style="margin-bottom:18px;">
      <button class="btn btn-primary" id="tjRestartBtn">Ulangi / Pilih Tingkat Lain</button>
      <button class="btn btn-ghost" id="tjMateriBtn2">Buka Materi Tajwid</button>
    </div>
    <div class="cats">${filterChips}</div>
    <div class="review-list">${items || '<p class="lede">Tidak ada soal pada filter ini.</p>'}</div>
  `;
}

function attachTajwidResultEvents(){
  const rb = document.getElementById("tjRestartBtn");
  if(rb) rb.addEventListener("click", ()=>{ state.tjScreen="setup"; render(); });
  const mb = document.getElementById("tjMateriBtn2");
  if(mb) mb.addEventListener("click", ()=>{ state.tjView="materi"; render(); });
  document.querySelectorAll("[data-tjrf]").forEach(c=>{
    c.addEventListener("click", ()=>{ state.tjReviewFilter = c.dataset.tjrf; render(); });
  });
  document.querySelectorAll("[data-tjtoggle]").forEach(h=>{
    h.addEventListener("click", ()=>{
      const i = h.dataset.tjtoggle;
      state.tjReviewOpen[i] = !state.tjReviewOpen[i];
      render();
    });
  });
}

/* ---------- tabs & theme ---------- */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click", ()=>{ state.tab = t.dataset.tab; render(); });
});

function applyTheme(t){
  const root = document.documentElement;
  if(t){ root.setAttribute("data-theme", t); } else { root.removeAttribute("data-theme"); }
  try{ localStorage.setItem("mihrab_theme", t||""); }catch(e){}
}
(function initTheme(){
  let saved = "";
  try{ saved = localStorage.getItem("mihrab_theme")||""; }catch(e){}
  if(saved) applyTheme(saved);
})();
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if(!cur) next = prefersDark ? "light" : "dark";
  else if(cur==="dark") next = "light";
  else next = "dark";
  applyTheme(next);
});

render();
</script>
</body>
</html>
