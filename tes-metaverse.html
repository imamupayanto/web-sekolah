function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function runQuiz({ title, sub, qs, timed = false, secs = 45, hint = null }) {
  stopLoop();
  return new Promise(resolve => {
    const el = $('#s-quiz'); let i = 0, ok = 0, timer = null, opts = [], done = false, wrong = 0; const res = [];
    const stopT = () => { clearInterval(timer); timer = null; };
    const end = quit => { stopT(); try { speechSynthesis.cancel(); } catch (e) {} resolve({ ok, n: qs.length, res, quit }); };
    const startT = () => {
      stopT(); const bar = $('#qT'); if (!timed || CALM || !bar) return;
      const t0 = performance.now();
      timer = setInterval(() => { const left = 1 - (performance.now() - t0) / (secs * 1000); bar.style.width = Math.max(0, left * 100) + '%'; if (left <= 0) answer(-1); }, 100);
    };
    const answer = k => {
      if (done) return; done = true; stopT();
      const q = qs[i], good = k >= 0 && opts[k].c;
      res[i] = good; if (good) { ok++; bondAdd(1); progress('benar'); progress('benar:' + q[0]); }
      el.querySelectorAll('.qz-o').forEach((b, j) => { b.disabled = true; if (opts[j].c) b.classList.add('ok'); else if (j === k) b.classList.add('no'); });
      const fb = $('#qFb'); fb.hidden = false;
      if (!good) wrong++;
      const hk = hint && !good && wrong % 2 === 0 ? hint(q) : null;
      fb.innerHTML = `<b class="${good ? 'ok' : 'no'}">${good ? 'Benar!' : k < 0 ? 'Waktu habis' : 'Belum tepat'}</b><p>${esc(q[8])}</p>${hk ? `<div class="hoot"><img src="${monURL('hoot')}" alt=""><div><b>Prof. Hoot</b><p>Coba ingat kartu <i>${esc(hk.judul)}</i>: ${esc(hk.inti)}</p></div></div>` : ''}<button type="button" class="btn hot" id="qN">${i + 1 < qs.length ? 'Lanjut' : 'Lihat hasil'}</button>`;
      $('#qN').onclick = () => { i++; if (i < qs.length) draw(); else end(false); };
      fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    };
    const draw = () => {

        <div class="qz-dots" aria-hidden="true">${qs.map((_, k) => `<i class="${k < i ? (res[k] ? 'ok' : 'no') : k === i ? 'now' : ''}"></i>`).join('')}</div>
        ${timed ? `<div class="qz-tools"><button type="button" class="chip" id="qCalm" aria-pressed="${CALM}">Mode tenang: ${CALM ? 'aktif' : 'mati'}</button><div class="bar qz-time"${CALM ? ' hidden' : ''}><i id="qT" style="width:100%"></i></div></div>` : ''}
        <div class="qz-card"><p class="qz-q">${esc(q[2])}</p><button type="button" class="qz-say" id="qSay">Bacakan soal</button></div>
        <div class="qz-opts">${opts.map((o, k) => `<button type="button" class="qz-o" data-k="${k}"><b>${'ABCD'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
        <div class="qz-fb" id="qFb" aria-live="polite" hidden></div></div>`;
      el.scrollTop = 0;

      if (timed) $('#qCalm').onclick = () => { CALM = !CALM; try { localStorage.setItem('mga-calm', CALM ? '1' : '0'); } catch (e) {} const b = $('#qCalm'); b.textContent = `Mode tenang: ${CALM ? 'aktif' : 'mati'}`; b.setAttribute('aria-pressed', CALM); $('.qz-time').hidden = CALM; if (CALM) stopT(); else startT(); };

  await startBattle({ type: 'duel', title: `Duel melawan ${D.name}`, zone: W.zone, foe: foe.map(f => f.id), foeF: foe, meF: duelTeam(D.mine), duel: D });
  MP.duel = null; if (W) W.safe = performance.now() + 2000; hud(); show('s-world'); startLoop();
}
async function mpOnDuel(m) {
  if (!m || typeof m.id !== 'string' || m.to !== MP.id || typeof m.ts !== 'number' || typeof m.k !== 'string' || typeof m.r !== 'string' || m.r.length > 40 || typeof m.x !== 'string' || m.x.length > 700 || !S) return;
  const o = MP.ps[m.id], c = MP.vk[m.id]; if (!o || !c) return;
  if (!await mpVerify(c.key, ['d', m.id, m.to, m.k, m.r, m.x, m.ts], m.sig)) return;
  let x; try { x = JSON.parse(m.x); } catch (e) { return; }
  const [sid, tail = ''] = m.r.split('|'), D = MP.duel;
  if (m.k === 'ch') { if (Math.abs(Date.now() - m.ts) > 300000 || m.ts <= (o.ld || 0)) return; o.ld = m.ts; duelIncoming(m.id, o, sid, x); return; }
  if (!D || D.opp !== m.id || D.sid !== sid) return;
  if (m.k === 'no' && D.st === 'wait') { MP.duel = null; duelBarOff(); toast(`${o.n} sedang sibuk atau menolak`); return; }
  if (m.k === 'ac' && D.st === 'wait') {
    const foe = duelTeam(x && x.t);
    if (!foe || duelBusy2()) { mpDuelSend(m.id, 'bye', sid + '|', 0); MP.duel = null; duelBarOff(); return; }
    startDuel(D, foe); return;
  }
  if (D.st !== 'go') return;
  if (m.k === 'bye') { D.over = true; D.why = 'bye'; for (const k in D.w) { const f = D.w[k]; delete D.w[k]; f(null); } return; }
  if ((m.k === 'act' || m.k === 'sw') && tail.length < 12) { const key = m.k + ':' + tail; if (D.w[key]) { const f = D.w[key]; delete D.w[key]; f(x); } else D.q[key] = x; }
}
function duelBusy2() { return B || !$('#modal').hidden || $('#s-world').hidden || !W; }
/* ketuk pemain lain di dunia untuk menantang */
document.addEventListener('click', e => {
  const cvs = e.target && e.target.closest && e.target.closest('#wcv'); if (!cvs || !W || MP.st !== 'on' || (S && S.mpOff) || MP.duel || B) return;
  const r = cvs.getBoundingClientRect(), wx = W.ox + (e.clientX - r.left) / SC, wy = W.oy + (e.clientY - r.top) / SC; let best = null, bd = 1e9;
  for (const id in MP.ps) { const o = MP.ps[id]; if (!mpHere(o)) continue; if (Math.abs(wx - o.x) < 14 && wy > o.y - 34 && wy < o.y + 8) { const d = Math.hypot(wx - o.x, wy - (o.y - 14)); if (d < bd) { bd = d; best = id; } } }
  if (best) duelAsk(best);
});

function rollR(type) { const t = BOX[type]; let x = rnd(0, 100); for (const r of ['L', 'E', 'R', 'C']) { if (x < t[r]) return r; x -= t[r]; } return 'C'; }
function openOne(type) {

    if (S.boxes[type] <= 0) { resolve(null); return; }
    S.boxes[type]--; S.st.opened++;
    let r = rollR(type), pool = MONS.filter(m => m.r === r);
    if (!pool.length) pool = MONS.filter(m => m.r !== 'L');
    const id = pick(pool).id, m = M[id], was = S.owned[id] ? S.owned[id].s : 0, d = addDup(id);
    let msg, tag;
    if (d.isNew) { tag = 'BARU'; msg = `${m.n} masuk koleksimu.`; if (S.team.length < 3 && teamCost() + RAR[m.r].cost <= TEAM_MAX) { S.team.push(id); msg += ' Langsung masuk tim.'; } }

    else { tag = `LV.${was} \u2192 LV.${d.lv}`; msg = `${m.n} naik ke Lv.${d.lv}! Statnya bertambah.`; }
    progress('open'); save();

    el.innerHTML = `<div class="rays"></div><div style="position:relative;height:100%;display:flex;flex-direction:column;gap:14px;padding:22px 12px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;align-items:center;text-align:center">

      <p style="margin:0;font-weight:800">${msg}</p>
      <button type="button" class="btn" id="keep" style="font-size:20px;min-height:56px;width:100%">Lanjut</button></div>`;
    show('s-box'); $('#keep').onclick = () => resolve(id);
  });
}
function openBox(type, opt = {}) {
  if (!opt.starter) return openOne(type);

    if (S.boxes[type] <= 0) { resolve(null); return; }
    S.boxes[type]--; S.st.opened++;
    const picks = [];
    for (let i = 0; i < 3; i++) {
      const r = Math.random() < .8 ? 'C' : 'R';
      let pool = MONS.filter(m => m.r === r && !picks.includes(m.id) && !S.owned[m.id]);
      if (!pool.length) pool = MONS.filter(m => (m.r === 'C' || m.r === 'R') && !picks.includes(m.id));
      picks.push(pick(pool).id);
    }
    picks.sort(() => Math.random() - .5);
    progress('open'); save();
    let sel = picks.indexOf(picks.slice().sort((a, b) => RORDER.indexOf(M[a].r) - RORDER.indexOf(M[b].r))[0]);
    const el = $('#s-box');
    const chestFill = { Kayu: ['#d9a066', '#a8693c'], Perak: ['#f1f5ff', '#9aa6c0'], Emas: ['#ffe27a', '#d98a12'] }[type];

        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--muted)"><span>Hadiah awal: Biasa 80% · Langka 20%</span></div>
      </div>`;

    <div class="card" style="font-size:13.5px;font-weight:700;color:var(--sub)"><b style="color:var(--text)">${esc(m.sk.n)}</b> · ${m.sk.c} energi<br>${esc(m.d)}${m.weak ? `<br><span style="color:#c2301b">Kelemahan: ${esc(m.weak)}</span>` : ''}</div>
    <p style="font-size:12.5px">${m.el === 'Netral' ? 'Netral: tidak unggul dan tidak lemah terhadap elemen mana pun.' : `Unggul melawan ${BEATS[m.el]}, lemah melawan ${Object.keys(BEATS).find(k => BEATS[k] === m.el)}.`}</p>`,
    [{ t: 'Tutup', cls: 'ghost' }, { t: inT ? 'Keluarkan dari tim' : 'Masukkan tim', cls: inT ? 'dark' : 'hot' }]);
  if (i !== 1) return;
  if (inT) { if (S.team.length <= 1) { toast('Tim minimal berisi 1 monster'); return; } S.team = S.team.filter(x => x !== id); }
  else {
    if (S.team.length >= 3) { toast('Tim sudah 3 monster. Keluarkan satu dulu'); return; }
    if (teamCost() + RAR[m.r].cost > TEAM_MAX) { toast(`Biaya tim lebih dari ${TEAM_MAX}. Ganti dengan monster yang lebih murah`); return; }
    S.team.push(id);
  }
  save(); openCol();
}

/* ---------- shop ---------- */
let shopTab = 'hat', shopSel = null;
function openShop(from) {
  if (from) openShop.from = from;
  const el = $('#s-shop');
  const items = SHOP.filter(s => s.slot === shopTab && (!s.g || s.g === gOf(S.look)));
  const sel = shopSel && SH[shopSel] && SH[shopSel].slot === shopTab ? SH[shopSel] : null;
  const prev = { ...look() }; if (sel) prev[sel.slot] = sel.id;
  const own = id => S.acc.own.includes(id), worn = id => S.acc[SH[id].slot] === id;
  el.innerHTML = `<div style="background:linear-gradient(#ff9a5c,#ffe0a3);padding:12px 12px 0;border-bottom:3px solid var(--deep)">
    <div class="row"><button class="round" id="sBack" type="button" aria-label="Kembali"><svg width="18" height="18" aria-hidden="true"><use href="#ic-back"/></svg></button><div class="title">Toko Aksesoris</div><span class="chip disp" style="font-weight:400;font-size:16px;color:var(--sun)">${COIN}${S.coins}</span></div>
    <div style="display:grid;place-items:center;padding:4px 0 0">${avatarSvg(prev, 92)}</div>
  </div>
  <div style="padding:12px 12px 30px;display:flex;flex-direction:column;gap:12px">
    <div class="tabs">${[['hat', gOf(S.look) === 'p' ? 'Topi/Hijab' : 'Topi'], ['shirt', 'Baju'], ['pants', gOf(S.look) === 'p' ? 'Celana/Rok' : 'Celana'], ['shoes', 'Sepatu'], ['glass', 'Kacamata'], ['back', 'Tas']].map(([k, n]) => `<button type="button" data-tab="${k}" aria-pressed="${shopTab === k}">${n}</button>`).join('')}</div>
    <div class="grid3">${items.map(it => { const lock = S.rank < it.rk && !own(it.id); return `<button type="button" class="item ${lock ? 'lock' : ''}" data-id="${it.id}" aria-pressed="${shopSel === it.id}">
      ${worn(it.id) ? '<span class="tag new" style="top:-10px">Dipakai</span>' : ''}${avatarSvg({ ...look(), [it.slot]: it.id }, 36)}
      <span class="n">${esc(it.n)}</span>${it.g ? `<span class="pill" style="background:#ffe0f0;color:var(--text);border-color:#c8507a">Khusus ${it.g === 'p' ? 'perempuan' : 'laki-laki'}</span>` : ''}${own(it.id) ? '<span class="pill" style="background:#3ccf91">Punya</span>' : lock ? `<span class="pill" style="background:var(--sun);color:var(--text)">Rank ${it.rk}</span>` : `<span class="p">${COIN}${it.p}</span>`}</button>`; }).join('')}</div>
    ${sel ? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="disp" style="font-size:20px">${esc(sel.n)}</div>
      ${own(sel.id) ? `<button type="button" class="btn ${worn(sel.id) ? 'ghost' : 'hot'}" id="sAct">${worn(sel.id) ? 'Lepas' : 'Pakai'}</button>`
        : S.rank < sel.rk ? `<div style="font-weight:800;color:var(--sub)">Terbuka di Rank ${sel.rk}</div>`
        : `<button type="button" class="btn hot" id="sAct" ${S.coins < sel.p ? 'disabled' : ''}>Beli ${COIN}${sel.p}</button>${S.coins < sel.p ? `<div style="font-size:12.5px;font-weight:700;color:var(--sub)">Koin kurang ${sel.p - S.coins}. Kalahkan monster liar atau menang duel.</div>` : ''}`}</div>` : '<p style="margin:0;color:var(--muted);font-weight:700;font-size:13px">Ketuk barang untuk mencobanya di karakter.</p>'}
    <p style="margin:0;text-align:center;font-size:12px;font-weight:700;color:var(--dim)">Koin hanya dari bermain: melawan monster, duel, dan misi. Tidak bisa dibeli dengan uang asli.</p>
  </div>`;
  $('#sBack').onclick = () => { shopSel = null; if (openShop.from === 'prof') { openShop.from = null; openProf(); } else { show('s-world'); hud(); refreshPlayer(); } };
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { shopTab = b.dataset.tab; shopSel = null; openShop(); });
  el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { shopSel = b.dataset.id; openShop(); });
  const a = $('#sAct');
  if (a) a.onclick = () => {
    if (!own(sel.id)) { if (S.coins < sel.p) return; S.coins -= sel.p; S.acc.own.push(sel.id); S.acc[sel.slot] = sel.id; toast(`Kamu membeli ${sel.n}!`); }
    else S.acc[sel.slot] = worn(sel.id) ? null : sel.id;
    save(); refreshPlayer(); openShop();
  };
  show('s-shop');
}

/* ---------- quests + quiz ---------- */
async function openQuests() {
  ensureQuests(); const dl = ensureDaily(), fz = ZONES[dl.zone];
  const allC = dl.qs.every(q => q.c);
  const row = (q, k, d) => `<div class="qrow"><div class="row" style="justify-content:space-between"><b>${esc(q.n)}</b><small>${q.p}/${q.g}</small></div><div class="bar"><i style="width:${q.p / q.g * 100}%"></i></div><small>Hadiah: ${rwText(q.rw)}</small>${q.c ? '<small style="color:#3ccf91;font-weight:800">Sudah diambil</small>' : q.p >= q.g ? `<button type="button" class="btn hot" data-${d ? 'd' : 'q'}="${k}" style="min-height:40px;font-size:16px">Ambil hadiah</button>` : ''}</div>`;
  const i = await modal(`<h2>Papan Misi Pak Darto</h2>
    <div class="card" style="font-size:13.5px;font-weight:800;display:flex;gap:8px;align-items:center"><span style="font-size:22px;color:#ffd23c">\u2605</span><span>Zona Unggulan hari ini: <b style="color:var(--sun)">${fz ? esc(fz.hl || fz.n) : '-'}</b><br><small style="font-weight:700;color:var(--sub)">Koin +50% dan peluang kotak naik di sana. Berganti besok.</small></span></div>
    <div class="disp" style="font-size:17px">Misi harian</div>
    <div style="display:flex;flex-direction:column;gap:8px">${dl.qs.map((q, k) => row(q, k, 1)).join('')}</div>
    ${allC ? (dl.bonus ? '<small style="color:#3ccf91;font-weight:800">Bonus harian sudah diambil. Kembali besok!</small>' : '<button type="button" class="btn hot" data-b="1" style="min-height:44px;font-size:17px">Ambil bonus: semua misi harian selesai</button>') : '<small style="color:var(--sub);font-weight:700">Selesaikan ketiganya untuk bonus: Kotak Kayu + 100 koin.</small>'}
    <div class="disp" style="font-size:17px">Misi umum</div>
    <div style="display:flex;flex-direction:column;gap:8px">${S.quests.map((q, k) => row(q, k, 0)).join('')}</div>`,
    [{ t: 'Tutup', cls: 'ghost' }],
    { onOpen: m => m.querySelectorAll('[data-q],[data-d],[data-b]').forEach(b => b.onclick = e => { e.stopPropagation(); if (b.dataset.q !== undefined) claim(+b.dataset.q); else if (b.dataset.d !== undefined) claimDaily(+b.dataset.d); else claimBonus(); m.hidden = true; m.innerHTML = ''; openQuests(); }) });
}
function claimDaily(k) {
  const q = ensureDaily().qs[k]; if (!q || q.p < q.g || q.c) return;
  q.c = 1; if (q.rw.box) S.boxes[q.rw.box]++; if (q.rw.coins) S.coins += q.rw.coins; save(); hud();
  toast(`Hadiah diterima: ${rwText(q.rw)}`);
}
function claimBonus() {
  const dl = ensureDaily(); if (dl.bonus || !dl.qs.every(q => q.c)) return;
  dl.bonus = 1; S.boxes.Kayu++; S.coins += 100; save(); hud(); toast('Bonus harian: Kotak Kayu + 100 koin!', 3000);
}
function claim(k) {
  const q = S.quests[k]; if (!q || q.p < q.g) return;
  if (q.rw.box) S.boxes[q.rw.box]++;
  if (q.rw.coins) S.coins += q.rw.coins;
  toast(`Hadiah diterima: ${rwText(q.rw)}`);
  S.quests.splice(k, 1, newQuest(S.quests.map(x => x.n)));
  save(); hud();
}
/* ---------- map ---------- */
function openMap() {
  stopLoop();
  const el = $('#s-map');
  el.innerHTML = `<div class="mapw">
    <div class="row"><button class="round" id="mBack" type="button" aria-label="Kembali"><svg width="18" height="18" aria-hidden="true"><use href="#ic-back"/></svg></button><div class="title">Peta Dunia</div><button type="button" class="chip" id="mZoom">Perbesar</button></div>
    <div id="wmHost"></div>
    <p class="maphint">Ketuk <b>angka wilayah</b> untuk pergi ke sana, atau ketuk pulau sekolah untuk pulang. Bab 1 di setiap pulau sudah terbuka. <b style="color:#ffd23c">\u2605 Zona Unggulan hari ini: ${esc((ZONES[featured()] || {}).n || '-')}</b> (koin +50%).</p>
  </div>`;
  show('s-map');
  const back = () => { WMAP.unmount(); show('s-world'); hud(); };
  $('#mBack').onclick = back;
  let zm = 1; $('#mZoom').onclick = () => { zm = zm === 1 ? 2 : 1; $('#mZoom').textContent = zm === 1 ? 'Perbesar' : 'Perkecil'; WMAP.setZoom(zm); };
  WMAP.mount($('#wmHost'), { isOpen, sarangOpen: k => !!prog(k).akhirLulus, featured: (k, b) => featured() === k + b, pick: async (k, b) => {
    if (k === 'school') { WMAP.unmount(); enteringFromMap = true; enterZone('school'); return; }
    const id = k + b, Z = ZONES[id];
    if (!isOpen(k, b)) {
      const prev = ZONES[k + (b - 1)];
      const c = await modal(`<h2>${esc(Z.n)} masih terkunci</h2><p>Bab ${b} · ${esc(Z.babN)}</p><p>Wilayah ini terbuka setelah kamu lulus <b style="color:#fff">Kuil Ujian Bab ${b - 1}</b> di ${esc(prev.n)}.</p><div class="card" style="font-size:13px;font-weight:700;color:var(--sub)">Mode uji pilot: kamu tetap bisa masuk untuk melihat wilayahnya.</div>`, [{ t: 'Tutup', cls: 'ghost' }, { t: 'Masuk (mode uji)', cls: '' }]);
      if (c !== 1) return;
    }
    WMAP.unmount(); enterZone(id);
    toast(`Masuk ${esc(Z.n)} · Bab ${b}. Monster liar akan mengejarmu!`, 2600);
  } });
}

/* ---------- boot ---------- */
function boot(data) {
  setupInput();
  S = (data && data.S && data.S.v === 2) ? data.S : load();
  if (S && S.v === 2 && S.team && S.team.length) { ensureQuests(); enterZone(ZONES[S.zone] && S.rank >= ZONES[S.zone].rank ? S.zone : 'school'); }
  else openStart();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});


</script>
<script>
/* Masuk fullscreen otomatis saat sentuhan pertama (Android/Chrome). iPhone Safari tidak mendukung API ini:
   gunakan Bagikan > Tambahkan ke Layar Utama agar tampil fullscreen. */
(function () {
  var de = document.documentElement;
  var rf = de.requestFullscreen || de.webkitRequestFullscreen;
  var standalone = (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches)) || navigator.standalone;
  if (!rf || standalone) return;
  var done = false;
  function lockPortrait() { try { var o = screen.orientation; if (o && o.lock) o.lock('portrait').catch(function () {}); } catch (e) {} }
  function go() {
    if (done) return;
    if (document.fullscreenElement || document.webkitFullscreenElement) { done = true; return; }
    done = true;
    try {
      var p = rf.call(de, { navigationUI: 'hide' });
      if (p && p.then) p.then(lockPortrait, function () { done = false; }); else lockPortrait();
    } catch (e) { done = false; }
  }
  ['pointerup', 'touchend', 'click'].forEach(function (ev) { addEventListener(ev, go, { passive: true }); });
})();
</script>
